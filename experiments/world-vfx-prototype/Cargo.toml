[package]
name = "oteryn-world-vfx-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
bytemuck = { version = "=1.23.2", features = ["derive"] }
hex = "=0.4.3"
pollster = "=1.0.1"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
