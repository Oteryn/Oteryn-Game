[package]
name = "oteryn-world-vfx-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MPL-2.0"
publish = false

# Keep this non-production evidence harness outside the repository root workspace.
# Issue #480 does not authorize root Cargo/workspace mutation.
[workspace]

[dependencies]
pollster = "=1.0.1"
serde_json = "=1.0.151"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
