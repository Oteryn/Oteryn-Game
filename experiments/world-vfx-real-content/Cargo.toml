[package]
name = "oteryn-world-vfx-real-content"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
publish = false

[workspace]

[dependencies]
hex = "=0.4.3"
lzma-rs = "=0.3.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
