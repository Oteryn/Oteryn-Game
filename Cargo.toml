[workspace]
members = [
    "apps/client",
    "crates/foundation",
    "crates/diagnostics",
    "crates/client-runtime",
    "crates/platform-contracts",
    "crates/platform-client",
    "crates/identity",
    "crates/client-domain",
    "crates/client-simulation",
    "crates/input-actions",
    "crates/input-platform",
    "crates/renderer",
    "crates/synthetic-assets",
    "crates/test-support",
    "tests/security/auth",
    "tests/pre-native-client",
    "tools/architecture-check",
    "tools/synthetic-asset-compiler",
    "tools/synthetic-client-harness",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
repository = "https://github.com/blakinio/Oteryn-v2"
publish = false

[workspace.dependencies]
pollster = { version = "=1.0.1", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
serde_json = "=1.0.145"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.51.4", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "dx12"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
