[workspace]
members = [
    "apps/client",
    "apps/game-server",
    "crates/foundation",
    "crates/simulation-determinism",
    "crates/diagnostics",
    "crates/client-runtime",
    "crates/platform-contracts",
    "crates/platform-client",
    "crates/identity",
    "crates/client-domain",
    "crates/client-simulation",
    "crates/input-actions",
    "crates/input-platform",
    "crates/renderer",
    "crates/synthetic-assets",
    "crates/test-support",
    "tests/security/auth",
    "tests/pre-native-client",
    "tools/architecture-check",
    "tools/synthetic-asset-compiler",
    "tools/synthetic-client-harness",
]
exclude = [
    "vendor/sqlx-core-0.9.0",
    "vendor/sqlx-postgres-0.9.0",
    "vendor/tokio-1.53.1",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MPL-2.0"
repository = "https://github.com/Oteryn/Oteryn-Game"
publish = false

[workspace.dependencies]
base64 = "=0.22.1"
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
ed25519-dalek = { version = "=2.2.0", default-features = false }
pollster = { version = "=1.0.1", default-features = false }
prost = "=0.14.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
rustix = { version = "=1.1.5", default-features = false, features = ["fs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs", "std"] }
serde = "=1.0.229"
serde_json = "=1.0.151"
sqlx = {
    version = "=0.9.0",
    default-features = false,
    features = [
        "runtime-tokio",
        "tls-rustls-aws-lc-rs",
        "postgres",
        "migrate",
        "macros",
        "uuid",
    ],
}
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["aws_lc_rs"] }
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "dx12"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core-0.9.0" }
sqlx-postgres = { path = "vendor/sqlx-postgres-0.9.0" }
tokio = { path = "vendor/tokio-1.53.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
