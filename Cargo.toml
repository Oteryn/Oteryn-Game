[workspace]
members = [
    "crates/admin/agent",
    "crates/admin/contracts",
    "crates/gameplay/dispatch",
    "crates/gameplay/npc",
    "crates/gameplay/entities",
    "crates/gameplay/social-rules",
    "crates/gameplay/encounter-rules",
    "crates/gameplay/spell-rules",
    "crates/gameplay/combat-rules",
    "crates/gameplay/housing",
    "crates/gameplay/quests",
    "crates/gameplay/economy",
    "crates/gameplay/items",
    "crates/gameplay/progression",
    "crates/gameplay/characters",
    "crates/gameplay/social",
    "crates/gameplay/monster-ai",
    "crates/gameplay/encounters",
    "crates/gameplay/spell",
    "crates/gameplay/combat",
    "crates/gameplay/world",
    "crates/gameplay/durability",
    "crates/gameplay/content",
    "crates/gameplay/content-promotion",
    "crates/gameplay/foundation",
    "crates/gameplay/domain",
    "apps/client",
    "apps/game-server",
    "crates/foundation",
    "crates/simulation-determinism",
    "crates/diagnostics",
    "crates/error-codes",
    "crates/task-supervisor",
    "crates/ntp-clock",
    "crates/client-runtime",
    "crates/client-ui",
    "crates/platform-contracts",
    "crates/platform-client",
    "crates/protocol-oteryn",
    "crates/session",
    "crates/session-tcp",
    "crates/identity",
    "crates/client-domain",
    "crates/client-simulation",
    "crates/input-actions",
    "crates/input-platform",
    "crates/renderer",
    "crates/client-assets",
    "crates/synthetic-assets",
    "crates/test-support",
    "crates/world-bundle",
    "crates/gameplay/weather",
    "crates/gameplay/world-change",
    "crates/gameplay/source-critical-baseline",
    "crates/gameplay/character-recovery-fence",
    "crates/gameplay/admission-evidence",
    "crates/gameplay/native-admission-source",
    "crates/gameplay/node-files",
    "tests/security/auth",
    "tests/pre-native-client",
    "tools/architecture-check",
    "tools/synthetic-asset-compiler",
    "tools/synthetic-client-harness",
    "tools/dev-client",
    "tools/player-bots",
    "tools/oteryn-game-ops-top",
    "tools/world-bundle-compiler",
]
exclude = [
    "vendor/sqlx-core-0.9.0",
    "vendor/sqlx-postgres-0.9.0",
    "vendor/tokio-1.53.1",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MPL-2.0"
repository = "https://github.com/Oteryn/Oteryn-Game"
publish = false

[workspace.dependencies]
aws-lc-rs = { version = "=1.19.0", default-features = false, features = ["aws-lc-sys"] }
base64 = "=0.22.1"
# tokio-console diagnostics build only (`oteryn-game-server` feature `diagnostics`).
console-subscriber = { version = "=0.5.0", default-features = false }
cap-fs-ext = "=4.0.3"
cap-std = "=4.0.3"
ed25519-dalek = { version = "=2.2.0", default-features = false }
pollster = { version = "=1.0.1", default-features = false }
crossterm = "=0.29.0"
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm"] }
lzma-rs = "=0.3.0"
prost = "=0.14.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["form", "json", "rustls", "stream"] }
rustix = { version = "=1.1.6", default-features = false, features = ["fs"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
sqlx = {
    version = "=0.9.0",
    default-features = false,
    features = [
        "runtime-tokio",
        "tls-rustls-aws-lc-rs",
        "postgres",
        "migrate",
        "macros",
        "uuid",
    ],
}
sha2 = { version = "=0.11.1", default-features = false }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "net", "rt-multi-thread", "sync", "time"] }
toml = { version = "=1.1.6", default-features = false, features = ["parse", "serde", "std"] }
# With `console-subscriber`: a registry carrying only the console layer.
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "aws_lc_rs"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "dx12", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
zstd = { version = "=0.14.3", default-features = false }

[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core-0.9.0" }
sqlx-postgres = { path = "vendor/sqlx-postgres-0.9.0" }
tokio = { path = "vendor/tokio-1.53.1" }

[workspace.lints.rust]
unsafe_code = "forbid"
# Set only by the tokio-console diagnostics build (`tools/diagnostics/console-build.sh`).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.dev]
# Line tables keep file:line in panics and backtraces; full debug info
# (CARGO_PROFILE_DEV_DEBUG=2) doubles target/ and slows incremental links.
debug = "line-tables-only"

# Content qualification hashes large native artifacts in dev and test builds.
# Optimize the existing crypto implementation without changing test assertions,
# debug assertions or overflow checks for any package.
[profile.dev.package.sha2]
opt-level = 3
debug-assertions = true
overflow-checks = true
