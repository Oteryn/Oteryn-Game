[package]
name = "oteryn-platform-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "platform-client"
release-role = "production"

[dependencies]
async-trait = "=0.1.89"
base64 = "=0.22.1"
bytes = "=1.12.1"
futures = "=0.3.32"
oteryn-diagnostics = { version = "=0.1.0", path = "../diagnostics" }
oteryn-error-codes = { version = "=0.1.0", path = "../error-codes" }
oteryn-foundation = { version = "=0.1.0", path = "../foundation" }
oteryn-platform-contracts = { version = "=0.1.0", path = "../platform-contracts" }
reqwest.workspace = true
sha2.workspace = true
ed25519-dalek = { workspace = true, features = ["std"] }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tough = { version = "=0.24.0", default-features = false }
url = "=2.5.8"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
