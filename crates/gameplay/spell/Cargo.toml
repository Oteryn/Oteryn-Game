[package]
name = "oteryn-gameplay-spell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "gameplay"
release-role = "production"

[dependencies]
oteryn-gameplay-combat = { version = "=0.1.0", path = "../combat" }
oteryn-gameplay-content = { version = "=0.1.0", path = "../content" }
oteryn-gameplay-domain = { version = "=0.1.0", path = "../domain" }
oteryn-gameplay-durability = { version = "=0.1.0", path = "../durability" }
oteryn-gameplay-foundation = { version = "=0.1.0", path = "../foundation" }
oteryn-gameplay-world = { version = "=0.1.0", path = "../world" }
oteryn-protocol-oteryn = { version = "=0.1.0", path = "../../protocol-oteryn" }
oteryn-simulation-determinism = { version = "=0.1.0", path = "../../simulation-determinism" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sqlx.workspace = true

[dev-dependencies]
oteryn-gameplay-content = { version = "=0.1.0", path = "../../gameplay/content", features = ["test-support"] }
oteryn-gameplay-durability = { version = "=0.1.0", path = "../../gameplay/durability", features = ["test-support"] }
oteryn-gameplay-foundation = { version = "=0.1.0", path = "../../gameplay/foundation", features = ["test-support"] }

[lints]
workspace = true
