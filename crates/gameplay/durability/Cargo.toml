[package]
name = "oteryn-gameplay-durability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "gameplay"
release-role = "production"

[features]
test-support = ["oteryn-gameplay-content/test-support", "oteryn-gameplay-entities/test-support", "oteryn-gameplay-foundation/test-support"]

[dependencies]
oteryn-gameplay-encounter-rules = { version = "=0.1.0", path = "../encounter-rules" }
oteryn-gameplay-social-rules = { version = "=0.1.0", path = "../social-rules" }
oteryn-gameplay-combat-rules = { version = "=0.1.0", path = "../combat-rules" }
oteryn-gameplay-characters = { version = "=0.1.0", path = "../characters" }
oteryn-gameplay-progression = { version = "=0.1.0", path = "../progression" }
oteryn-gameplay-items = { version = "=0.1.0", path = "../items" }
oteryn-gameplay-economy = { version = "=0.1.0", path = "../economy" }
oteryn-gameplay-quests = { version = "=0.1.0", path = "../quests" }
oteryn-gameplay-housing = { version = "=0.1.0", path = "../housing" }
base64.workspace = true
oteryn-error-codes = { version = "=0.1.0", path = "../../error-codes" }
oteryn-gameplay-admission-evidence = { version = "=0.1.0", path = "../admission-evidence" }
oteryn-gameplay-character-recovery-fence = { version = "=0.1.0", path = "../character-recovery-fence" }
oteryn-gameplay-content = { version = "=0.1.0", path = "../content" }
oteryn-gameplay-domain = { version = "=0.1.0", path = "../domain" }
oteryn-gameplay-entities = { version = "=0.1.0", path = "../entities" }
oteryn-gameplay-foundation = { version = "=0.1.0", path = "../foundation" }
oteryn-gameplay-native-admission-source = { version = "=0.1.0", path = "../native-admission-source" }
oteryn-protocol-oteryn = { version = "=0.1.0", path = "../../protocol-oteryn" }
oteryn-simulation-determinism = { version = "=0.1.0", path = "../../simulation-determinism" }
oteryn-world-bundle = { version = "=0.1.0", path = "../../world-bundle" }
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["signal"] }

[dev-dependencies]
oteryn-gameplay-entities = { version = "=0.1.0", path = "../entities", features = ["test-support"] }
oteryn-gameplay-foundation = { version = "=0.1.0", path = "../foundation", features = ["test-support"] }
oteryn-gameplay-content = { version = "=0.1.0", path = "../content", features = ["test-support"] }

[lints]
workspace = true
