[package]
name = "oteryn-gameplay-entities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "gameplay"
release-role = "production"

[features]
test-support = ["oteryn-gameplay-content/test-support", "oteryn-gameplay-foundation/test-support"]

[dependencies]
oteryn-gameplay-content = { version = "=0.1.0", path = "../content" }
oteryn-gameplay-domain = { version = "=0.1.0", path = "../domain" }
oteryn-gameplay-foundation = { version = "=0.1.0", path = "../foundation" }
oteryn-simulation-determinism = { version = "=0.1.0", path = "../../simulation-determinism" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
oteryn-gameplay-foundation = { version = "=0.1.0", path = "../foundation", features = ["test-support"] }

[lints]
workspace = true
