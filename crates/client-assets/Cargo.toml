[package]
name = "oteryn-client-assets"
version.workspace = true
description = "Hash-pinned 15.30 appearance and sprite sheet loader for the Oteryn client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "client-assets"
release-role = "production"

[features]
# The generated graphics bundle for tests of dependent crates.
test-support = []

[dependencies]
flate2.workspace = true
lzma-rs.workspace = true
oteryn-client-domain = { version = "=0.1.0", path = "../client-domain" }
oteryn-world-bundle = { version = "=0.1.0", path = "../world-bundle" }
png.workspace = true
prost.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
zstd.workspace = true

[lints]
workspace = true
