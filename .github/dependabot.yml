version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
    groups:
      # init and analyze must move together; one PR instead of two.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "build(deps)"
    groups:
      # One weekly PR for every semver-compatible bump. Each Dependabot PR runs
      # the full Rust gate, and a stale one runs it again on every rebase.
      # Major bumps still arrive one per PR.
      cargo-compatible:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
