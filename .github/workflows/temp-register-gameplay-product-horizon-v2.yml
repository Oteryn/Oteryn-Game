name: Temporary gameplay product horizon patch v2

on:
  push:
    branches:
      - arch/register-gameplay-product-horizon-20260805

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: arch/register-gameplay-product-horizon-20260805
          fetch-depth: 0

      - name: Correct final patch anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/temp_register_gameplay_product_horizon.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              programme,
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\\n",
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\\n  - docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md\\n",
          )
          '''
          new = '''replace_once(
              programme,
              "  - docs/architecture/FOUNDATION_DECISION_BACKLOG.md\\n  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\\n  - docs/contracts/CROSS_REPOSITORY_CONTRACT_LOCK.json\\n",
              "  - docs/architecture/FOUNDATION_DECISION_BACKLOG.md\\n  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\\n  - docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md\\n  - docs/contracts/CROSS_REPOSITORY_CONTRACT_LOCK.json\\n",
          )
          '''
          if old not in text:
              raise SystemExit('expected final patch block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Patch canonical documents
        run: python .github/scripts/temp_register_gameplay_product_horizon.py

      - name: Commit synchronized documents
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md \
                  docs/architecture/FOUNDATION_DECISION_BACKLOG.md \
                  docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md
          git commit -m "docs(architecture): synchronize gameplay product horizon"
          git push
