name: PR239 round9 green helper

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Apply bounded validator repair and verify
        run: |
          set -euo pipefail
          expected_parent="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          old_ping = '''    re.compile(
        r"(?=.*\\bping\\b)"
        r"(?=.*(?:\\bautomatically\\s+(?:authori[sz]ed|approved)\\b|\\bpreauthori[sz]ed\\b|\\bpreapproved\\b|"
        r"\\b(?:blanket|standing|automatic|default)\\s+(?:approval|permission|authori[sz]ation)\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+(?:is\\s+)?(?:granted|given)\\s+by\\s+default\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+by\\s+default\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+(?:is\\s+)?automatically\\s+(?:granted|given)\\b|"
        r"\\b(?:authori[sz]ed|approved)\\s+by\\s+default\\b))",
        re.IGNORECASE,
    ),
'''
          new_ping = '''    re.compile(
        r"(?=.*\\bping\\b)"
        r"(?=.*(?:\\bautomatically\\s+(?:authori[sz]ed|approved)\\b|\\bpreauthori[sz]ed\\b|\\bpreapproved\\b|"
        r"\\b(?:blanket|standing|automatic|default)\\s+(?:approval|permission|authori[sz]ation)\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+(?:is\\s+)?(?:granted|given)\\s+by\\s+default\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+by\\s+default\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+(?:is\\s+)?automatically\\s+(?:granted|given)\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+(?:is\\s+)?(?:granted|given)\\s+automatically\\b|"
        r"\\bautomatically\\s+(?:granted|given)\\s+(?:approval|permission|authori[sz]ation)\\b|"
        r"\\b(?:approval|permission|authori[sz]ation)\\s+(?:is\\s+)?automatic\\b|"
        r"\\b(?:authori[sz]ed|approved)\\s+by\\s+default\\b))",
        re.IGNORECASE,
    ),
'''
          if text.count(old_ping) != 1:
              raise SystemExit("ping matcher anchor mismatch")
          text = text.replace(old_ping, new_ping, 1)

          old_location = r'''        r"\\b(?:stop|stops|stopped|stopping|refuse|refuses|refused|refusing)\\s+(?:by|at)\\s+(?:the\\s+)?"'''
          new_location = r'''        r"\\b(?:stop|stops|stopped|stopping|refuse|refuses|refused|refusing)\\s+(?:by|at|within|inside)\\s+(?:the\\s+)?"'''
          if text.count(old_location) != 1:
              raise SystemExit("provider location matcher anchor mismatch")
          text = text.replace(old_location, new_location, 1)

          old_web = r'''    r"(?:(?:https?:)?//)(?:(?:www\\.)?github\\.com\\.?(?::[0-9]{1,5})?/Oteryn/Oteryn/(?:blob|tree|raw)|raw\\.githubusercontent\\.com\\.?(?::[0-9]{1,5})?/Oteryn/Oteryn)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json",'''
          new_web = r'''    r"(?:(?:https?:)?//)(?:[^\\s/@]+@)?(?:(?:www\\.)?github\\.com\\.?(?::[0-9]{1,5})?/Oteryn/Oteryn/(?:blob|tree|raw)|raw\\.githubusercontent\\.com\\.?(?::[0-9]{1,5})?/Oteryn/Oteryn)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json",'''
          if text.count(old_web) != 1:
              raise SystemExit("GitHub web URL matcher anchor mismatch")
          text = text.replace(old_web, new_web, 1)

          old_api = r'''    r"(?:(?:https?:)?//)api\\.github\\.com\\.?(?::[0-9]{1,5})?/repos/Oteryn/Oteryn/contents/"'''
          new_api = r'''    r"(?:(?:https?:)?//)(?:[^\\s/@]+@)?api\\.github\\.com\\.?(?::[0-9]{1,5})?/repos/Oteryn/Oteryn/contents/"'''
          if text.count(old_api) != 1:
              raise SystemExit("GitHub Contents URL matcher anchor mismatch")
          text = text.replace(old_api, new_api, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check
          git rm .github/workflows/pr239-round9-green-helper.yml
          git diff --name-only --exit-code -- . ':!tools/agents/validate_remote_desktop_prompt_routing.py' ':!.github/workflows/pr239-round9-green-helper.yml'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/agents/validate_remote_desktop_prompt_routing.py
          git commit -m "fix(agents): close final Codex round 9 bypasses"
          remote_sha="$(git ls-remote origin refs/heads/governance/remote-desktop-per-action-gate-237 | cut -f1)"
          test "$remote_sha" = "$expected_parent"
          git push origin HEAD:refs/heads/governance/remote-desktop-per-action-gate-237
