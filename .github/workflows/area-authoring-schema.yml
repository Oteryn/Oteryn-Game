name: Area Authoring Schema

on:
  pull_request:
    paths:
      - tools/content-schema/area-authoring/**
      - tools/content-schema/monster-authoring/monster.schema.json
      - imports/cipsoft-staticdata/map/areas/**
      - content/world/areas/**
      - content/houses/**
      - .github/workflows/area-authoring-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  area-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/area-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Catalogue and report regenerate byte-identically from the committed sources
        run: python build_areas.py build --check

      - name: Schema and validator cases
        run: python test_validate_areas.py

      - name: Ruff check and format
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        working-directory: .
        run: test -z "$(git status --short --untracked-files=all)"

  # `build_areas.py extract-crystal-towns --check` needs the pinned CrystalServer world.otbm and
  # `fetch-wiki` needs tibia.fandom.com; both are run locally by whoever changes their samples.
