name: Game Atlas creature moving-in-place

run-name: Game Atlas creature moving-in-place • pull_request • ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/game-atlas-creatures/animated.py'
      - 'tools/game-atlas-creatures/animated_self_test.py'
      - 'docs/contracts/OTERYN_ATLAS_ANIMATED_APPEARANCES_V1.md'
      - '.github/workflows/game-atlas-creature-moving-in-place.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-atlas-creature-moving-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Game Atlas creature moving-in-place / exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Game revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify exact checked out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python -m py_compile tools/game-atlas-creatures/animated.py tools/game-atlas-creatures/animated_self_test.py
          python tools/game-atlas-creatures/animated_self_test.py

      - name: Check out pinned migration evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blakinio/Otheryn
          ref: e417c5e7c22986bf4acef0495eb47f7b72c97cce
          path: legacy
          fetch-depth: 1
          persist-credentials: false

      - name: Verify migration evidence revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = 'e417c5e7c22986bf4acef0495eb47f7b72c97cce'
          test -d legacy/vendor/map-analysis/crystalserver/data-global/world
          test -d legacy/vendor/map-analysis/crystalserver/data-global/npc
          test -d legacy/vendor/map-analysis/crystalserver/data-global/monster

      - name: Download exact 15.32 source
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='1Dlo3bS4K1nS3mw4BhPZdlHT7lX5zRAvv'
          EXPECTED='1a6bad8b7598cd874f534cd4aae2d249fb3d9b4458b3ccfa75754f91bb27870f'
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -fL --retry 5 --retry-delay 2 "$URL" -o /tmp/15.32.zip
          test "$(sha256sum /tmp/15.32.zip | awk '{print $1}')" = "$EXPECTED"

      - name: Build exact appearance and spatial authorities
        shell: bash
        run: |
          set -euo pipefail
          python tools/game-atlas-appearances/export.py /tmp/15.32.zip /tmp/appearance >/tmp/appearance-build.json
          python tools/game-atlas-appearances/verify.py /tmp/appearance >/tmp/appearance-verify.json
          python tools/game-atlas-outfit-spatial/export.py /tmp/15.32.zip /tmp/outfit-spatial >/tmp/outfit-spatial-build.json

      - name: Prove deterministic handoff and exact static compatibility
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/legacy/vendor/map-analysis/crystalserver/data-global"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:tools/game-atlas-creatures/animated.py" > tools/game-atlas-creatures/_animated_baseline.py
          python tools/game-atlas-creatures/_animated_baseline.py \
            "$ROOT/world" "$ROOT/npc" "$ROOT/monster" \
            /tmp/appearance /tmp/outfit-spatial /tmp/creatures-baseline.json >/tmp/baseline-build.json
          rm tools/game-atlas-creatures/_animated_baseline.py
          python tools/game-atlas-creatures/animated.py \
            "$ROOT/world" "$ROOT/npc" "$ROOT/monster" \
            /tmp/appearance /tmp/outfit-spatial /tmp/creatures-a.json >/tmp/creature-build-a.json
          python tools/game-atlas-creatures/animated.py \
            "$ROOT/world" "$ROOT/npc" "$ROOT/monster" \
            /tmp/appearance /tmp/outfit-spatial /tmp/creatures-b.json >/tmp/creature-build-b.json
          cmp /tmp/creatures-a.json /tmp/creatures-b.json
          test ! -e tools/game-atlas-creatures/_animated_baseline.py

      - name: Verify real census, ordinary creatures, anchors and corruption rejection
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import importlib.util
          import json
          from pathlib import Path
          import sys

          baseline=json.loads(Path('/tmp/creatures-baseline.json').read_text())
          data=json.loads(Path('/tmp/creatures-a.json').read_text())
          assert data['capability']=='animated-creatures-v1'
          assert data['appearance_product_root']=='sha256:0d1c8fc777d1d220a9d7723507fddd72585f7358d35a40209bd7415f1fe057c1'
          assert data['outfit_spatial_product_root']=='sha256:62fdd7d0ce02652582f03bf971455f4a2f9ec1e472eaebfec5af739cf11a921e'

          for key in ('npcs','monster_spawns'):
              old_records=baseline[key]
              new_records=data[key]
              assert len(old_records)==len(new_records)
              assert [r['record_id'] for r in old_records]==[r['record_id'] for r in new_records]
              for old,new in zip(old_records,new_records,strict=True):
                  for field,value in old.items():
                      if field!='outfit_presentation':
                          assert new.get(field)==value, (key,new['record_id'],field)
                  if old.get('presentation_resolution_state')=='RESOLVED':
                      old_p=old['outfit_presentation']; new_p=new['outfit_presentation']
                      assert new_p['outfit_presentation_id']==old_p['outfit_presentation_id']
                      assert new_p['groups']==old_p['groups']
                      assert new_p['static_projection']==old_p['static_projection']
                      state=new_p['moving_in_place_resolution_state']
                      assert state in ('RESOLVED','FALLBACK_STATIC')
                      if state=='RESOLVED':
                          moving=new_p['moving_in_place_projection']
                          static=new_p['static_projection']
                          assert moving['frame_group']['semantic']=='outfit-moving'
                          assert moving['selection_policy']=='unique-outfit-moving-fixed-south-in-place-v1'
                          assert moving['direction']=='south'
                          assert moving['uses_moving_group_in_place'] is True
                          assert moving['displacement']==static['displacement']
                          assert moving['anchor_policy']==static['anchor_policy']
                          assert moving['spatial_record_id']==static['spatial_record_id']
                      else:
                          assert 'moving_in_place_projection' not in new_p
                          assert isinstance(new_p.get('moving_in_place_reason'),str) and new_p['moving_in_place_reason']
                  else:
                      assert new==old

          n=data['statistics']['npc_presentation']
          m=data['statistics']['monster_presentation']
          assert n['resolved_moving_in_place_records'] + n['fallback_static_moving_in_place_records'] == n['resolved_presentation_records']
          assert m['resolved_moving_in_place_records'] + m['fallback_static_moving_in_place_records'] == m['resolved_presentation_records']
          assert n['resolved_moving_in_place_records'] > 0
          assert m['resolved_moving_in_place_records'] > 0

          fixture_evidence={}
          all_records=data['npcs']+data['monster_spawns']
          for name in ('Sheep','Pig','Chicken'):
              record=next(r for r in all_records if r.get('name')==name and r.get('presentation_resolution_state')=='RESOLVED' and r['outfit_presentation'].get('moving_in_place_resolution_state')=='RESOLVED')
              static=record['outfit_presentation']['static_projection']
              moving=record['outfit_presentation']['moving_in_place_projection']
              assert moving['direction']=='south' and moving['pattern_x']==2
              assert moving['phase_count']==8
              assert len(moving['animation']['presentation_durations_ms'])==8
              assert moving['displacement']==static['displacement']
              fixture_evidence[name]={
                  'kind':record['kind'],
                  'record_id':record['record_id'],
                  'look_type':record['appearance']['look_type'],
                  'position':record['position'],
                  'phase_count':moving['phase_count'],
                  'south_pattern_x':moving['pattern_x'],
                  'displacement':moving['displacement'],
              }

          strange=next(r for r in data['npcs'] if r.get('name')=='Strange Pipe' and r.get('presentation_resolution_state')=='RESOLVED')
          strange_p=strange['outfit_presentation']
          assert strange_p['moving_in_place_resolution_state']=='FALLBACK_STATIC'
          assert strange_p['moving_in_place_reason']=='NO_MOVING_FRAME_GROUP'
          assert 'moving_in_place_projection' not in strange_p
          assert isinstance(strange_p.get('static_projection'),dict)

          path=Path('tools/game-atlas-creatures/animated.py')
          spec=importlib.util.spec_from_file_location('moving_validator',path)
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.validate_animated_creatures(data)
          corrupt=copy.deepcopy(data)
          target=next(r for r in corrupt['monster_spawns'] if r.get('presentation_resolution_state')=='RESOLVED' and r['outfit_presentation'].get('moving_in_place_resolution_state')=='RESOLVED')
          target['outfit_presentation']['moving_in_place_projection']['pattern_x']=999
          try:
              mod.validate_animated_creatures(corrupt)
          except RuntimeError:
              pass
          else:
              raise AssertionError('corrupt moving-in-place projection was accepted')

          evidence={
              'status':'PASS',
              'semantic_digest':data['semantic_digest'],
              'appearance_product_root':data['appearance_product_root'],
              'outfit_spatial_product_root':data['outfit_spatial_product_root'],
              'statistics':data['statistics'],
              'ordinary_creatures':fixture_evidence,
              'strange_pipe_fallback':{
                  'record_id':strange['record_id'],
                  'reason':strange_p['moving_in_place_reason'],
              },
              'deterministic_double_build':True,
              'static_projection_compatible_with_pr_base':True,
              'factual_record_fields_compatible_with_pr_base':True,
              'corruption_rejected':True,
          }
          Path('/tmp/creature-moving-in-place-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY

      - name: Upload moving-in-place evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-atlas-creature-moving-in-place-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/creature-moving-in-place-evidence.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
