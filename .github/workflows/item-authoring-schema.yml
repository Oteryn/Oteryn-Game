name: Item Authoring Schema

on:
  pull_request:
    paths:
      - tools/content-schema/item-authoring/**
      - tools/content-schema/world-object-authoring/**
      - content/world/terrain/**
      - content/world/objects/**
      - content/proficiencies/**
      - tools/content-schema/validate_item_master_schema.py
      - tools/content-schema/test_validate_item_master_schema.py
      - imports/tibiawiki/bindings/items.json
      - imports/crystalserver/bindings/items.json
      - imports/crystalserver/facts/**
      - imports/tibiawiki/facts/items-family-fallback.json
      - imports/tibiawiki/facts/items-stats.json
      - imports/tibiawiki/batches.json
      - imports/tibiawiki/sources.json
      - tools/content-census/item_wiki_family_capture.py
      - tools/content-census/item_wiki_stats_capture.py
      - tools/content-census/item_wiki_stats_capture_self_test.py
      - docs/agents/evidence/OTV2-20261001-item5801-temporal-source-qualification-v1.json
      - docs/agents/evidence/OTV2-20261001-item-modifier-source-hold-v1.json
      - docs/agents/evidence/OTV2-20261001-item-stack-false-promotion-v1.json
      - docs/agents/evidence/OTV2-20261001-item-stack-default-source-qualification-v1.json
      - docs/agents/evidence/OTV2-20261001-item-stack-default-promotion-v1.json
      - docs/agents/evidence/OTV2-20261001-item-stack-historical-source-frame-v1.json
      - docs/agents/evidence/OTV2-20261001-item-stack-historical-promotion-v1.json
      - docs/agents/evidence/OTV2-20261001-item-capacity-promotion-v1.json
      - docs/agents/evidence/OTV2-20261001-item-physical-promotion-v1.json
      - docs/agents/evidence/OTV2-20261001-item-physical-source-qualification-v1.json
      - docs/agents/evidence/OTV2-20260930-item-stats-promotion-v2.json
      - docs/agents/evidence/OTV2-20261001-item-market-true*.json
      - docs/agents/evidence/OTV2-20261001-item-movable*.json
      - docs/agents/evidence/OTV2-20261001-item-document*.json
      - content/items/index.json
      - content/items/definitions/**
      - content/assets/files/appearances-*.dat
      - imports/official/appearance-membership/**
      - .github/workflows/item-authoring-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  item-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/item-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Regenerate schemas, catalogs and templates byte-identically
        run: |
          set -euo pipefail
          python build_formal_schema.py
          git diff --exit-code -- .

      - name: Focused schema and validator checks
        run: |
          set -euo pipefail
          python verify_formal_schema.py
          git diff --exit-code -- .
          python validate_item.py synthetic-valid-item.json synthetic-valid-dependencies.json \
            --manifest synthetic-valid-import-readiness.json

      - name: Converter fixture tests
        run: python test_engine_items.py

      - name: Semantic promotion lowering fixture tests
        run: python test_lower_promotion_packet.py

      - name: Donor census fixture tests
        run: python test_donor_census.py

      - name: TibiaWiki Item stat snapshot self-test
        working-directory: tools/content-census
        run: python item_wiki_stats_capture_self_test.py

      - name: TibiaWiki Item stat promotion packet tests and drift
        run: |
          python test_lower_wiki_stats_packet.py
          python -m unittest test_wiki_modifiers_packet.py
          python -m unittest test_key_ring5801_source_selection.py

      - name: Bounded physical source facts and magic rune limit
        run: |
          python test_lower_client_physical_packet.py
          python lower_client_physical_packet.py --check

      - name: Bounded source-qualified container capacity tests and drift
        run: python test_lower_wiki_capacity_packet.py

      - name: Explicit wiki non-stackability tests and drift
        run: python test_lower_wiki_stack_false_packet.py

      - name: Documented wiki non-stackability default tests and drift
        run: |
          set -euo pipefail
          python test_lower_wiki_stack_default_packet.py
          python lower_wiki_stack_default_packet.py --check

      - name: Closed historical source frames for seven stack defaults
        working-directory: tools/content-schema/item-authoring
        run: |
          python test_lower_wiki_stack_historical_packet.py
          python lower_wiki_stack_historical_packet.py --check

      - name: Weapon proficiency tests and artifact drift
        run: |
          set -euo pipefail
          python test_item_weapon_proficiency.py
          python item_weapon_proficiency.py --check

      - name: Positive official market qualification guards and packet drift
        run: |
          python test_lower_client_market_packet.py
          python lower_client_market_packet.py --check

      - name: Explicit own-Wiki movable qualification guards and packet drift
        run: |
          python test_lower_wiki_movable_packet.py
          python lower_wiki_movable_packet.py --check

      - name: Explicit document qualification guards and packet drift
        run: |
          python test_lower_item_document_packet.py
          python lower_item_document_packet.py --check

      - name: Client appearance census fixture tests
        run: python test_client_appearance_census.py

      - name: Client appearance census drift against the in-repo 15.30 appearances
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/engine-items-xml"
          fetch() {
            mkdir -p "$SRC/$1/data/items"
            curl -fsSL --retry 5 --retry-delay 2 \
              "https://raw.githubusercontent.com/$2/$3/data/items/items.xml" \
              -o "$SRC/$1/data/items/items.xml"
          }
          # Revisions come from the tools' own pins; the census verifies each digest.
          read -r CRYSTAL_REPO CRYSTAL_REV CANARY_REPO CANARY_REV DONOR_REV < <(python -c '
          from engine_items import ENGINES
          from donor_census import DONOR_COMMIT
          c, k = ENGINES["crystal"], ENGINES["canary"]
          print(c["repository"], c["revision"], k["repository"], k["revision"], DONOR_COMMIT)')
          fetch crystal "$CRYSTAL_REPO" "$CRYSTAL_REV"
          fetch donor "$CRYSTAL_REPO" "$DONOR_REV"
          fetch canary "$CANARY_REPO" "$CANARY_REV"
          python client_appearance_census.py --check \
            --crystal-source "$SRC/crystal" --donor-source "$SRC/donor" --canary-source "$SRC/canary"

      - name: Appearance membership manifests (A12 §4.1) from the pinned appearance files
        run: |
          set -euo pipefail
          python test_appearance_membership.py
          SRC="$RUNNER_TEMP/appearance-membership"
          mkdir -p "$SRC"
          fetch() {
            curl -fsSL --retry 5 --retry-delay 2 \
              "https://raw.githubusercontent.com/$2/$3/data/items/appearances.dat" -o "$SRC/$1.dat"
          }
          # Revisions come from the tool's own pins (`pinned_by`); --check verifies every
          # file's size and digest before it regenerates that file's manifest.
          SOURCES=()
          while read -r LABEL REPO REV; do
            fetch "$LABEL" "$REPO" "$REV"
            SOURCES+=(--source "$LABEL=$SRC/$LABEL.dat")
          done < <(python -c '
          from appearance_membership import ADMITTED
          for spec in ADMITTED:
              pin = spec["pinned_by"]
              if ":data/items/appearances.dat" in pin:
                  repo, rev = pin.split(":", 1)[0].split("@")
                  print(spec["label"], repo, rev)')
          test "${#SOURCES[@]}" -eq 6
          python appearance_membership.py --check "${SOURCES[@]}"

      - name: WorldObject and Terrain authoring tests
        working-directory: tools/content-schema/world-object-authoring
        run: python test_world_objects.py

      - name: WorldObject and Terrain catalogue drift against pinned Crystal
        working-directory: tools/content-schema/world-object-authoring
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/crystal-catalogue"
          read -r REPO REV POOL < <(cd ../item-authoring && python -c '
          from engine_items import ENGINES, DELIVERY_POOL_PATH
          c = ENGINES["crystal"]
          print(c["repository"], c["revision"], DELIVERY_POOL_PATH["crystal"])')
          # The loader verifies every file against its pinned digest.
          for path in data/items/items.xml data/items/appearances.dat "$POOL"; do
            mkdir -p "$SRC/$(dirname "$path")"
            curl -fsSL --retry 5 --retry-delay 2 \
              "https://raw.githubusercontent.com/$REPO/$REV/$path" -o "$SRC/$path"
          done
          python build_catalogue.py --source "$SRC" --check

      - name: Item Master census
        working-directory: .
        run: |
          set -euo pipefail
          python tools/content-schema/validate_item_master_schema.py
          python tools/content-schema/test_validate_item_master_schema.py

      - name: Ruff check and format
        working-directory: .
        run: |
          set -euo pipefail
          ruff check tools/content-schema/item-authoring tools/content-schema/world-object-authoring
          ruff format --check tools/content-schema/item-authoring tools/content-schema/world-object-authoring

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        working-directory: .
        run: test -z "$(git status --short --untracked-files=all)"
