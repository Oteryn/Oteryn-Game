name: RDC inline-comment parser patch once

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-inline-comment-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact inline-comment state patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/agents/validate_remote_desktop_prompt_routing.py')
          text = path.read_text(encoding='utf-8')
          old = '''                if opening is not None:\n                    inert = True\n                    fence = opening.group("fence")\n                    fence_char = fence[0]\n                    fence_len = len(fence)\n\n        end = offset + len(segment)\n'''
          new = '''                if opening is not None:\n                    inert = True\n                    fence = opening.group("fence")\n                    fence_char = fence[0]\n                    fence_len = len(fence)\n                elif raw.rfind("<!--") > raw.rfind("-->"):\n                    # Markdown HTML comments may begin after ordinary prose. The\n                    # current line remains operative, but following lines are inert\n                    # until the matching closer is observed.\n                    in_html_comment = True\n\n        end = offset + len(segment)\n'''
          if text.count(old) != 1:
              raise SystemExit('unexpected inline-comment patch anchor count')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/rdc-inline-comment-patch-once.yml').unlink()
          PY
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/agents/validate_remote_desktop_prompt_routing.py .github/workflows/rdc-inline-comment-patch-once.yml
          git commit -m 'fix(agents): track inline HTML comment routing state'
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
