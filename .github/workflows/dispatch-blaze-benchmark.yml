name: Dispatch Blaze matched-nightly edit
on:
  push:
    branches: [codex/dispatch-blaze-matched-20261120]
    paths:
      - .github/workflows/dispatch-blaze-benchmark.yml
      - tools/ci/dispatch_blaze_pilot.sh
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    name: ${{ matrix.engine }} / ${{ matrix.operation }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        engine: [cargo, enabled]
        operation: [edit]
    env:
      ENGINE: ${{ matrix.engine }}
      OPERATION: ${{ matrix.operation }}
      CARGO_BUILD_JOBS: '2'
      BLAZE_SANDBOX: 'off'
      RA_JIT_SCRIPTS_BY_RUSTC: '1'
      RA_JIT_PROC_MACRO_SERVER: '0'
      RUSTUP_TOOLCHAIN: nightly-2026-10-27
      OTERYN_DISPATCH_PG_SHARD: 3/3
      SOURCE_SHA: 4beb4cfa87bdde05bebecb2dd8930340b12daeb4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controller
          sparse-checkout: tools/ci/dispatch_blaze_pilot.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
      - name: Install and verify pinned tools
        working-directory: source
        run: bash ../controller/tools/ci/dispatch_blaze_pilot.sh setup
      - name: Measure and validate the result
        working-directory: source
        run: bash ../controller/tools/ci/dispatch_blaze_pilot.sh measure
      - name: Collect daemon status
        if: ${{ always() && matrix.engine != 'cargo' }}
        working-directory: source
        run: |
          if command -v blaze >/dev/null; then
            timeout 20 blaze status > "$RUNNER_TEMP/metrics/daemon-status.txt" 2>&1 || true
            timeout 15 blaze stop || true
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: matched-${{ matrix.engine }}-${{ matrix.operation }}
          path: ${{ runner.temp }}/metrics
          if-no-files-found: warn
          retention-days: 7
