      - name: Commit RED tests and remove helper
        run: |
          git config user.name blakinio
          git config user.email 75369544+blakinio@users.noreply.github.com
          git rm .github/workflows/rdc-codex-edge-red-once.yml
          git add tools/agents/test_validate_remote_desktop_prompt_routing.py
          git commit -m "test(agents): cover final Codex RDC parser edges"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
