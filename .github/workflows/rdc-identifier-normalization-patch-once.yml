name: RDC identifier normalization patch once

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-identifier-normalization-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact identifier-safe Markdown normalization patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/agents/validate_remote_desktop_prompt_routing.py')
          text = path.read_text(encoding='utf-8')

          old_defs = '''MARKDOWN_LINK_RE = re.compile(r"!?\\[([^]\\n]*)\\]\\([^\\n)]*\\)")\nHTML_TAG_RE = re.compile(r"</?[A-Za-z][^>]*>")\nMARKDOWN_ESCAPE_RE = re.compile(r"\\\\([\\\\`*_{}\\[\\]()#+.!~>-])")\nZERO_WIDTH_RE = re.compile("[\\u200b\\u200c\\u200d\\u2060\\ufeff]")\n'''
          new_defs = '''MARKDOWN_LINK_RE = re.compile(r"!?\\[([^]\\n]*)\\]\\([^\\n)]*\\)")\nMARKDOWN_REFERENCE_LINK_RE = re.compile(r"!?\\[([^]\\n]*)\\]\\[[^]\\n]*\\]")\nHTML_COMMENT_INLINE_RE = re.compile(r"<!--.*?-->", re.DOTALL)\nHTML_TAG_RE = re.compile(r"</?[A-Za-z][^>]*>")\nMARKDOWN_ESCAPE_RE = re.compile(r"\\\\([\\\\`*_{}\\[\\]()#+.!~>-])")\nMARKDOWN_UNDERSCORE_EMPHASIS_RE = re.compile(r"(?<!\\w)_{1,3}(?=\\w)|(?<=\\w)_{1,3}(?!\\w)")\nZERO_WIDTH_RE = re.compile("[\\u200b\\u200c\\u200d\\u2060\\ufeff]")\n'''
          if text.count(old_defs) != 1:
              raise SystemExit('unexpected normalization definitions anchor')
          text = text.replace(old_defs, new_defs, 1)

          old_norm = '''    value = unicodedata.normalize("NFKC", value)\n    value = MARKDOWN_LINK_RE.sub(lambda match: match.group(1), value)\n    value = HTML_TAG_RE.sub(" ", value)\n    value = MARKDOWN_ESCAPE_RE.sub(r"\\1", value)\n    value = ZERO_WIDTH_RE.sub(" ", value)\n    value = re.sub(r"[*_~`]+", "", value)\n    value = re.sub(r"[ \\t\\f\\v]+", " ", value)\n'''
          new_norm = '''    value = unicodedata.normalize("NFKC", value)\n    value = MARKDOWN_LINK_RE.sub(lambda match: match.group(1), value)\n    value = MARKDOWN_REFERENCE_LINK_RE.sub(lambda match: match.group(1), value)\n    value = HTML_COMMENT_INLINE_RE.sub(" ", value)\n    value = HTML_TAG_RE.sub(" ", value)\n    value = MARKDOWN_ESCAPE_RE.sub(r"\\1", value)\n    value = ZERO_WIDTH_RE.sub(" ", value)\n    value = re.sub(r"[*~`]+", "", value)\n    value = MARKDOWN_UNDERSCORE_EMPHASIS_RE.sub("", value)\n    value = re.sub(r"[ \\t\\f\\v]+", " ", value)\n'''
          if text.count(old_norm) != 1:
              raise SystemExit('unexpected normalization body anchor')
          text = text.replace(old_norm, new_norm, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/rdc-identifier-normalization-patch-once.yml').unlink()
          PY
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/agents/validate_remote_desktop_prompt_routing.py .github/workflows/rdc-identifier-normalization-patch-once.yml
          git commit -m 'fix(agents): preserve RDC identifiers during Markdown normalization'
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
