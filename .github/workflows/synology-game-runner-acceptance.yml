name: Synology Game Runner Acceptance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/synology-game-runner-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synology-game-runner-acceptance
  cancel-in-progress: false

jobs:
  qualify-game-runner:
    name: Qualify Game runner and local Canary boundary
    timeout-minutes: 10
    runs-on:
      group: game-runners
      labels: oteryn-game
    env:
      EXPECTED_RUNNER_NAME: oteryn-synology-game
      EXPECTED_COMPOSE_PROJECT: oteryn-staging
    steps:
      - name: Verify exact Game runner identity
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
          ACTUAL_RUNNER_OS: ${{ runner.os }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$ACTUAL_RUNNER_OS" = "Linux"
          test -n "${HOSTNAME:-}"

      - name: Verify Game runner capability and state separation
        shell: bash
        run: |
          set -euo pipefail
          docker version >/dev/null
          docker info >/dev/null
          docker inspect "$HOSTNAME" >/dev/null

          mounts="$(docker inspect "$HOSTNAME" --format '{{range .Mounts}}{{printf "%s|%s\n" .Source .Destination}}{{end}}')"
          printf '%s\n' "$mounts" | grep -Eq '\|/runner$'
          printf '%s\n' "$mounts" | grep -Eq '\|/work$'
          if printf '%s\n' "$mounts" | grep -Eiq '(platform|atlas|staging).*(\|/runner|\|/work)|(/runner|/work).*(platform|atlas|staging)'; then
            echo 'Game runner reuses Platform/Atlas/staging runner state' >&2
            exit 1
          fi

      - name: Verify existing Canary runtime read-only
        shell: bash
        run: |
          set -euo pipefail
          canary_id="$(docker ps -q \
            --filter "label=com.docker.compose.project=$EXPECTED_COMPOSE_PROJECT" \
            --filter 'label=com.docker.compose.service=canary')"
          test -n "$canary_id"
          test "$(printf '%s\n' "$canary_id" | sed '/^$/d' | wc -l)" -eq 1
          test "$(docker inspect "$canary_id" --format '{{.State.Running}}')" = "true"

          canary_mounts="$(docker inspect "$canary_id" --format '{{range .Mounts}}{{printf "%s|%s\n" .Type .Destination}}{{end}}')"
          printf '%s\n' "$canary_mounts" | grep -Eq '^volume\|/data$'
          if printf '%s\n' "$canary_mounts" | grep -Eq '\|/var/run/docker.sock$'; then
            echo 'Canary runtime unexpectedly has Docker socket access' >&2
            exit 1
          fi

          mariadb_id="$(docker ps -q \
            --filter "label=com.docker.compose.project=$EXPECTED_COMPOSE_PROJECT" \
            --filter 'label=com.docker.compose.service=mariadb')"
          test -n "$mariadb_id"
          test "$(printf '%s\n' "$mariadb_id" | sed '/^$/d' | wc -l)" -eq 1
          test "$(docker inspect "$mariadb_id" --format '{{.State.Running}}')" = "true"
          test "$(docker inspect "$mariadb_id" --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}')" = "healthy"

          canary_networks="$(docker inspect "$canary_id" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}')"
          mariadb_networks="$(docker inspect "$mariadb_id" --format '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}')"
          common_network="$(comm -12 <(printf '%s\n' "$canary_networks" | sort -u) <(printf '%s\n' "$mariadb_networks" | sort -u))"
          test -n "$common_network"

      - name: Record sanitized acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'GAME_RUNNER_ACCEPTANCE=PASS'
            echo "RUNNER_NAME=${{ runner.name }}"
            echo 'RUNNER_ROUTE=game-runners/oteryn-game'
            echo 'CANARY_RUNTIME=running'
            echo 'CANARY_PERSISTENCE=/data volume present'
            echo 'CANARY_DATABASE_TOPOLOGY=shared Docker network with healthy MariaDB'
            echo 'RUNTIME_MUTATION=NONE'
            echo 'ENVIRONMENT_VALUES_EXPOSED=NONE'
          } >> "$GITHUB_STEP_SUMMARY"
