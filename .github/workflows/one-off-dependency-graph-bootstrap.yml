name: One-off dependency graph bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.repository == 'Oteryn/Oteryn-Game' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BASE_SHA: 16afdf31a15bd49d454cdbcdd98fa7ec72213ef9
    steps:
      - name: Submit empty migration bootstrap snapshot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          payload = {
              "version": 0,
              "sha": os.environ["BASE_SHA"],
              "ref": "refs/heads/main",
              "job": {
                  "correlator": "oteryn-game-history-migration-bootstrap",
                  "id": os.environ["GITHUB_RUN_ID"],
                  "html_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              },
              "detector": {
                  "name": "oteryn-history-migration-bootstrap",
                  "version": "1",
                  "url": "https://github.com/Oteryn/Oteryn-Game",
              },
              "scanned": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          request = urllib.request.Request(
              "https://api.github.com/repos/Oteryn/Oteryn-Game/dependency-graph/snapshots",
              data=json.dumps(payload).encode(),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2026-03-10",
                  "Content-Type": "application/json",
                  "User-Agent": "oteryn-game-migration",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              body = response.read().decode()
              if response.status != 201:
                  raise SystemExit(f"unexpected dependency snapshot status {response.status}: {body}")
              print(body)
          PY
