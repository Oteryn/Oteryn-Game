name: RDC prompt sweep once

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237

permissions:
  contents: write

concurrency:
  group: rdc-prompt-sweep-once
  cancel-in-progress: false

jobs:
  sweep:
    if: ${{ !contains(github.event.head_commit.message, '[rdc-sweep]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Append canonical Remote Desktop routing section
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          registry = json.loads((root / 'docs/agents/PROMPT_LIFECYCLE.json').read_text(encoding='utf-8'))
          entries = registry.get('prompts')
          if not isinstance(entries, list):
              raise SystemExit('PROMPT_LIFECYCLE prompts must be a list')

          paths = []
          for entry in entries:
              if not isinstance(entry, dict):
                  raise SystemExit('PROMPT_LIFECYCLE entry must be an object')
              if entry.get('status') == 'reusable' and entry.get('reusable') is True:
                  path = entry.get('path')
                  if not isinstance(path, str) or not path.startswith('docs/agents/prompts/') or not path.endswith('.md'):
                      raise SystemExit(f'invalid reusable prompt path: {path!r}')
                  paths.append(path)

          if len(paths) != 43 or len(set(paths)) != 43:
              raise SystemExit(f'expected exactly 43 unique reusable prompts, got {len(paths)} / {len(set(paths))}')

          heading = '## Remote Desktop execution routing'
          section = '''## Remote Desktop execution routing

          Before any Remote Desktop/Desktop Commander use, resolve the current Game `AGENTS.md` and the canonical META execution-routing policy at `Oteryn/Oteryn@e002fc7532188e73a0f495da3e20710541ed50e0`. Out-of-band local connector/tool registration and argument-schema inspection is capability discovery; every direct `Remote_Desktop_Commander.*` invocation is exception-only and requires a fresh valid host-exception context plus a positive per-action decision for the exact semantic host action and exact connector tool immediately before the call.

          `list_devices`, `who_am_i`, `ping`, `get_config`, filesystem/search/process/session/terminal/history operations and other direct connector calls are not capability-discovery exemptions. Unknown or undeclared tools fail closed, and a prior ALLOW never authorizes a different action or tool. This prompt cannot broaden META exception reasons or use Remote Desktop as a routine fallback for repository tests, Git inspection, CI/log polling or convenience. A Remote Desktop DENY is not automatically a blocker: continue through GitHub, GitHub Actions, repository-native connectors or an isolated workspace when they can perform useful authorized work.
          '''
          section = '\n'.join(line[10:] if line.startswith('          ') else line for line in section.splitlines()).strip()

          for relative in sorted(paths):
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'missing reusable prompt: {relative}')
              text = path.read_text(encoding='utf-8')
              if text.count(heading) != 0:
                  raise SystemExit(f'{relative}: expected no pre-existing Remote Desktop routing section')
              path.write_text(text.rstrip() + '\n\n' + section + '\n', encoding='utf-8')

          print(f'Updated {len(paths)} lifecycle-derived reusable prompts.')
          PY

      - name: Validate exact prompt routing contract
        run: |
          set -euo pipefail
          python3 tools/agents/validate_governance.py
          python3 tools/agents/validate_remote_desktop_prompt_routing.py

      - name: Verify bounded changed paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          registry = json.loads(Path('docs/agents/PROMPT_LIFECYCLE.json').read_text(encoding='utf-8'))
          expected = sorted(
              entry['path']
              for entry in registry['prompts']
              if entry.get('status') == 'reusable' and entry.get('reusable') is True
          )
          actual = sorted(
              line for line in subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines() if line
          )
          if actual != expected:
              raise SystemExit(f'unexpected sweep diff: expected={expected!r} actual={actual!r}')
          print(f'Bounded sweep path set PASS: {len(actual)} prompts')
          PY
          git diff --check

      - name: Commit bounded sweep to task branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/agents/prompts/*.md
          git commit -m 'docs(agents): bind reusable prompts to RDC gate [rdc-sweep]'
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
