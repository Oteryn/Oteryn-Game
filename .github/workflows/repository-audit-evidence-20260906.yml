name: Repository audit source and model completion 20260906
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/repository-audit-evidence-20260906.yml','docs/agents/reports/repository-audit-20260906/probes/local_model_characterization.rs']
permissions:
  contents: read
jobs:
  model-characterization:
    if: github.event.pull_request.head.ref == 'audit/repository-coverage-20260906' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit-packet
          persist-credentials: false
      - name: Characterize original AI and Ability and compare SHA256 with independent oracle
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3
          mkdir evidence
          rustup toolchain install 1.94.0 --profile minimal
          python - <<'PY'
          from pathlib import Path
          import subprocess,hashlib,json,re
          root=Path.cwd()
          probe=root/'audit-packet/docs/agents/reports/repository-audit-20260906/probes/local_model_characterization.rs'
          source=probe.read_text().replace('../../../../../',root.as_posix()+'/')
          executable=root/'evidence/model-probe'
          temporary=root/'evidence/model-probe.rs';temporary.write_text(source)
          subprocess.run(['rustc','+1.94.0','--edition','2024','-O',str(temporary),'-o',str(executable)],check=True)
          result=subprocess.run([str(executable)],check=True,text=True,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          (root/'evidence/model-probe.log').write_text(result.stdout)
          vectors=[]
          for size,actual in re.findall(r'SHA256_VECTOR size=(\d+) digest=([0-9a-f]{64})',result.stdout):
              size=int(size);expected=hashlib.sha256(bytes(i%251 for i in range(size))).hexdigest()
              assert actual==expected,(size,actual,expected)
              vectors.append(dict(size=size,digest=actual))
          assert len(vectors)==13
          paths=['apps/game-server/src/ai/perception.rs','apps/game-server/src/ability/effects.rs','apps/game-server/src/ability/plan.rs','apps/game-server/src/ability/commit.rs','apps/game-server/src/content/digest.rs']
          (root/'evidence/model-summary.json').write_text(json.dumps(dict(source_commit='7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3',AI='separated duplicate identity accepted in all six orderings',Ability='raw public variants bypass magnitude constructors and plan validation',scope='fixture/bootstrap models, no production transport exploit or product repair',vectors=vectors,source_blobs={p:subprocess.check_output(['git','hash-object',p],text=True).strip() for p in paths}),indent=2))
          PY
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: continuation-models-7ce1d88
          path: |
            evidence/*.json
            evidence/*.log
          retention-days: 1
  provider-completion:
    if: github.event.pull_request.head.ref == 'audit/repository-coverage-20260906' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read complete regular UTF8 provider sources including PHP and shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          python - <<'PY'
          import subprocess,pathlib,json,zipfile,hashlib
          out=pathlib.Path('evidence'); inventory=[]
          sources=[('Oteryn-Platform','3b2ea1c7392187d5d22488673073dc8f8305a374'),('Oteryn-Atlas','51623c7dab2346cee39cd51e3caa845bf4b65426')]
          font_extensions={'.ttf','.otf','.woff','.woff2','.eot'}
          with zipfile.ZipFile(out/'provider-source-text.zip','w',zipfile.ZIP_DEFLATED) as archive:
            for repo,sha in sources:
              dest=pathlib.Path('/tmp')/('audit-'+repo);dest.mkdir()
              subprocess.run(['git','init','-q',str(dest)],check=True)
              subprocess.run(['git','-C',str(dest),'fetch','--depth=1','https://github.com/Oteryn/'+repo+'.git',sha],check=True)
              assert subprocess.check_output(['git','-C',str(dest),'rev-parse','FETCH_HEAD'],text=True).strip()==sha
              rows=subprocess.check_output(['git','-C',str(dest),'ls-tree','-r','-l','-z',sha]).split(b'\0');total=0
              for row in rows:
                if not row: continue
                metadata,raw_path=row.split(b'\t',1);mode,kind,oid,size=metadata.split();path=raw_path.decode()
                item=dict(repository=repo,commit=sha,path=path,mode=mode.decode(),sha=oid.decode(),size=int(size) if size!=b'-' else None,archived=False,reason='special-mode-or-size-budget')
                if kind==b'blob' and mode in {b'100644',b'100755'} and pathlib.PurePosixPath(path).suffix not in font_extensions and int(size)<=2000000 and total+int(size)<=40000000:
                  data=subprocess.check_output(['git','-C',str(dest),'cat-file','blob',oid.decode()])
                  try: data.decode('utf-8')
                  except UnicodeDecodeError: item['reason']='binary'
                  else:
                    if b'\0' not in data:
                      assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==oid.decode()
                      archive.writestr(repo+'/'+path,data);item['archived']=True;item['reason']='verified-text';total+=len(data)
                    else:item['reason']='binary'
                inventory.append(item)
          (out/'providers-inventory.json').write_text(json.dumps(inventory,indent=2))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: continuation-complete-provider-sources
          path: evidence
          retention-days: 1
