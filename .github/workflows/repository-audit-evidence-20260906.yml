name: Repository audit late semantic probes
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/repository-audit-evidence-20260906.yml'
permissions:
  contents: read
jobs:
  characterize:
    if: github.event.pull_request.head.ref == 'audit/repository-coverage-20260906' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3
          path: product
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit-packet
          persist-credentials: false
      - name: Reproduce existing API defects without repairing product
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C product rev-parse HEAD)" = 7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3
          mkdir evidence
          rustup toolchain install 1.94.0 --profile minimal
          rustc +1.94.0 -vV > evidence/compiler.txt
          python - <<'PY'
          from pathlib import Path
          root = Path.cwd()
          probe = root/'audit-packet/docs/agents/reports/repository-audit-20260906/probes/late_semantic_findings.rs'
          (root/'evidence/probe.rs').write_text(probe.read_text().replace('__PRODUCT__', str(root/'product')))
          PY
          rustc +1.94.0 --edition 2024 evidence/probe.rs -o evidence/probe
          evidence/probe | tee evidence/characterization.log
          sha256sum evidence/probe > evidence/binary-sha256.txt
          git -C product diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: audit-late-semantic-7ce1d88
          path: |
            evidence/*.txt
            evidence/*.log
            evidence/*.rs
          if-no-files-found: error
          retention-days: 7
