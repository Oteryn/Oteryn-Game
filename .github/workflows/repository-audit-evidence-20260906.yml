name: Repository audit native libFuzzer 20260906
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/repository-audit-evidence-20260906.yml']
permissions:
  contents: read
jobs:
  native-fuzz:
    if: github.event.pull_request.head.ref == 'audit/repository-coverage-20260906' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target: [wire, content]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: audit-packet
          persist-credentials: false
      - name: Execute direct native sanitizer campaign on unchanged product
        env:
          AUDIT_TARGET: ${{ matrix.target }}
        run: python audit-packet/docs/agents/reports/repository-audit-20260906/probes/run_fuzz.py "$AUDIT_TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: continuation-native-fuzz-${{ matrix.target }}-7ce1d88
          path: |
            evidence
            fuzz/artifacts
          retention-days: 1
