name: Repository audit evidence 20260906
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['.github/workflows/repository-audit-evidence-20260906.yml']
permissions: {}
concurrency:
  group: repository-audit-evidence-20260906-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  auxiliary:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'audit/repository-coverage-20260906'
    name: Audit / non-workspace Rust and complete Python test discovery
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3
          persist-credentials: false
      - name: Configure documented verification toolchains
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify non-workspace limit evidence program
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3
          mkdir -p audit-output
          rustup toolchain install 1.94.0 --profile minimal
          rustc +1.94.0 --edition 2024 -D warnings --test tools/next-wave-limit-evidence/main.rs -o "$RUNNER_TEMP/oteryn-limit-audit-tests"
          "$RUNNER_TEMP/oteryn-limit-audit-tests" 2>&1 | tee audit-output/non-workspace-rust-tests.log
          rustc +1.94.0 --edition 2024 -D warnings -O tools/next-wave-limit-evidence/main.rs -o "$RUNNER_TEMP/oteryn-limit-audit"
          "$RUNNER_TEMP/oteryn-limit-audit" > audit-output/limit-emitter.json
          python -m json.tool audit-output/limit-emitter.json >/dev/null
          "$RUNNER_TEMP/oteryn-limit-audit" --stress 8 2>&1 | tee audit-output/limit-model-stress.log
      - name: Execute every existing isolated Python test entrypoint
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONHASHSEED: '0'
        run: |
          python - <<'PY'
          import concurrent.futures, datetime, hashlib, json, os, pathlib, re, subprocess, sys, time
          root = pathlib.Path.cwd()
          out = root / 'audit-output'
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          tests = sorted(p for p in tracked if p.endswith('.py') and (pathlib.PurePosixPath(p).name.startswith('test_') or pathlib.PurePosixPath(p).name.endswith('self_test.py')))
          targets = tests + ['tools/agents/validate_governance.py', 'tools/repository/validate_repository_policy.py', 'tools/agents/validate_inherited_prompt_policy.py']
          def execute(path):
              started = datetime.datetime.now(datetime.timezone.utc).isoformat()
              begin = time.monotonic()
              env = dict(os.environ, PYTHONPATH=str(root/'tools/tibia-worldmap-reconstruction'))
              for key in ('GH', 'GH_TOKEN', 'GITHUB_TOKEN', 'DATABASE_URL', 'OTERYN_TEST_POSTGRES_ADMIN_URL'):
                  env.pop(key, None)
              command = [sys.executable, path]
              try:
                  result = subprocess.run(command, cwd=root, env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=90)
                  code, log = result.returncode, result.stdout
              except subprocess.TimeoutExpired as error:
                  code, log = 124, str(error)
              name = re.sub(r'[^A-Za-z0-9._-]', '_', path) + '.log'
              (out/name).write_text(log)
              return {'path': path, 'command': command, 'started_at': started, 'duration_seconds': round(time.monotonic()-begin, 3), 'exit_code': code, 'log': name, 'log_sha256': hashlib.sha256(log.encode()).hexdigest()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(execute, targets))
          summary = {'audited_commit': '7ce1d88ba7eb83033c4f0c11a5ccd1cb5030fac3', 'python': sys.version, 'commands': len(results), 'passed': sum(r['exit_code']==0 for r in results), 'failed': sum(r['exit_code']!=0 for r in results), 'results': results}
          (out/'python-tests.json').write_text(json.dumps(summary, indent=2)+'\n')
          subprocess.run(['git','diff','--exit-code'],check=True)
          print(json.dumps({k:v for k,v in summary.items() if k != 'results'}, indent=2))
          for result in results:
              print(('PASS' if result['exit_code']==0 else 'FAIL'),result['path'])
          # A discovered failing suite makes this observer fail. Never hide it as PASS.
          raise SystemExit(1 if summary['failed'] else 0)
          PY
      - name: Retain complete outcomes including discovered failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repository-audit-auxiliary-7ce1d88
          path: audit-output/
          retention-days: 1
          if-no-files-found: error
