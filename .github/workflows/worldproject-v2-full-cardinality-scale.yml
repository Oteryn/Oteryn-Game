name: World Project v2 Full-Cardinality Scale Measurement

on:
  pull_request:
    paths:
      - "tools/world-project-v2-scale-measurement/**"
      - ".github/workflows/worldproject-v2-full-cardinality-scale.yml"
      - "docs/agents/tasks/active/OTV2-20260924-worldproject-v2-full-cardinality-scale.md"
      - "docs/agents/evidence/OTV2-20260924-worldproject-v2-full-cardinality-scale.json"
      - "apps/game-server/src/content/project.rs"
      - "apps/game-server/src/content/project/v2.rs"
      - "apps/game-server/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldproject-v2-full-cardinality-scale-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust 1.94.0
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Test and run bounded synthetic smoke
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.94.0 test --manifest-path tools/world-project-v2-scale-measurement/Cargo.toml
          cargo +1.94.0 run --release --manifest-path tools/world-project-v2-scale-measurement/Cargo.toml -- --mode smoke | tee world-project-v2-scale-smoke.json
          python3 -c 'import json; d=json.load(open("world-project-v2-scale-smoke.json")); assert d["status"] == "completed"; assert d["input_class"] == "SYNTHETIC_SCALE_STRESS_ONLY"; assert d["placements_loaded"] == d["placements_requested"] == 2000'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: world-project-v2-scale-smoke-${{ github.event.pull_request.head.sha || github.sha }}
          path: world-project-v2-scale-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  supervised-full:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install Rust 1.94.0
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Build release probe
        run: cargo +1.94.0 build --release --manifest-path tools/world-project-v2-scale-measurement/Cargo.toml
      - name: Run full corpus under a 6 GiB virtual-memory ceiling
        shell: bash
        run: |
          set -euo pipefail
          result=world-project-v2-scale-full.json
          time_report=world-project-v2-scale-full.time.txt
          set +e
          /usr/bin/time -v -o "$time_report" bash -c 'ulimit -v 6291456 || exit 76; exec timeout --signal=TERM --kill-after=90s 75m tools/world-project-v2-scale-measurement/target/release/world-project-v2-scale-measurement --mode full' >"$result" 2>world-project-v2-scale-full.stderr
          rc=$?
          set -e
          python3 - "$result" "$time_report" "$rc" <<'PY'
          import json, re, sys
          result_path, time_path, rc_text = sys.argv[1:]
          rc = int(rc_text)
          try:
              with open(result_path) as stream:
                  data = json.load(stream)
          except (OSError, json.JSONDecodeError):
              data = {}
          try:
              with open(time_path) as stream:
                  timing = stream.read()
          except OSError:
              timing = ""
          match = re.search(r"Maximum resident set size \(kbytes\):\s*(\d+)", timing)
          peak = int(match.group(1)) * 1024 if match else data.get("peak_rss_bytes")
          valid_completed = rc == 0 and data.get("status") == "completed" and data.get("placements_loaded") == 24502036
          valid_resource_limit = rc == 75 and data.get("status") == "resource_limit"
          if valid_completed:
              status = "completed"
          else:
              status = "resource_limit"
              if not valid_resource_limit:
                  reason = "wall_clock_timeout" if rc == 124 else "resource_ceiling_or_incomplete_measurement"
                  data = {
                      "schema": "OTERYN_WORLD_PROJECT_SCALE_MEASUREMENT/v1",
                      "status": status,
                      "input_class": "SYNTHETIC_SCALE_STRESS_ONLY",
                      "mode": "full",
                      "placements_requested": 24502036,
                      "failed_stage": "supervised_process",
                      "exit_code": rc,
                      "reason": reason,
                      "one_placement_edit_amplification": {
                          "measurement_status": "ESTIMATE_NOT_GATE_COMPLETE",
                          "changed_paths": None,
                          "changed_file_count": None,
                          "changed_project_bytes": None,
                          "estimate_status": "unavailable_after_supervised_process_failure"
                      },
                      "schema_and_chunk_decision": "out_of_scope"
                  }
          data.update({
              "schema": "OTERYN_WORLD_PROJECT_SCALE_MEASUREMENT/v1",
              "status": status,
              "input_class": "SYNTHETIC_SCALE_STRESS_ONLY",
              "mode": "full",
              "placements_requested": 24502036,
              "peak_rss_bytes": peak,
          "peak_rss_source": "/usr/bin/time -v maximum resident set size (bytes converted from KiB)" if match else "probe self-report or unavailable",
          "donor_or_source_inputs_accepted": False,
          "one_placement_edit_amplification_status": "ESTIMATE_NOT_GATE_COMPLETE",
          "schema_and_chunk_decision": "out_of_scope"
          })
          if status == "completed":
              data["placements_loaded"] = 24502036
          required = {
              "schema": "OTERYN_WORLD_PROJECT_SCALE_MEASUREMENT/v1",
              "input_class": "SYNTHETIC_SCALE_STRESS_ONLY",
              "placements_requested": 24502036,
          }
          assert all(data.get(key) == value for key, value in required.items())
          assert data["status"] in {"completed", "resource_limit"}
          with open(result_path, "w") as stream:
              json.dump(data, stream, indent=2)
              stream.write("\n")
          PY
          cat "$result"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: world-project-v2-scale-full-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            world-project-v2-scale-full.json
            world-project-v2-scale-full.stderr
            world-project-v2-scale-full.time.txt
          if-no-files-found: warn
          retention-days: 30
