name: RDC systemic helper class fix once

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-systemic-helper-class-fix-once.yml

permissions:
  contents: write

jobs:
  systemic-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 2

      - name: Fail closed on exact helper revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9699a2e37e6ace3cee58f382a37ef1728503f277"
          test "$(git rev-parse HEAD:tools/agents/validate_remote_desktop_prompt_routing.py)" = "0ded8788b3f626ce2cf420faafd48061ac2ce6dc"
          test -f .github/workflows/rdc-systemic-semantic-green-once.yml

      - name: Apply corrected systemic semantic transform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          helper_path = Path(".github/workflows/rdc-systemic-semantic-green-once.yml")
          helper = helper_path.read_text(encoding="utf-8")
          lines = helper.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == "PY")
          code = textwrap.dedent("\n".join(lines[start + 1:end])) + "\n"

          old_authority = r'''r"\b(?:authority|authorization|authorisation|authorized|authorised|approval|approved|permission|permitted|permit|allowed|allowance|exception|entitlement)\b",'''
          new_authority = r'''r"\b(?:authority|authorization|authorisation|authorized|authorised|approval|approved|permission|permitted|permit|allowed|allowance|exception|entitlement)\b"
              r"|\bpre[- ]?(?:approv(?:e[sd]?|al)|authori[sz](?:e[sd]?|ation))\b",'''
          assert code.count(old_authority) == 1, code.count(old_authority)
          code = code.replace(old_authority, new_authority, 1)

          old_context = r'''r"\b(?:per[- ]?action|fresh|authorization|authorisation|approval|permission|decision|host[- ]?exception|gate|routing|unauthori[sz]ed|missing|lacking)\b",'''
          new_context = r'''r"\b(?:per[- ]?action|fresh|authorization|authorisation|approval|permission|decision|host[- ]?exception|gate|routing|unauthori[sz]ed|missing|lacking|physical(?:ly)?|policy)\b",'''
          assert code.count(old_context) == 1, code.count(old_context)
          code = code.replace(old_context, new_context, 1)

          old_coordinate_scan = '''def _validate_meta_routing_coordinates(path: Path, text: str, errors: list[str]) -> None:
              operative = _operative_text(text)
          '''
          new_coordinate_scan = '''def _validate_meta_routing_coordinates(path: Path, text: str, errors: list[str]) -> None:
              operative = _normalize_policy_text(_operative_text(text))
          '''
          assert code.count(old_coordinate_scan) == 1, code.count(old_coordinate_scan)
          code = code.replace(old_coordinate_scan, new_coordinate_scan, 1)

          exec(compile(code, str(helper_path), "exec"), {"__name__": "__main__"})
          PY

      - name: Verify systemic GREEN before publication
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_round12.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_governance.py
          git diff --check

      - name: Publish validator only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/agents/validate_remote_desktop_prompt_routing.py
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "tools/agents/validate_remote_desktop_prompt_routing.py"
          git commit -m "fix(agents): enforce systemic remote desktop semantics"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
