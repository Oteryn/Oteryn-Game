name: Node boot physical qualification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-boot-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-boot:
    name: Node boot / shipped binaries against the real Platform
    runs-on: ubuntu-24.04
    # W20a's natural day and W20b's light decay run serially for almost two hours.
    # Include build, the basic seam, World setup and the remaining journeys.
    timeout-minutes: 240
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check out exact public Platform producer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: 3bc2d0e923db7472ec1f9b534ebe87aaffa1ef05
          path: _platform
          persist-credentials: false

      - name: Verify exact Platform revision
        run: test "$(git -C _platform rev-parse HEAD)" = 3bc2d0e923db7472ec1f9b534ebe87aaffa1ef05

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Validate harness
        run: |
          set -euo pipefail
          bash -n tools/qualification/node_boot/run.sh
          python3 tools/qualification/node_boot/test_diagnostics.py
          echo 'NODE_BOOT_EVIDENCE static_validation=PASS shell=parsed'

      - name: Run node boot qualification
        env:
          PLATFORM_SOURCE: ${{ github.workspace }}/_platform
        run: |
          set -euo pipefail
          logs="$RUNNER_TEMP/node-boot-failure-logs"
          mkdir -p "$logs"
          evidence="$logs/qualification-client.log"
          NODE_BOOT_FAILURE_LOG_DIR="$logs" bash tools/qualification/node_boot/run.sh | tee "$evidence"
          grep -Fxq 'NODE_BOOT_RESULT=NODE_BOOT_PASS' "$evidence"
          grep -E '^(NODE_BOOT_EVIDENCE |SEAM_EVIDENCE |NODE_BOOT_RESULT=)' "$evidence" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Redact failed node boot logs
        if: failure()
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/node-boot-failure-logs"
          artifact="$RUNNER_TEMP/node-boot-failure-artifact"
          mkdir -p "$source" "$artifact"
          for log in node.log qualification-client.log; do
            if [[ ! -f "$source/$log" ]]; then
              printf 'Log unavailable; failure occurred before %s was created.\n' "$log" > "$source/$log"
            fi
            python3 tools/redact_ci_log.py "$source/$log" "$artifact/$log"
          done

      - name: Upload failed node boot logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-boot-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-boot-failure-artifact
          if-no-files-found: error
          retention-days: 7
