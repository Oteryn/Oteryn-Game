name: Repository configuration

on:
  push:
    branches:
      - main
    paths:
      - .github/repository-policy.json
      - .github/workflows/repository-configuration.yml
      - tools/repository/apply_github_settings.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-configuration
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply and verify GitHub settings
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: python tools/repository/apply_github_settings.py
