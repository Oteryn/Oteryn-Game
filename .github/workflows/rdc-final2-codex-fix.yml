name: RDC final2 Codex fix

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final2-codex-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0

      - name: Apply bounded validator repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          old_permission = '''    re.compile(\n        r"(?=.*\\bdirect\\s+(?:connectors?|tools?)\\b)"\n        r"(?=.*\\b(?:(?:blanket|standing|automatic)\\s+(?:approval|permission)|(?:approval|permission)\\s+by\\s+default)\\b)",\n        re.IGNORECASE,\n    ),\n'''
          new_permission = '''    re.compile(\n        r"(?=.*\\bdirect\\s+(?:connectors?|tools?)\\b)"\n        r"(?=.*(?:\\b(?:blanket|standing|automatic|default)\\s+(?:approval|permission)\\b|"\n        r"\\b(?:approval|permission)\\s+by\\s+default\\b|\\bby\\s+default\\b.{0,160}\\b(?:approval|permission)\\b))",\n        re.IGNORECASE,\n    ),\n'''
          if text.count(old_permission) != 1:
              raise SystemExit("unexpected direct-permission matcher count")
          text = text.replace(old_permission, new_permission, 1)

          old_provider_nouns = '(?:connectors?|routers?|transports?)'
          new_provider_nouns = '(?:connectors?|routers?|transports?|providers?)'
          provider_count = text.count(old_provider_nouns)
          if provider_count != 6:
              raise SystemExit(f"unexpected enforcement provider matcher count: {provider_count}")
          text = text.replace(old_provider_nouns, new_provider_nouns)

          old_url = 'r"(?:(?:https?:)?//)(?:www\\.)?github\\.com/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json"'
          new_url = 'r"(?:(?:https?:)?//)(?:www\\.)?github\\.com(?::[0-9]{1,5})?/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json"'
          if text.count(old_url) != 1:
              raise SystemExit("unexpected GitHub routing URL matcher count")
          text = text.replace(old_url, new_url, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify repaired validator
        run: |
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check

      - name: Remove one-shot helper and publish repair
        run: |
          rm .github/workflows/rdc-final2-codex-fix.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/rdc-final2-codex-fix.yml' 'tools/agents/validate_remote_desktop_prompt_routing.py' | sort)"
          test "$changed" = "$expected"
          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -A
          git commit -m "fix(agents): close reordered Codex RDC bypasses"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
