name: Agent governance

on:
  pull_request:
    paths:
      - AGENTS.md
      - AGENTS.override.md
      - README.md
      - docs/agents/**
      - docs/architecture/**
      - tools/agents/**
      - .github/workflows/agent-governance.yml
  push:
    branches:
      - main
    paths:
      - AGENTS.md
      - AGENTS.override.md
      - README.md
      - docs/agents/**
      - docs/architecture/**
      - tools/agents/**
      - .github/workflows/agent-governance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate agent governance
        run: python tools/agents/validate_governance.py
