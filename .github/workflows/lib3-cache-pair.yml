name: Hosted lib-3 protected dependency cache verification
'on':
  push:
    branches:
    - codex/lib3-cache-pair-20261120
    paths:
    - .github/workflows/lib3-cache-pair.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - name: Check out exact pull request head
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 9efd6a1dad24868aab2481c2913f8031b3c65f69
        persist-credentials: false
    - name: Restore Cargo dependencies for dispatch lib-3
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: pg-cargo-deps-linux-v1-${{ hashFiles('Cargo.lock') }}
        fail-on-cache-miss: 'true'
      id: main_deps
    - name: Verify offline workspace metadata from cache
      env:
        EXACT_HIT: ${{ steps.main_deps.outputs.cache-hit }}
      run: |-
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "9efd6a1dad24868aab2481c2913f8031b3c65f69"
        test "$EXACT_HIT" = true
        test ! -e target
        rustup toolchain install 1.100.0 --profile minimal
        cargo +1.100.0 metadata --locked --offline --format-version 1 > "$RUNNER_TEMP/metadata.json"
        jq -e '.packages | length > 0' "$RUNNER_TEMP/metadata.json"
        du -sh ~/.cargo/registry/index ~/.cargo/registry/cache
