name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Detect repository-policy bootstrap
        id: bootstrap
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          path = urllib.parse.quote('.github/repository-policy.json', safe='/')
          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              f"/contents/{path}?ref={os.environ['BASE_SHA']}"
          )
          request = urllib.request.Request(
              url,
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2026-03-10',
                  'User-Agent': 'Oteryn-v2-dependency-review-bootstrap',
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30):
                  bootstrap = False
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              bootstrap = True
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"active={'true' if bootstrap else 'false'}\n")
          print(f"Repository-policy bootstrap: {bootstrap}")
          PY

      - name: Explain bootstrap exception
        if: steps.bootstrap.outputs.active == 'true'
        run: |
          echo "Dependency review is deferred only for the PR that enables the dependency graph and repository security policy."

      - name: Review dependency changes
        if: steps.bootstrap.outputs.active != 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
