name: Final cleanup apply 388 (temporary)

on:
  push:
    branches:
      - governance/final-cleanup-388

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/final-cleanup-388
          fetch-depth: 0
      - name: Verify transport head
        run: |
          test "$(git rev-parse HEAD^)" = "283e2d324edb10a3f9ed8a0fa53f137599438ffc"
          test "$(git rev-parse a793457cf3001df37109acb2c4b4a772b53db97a^{commit})" = "a793457cf3001df37109acb2c4b4a772b53db97a"
      - name: Apply exact validated cleanup
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply388.py
          git show 9f769a77c3c6067f389906f0b62372f2d30684c2:tools/agents/validate_governance.py > tools/agents/validate_governance.py
          rm tools/agents/validate_governance_core.py docs/agents/CODEX_REVIEW_POLICY.json
          python /tmp/apply388.py
          rm .github/workflows/final-cleanup-apply-388.yml
      - name: Freeze exact candidate
        shell: bash
        run: |
          git config user.name "Oteryn Agent"
          git config user.email "oteryn-agent@users.noreply.github.com"
          git add -A
          git commit -m "refactor(governance): remove retired controller and prompt dispatch"
          test "$(git rev-parse HEAD^{tree})" = "aea37601eb9f9b3b1174f90fe795b969fadde3f5"
      - name: Validate exact candidate
        shell: bash
        run: |
          python tools/agents/validate_governance.py
          python -m unittest discover -s tools/agents/tests -v
          python tools/repository/validate_repository_policy.py
          python tools/architecture/semantic_contract_audit.py --base-sha a793457cf3001df37109acb2c4b4a772b53db97a --head-sha "$(git rev-parse HEAD)"
          git diff --check HEAD^ HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('docs/agents/PROMPT_LIFECYCLE.json').read_text())
          reusable=[e for e in d['prompts'] if e['status']=='reusable']
          retired=[e for e in d['prompts'] if e['status']=='retired']
          assert len(reusable)==39, len(reusable)
          assert len(retired)==9, len(retired)
          for e in reusable:
              assert 'Superpowers' not in Path(e['path']).read_text(), e['prompt_id']
          print('prompt lifecycle: 39 reusable / 9 retired; reusable Superpowers refs: 0')
          PY
      - name: Publish exact candidate
        run: git push origin HEAD:governance/final-cleanup-388
