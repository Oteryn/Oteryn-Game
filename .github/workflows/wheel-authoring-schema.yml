name: Wheel Authoring Schema

on:
  pull_request:
    paths:
      - tools/content-schema/wheel-authoring/**
      - rulesets/progression/wheel-of-destiny/**
      - rulesets/progression/gem-atelier/**
      - tools/content-schema/spell-authoring/wheel-augments.json
      - tools/content-schema/item-authoring/**
      - content/assets/files/**
      - imports/official/client-assets/15.30/manifest.json
      - docs/reference/tibia-manual/characters.md
      - .github/workflows/wheel-authoring-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  wheel-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/wheel-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt
      - name: Check deterministic schemas, candidate and evidence
        run: |
          python build_schema.py --check
          python wheel_authoring.py build --check
          python wheel_authoring.py validate
          python verify_item_assets.py --check
          python client_icons.py --check
          python import_server_data.py --check
      - name: Regression tests and deterministic report
        run: |
          python -m unittest discover -s . -q
          python build_report.py --check
      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        working-directory: .
        run: test -z "$(git status --short --untracked-files=all)"
