name: Bevy client regressions

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'crates/client-*/**'
      - 'crates/input-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bevy-client-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'apps/client/**'
      - 'crates/client-*/**'
      - 'crates/input-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bevy-client-regressions.yml'

permissions:
  contents: read

jobs:
  bevy_client:
    name: Bevy client regressions / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libseccomp2

      - name: Test screenshot and window close regressions
        run: >-
          cargo +1.100.0 test --locked -p oteryn-client --features bevy-shell --lib --
          bevy_shell::screenshots::tests
          bevy_shell::ui::window_layout::tests::window_close_saves_pending_move_when_next_frame_is_past_deadline
