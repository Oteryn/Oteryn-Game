name: RDC final P2 GREEN retry

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final-p2-green-retry.yml

permissions:
  contents: write

jobs:
  publish-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Prove RED, apply bounded validator patch, prove GREEN
        shell: bash
        run: |
          test "$(git rev-parse HEAD:tools/agents/validate_remote_desktop_prompt_routing.py)" = "29248fd91b4f1fae8d2acc2e1be8e654d3c113ce"
          test "$(git rev-parse HEAD:tools/agents/test_validate_remote_desktop_prompt_routing.py)" = "6820f60e4a882b70d4f98d65d632d3b95dd8c4e7"
          python - <<'PY'
          import sys
          sys.path.insert(0, "tools/agents")
          import test_validate_remote_desktop_prompt_routing as tests

          expected_red = [
              "test_pre_html_block_prompt_section_does_not_count",
              "test_script_html_block_surface_section_does_not_count",
              "test_direct_connector_operations_authorization_outside_section_fails",
              "test_surface_direct_tool_requests_authorization_outside_section_fails",
              "test_invisible_separator_connector_identifier_outside_section_fails",
              "test_surface_invisible_separator_connector_identifier_outside_section_fails",
              "test_non_cf_default_ignorable_connector_identifier_outside_section_fails",
          ]
          for name in expected_red:
              try:
                  getattr(tests, name)()
              except AssertionError as exc:
                  print(f"EXPECTED RED {name}: {exc}")
              else:
                  raise SystemExit(f"expected RED regression unexpectedly passed: {name}")
          PY
          echo '' | base64 -d | gzip -d > /tmp/rdc_patch.py
          python /tmp/rdc_patch.py
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_governance.py
          python tools/repository/validate_repository_policy.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/agents/validate_remote_desktop_prompt_routing.py
          git diff --cached --check
          git commit -m "fix(agents): close raw-HTML and Unicode RDC bypasses"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
          echo "Published GREEN head: $(git rev-parse HEAD)"
