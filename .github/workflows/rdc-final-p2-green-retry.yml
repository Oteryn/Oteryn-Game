name: RDC final named-host-operation RED GREEN

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final-p2-green-retry.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Prove RED then apply minimal GREEN
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import subprocess
          import sys

          branch = "governance/remote-desktop-per-action-gate-237"
          test_path = Path("tools/agents/test_validate_remote_desktop_prompt_routing.py")
          validator_path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          test_text = test_path.read_text(encoding="utf-8")
          validator_text = validator_path.read_text(encoding="utf-8")

          new_tests = '''
          def test_named_filesystem_operations_preapproved_outside_section_fails() -> None:
              text = (
                  "# Prompt\\n\\nFilesystem operations are preapproved.\\n\\n"
                  + CANONICAL_PROMPT_SECTION
                  + "\\n"
              )
              assert_fail(text, "Remote Desktop policy text outside canonical section")


          def test_surface_named_history_actions_blanket_approval_outside_section_fails() -> None:
              text = (
                  "# Surface\\n\\nHistory actions have blanket approval.\\n\\n"
                  + SURFACE_SECTION
                  + "\\n"
              )
              assert_surface_fail(text, "Remote Desktop policy text outside canonical section")


          '''
          marker = "def main() -> int:\n"
          if "test_named_filesystem_operations_preapproved_outside_section_fails" in test_text:
              raise SystemExit("named-host-operation regressions already exist unexpectedly")
          if marker not in test_text:
              raise SystemExit("test main marker missing")
          test_path.write_text(test_text.replace(marker, new_tests + marker, 1), encoding="utf-8")

          subprocess.run(["git", "add", str(test_path)], check=True)
          subprocess.run(["git", "commit", "-m", "test(agents): cover named host-operation blanket authority"], check=True)
          red_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)
          print(f"RED_HEAD={red_head}")

          sys.path.insert(0, str(test_path.parent.resolve()))
          spec = importlib.util.spec_from_file_location("rdc_tests", test_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          for name in (
              "test_named_filesystem_operations_preapproved_outside_section_fails",
              "test_surface_named_history_actions_blanket_approval_outside_section_fails",
          ):
              try:
                  getattr(module, name)()
              except AssertionError:
                  print(f"EXPECTED_RED {name}")
              else:
                  raise SystemExit(f"regression unexpectedly passed before validator repair: {name}")

          anchor = '    re.compile(r"\\bping\\b.{0,100}\\b(?:capability|discover|connector|tool|host)\\b", re.IGNORECASE),\n'
          if validator_text.count(anchor) != 1:
              raise SystemExit("expected one ping-pattern insertion anchor")
          insert = '''    re.compile(
              r"\\b(?:filesystem|search|process|session|terminal|history)\\s+(?:calls?|operations?|requests?|invocations?|actions?)\\b.{0,160}"
              r"\\b(?:authori[sz]ation|(?:pre)?authori[sz]ed|(?:pre)?approved|host[- ]exception|exception|per[- ]action|exempt|without|allow(?:ed|ance)?|permit(?:ted|s)?|require(?:d|s)?|need(?:s)?\\s+no|(?:blanket|standing|automatic)\\s+approval|preapproval|approval\\s+by\\s+default)\\b",
              re.IGNORECASE,
          ),
          re.compile(
              r"\\b(?:authori[sz]ation|(?:pre)?authori[sz]ed|(?:pre)?approved|host[- ]exception|exception|per[- ]action|exempt|without|allow(?:ed|ance)?|permit(?:ted|s)?|require(?:d|s)?|need(?:s)?\\s+no|(?:blanket|standing|automatic)\\s+approval|preapproval|approval\\s+by\\s+default)\\b.{0,160}"
              r"\\b(?:filesystem|search|process|session|terminal|history)\\s+(?:calls?|operations?|requests?|invocations?|actions?)\\b",
              re.IGNORECASE,
          ),
          '''
          validator_path.write_text(validator_text.replace(anchor, insert + anchor, 1), encoding="utf-8")

          for command in (
              [sys.executable, str(test_path)],
              [sys.executable, str(validator_path)],
              [sys.executable, "tools/agents/validate_governance.py"],
              [sys.executable, "tools/repository/validate_repository_policy.py"],
              ["git", "diff", "--check"],
          ):
              print("RUN", " ".join(command))
              subprocess.run(command, check=True)

          subprocess.run(["git", "add", str(validator_path)], check=True)
          subprocess.run(["git", "commit", "-m", "fix(agents): reject named host-operation blanket authority"], check=True)
          green_head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)
          print(f"GREEN_HEAD={green_head}")
          PY
