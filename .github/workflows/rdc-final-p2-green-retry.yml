name: RDC final authority P2 GREEN retry

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final-p2-green-retry.yml

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply corrected minimal GREEN and verify
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/rdc_final_authority_green.py
          python /tmp/rdc_final_authority_green.py
