name: RDC call-first Codex P2 repair

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final-p2-green-retry.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Prove RED, repair minimally, prove GREEN
        run: python .github/rdc_call_first_p2_repair.py
