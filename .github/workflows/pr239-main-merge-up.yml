name: PR239 exact main merge-up

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/pr239-main-merge-up.yml

permissions:
  contents: write

jobs:
  merge-up:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Merge protected main exactly
        shell: bash
        run: |
          set -euo pipefail
          branch='governance/remote-desktop-per-action-gate-237'
          expected_main='138c5add957718bd26149820626e538068a35a58'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin refs/heads/$branch | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$expected_main"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit origin/main
          git rm .github/workflows/pr239-main-merge-up.yml
          test -f docs/agents/tasks/active/OTV2-20260825-work-delivery-coordinator.md
          git diff --check --cached
          git commit -m 'merge: synchronize protected main into PR 239'
          test "$(git rev-parse HEAD^1)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^2)" = "$expected_main"
          remote_head="$(git ls-remote origin refs/heads/$branch | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:$branch
