name: PR239 round11 green

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Apply bounded production repair
        run: python tools/agents/_pr239_round11_green.py
      - name: Verify complete governance repair
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/validate_governance.py
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          python - <<'PY'
          from pathlib import Path
          task = Path('docs/agents/tasks/active/OTV2-20260828-remote-desktop-per-action-gate.md').read_text(encoding='utf-8')
          assert 'all **44** lifecycle-reusable Game prompts' in task
          assert 'test_validate_remote_desktop_prompt_routing_codex_regressions.py' in task
          assert '.github/workflows/rdc-final-p2-green-retry.yml' not in task.split('```', 2)[1]
          assert 'three unresolved Codex P2 parser/normalization bypasses remain RED at handoff' not in task
          assert 'temporary_helper_still_in_diff:' not in task
          print('Current task checkpoint validation PASS')
          PY
          git diff --check
      - name: Publish clean GREEN commit
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="$(git rev-parse HEAD)"
          git rm .github/workflows/pr239-round11-green.yml tools/agents/_pr239_round11_green.py
          git add tools/agents/validate_remote_desktop_prompt_routing.py docs/agents/tasks/active/OTV2-20260828-remote-desktop-per-action-gate.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agents): close final Codex round 11 findings"
          remote_sha="$(git ls-remote origin refs/heads/governance/remote-desktop-per-action-gate-237 | cut -f1)"
          test "$remote_sha" = "$expected_parent"
          git push origin HEAD:refs/heads/governance/remote-desktop-per-action-gate-237
