name: Game Atlas animated appearances

run-name: Game Atlas animated appearances • pull_request • ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/game-atlas-appearances/**'
      - 'tools/game-atlas-outfit-spatial/**'
      - 'tools/game-atlas-creatures/animated.py'
      - 'tools/game-atlas-creatures/animated_self_test.py'
      - 'tools/game-atlas-fullworld-source/animated.py'
      - 'tools/game-atlas-fullworld-source/animated_self_test.py'
      - 'docs/contracts/OTERYN_ATLAS_ANIMATED_APPEARANCES_V1.md'
      - 'docs/contracts/OTERYN_ATLAS_15_32_ANIMATION_CENSUS_V1.json'
      - '.github/workflows/game-atlas-animated-appearances.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-atlas-animated-appearances-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Game Atlas animation producer / exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Game revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify exact checked out head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Check out pinned migration evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: blakinio/Otheryn
          ref: e417c5e7c22986bf4acef0495eb47f7b72c97cce
          path: legacy
          fetch-depth: 1
          persist-credentials: false

      - name: Verify migration evidence revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C legacy rev-parse HEAD)" = 'e417c5e7c22986bf4acef0495eb47f7b72c97cce'
          test -f legacy/src/protobuf/appearances.proto
          test -f legacy/tools/otbm_atlas/assets.py
          test -d legacy/vendor/map-analysis/crystalserver/data-global/world
          test -d legacy/vendor/map-analysis/crystalserver/data-global/npc
          test -d legacy/vendor/map-analysis/crystalserver/data-global/monster

      - name: Download exact 15.32 source
        shell: bash
        run: |
          set -euo pipefail
          FILE_ID='1Dlo3bS4K1nS3mw4BhPZdlHT7lX5zRAvv'
          EXPECTED='1a6bad8b7598cd874f534cd4aae2d249fb3d9b4458b3ccfa75754f91bb27870f'
          URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
          curl -fL --retry 5 --retry-delay 2 "$URL" -o /tmp/15.32.zip
          test "$(sha256sum /tmp/15.32.zip | awk '{print $1}')" = "$EXPECTED"

      - name: Compile and run pure producer tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/game-atlas-appearances/export.py \
            tools/game-atlas-appearances/verify.py \
            tools/game-atlas-appearances/self_test.py \
            tools/game-atlas-outfit-spatial/export.py \
            tools/game-atlas-outfit-spatial/self_test.py \
            tools/game-atlas-creatures/animated.py \
            tools/game-atlas-creatures/animated_self_test.py \
            tools/game-atlas-fullworld-source/animated.py \
            tools/game-atlas-fullworld-source/animated_self_test.py
          python tools/game-atlas-appearances/self_test.py
          python tools/game-atlas-outfit-spatial/self_test.py
          python tools/game-atlas-creatures/self_test.py
          python tools/game-atlas-creatures/animated_self_test.py
          python tools/game-atlas-fullworld-source/animated_self_test.py

      - name: Build exact animation and outfit spatial products twice
        shell: bash
        run: |
          set -euo pipefail
          python tools/game-atlas-appearances/export.py /tmp/15.32.zip /tmp/appearance-a | tee /tmp/appearance-build.json
          python tools/game-atlas-appearances/export.py /tmp/15.32.zip /tmp/appearance-b >/dev/null
          diff -rq /tmp/appearance-a /tmp/appearance-b
          python tools/game-atlas-appearances/verify.py /tmp/appearance-a | tee /tmp/appearance-verify.json
          python tools/game-atlas-appearances/verify.py /tmp/appearance-b >/dev/null
          python tools/game-atlas-outfit-spatial/export.py /tmp/15.32.zip /tmp/outfit-spatial-a | tee /tmp/outfit-spatial-build.json
          python tools/game-atlas-outfit-spatial/export.py /tmp/15.32.zip /tmp/outfit-spatial-b >/dev/null
          diff -rq /tmp/outfit-spatial-a /tmp/outfit-spatial-b
          python - <<'PY'
          import importlib.util, json, pathlib, sys
          path=pathlib.Path('tools/game-atlas-outfit-spatial/export.py')
          spec=importlib.util.spec_from_file_location('spatial_verify',path); mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          a,_=mod.load_index(pathlib.Path('/tmp/outfit-spatial-a'))
          b,_=mod.load_index(pathlib.Path('/tmp/outfit-spatial-b'))
          assert a == b
          pathlib.Path('/tmp/outfit-spatial-verify.json').write_text(json.dumps({'status':'PASS','product_root':a['product_root'],'statistics':a['statistics']},sort_keys=True)+'\n')
          print(pathlib.Path('/tmp/outfit-spatial-verify.json').read_text(), end='')
          PY

      - name: Verify exhaustive census and committed root
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          expected=json.loads(Path('docs/contracts/OTERYN_ATLAS_15_32_ANIMATION_CENSUS_V1.json').read_text())
          actual=json.loads(Path('/tmp/appearance-a/census.json').read_text())
          manifest=json.loads(Path('/tmp/appearance-a/manifest.json').read_text())
          assert actual == expected['census'], 'decoder census drifted from evidence'
          assert manifest['product_root'] == expected['product_root'], 'animation product root drifted'
          assert actual['object']['appearances'] == 43514
          assert actual['object']['animated_appearances'] == 5190
          assert actual['outfit']['appearances'] == 1480
          assert actual['outfit']['frame_groups'] == 2935
          assert actual['outfit']['animated_appearances'] == 1466
          assert actual['outfit']['animated_frame_groups'] == 1732
          assert actual['effect']['appearances'] == 243
          assert actual['missile']['appearances'] == 76
          assert actual['missile']['animated_appearances'] == 0
          print(json.dumps({'product_root':manifest['product_root'],'census':'PASS'},sort_keys=True))
          PY

      - name: Prove corrupt products fail closed
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/appearance-a /tmp/appearance-corrupt
          printf ' ' >> /tmp/appearance-corrupt/object-programs.jsonl
          if python tools/game-atlas-appearances/verify.py /tmp/appearance-corrupt >/tmp/corrupt.log 2>&1; then
            echo 'ERROR: verifier accepted corrupt animation product' >&2
            exit 1
          fi
          grep -q 'ERROR:' /tmp/corrupt.log
          cp -a /tmp/outfit-spatial-a /tmp/outfit-spatial-corrupt
          printf ' ' >> /tmp/outfit-spatial-corrupt/outfits.jsonl
          if python - <<'PY' >/tmp/spatial-corrupt.log 2>&1
          import importlib.util, pathlib, sys
          path=pathlib.Path('tools/game-atlas-outfit-spatial/export.py')
          spec=importlib.util.spec_from_file_location('spatial_corrupt',path); mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          mod.load_index(pathlib.Path('/tmp/outfit-spatial-corrupt'))
          PY
          then
            echo 'ERROR: verifier accepted corrupt outfit spatial product' >&2
            exit 1
          fi

      - name: Resolve real pinned NPC and monster outfits
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/legacy/vendor/map-analysis/crystalserver/data-global"
          python tools/game-atlas-creatures/animated.py \
            "$ROOT/world" "$ROOT/npc" "$ROOT/monster" \
            /tmp/appearance-a /tmp/outfit-spatial-a /tmp/animated-creatures.json \
            | tee /tmp/creature-build.json
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/animated-creatures.json').read_text())
          assert data['capability']=='animated-creatures-v1'
          assert data['appearance_product_root']=='sha256:0d1c8fc777d1d220a9d7723507fddd72585f7358d35a40209bd7415f1fe057c1'
          assert data['outfit_spatial_product_root'].startswith('sha256:')
          n=data['statistics']['npc_presentation']
          m=data['statistics']['monster_presentation']
          assert n['resolved_unique_outfits'] > 0
          assert m['resolved_unique_outfits'] > 0
          assert n['resolved_animated_unique_outfits'] > 0
          assert m['resolved_animated_unique_outfits'] > 0
          for key in ('npcs','monster_spawns'):
              for record in data[key]:
                  if record.get('presentation_resolution_state') == 'UNRESOLVED_APPEARANCE':
                      assert record.get('presentation_fallback') == 'factual-marker'
          Path('/tmp/creature-evidence.json').write_text(json.dumps({
              'appearance_product_root':data['appearance_product_root'],
              'outfit_spatial_product_root':data['outfit_spatial_product_root'],
              'semantic_digest':data['semantic_digest'],
              'statistics':data['statistics'],
          },indent=2,sort_keys=True)+'\n')
          print(json.dumps({'npc':n,'monster':m},sort_keys=True))
          PY

      - name: Record exact-head evidence
        shell: bash
        env:
          PRODUCER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest=json.loads(Path('/tmp/appearance-a/manifest.json').read_text())
          verify=json.loads(Path('/tmp/appearance-verify.json').read_text())
          spatial=json.loads(Path('/tmp/outfit-spatial-verify.json').read_text())
          creature=json.loads(Path('/tmp/creature-evidence.json').read_text())
          evidence={
            'producer_repository':'Oteryn/Oteryn-Game',
            'producer_head_sha':os.environ['PRODUCER_SHA'],
            'migration_repository':'blakinio/Otheryn',
            'migration_sha':'e417c5e7c22986bf4acef0495eb47f7b72c97cce',
            'source':manifest['source'],
            'product_root':manifest['product_root'],
            'outfit_spatial':spatial,
            'statistics':manifest['statistics'],
            'creatures':creature,
            'deterministic_double_build':True,
            'corruption_rejected':True,
            'verification':verify,
          }
          Path('/tmp/animation-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print(json.dumps(evidence,indent=2,sort_keys=True))
          PY

      - name: Upload metadata and evidence only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: game-atlas-animated-appearances-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/appearance-a/product.json
            /tmp/appearance-a/manifest.json
            /tmp/appearance-a/census.json
            /tmp/appearance-a/object-programs.jsonl
            /tmp/appearance-a/outfit-programs.jsonl
            /tmp/outfit-spatial-a/product.json
            /tmp/outfit-spatial-a/manifest.json
            /tmp/outfit-spatial-a/outfits.jsonl
            /tmp/appearance-verify.json
            /tmp/outfit-spatial-verify.json
            /tmp/creature-evidence.json
            /tmp/animation-evidence.json
          if-no-files-found: error
          compression-level: 9
          retention-days: 90
