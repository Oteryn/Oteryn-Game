name: RDC final Codex fix

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final-codex-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0

      - name: Apply bounded validator repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'r"https://github\\.com/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json"',
                  'r"(?:(?:https?:)?//)github\\.com/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json"',
                  1,
              ),
              (
                  'approval\\s+by\\s+default',
                  '(?:approval|permission)\\s+by\\s+default',
                  5,
              ),
              (
                  '(?:connector|router|transport)',
                  '(?:connectors?|routers?|transports?)',
                  5,
              ),
              (
                  'enforce|enforces|enforced|enforcing|block|blocks|blocked|blocking|reject|rejects|rejected|rejecting',
                  'enforce|enforces|enforced|enforcing|enforcement|block|blocks|blocked|blocking|reject|rejects|rejected|rejecting',
                  1,
              ),
          ]

          for old, new, expected_count in replacements:
              actual = text.count(old)
              if actual != expected_count:
                  raise SystemExit(f"unexpected replacement count for {old!r}: {actual} != {expected_count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify repaired validator
        run: |
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check

      - name: Remove one-shot helper and publish repair
        run: |
          rm .github/workflows/rdc-final-codex-fix.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/rdc-final-codex-fix.yml' 'tools/agents/validate_remote_desktop_prompt_routing.py' | sort)"
          test "$changed" = "$expected"
          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -A
          git commit -m "fix(agents): close final Codex RDC bypasses"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
