name: NPC TibiaWiki BR Capture

on:
  pull_request:
    branches:
      - main
    paths:
      - tools/content-schema/npc-authoring/wiki_br.py
      - .github/workflows/npc-tibiawiki-br-capture.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npc-tibiawiki-br-capture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: NPC / TibiaWiki BR snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run offline self-test
        run: python tools/content-schema/npc-authoring/wiki_br.py self-test

      - name: Capture NPC pages
        run: |
          set -euo pipefail
          python tools/content-schema/npc-authoring/wiki_br.py fetch \
            --out "$RUNNER_TEMP/npc-tibiawiki-br/tibiawiki-br-npc-snapshot.json"
          python tools/content-schema/npc-authoring/wiki_br.py facts \
            --snapshot "$RUNNER_TEMP/npc-tibiawiki-br/tibiawiki-br-npc-snapshot.json" \
            --out "$RUNNER_TEMP/npc-tibiawiki-br/tibiawiki-br-npc-facts.json"
          sha256sum "$RUNNER_TEMP"/npc-tibiawiki-br/*.json

      - name: Upload snapshot and facts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npc-tibiawiki-br-snapshot-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/npc-tibiawiki-br/tibiawiki-br-npc-snapshot.json
            ${{ runner.temp }}/npc-tibiawiki-br/tibiawiki-br-npc-facts.json
          if-no-files-found: error
          retention-days: 30
