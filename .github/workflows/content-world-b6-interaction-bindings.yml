name: Content World B6 interaction bindings

run-name: Content World B6 interaction bindings • PR #${{ github.event.pull_request.number }}

# The pinned-source rebuild of the B6 catalogue was removed in GAME-DECANARY-2a: Game CI no longer
# fetches external server repositories. The tracked evidence is regenerated locally with
# interaction_binding_catalog.py (see tools/reference-world-corridor-census/README.md); CI runs
# the offline self-tests only.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/reference-world-corridor-census/interaction_binding_catalog.py'
      - 'tools/reference-world-corridor-census/interaction_binding_catalog_self_test.py'
      - 'tools/game-atlas-fullworld-source/producer.py'
      - 'tools/reference-world-corridor-census/census.py'
      - 'tools/game-atlas-thais-fixture/export.py'
      - 'tools/reference-world-corridor-census/self_test.py'
      - 'tools/reference-world-corridor-census/content_source_batch_self_test.py'
      - 'tools/game-atlas-fullworld-source/self_test.py'
      - '.github/workflows/content-world-b6-interaction-bindings.yml'

permissions:
  contents: read

concurrency:
  group: content-world-b6-interaction-bindings-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  self-tests:
    name: Content World B6 / offline self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact Game PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify exact Game head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compile B6 generator and focused self-test
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile \
            tools/reference-world-corridor-census/interaction_binding_catalog.py \
            tools/reference-world-corridor-census/interaction_binding_catalog_self_test.py

      - name: Run focused and existing regression self-tests
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/reference-world-corridor-census/interaction_binding_catalog_self_test.py
          python -B tools/reference-world-corridor-census/self_test.py
          python -B tools/reference-world-corridor-census/content_source_batch_self_test.py
          python -B tools/game-atlas-fullworld-source/self_test.py
