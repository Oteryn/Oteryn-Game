name: Content World B6 interaction bindings

run-name: Content World B6 interaction bindings • PR #${{ github.event.pull_request.number }}

# The pinned-source rebuild of the B6 catalogue was removed in GAME-DECANARY-2a: Game CI no longer
# fetches external server repositories. The tracked evidence is regenerated locally with
# interaction_binding_catalog.py (see tools/reference-world-corridor-census/README.md). CI runs
# the offline self-tests and an offline closure check: the recorded Game inputs must match the
# checked-out files, and every tracked index, family and shard file must equal an offline rebuild
# of its records with the checked-out generator.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/reference-world-corridor-census/interaction_binding_catalog.py'
      - 'tools/reference-world-corridor-census/interaction_binding_catalog_self_test.py'
      - 'tools/game-atlas-fullworld-source/producer.py'
      - 'tools/reference-world-corridor-census/census.py'
      - 'tools/game-atlas-thais-fixture/export.py'
      - 'tools/reference-world-corridor-census/self_test.py'
      - 'tools/reference-world-corridor-census/content_source_batch_self_test.py'
      - 'tools/game-atlas-fullworld-source/self_test.py'
      - 'docs/agents/evidence/OTV2-20260920-content-world-cw2-b6-interaction-bindings.json'
      - 'docs/agents/evidence/OTV2-20260920-content-world-cw2-b6-interaction-bindings/**'
      - '.github/workflows/content-world-b6-interaction-bindings.yml'

permissions:
  contents: read

concurrency:
  group: content-world-b6-interaction-bindings-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  self-tests:
    name: Content World B6 / offline self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact Game PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Verify exact Game head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - name: Compile B6 generator and focused self-test
        shell: bash
        run: |
          set -euo pipefail
          python -B -m py_compile \
            tools/reference-world-corridor-census/interaction_binding_catalog.py \
            tools/reference-world-corridor-census/interaction_binding_catalog_self_test.py

      - name: Run focused and existing regression self-tests
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/reference-world-corridor-census/interaction_binding_catalog_self_test.py
          python -B tools/reference-world-corridor-census/self_test.py
          python -B tools/reference-world-corridor-census/content_source_batch_self_test.py
          python -B tools/game-atlas-fullworld-source/self_test.py

      - name: Verify tracked B6 evidence closure offline
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib
          import importlib.util
          import json
          import stat
          import subprocess
          import sys
          from pathlib import Path

          sys.dont_write_bytecode = True

          # Expected values come from the checked-out generator, never from a second hand-kept copy.
          generator_path = Path('tools/reference-world-corridor-census/interaction_binding_catalog.py')
          spec = importlib.util.spec_from_file_location('b6_interaction_binding_catalog', generator_path)
          gen = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = gen
          spec.loader.exec_module(gen)

          # Pinned logical product of the tracked evidence; a regeneration updates it here in the same PR.
          expected_product = '793ea8072e56a1070f29cab071e5d9b2c1e029522984a268f18c76d038c0616e'


          def git(*args):
              return subprocess.run(('git', *args), check=True, stdout=subprocess.PIPE, text=True).stdout


          def regular_file(relative):
              current = Path('.')
              for part in Path(relative).parts:
                  current = current / part
                  assert not stat.S_ISLNK(current.lstat().st_mode), f'symlink in path: {relative}'
              assert stat.S_ISREG(current.lstat().st_mode), f'not a regular file: {relative}'
              return current


          def worktree_blob(path):
              payload = path.read_bytes()
              return hashlib.sha1(b'blob %d\0' % len(payload) + payload, usedforsecurity=False).hexdigest()


          evidence_root = 'docs/agents/evidence'
          family_prefix = gen.FINAL_FAMILY_PREFIX
          assert gen.FINAL_INDEX_PATH == f'{evidence_root}/{gen.INDEX_NAME}'
          assert family_prefix == f'{evidence_root}/{gen.FAMILY_DIR_NAME}'
          index = json.loads(regular_file(gen.FINAL_INDEX_PATH).read_bytes().decode('utf-8'))
          assert index['storage']['index_tracked_path'] == gen.FINAL_INDEX_PATH

          # 1. Recorded Game inputs must be the checked-out files (committed blob and worktree bytes).
          assert set(index['game_inputs']) == set(gen.GAME_INPUT_BLOBS), 'game_inputs path set differs from generator'
          for relative, recorded_blob in sorted(index['game_inputs'].items()):
              committed_blob = git('rev-parse', f'HEAD:{relative}').strip()
              assert committed_blob == recorded_blob, f'game input {relative}: checked-out blob {committed_blob} != recorded {recorded_blob}'
              assert worktree_blob(regular_file(relative)) == recorded_blob, f'game input {relative}: worktree bytes differ from recorded blob'
              assert gen.GAME_INPUT_BLOBS[relative] == recorded_blob, f'game input {relative}: generator pin differs from evidence'

          # 2. Every recorded tracked_path must be the full path the generator writes.
          family_entries = index['storage']['family_files']
          assert [entry['family'] for entry in family_entries] == list(gen.FAMILIES)
          referenced = {gen.FINAL_INDEX_PATH}
          records_by_family = {}
          for entry in family_entries:
              family = entry['family']
              expected_path = f'{family_prefix}/{gen.FAMILY_FILENAMES[family]}'
              assert entry['tracked_path'] == expected_path, f'{family}: tracked_path {entry["tracked_path"]!r} != {expected_path!r}'
              referenced.add(expected_path)
              document = json.loads(regular_file(expected_path).read_bytes().decode('utf-8'))
              if entry['storage_mode'] == 'SHARDED':
                  records = []
                  shards = document['storage']['shards']
                  assert [shard['ordinal'] for shard in shards] == list(range(1, len(shards) + 1))
                  for shard_meta in shards:
                      shard_path = f'{family_prefix}/{gen._shard_filename(family, shard_meta["ordinal"])}'
                      assert shard_meta['tracked_path'] == shard_path, f'{family}: shard tracked_path {shard_meta["tracked_path"]!r} != {shard_path!r}'
                      referenced.add(shard_path)
                      records.extend(json.loads(regular_file(shard_path).read_bytes().decode('utf-8'))['records'])
              else:
                  assert entry['storage_mode'] == 'INLINE'
                  records = document['records']
              records_by_family[family] = records

          # 3. The tracked file set is exactly the referenced set, in git and on disk.
          tracked = set(git('ls-files', '-z', '--', gen.FINAL_INDEX_PATH, f'{family_prefix}/').split('\0')) - {''}
          on_disk = {f'{family_prefix}/{child.name}' for child in Path(family_prefix).iterdir()} | {gen.FINAL_INDEX_PATH}
          assert tracked == referenced, f'tracked vs referenced: {sorted(tracked ^ referenced)}'
          assert on_disk == referenced, f'on disk vs referenced: {sorted(on_disk ^ referenced)}'

          # 4. Rebuild every payload offline with the checked-out mapper and storage code; bytes must match.
          observations = []
          for family in gen.FAMILIES:
              for record in records_by_family[family]:
                  assert record['family'] == family
                  observation = {
                      'structural_kind': record['family'],
                      'position': record['position'],
                      'item_order': record['item_order'],
                      'source_item_id': record['source_item_id'],
                      'source_value': record['source_value'],
                  }
                  assert gen.normalize_observation(observation) == record, f'record {record.get("record_id")} differs from the checked-out mapper'
                  observations.append(observation)
          gen.validate_real_source_counts(index['source_stream_counts'])
          rebuilt_index, family_docs = gen.build_catalog(observations, index['source_stream_counts'])
          gen.validate_real_family_counts(family_docs)
          payloads = gen.storage_payloads(rebuilt_index, family_docs)
          rebuilt = {f'{evidence_root}/{name}': payload for name, payload in payloads.items()}
          assert set(rebuilt) == referenced, f'rebuilt vs referenced: {sorted(set(rebuilt) ^ referenced)}'
          for relative, payload in sorted(rebuilt.items()):
              assert Path(relative).read_bytes() == payload, f'{relative}: tracked bytes differ from offline rebuild'

          # 5. Pinned outcome.
          assert rebuilt_index['logical_product_digest_sha256'] == expected_product
          assert rebuilt_index['total_occurrences'] == rebuilt_index['dispositions']['UNKNOWN'] == 6_932
          for name in ('UNSUPPORTED', 'AMBIGUOUS', 'CONFLICT', 'LOSS'):
              assert rebuilt_index['dispositions'][name] == 0
          print(f'B6 evidence closure ok: {len(referenced)} files, {rebuilt_index["total_occurrences"]} occurrences, game inputs bound to checkout')
          PY
