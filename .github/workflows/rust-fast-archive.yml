name: Rust fast archive

# Each caller matrix instance releases its own test workers as soon as its
# archive is built. No worker waits for another archive's compilation.
on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      rust_selection:
        required: true
        type: string
      test_shards:
        required: true
        type: string
      plan_image:
        required: true
        type: string
      plan_platform:
        required: true
        type: string
      archive:
        required: true
        type: string
      native_entry_required:
        default: false
        type: boolean
    outputs:
      artifact_id:
        value: ${{ jobs.build.outputs.artifact_id }}
      runner_image:
        value: ${{ jobs.build.outputs.runner_image }}
      runner_platform:
        value: ${{ jobs.build.outputs.runner_platform }}

permissions: {}

jobs:
  build:
    name: Build unit-test archive (${{ inputs.archive }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      runner_image: ${{ steps.identity.outputs.image }}
      runner_platform: ${{ steps.identity.outputs.platform }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Report archive runner identity
        id: identity
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          printf 'image=%s\nplatform=%s\nrun_attempt=%s\n' "${ImageVersion:-unknown}" "$RUNNER_OS-$RUNNER_ARCH" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ inputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Free hosted runner disk before the Cargo cache restore
        run: &cleanup_cargo_disk |
          # Allow for the extracted Cargo cache (~26 GiB), 16 GiB swap and new artifacts.
          available_kib=$(df -Pk / | awk 'END {print $4}')
          if [[ "$available_kib" =~ ^[0-9]+$ ]] && (( available_kib >= 80 * 1024 * 1024 )); then
            echo "Skipping SDK cleanup with $(( available_kib / 1024 / 1024 )) GiB free on /"
            exit 0
          fi
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Restore trimmed Cargo cache from protected main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.100.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-linux-v2-1.100.0-${{ hashFiles('Cargo.lock') }}-
            rust-linux-v2-1.100.0-

      - name: Normalize source mtimes for the restored Cargo cache
        run: python tools/repository/normalize_cargo_mtimes.py

      - name: Install pinned cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.146
          NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          if curl --proto '=https' --tlsv1.2 -fsSL --retry 8 --retry-delay 15 --retry-all-errors --retry-max-time 150 --connect-timeout 30 -o "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"; then
            echo "${NEXTEST_SHA256}  ${archive}" | sha256sum -c -
            tar -xzf "$archive" -C "$RUNNER_TEMP/nextest-bin"
          else
            # Hosted runners can lose GitHub release downloads for an hour at a time. Build the
            # same pinned version from crates.io with its locked dependency set instead.
            echo "::warning::cargo-nextest ${NEXTEST_VERSION} release download failed; building it from crates.io"
            rustup toolchain install 1.100.0 --profile minimal --no-self-update
            cargo +1.100.0 install --locked --quiet cargo-nextest --version "=${NEXTEST_VERSION}" --root "$RUNNER_TEMP/nextest-root"
            cp "$RUNNER_TEMP/nextest-root/bin/cargo-nextest" "$RUNNER_TEMP/nextest-bin/"
          fi
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: Add swap for the library test build
        run: |
          set -euo pipefail
          sudo fallocate -l 16G /mnt/oteryn-extra.swap
          sudo chmod 600 /mnt/oteryn-extra.swap
          sudo mkswap /mnt/oteryn-extra.swap
          sudo swapon /mnt/oteryn-extra.swap
          swapon --show
          free -h

      - name: Install pinned mold linker
        env:
          MOLD_VERSION: 2.42.1
          MOLD_SHA256: 6ff270c9bf07d2bec5c98aa324eb7c4daf6a1a4d815c05ff1708049616047855
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/mold.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 40 --retry-delay 15 --retry-all-errors --retry-max-time 600 --connect-timeout 30 -o "$archive" \
            "https://github.com/rui314/mold/releases/download/v${MOLD_VERSION}/mold-${MOLD_VERSION}-x86_64-linux.tar.gz"
          echo "${MOLD_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mold_dir="$RUNNER_TEMP/mold-${MOLD_VERSION}-x86_64-linux"
          "$mold_dir/bin/mold" --version
          echo "MOLD_PATH=$mold_dir/bin/mold" >> "$GITHUB_ENV"
          echo "MOLD_PRELOAD=$mold_dir/lib/mold/mold-wrapper.so" >> "$GITHUB_ENV"

      # Every build keeps the full Cargo package selection for feature unification.
      # The named Dispatch harness avoids compiling other library test targets.
      # Older heads split the Dispatch library harness and filter at archive time.
      - name: Archive changed-crate unit tests
        env:
          RUST_SELECTION: ${{ inputs.rust_selection }}
          ARCHIVE: ${{ inputs.archive }}
          EXPECTED_SHA: ${{ inputs.target_sha }}
          CARGO_BUILD_JOBS: "2"
          LD_PRELOAD: ${{ env.MOLD_PRELOAD }}
        run: |
          set -euo pipefail
          package_args_file="$RUNNER_TEMP/rust-fast-archive-args.txt"
          python - <<'PY' > "$package_args_file"
          import json
          import os

          selection = json.loads(os.environ['RUST_SELECTION'])
          if selection['mode'] == 'workspace':
              print('--workspace')
          elif selection['mode'] == 'packages' and selection['packages']:
              for package in selection['packages']:
                  print('-p')
                  print(package)
          else:
              raise SystemExit('unit-test archive requires a nonempty package selection')
          PY
          mapfile -t package_args < "$package_args_file"
          artifact="$RUNNER_TEMP/rust-fast-archive/$ARCHIVE"
          mkdir -p "$artifact"
          unset OTERYN_DISPATCH_PG_SHARD OTERYN_DISPATCH_TEST_ARCHIVE
          case "$ARCHIVE" in
            all) target_args=(--lib --bins) ;;
            bins) target_args=(--bins) ;;
            lib)
              export OTERYN_DISPATCH_TEST_ARCHIVE=common
              target_args=(--lib -E 'not package(=oteryn-gameplay-dispatch)')
              ;;
            dispatch-1|dispatch-2|dispatch-3)
              # One canonical feature/profile build is shared with the real PG lane.
              # This helper owns all manifest-bound files in the role directory.
              if [[ -f tools/ci/shared_dispatch_archive.py ]]; then
                python3 tools/ci/shared_dispatch_archive.py build "$artifact" "$ARCHIVE"
                exit 0
              fi
              # Exact older PR heads still have the original dedicated target.
              export OTERYN_DISPATCH_TEST_ARCHIVE=dedicated OTERYN_DISPATCH_PG_SHARD="${ARCHIVE#dispatch-}/3"
              target_args=(--test oteryn-gameplay-dispatch)
              ;;
            lib-1|lib-2|lib-3)
              export OTERYN_DISPATCH_PG_SHARD="${ARCHIVE#lib-}/3"
              target_args=(--lib)
              if [[ "$ARCHIVE" != lib-1 ]]; then
                target_args+=(-E 'package(=oteryn-gameplay-dispatch)')
              fi
              ;;
            *) exit 1 ;;
          esac
          cargo +1.100.0 nextest archive --locked "${package_args[@]}" "${target_args[@]}" \
            --archive-file "$artifact/unit-tests.tar.zst" --zstd-level 1 < /dev/null
          if [[ "$ARCHIVE" == dispatch-* ]]; then
            cargo +1.100.0 nextest list --archive-file "$artifact/unit-tests.tar.zst" \
              --workspace-remap . --message-format json < /dev/null |
              jq -e '.["test-count"] > 0 and (.["rust-suites"] | length == 1)' > /dev/null
          fi
          cp "$RUNNER_TEMP/nextest-bin/cargo-nextest" "$artifact/"
          printf '%s\n' "${ImageVersion:-unknown}" > "$artifact/runner-image"
          printf '%s\n' "$RUNNER_OS-$RUNNER_ARCH" > "$artifact/runner-platform"

      - name: Upload unit-test archive
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-fast-unit-tests-${{ github.run_attempt }}-${{ inputs.archive }}
          path: ${{ runner.temp }}/rust-fast-archive/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record uploaded archive ID
        id: artifact
        env:
          ARCHIVE: ${{ inputs.archive }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Build native entry room on the common library graph
        if: >-
          inputs.native_entry_required
          && contains(fromJSON('["lib","all","lib-1"]'), inputs.archive)
          && (fromJSON(inputs.rust_selection).mode == 'workspace'
              || contains(fromJSON(inputs.rust_selection).packages, 'oteryn-game-server'))
          && hashFiles('tools/qualification/native_entry_room/prebuilt.py') != ''
        env:
          RUST_SELECTION: ${{ inputs.rust_selection }}
          ARCHIVE: ${{ inputs.archive }}
          LD_PRELOAD: ${{ env.MOLD_PRELOAD }}
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          unset OTERYN_DISPATCH_PG_SHARD OTERYN_DISPATCH_TEST_ARCHIVE
          case "$ARCHIVE" in
            lib) export OTERYN_DISPATCH_TEST_ARCHIVE=common ;;
            lib-1) export OTERYN_DISPATCH_PG_SHARD=1/3 ;;
          esac
          started=$SECONDS
          code=0
          python3 tools/qualification/native_entry_room/prebuilt.py build "$RUNNER_TEMP/native-entry-build" \
            --rust-selection "$RUST_SELECTION" || code=$?
          elapsed=$((SECONDS - started))
          echo "NATIVE_ENTRY_BUILD_SECONDS=$elapsed exit_code=$code"
          printf 'Native entry side build: %s seconds (exit %s).\n' "$elapsed" "$code" >> "$GITHUB_STEP_SUMMARY"
          # This side build is measured: needs:build still waits for the whole job.
          [[ "$code" == 0 ]] || exit "$code"
          mkdir -p "$RUNNER_TEMP/native-entry-room"
          tar -I 'gzip -1' -cf "$RUNNER_TEMP/native-entry-room/bundle.tar.gz" \
            -C "$RUNNER_TEMP/native-entry-build" manifest.json content_native_entry_room

      - name: Upload native entry room binary
        if: >-
          inputs.native_entry_required
          && contains(fromJSON('["lib","all","lib-1"]'), inputs.archive)
          && (fromJSON(inputs.rust_selection).mode == 'workspace'
              || contains(fromJSON(inputs.rust_selection).packages, 'oteryn-game-server'))
          && hashFiles('tools/qualification/native_entry_room/prebuilt.py') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-entry-room-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-entry-room/bundle.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  tests:
    name: Unit-test archive (${{ inputs.archive }}, ${{ matrix.shard }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: tests-1-5
            shard: '1/5'
          - slug: tests-2-5
            shard: '2/5'
          - slug: tests-3-5
            shard: '3/5'
          - slug: tests-4-5
            shard: '4/5'
          - slug: tests-5-5
            shard: '5/5'
    env:
      EXPECTED_SHA: ${{ inputs.target_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
      RUST_SELECTION: ${{ inputs.rust_selection }}
      TEST_SHARDS: ${{ inputs.test_shards }}
      PLAN_IMAGE: ${{ inputs.plan_image }}
      PLAN_PLATFORM: ${{ inputs.plan_platform }}
      ARCHIVE: ${{ inputs.archive }}
      SHARD: ${{ matrix.shard }}
      SLUG: ${{ matrix.slug }}
      BUILD_IMAGE: ${{ needs.build.outputs.runner_image }}
      BUILD_PLATFORM: ${{ needs.build.outputs.runner_platform }}
      BUILD_ATTEMPT: ${{ needs.build.outputs.run_attempt }}
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Load worker helper for an older candidate
        if: hashFiles('tools/repository/run_rust_fast_archive.py') == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: _ci-control
          sparse-checkout: tools/repository/run_rust_fast_archive.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Select the exact-source worker helper
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          helper="$GITHUB_WORKSPACE/tools/repository/run_rust_fast_archive.py"
          if [[ ! -f "$helper" ]]; then
            test "$(git -C _ci-control rev-parse HEAD)" = "$EXPECTED_WORKFLOW_SHA"
            helper="$GITHUB_WORKSPACE/_ci-control/tools/repository/run_rust_fast_archive.py"
          fi
          [[ -f "$helper" && ! -L "$helper" ]]
          echo "FAST_ARCHIVE_HELPER=$helper" >> "$GITHUB_ENV"

      - name: Select crates without a passed result
        id: selection
        run: |
          python3 -I "$FAST_ARCHIVE_HELPER" plan \
            --out "$RUNNER_TEMP/rust-fast-results/$ARCHIVE/$SLUG"

      - name: Install Rust toolchain
        if: steps.selection.outputs.hit != 'true'
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Free hosted runner disk for archived artifacts
        if: steps.selection.outputs.hit != 'true'
        run: *cleanup_cargo_disk

      - name: Download this unit-test archive by immutable ID
        if: steps.selection.outputs.hit != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/rust-fast-archive

      - name: Verify canonical Dispatch archive
        if: >-
          steps.selection.outputs.hit != 'true' && startsWith(inputs.archive, 'dispatch-')
          && hashFiles('tools/ci/shared_dispatch_archive.py') != ''
        run: |
          python3 tools/ci/shared_dispatch_archive.py verify \
            "$RUNNER_TEMP/rust-fast-archive/$ARCHIVE" "$ARCHIVE" \
            --producer-image "$BUILD_IMAGE" --producer-attempt "$BUILD_ATTEMPT"

      # Hash partition and package filters are identical to the former combined
      # worker. Only the completion boundary changes from all archives to one.
      - name: Run this archive and record its current result
        if: steps.selection.outputs.hit != 'true'
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/rust-fast-archive/$ARCHIVE:$PATH"
          unset OTERYN_TEST_POSTGRES_ADMIN_URL
          python3 -I "$FAST_ARCHIVE_HELPER" run \
            --artifact "$RUNNER_TEMP/rust-fast-archive/$ARCHIVE" \
            --extract "$RUNNER_TEMP/rust-fast-extract/$ARCHIVE" \
            --out "$RUNNER_TEMP/rust-fast-results/$ARCHIVE/$SLUG"

      # Exit 100 is a completed test run with failing tests. Other failures leave
      # completed=false; cancellation never produces a successful result bundle.
      # The parent alone joins every archive before updating a package ledger.
      - name: Upload current archive-shard result
        if: always() && !cancelled() && steps.selection.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-fast-results-${{ github.run_attempt }}-${{ inputs.archive }}-${{ matrix.slug }}
          path: ${{ runner.temp }}/rust-fast-results/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
