name: Node boot build artifacts

on:
  workflow_call:
    inputs:
      revision:
        required: true
        type: string
      variants:
        required: true
        type: string
      server_seam_sha256:
        required: false
        type: string
        default: ''
    outputs:
      default:
        value: ${{ jobs.build.outputs.default }}
      qualification-spawn:
        value: ${{ jobs.build.outputs.qualification-spawn }}
      qualification-clock:
        value: ${{ jobs.build.outputs.qualification-clock }}
      world-compiler:
        value: ${{ jobs.build.outputs.world-compiler }}
      platform:
        value: ${{ jobs.build.outputs.platform }}
      server-seam:
        value: ${{ jobs.build.outputs.server-seam }}

permissions:
  contents: read

jobs:
  build:
    name: Compile ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.variants) }}
    env:
      CARGO_BUILD_JOBS: '2'
    outputs:
      default: ${{ steps.digest.outputs.default }}
      qualification-spawn: ${{ steps.digest.outputs.qualification-spawn }}
      qualification-clock: ${{ steps.digest.outputs.qualification-clock }}
      world-compiler: ${{ steps.digest.outputs.world-compiler }}
      platform: ${{ steps.digest.outputs.platform }}
      server-seam: ${{ steps.digest.outputs.server-seam }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ inputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Read exact Platform producer pin
        if: matrix.variant == 'platform'
        id: platform_ref
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import sys
          sys.path.insert(0, 'tools/qualification/node_boot')
          from matrix import ROOT, pinned_sha
          print('sha=' + pinned_sha(ROOT, Path('tools/qualification/game_platform/lifecycle.sh'), 'GAME_PLATFORM_SHA'))
          PY

      - name: Check out exact public Platform producer
        if: matrix.variant == 'platform'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Oteryn/Oteryn-Platform
          ref: ${{ steps.platform_ref.outputs.sha }}
          path: _platform
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Free runner disk for cached and new build artifacts
        if: matrix.variant != 'platform'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Restore trimmed Cargo cache from protected main
        if: matrix.variant != 'platform'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.100.0-${{ hashFiles('Cargo.lock') }}-${{ inputs.revision }}
          restore-keys: |
            rust-linux-v2-1.100.0-${{ hashFiles('Cargo.lock') }}-
            rust-linux-v2-1.100.0-

      # The protected pg-cargo-dependency-cache producer publishes these paths.
      # Restoring the much larger Game target tree costs more than building Portal.
      - name: Restore Cargo dependencies for Platform only
        if: matrix.variant == 'platform'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: pg-cargo-deps-linux-v1-${{ hashFiles('Cargo.lock') }}

      - name: Normalize source mtimes for the restored Cargo cache
        if: matrix.variant != 'platform'
        run: python3 tools/repository/normalize_cargo_mtimes.py

      - name: Download the earlier shipping-default library
        if: matrix.variant == 'default' && inputs.server_seam_sha256 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: node-boot-build-server-seam
          path: ${{ runner.temp }}/server-seam-download

      - name: Verify and unpack the earlier shipping-default library
        if: matrix.variant == 'default' && inputs.server_seam_sha256 != ''
        env:
          SEAM_SHA256: ${{ inputs.server_seam_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SEAM_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/server-seam-download/bundle.tar.gz"
          printf '%s  %s\n' "$SEAM_SHA256" "$archive" | sha256sum -c -
          python3 tools/qualification/node_boot/prebuilt.py unpack server-seam "$archive" "$RUNNER_TEMP/server-seam-prebuilt"

      - name: Compile and package exact-candidate binaries
        env:
          VARIANT: ${{ matrix.variant }}
          SEAM_SHA256: ${{ inputs.server_seam_sha256 }}
        run: |
          set -euo pipefail
          reuse=()
          if [[ "$VARIANT" == default && -n "$SEAM_SHA256" ]]; then
            reuse=(--server-seam-source "$RUNNER_TEMP/server-seam-prebuilt")
          fi
          started=$SECONDS
          code=0
          python3 tools/qualification/node_boot/prebuilt.py build "$VARIANT" "$RUNNER_TEMP/node-boot-build" "${reuse[@]}" || code=$?
          elapsed=$((SECONDS - started))
          echo "NODE_BOOT_BUILD_SECONDS variant=$VARIANT seconds=$elapsed exit_code=$code"
          printf 'Qualification build %s: %s seconds (exit %s).\n' "$VARIANT" "$elapsed" "$code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Bind digest to the build variant
        id: digest
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "$RUNNER_TEMP/node-boot-build/bundle.tar.gz" | cut -d' ' -f1)"
          printf '%s=%s\n' "$VARIANT" "$digest" >> "$GITHUB_OUTPUT"

      - name: Upload qualification build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-boot-build-${{ matrix.variant }}
          path: ${{ runner.temp }}/node-boot-build/bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 3
