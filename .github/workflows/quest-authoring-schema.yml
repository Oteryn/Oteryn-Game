name: Quest Authoring Schema

on:
  pull_request:
    paths:
      - tools/content-schema/quest-authoring/**
      - tools/content-schema/monster-authoring/requirements.txt
      - content/quests/**
      - content/interactions/**
      - content/items/**
      - content/project.json
      - content/manifest.json
      - content/content.lock.json
      - .github/workflows/quest-authoring-schema.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quest-authoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Three parts on separate runners, so the wall time is the slowest part (the donor source,
  # about 7 minutes) instead of their sum. run_checks.py --part defines what each one runs.
  quest-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [checks, donor, unit-tests]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # A pull request that changes only unreferenced Quest tool docs skips the multi-minute
      # checks below; every other change, and any doubt, takes the full path. The classifier is
      # read from the protected base so a pull request cannot widen its own skip. The job still
      # runs and reports, so the check name and its result never go missing.
      - name: Classify Quest scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          full() { printf 'full=true\nreason=%s\n' "$1" >> "$GITHUB_OUTPUT"; echo "Quest scope: full ($1)"; }
          if [ -z "$PULL_NUMBER" ]; then
            full "not a pull request"
          elif curl -fsSL --retry 2 -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              -o "$RUNNER_TEMP/classify_quest_scope.py" \
              "https://api.github.com/repos/$REPOSITORY/contents/tools/repository/classify_quest_authoring_scope.py?ref=$BASE_SHA"; then
            python -I "$RUNNER_TEMP/classify_quest_scope.py" --root . --repository "$REPOSITORY" --pull-request "$PULL_NUMBER" --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
              || full "classifier failed"
          else
            full "protected-base classifier unavailable"
          fi

      - name: Set up Python
        if: ${{ steps.scope.outputs.full == 'true' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install pinned schema requirements
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: python -m pip install -r tools/content-schema/monster-authoring/requirements.txt

      # The donor-source regeneration is left out only on an explicit `donor=false`; a missing
      # output (older base classifier, any fail-closed path above) runs it.
      - name: Validate all offline Quest data
        if: ${{ steps.scope.outputs.full == 'true' }}
        env:
          QUEST_DONOR: ${{ steps.scope.outputs.donor }}
          QUEST_PART: ${{ matrix.part }}
        run: |
          if [ "$QUEST_DONOR" = "false" ]; then
            python tools/content-schema/quest-authoring/run_checks.py --part "$QUEST_PART" --skip-donor-source
          else
            python tools/content-schema/quest-authoring/run_checks.py --part "$QUEST_PART"
          fi

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        run: test -z "$(git status --short --untracked-files=all)"
