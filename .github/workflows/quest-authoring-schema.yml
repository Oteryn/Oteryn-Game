name: Quest Authoring Schema

on:
  pull_request:
    paths:
      - tools/content-schema/quest-authoring/**
      - tools/content-schema/monster-authoring/requirements.txt
      - content/quests/**
      - content/interactions/**
      - content/items/**
      - content/project.json
      - content/manifest.json
      - content/content.lock.json
      - .github/workflows/quest-authoring-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quest-authoring-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quest-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install pinned schema requirements
        run: python -m pip install -r tools/content-schema/monster-authoring/requirements.txt

      - name: Validate all offline Quest data
        run: python tools/content-schema/quest-authoring/run_checks.py

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        run: test -z "$(git status --short --untracked-files=all)"
