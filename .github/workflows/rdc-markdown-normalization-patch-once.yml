name: RDC Markdown normalization patch once

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-markdown-normalization-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact rendered-Markdown normalization patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/agents/validate_remote_desktop_prompt_routing.py')
          text = path.read_text(encoding='utf-8')

          old_import = 'import json\nfrom pathlib import Path\nimport re\nimport sys\n'
          new_import = 'import html\nimport json\nfrom pathlib import Path\nimport re\nimport sys\nimport unicodedata\n'
          if text.count(old_import) != 1:
              raise SystemExit('unexpected import anchor count')
          text = text.replace(old_import, new_import, 1)

          anchor = '''def _outside_routing_paragraphs(text: str) -> list[str]:\n    operative = _operative_text(text)\n'''
          replacement = '''MARKDOWN_LINK_RE = re.compile(r"!?\\[([^]\\n]*)\\]\\([^\\n)]*\\)")\nHTML_TAG_RE = re.compile(r"</?[A-Za-z][^>]*>")\nMARKDOWN_ESCAPE_RE = re.compile(r"\\\\([\\\\`*_{}\\[\\]()#+.!~>-])")\nZERO_WIDTH_RE = re.compile("[\\u200b\\u200c\\u200d\\u2060\\ufeff]")\n\n\ndef _normalize_policy_text(text: str) -> str:\n    \"\"\"Approximate rendered Markdown text for fail-closed policy detection.\"\"\"\n    value = text\n    for _ in range(4):\n        decoded = html.unescape(value)\n        if decoded == value:\n            break\n        value = decoded\n    value = unicodedata.normalize("NFKC", value)\n    value = MARKDOWN_LINK_RE.sub(lambda match: match.group(1), value)\n    value = HTML_TAG_RE.sub(" ", value)\n    value = MARKDOWN_ESCAPE_RE.sub(r"\\1", value)\n    value = ZERO_WIDTH_RE.sub(" ", value)\n    value = re.sub(r"[*_~`]+", "", value)\n    value = re.sub(r"[ \\t\\f\\v]+", " ", value)\n    return value\n\n\ndef _outside_routing_paragraphs(text: str) -> list[str]:\n    operative = _operative_text(text)\n'''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected outside-routing anchor count')
          text = text.replace(anchor, replacement, 1)

          old_line = 'if any(pattern.search(line) is not None for pattern in OUTSIDE_ROUTING_PATTERNS)'
          new_line = 'if any(pattern.search(_normalize_policy_text(line)) is not None for pattern in OUTSIDE_ROUTING_PATTERNS)'
          if text.count(old_line) != 1:
              raise SystemExit('unexpected list detection anchor count')
          text = text.replace(old_line, new_line, 1)

          old_para = 'if any(pattern.search(paragraph) is not None for pattern in OUTSIDE_ROUTING_PATTERNS):'
          new_para = 'if any(pattern.search(_normalize_policy_text(paragraph)) is not None for pattern in OUTSIDE_ROUTING_PATTERNS):'
          if text.count(old_para) != 1:
              raise SystemExit('unexpected paragraph detection anchor count')
          text = text.replace(old_para, new_para, 1)

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/rdc-markdown-normalization-patch-once.yml').unlink()
          PY
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/agents/validate_remote_desktop_prompt_routing.py .github/workflows/rdc-markdown-normalization-patch-once.yml
          git commit -m 'fix(agents): normalize rendered Markdown RDC policy text'
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
