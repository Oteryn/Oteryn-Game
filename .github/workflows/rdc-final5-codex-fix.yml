name: RDC final5 Codex fix

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final5-codex-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact helper trigger
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply bounded validator repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          import_old = "import unicodedata\n"
          import_new = "import unicodedata\nfrom urllib.parse import unquote\n"
          if text.count(import_old) != 1:
              raise SystemExit(f"unexpected import anchor count: {text.count(import_old)}")
          text = text.replace(import_old, import_new)

          passive_old = '''    re.compile(
                  r"(?=.*\\b(?:(?:connectors?|tools?)\\s+(?:calls?|operations?|requests?|invocations?|actions?)|"
                  r"(?:filesystem|search|process|session|terminal|history|ping)\\s+(?:calls?|operations?|requests?|invocations?|actions?))\\b)"
                  r"(?=.*\\b(?:approval|permission)\\s+(?:is\\s+)?(?:granted|given)\\s+by\\s+default\\b)",
                  re.IGNORECASE,
              ),'''
          passive_new = '''    re.compile(
                  r"(?=.*\\b(?:(?:connectors?|tools?)\\s+(?:calls?|operations?|requests?|invocations?|actions?)|"
                  r"(?:filesystem|search|process|session|terminal|history|ping)\\s+(?:calls?|operations?|requests?|invocations?|actions?))\\b)"
                  r"(?=.*\\b(?:approval|permission)\\b)"
                  r"(?=.*(?:\\b(?:granted|given)\\b.{0,80}\\bby\\s+default\\b|"
                  r"\\bautomatically\\b.{0,80}\\b(?:granted|given)\\b|"
                  r"\\b(?:granted|given)\\b.{0,80}\\bautomatically\\b))",
                  re.IGNORECASE,
              ),'''
          if text.count(passive_old) != 1:
              raise SystemExit(f"unexpected passive authority matcher count: {text.count(passive_old)}")
          text = text.replace(passive_old, passive_new)

          ping_anchor = '''    re.compile(
                  r"(?=.*\\bping\\b)"
                  r"(?=.*\\b(?:automatically\\s+(?:authori[sz]ed|approved)|preauthori[sz]ed|preapproved|"
                  r"(?:blanket|standing|automatic|default)\\s+(?:approval|permission)|"
                  r"(?:approval|permission)\\s+(?:is\\s+)?(?:granted|given)\\s+by\\s+default|"
                  r"(?:approval|permission)\\s+by\\s+default)\\b)",
                  re.IGNORECASE,
              ),'''
          ping_new = ping_anchor + '''
              re.compile(
                  r"(?=.*\\bping\\b)"
                  r"(?=.*(?:\\b(?:requires?|needs?)\\s+no\\s+(?:per[- ]action\\s+)?(?:authori[sz]ation|host[- ]exception|exception)\\b|"
                  r"\\b(?:does\\s+not\\s+require|without|exempt(?:ed)?\\s+from)\\b.{0,80}"
                  r"\\b(?:per[- ]action|authori[sz]ation|host[- ]exception|exception)\\b))",
                  re.IGNORECASE,
              ),'''
          if text.count(ping_anchor) != 1:
              raise SystemExit(f"unexpected direct ping matcher count: {text.count(ping_anchor)}")
          text = text.replace(ping_anchor, ping_new)

          stop_anchor = '''    re.compile(
                  r"(?=.*\\b(?:connectors?|routers?|transports?|providers?)\\b.{0,80}"
                  r"\\b(?:stop|stops|stopped|stopping|refuse|refuses|refused|refusing)\\b.{0,80}"
                  r"\\b(?:calls?|requests?|invocations?|actions?)\\b)"
                  r"(?=.*\\b(?:per[- ]action|decision|gate|routing|authori[sz]\\w*)\\b)",
                  re.IGNORECASE,
              ),'''
          stop_new = stop_anchor + '''
              re.compile(
                  r"(?=.*\\b(?:calls?|requests?|invocations?|actions?)\\b.{0,120}"
                  r"\\b(?:is|are|be|being|been)\\b.{0,30}\\b(?:stopped|refused)\\s+by\\s+(?:the\\s+)?"
                  r"(?:connectors?|routers?|transports?|providers?)\\b)"
                  r"(?=.*\\b(?:per[- ]action|decision|gate|routing|authori[sz]\\w*)\\b)",
                  re.IGNORECASE,
              ),'''
          if text.count(stop_anchor) != 1:
              raise SystemExit(f"unexpected active stop/refuse matcher count: {text.count(stop_anchor)}")
          text = text.replace(stop_anchor, stop_new)

          url_old = '''    value = unicodedata.normalize("NFKC", value)
              return _remove_default_ignorables(value)
          '''
          url_new = '''    value = unicodedata.normalize("NFKC", value)
              for _ in range(4):
                  decoded = unquote(value)
                  if decoded == value:
                      break
                  value = decoded
              return _remove_default_ignorables(value)
          '''
          if text.count(url_old) != 1:
              raise SystemExit(f"unexpected URL normalization anchor count: {text.count(url_old)}")
          text = text.replace(url_old, url_new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify repaired validator
        shell: bash
        run: |
          python tools/agents/validate_governance.py
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check
      - name: Remove one-shot helper and publish repair
        shell: bash
        run: |
          git rm .github/workflows/rdc-final5-codex-fix.yml
          git add tools/agents/validate_remote_desktop_prompt_routing.py
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/rdc-final5-codex-fix.yml",
              "tools/agents/validate_remote_desktop_prompt_routing.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"unexpected staged paths: {sorted(changed)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agents): close post-merge-up RDC bypasses"
          remote_head="$(git ls-remote origin refs/heads/governance/remote-desktop-per-action-gate-237 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
