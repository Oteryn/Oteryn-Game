name: PR239 round11 tests-only

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237

permissions:
  contents: write

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trigger commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Add durable regressions only
        run: python tools/agents/_pr239_round11_tests.py
      - name: Prove unchanged validator is RED
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          set +e
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py > /tmp/round11-red.log 2>&1
          rc=$?
          set -e
          cat /tmp/round11-red.log
          test "$rc" -ne 0
          grep -F "expected error containing" /tmp/round11-red.log
          git diff --check
      - name: Publish clean tests-only RED commit
        shell: bash
        run: |
          set -euo pipefail
          expected_parent="$(git rev-parse HEAD)"
          git rm .github/workflows/pr239-round11-tests.yml tools/agents/_pr239_round11_tests.py
          git add tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(agents): cover final Codex round 11 bypasses"
          remote_sha="$(git ls-remote origin refs/heads/governance/remote-desktop-per-action-gate-237 | cut -f1)"
          test "$remote_sha" = "$expected_parent"
          git push origin HEAD:refs/heads/governance/remote-desktop-per-action-gate-237
