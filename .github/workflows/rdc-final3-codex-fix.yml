name: RDC final3 Codex fix

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final3-codex-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0
      - name: Apply bounded validator repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'r"(?=.*\\b(?:(?:blanket|standing|automatic)\\s+(?:approval|permission)|preapproval|(?:approval|permission)\\s+by\\s+default)\\b)",',
                  'r"(?=.*(?:\\b(?:(?:blanket|standing|automatic|default)\\s+(?:approval|permission)|preapproval|(?:approval|permission)\\s+by\\s+default)\\b|\\bby\\s+default\\b.{0,80}\\b(?:approval|permission)\\b))",',
              ),
              (
                  '(?:filesystem|search|process|session|terminal|history)',
                  '(?:filesystem|search|process|session|terminal|history|ping)',
              ),
              (
                  'r"allow(?:ed|ance)?|permit(?:ted|s)?|require(?:d|s)?|need(?:s)?\\s+no|(?:blanket|standing|automatic)\\s+(?:approval|permission)|preapproval|(?:approval|permission)\\s+by\\s+default)\\b",',
                  'r"allow(?:ed|ance)?|permit(?:ted|s)?|require(?:d|s)?|need(?:s)?\\s+no|(?:blanket|standing|automatic|default)\\s+(?:approval|permission)|preapproval|(?:approval|permission)\\s+by\\s+default|by\\s+default.{0,80}(?:approval|permission))\\b",',
              ),
              (
                  'r"(?=.*\\b(?:enforce|enforces|enforced|enforcing|enforcement|block|blocks|blocked|blocking|reject|rejects|rejected|rejecting)\\b)"',
                  'r"(?=.*\\b(?:enforce|enforces|enforced|enforcing|enforcement|block|blocks|blocked|blocking|reject|rejects|rejected|rejecting|prevent|prevents|prevented|preventing)\\b)"',
              ),
              (
                  'r"(?:(?:https?:)?//)(?:www\\.)?github\\.com(?::[0-9]{1,5})?/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json",',
                  'r"(?:(?:https?:)?//)(?:(?:www\\.)?github\\.com(?::[0-9]{1,5})?/Oteryn/Oteryn/(?:blob|tree|raw)|raw\\.githubusercontent\\.com(?::[0-9]{1,5})?/Oteryn/Oteryn)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json",',
              ),
              (
                  'if opening is not None:\n                        inert = True\n                        fence = opening.group("fence")\n                        fence_char = fence[0]\n                        fence_len = len(fence)',
                  'if opening is not None and not (\n                        opening.group("fence").startswith("`") and "`" in opening.group("rest")\n                    ):\n                        inert = True\n                        fence = opening.group("fence")\n                        fence_char = fence[0]\n                        fence_len = len(fence)',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"expected validator fragment not found: {old[:100]!r}")
              text = text.replace(old, new)
              print(f"replaced {count}: {old[:70]}")

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify repaired validator
        shell: bash
        run: |
          python tools/agents/validate_governance.py
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check
      - name: Remove one-shot helper and publish repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/rdc-final3-codex-fix.yml
          git add tools/agents/validate_remote_desktop_prompt_routing.py
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/rdc-final3-codex-fix.yml",
              "tools/agents/validate_remote_desktop_prompt_routing.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"unexpected staged paths: {sorted(changed)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agents): close final raw RDC bypasses"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
