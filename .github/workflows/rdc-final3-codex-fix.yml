name: RDC final3 Codex fix
# retry after exact invalid-fence RED

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final3-codex-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0
      - name: Apply bounded validator repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          action_old = 'r"(?=.*\\b(?:(?:blanket|standing|automatic)\\s+(?:approval|permission)|preapproval|(?:approval|permission)\\s+by\\s+default)\\b)",'
          action_new = 'r"(?=.*(?:\\b(?:(?:blanket|standing|automatic|default)\\s+(?:approval|permission)|preapproval|(?:approval|permission)\\s+by\\s+default)\\b|\\bby\\s+default\\b.{0,80}\\b(?:approval|permission)\\b))",'
          if text.count(action_old) != 1:
              raise SystemExit(f"unexpected connector-action permission matcher count: {text.count(action_old)}")
          text = text.replace(action_old, action_new)

          host_old = '(?:filesystem|search|process|session|terminal|history)'
          if text.count(host_old) != 2:
              raise SystemExit(f"unexpected named-host matcher count: {text.count(host_old)}")
          text = text.replace(host_old, '(?:filesystem|search|process|session|terminal|history|ping)')

          approval_old = r'(?:blanket|standing|automatic)\s+(?:approval|permission)|preapproval|(?:approval|permission)\s+by\s+default'
          approval_new = r'(?:blanket|standing|automatic|default)\s+(?:approval|permission)|preapproval|(?:approval|permission)\s+by\s+default|by\s+default.{0,80}(?:approval|permission)'
          count = text.count(approval_old)
          if count < 2:
              raise SystemExit(f"expected multiple bounded approval matchers, got {count}")
          text = text.replace(approval_old, approval_new)
          print(f"extended {count} bounded approval matchers")

          enforce_old = 'r"(?=.*\\b(?:enforce|enforces|enforced|enforcing|enforcement|block|blocks|blocked|blocking|reject|rejects|rejected|rejecting)\\b)"'
          enforce_new = 'r"(?=.*\\b(?:enforce|enforces|enforced|enforcing|enforcement|block|blocks|blocked|blocking|reject|rejects|rejected|rejecting|prevent|prevents|prevented|preventing)\\b)"'
          if text.count(enforce_old) != 1:
              raise SystemExit(f"unexpected enforcement matcher count: {text.count(enforce_old)}")
          text = text.replace(enforce_old, enforce_new)

          url_old = 'r"(?:(?:https?:)?//)(?:www\\.)?github\\.com(?::[0-9]{1,5})?/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json",'
          url_new = 'r"(?:(?:https?:)?//)(?:(?:www\\.)?github\\.com(?::[0-9]{1,5})?/Oteryn/Oteryn/(?:blob|tree|raw)|raw\\.githubusercontent\\.com(?::[0-9]{1,5})?/Oteryn/Oteryn)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json",'
          if text.count(url_old) != 1:
              raise SystemExit(f"unexpected GitHub routing URL matcher count: {text.count(url_old)}")
          text = text.replace(url_old, url_new)

          fence_old = 'if opening is not None:\n                        inert = True\n                        fence = opening.group("fence")\n                        fence_char = fence[0]\n                        fence_len = len(fence)'
          fence_new = 'if opening is not None and not (\n                        opening.group("fence").startswith("`") and "`" in opening.group("rest")\n                    ):\n                        inert = True\n                        fence = opening.group("fence")\n                        fence_char = fence[0]\n                        fence_len = len(fence)'
          if text.count(fence_old) != 1:
              raise SystemExit(f"unexpected fence opener block count: {text.count(fence_old)}")
          text = text.replace(fence_old, fence_new)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Verify repaired validator
        shell: bash
        run: |
          python tools/agents/validate_governance.py
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check
      - name: Remove one-shot helper and publish repair
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rm .github/workflows/rdc-final3-codex-fix.yml
          git add tools/agents/validate_remote_desktop_prompt_routing.py
          python - <<'PY'
          import subprocess
          allowed = {
              ".github/workflows/rdc-final3-codex-fix.yml",
              "tools/agents/validate_remote_desktop_prompt_routing.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f"unexpected staged paths: {sorted(changed)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(agents): close final raw RDC bypasses"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
