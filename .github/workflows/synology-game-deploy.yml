name: Synology Game Deploy

# Deploys the native Game server to the internal Synology `preproduction`
# environment, the only environment. Manual dispatch from `main` only; the
# owner's approval of the GitHub environment `preproduction` is the human gate.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synology-game-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux x86_64 binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse any ref other than main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "deploy runs from main only" >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal
          cargo +1.94.0 build --release --locked -p oteryn-game-server --bins

      - name: Stage release bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          mkdir -p "$bundle/bin"
          for name in oteryn-game-server oteryn-game-ops oteryn-game-migrate; do
            install -m 0755 "target/release/$name" "$bundle/bin/$name"
          done
          install -m 0755 deploy/synology-game/supervisor.sh "$bundle/supervisor.sh"
          install -m 0755 deploy/synology-game/deploy-ops.sh "$bundle/deploy-ops.sh"
          python3 deploy/synology-game/stage_gameplay.py \
            content/spells.manifest.json "$GITHUB_WORKSPACE" "$bundle/gameplay"
          echo "$GITHUB_SHA" > "$bundle/SOURCE_SHA"
          # Every file is in the bundle before the checksums are computed.
          (cd "$bundle" && find bin gameplay supervisor.sh deploy-ops.sh SOURCE_SHA -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: game-preprod-bundle
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to preproduction
    needs: build
    environment: preproduction
    runs-on:
      group: game-runners
      labels: oteryn-game
    timeout-minutes: 30
    env:
      EXPECTED_RUNNER_NAME: oteryn-synology-game
      BASE: /volume1/oteryn/game-preprod
      # Root-owned, runner-unwritable; installed and upgraded by the owner out of band.
      ROOT_BASE: /volume1/oteryn/game-preprod-root
    steps:
      - name: Verify ref and runner identity
        env:
          ACTUAL_RUNNER_NAME: ${{ runner.name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$ACTUAL_RUNNER_NAME" = "$EXPECTED_RUNNER_NAME"
          test "$(id -u)" != 0
          test ! -e /var/run/docker.sock

      - uses: actions/download-artifact@v4
        with:
          name: game-preprod-bundle
          path: ${{ runner.temp }}/bundle

      - name: Verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/bundle"
          test "$(cat SOURCE_SHA)" = "$GITHUB_SHA"
          sha256sum --check --strict SHA256SUMS
          test "$(uname -m)" = x86_64

      - name: Verify the one-time operator setup exists
        shell: bash
        run: |
          set -euo pipefail
          for path in "$BASE/node/node.toml" "$BASE/ops/migration-url"; do
            test -f "$path" && test ! -L "$path"
            test "$(stat -c '%a %u' "$path")" = "600 $(id -u)"
          done
          ops="$ROOT_BASE/bin/oteryn-game-ops"
          test -f "$ops" && test ! -L "$ops"
          test "$(stat -c '%u' "$ops")" = 0
          test -e "$ROOT_BASE/ops/ops.toml"
          wrapper="$ROOT_BASE/bin/oteryn-game-deploy-ops"
          test -f "$wrapper" && test ! -L "$wrapper" && test "$(stat -c '%u' "$wrapper")" = 0
          # The root-run binaries must not be replaceable by the runner user.
          test ! -w "$ops" && test ! -w "$wrapper" && test ! -w "$ROOT_BASE/bin"
          sudo -n -l >/dev/null

      - name: Compare the root-installed ops binary with the bundle
        shell: bash
        run: |
          set -euo pipefail
          installed="$(sha256sum "$ROOT_BASE/bin/oteryn-game-ops" | cut -d ' ' -f 1)"
          bundled="$(sha256sum "$RUNNER_TEMP/bundle/bin/oteryn-game-ops" | cut -d ' ' -f 1)"
          if [[ "$installed" != "$bundled" ]]; then
            echo "::warning::root-installed oteryn-game-ops differs from this bundle (installed $installed, bundle $bundled); the owner upgrades it out of band"
          fi
          if ! cmp -s "$ROOT_BASE/bin/oteryn-game-deploy-ops" "$RUNNER_TEMP/bundle/deploy-ops.sh"; then
            echo "::warning::root-installed oteryn-game-deploy-ops differs from this bundle; the owner upgrades it out of band"
          fi
          echo "OPS_SHA256_INSTALLED=$installed" >> "$GITHUB_STEP_SUMMARY"
          echo "OPS_SHA256_BUNDLE=$bundled" >> "$GITHUB_STEP_SUMMARY"

      - name: Install binaries, gameplay inputs and supervisor
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/bundle"
          install -d -m 0755 "$BASE/bin" "$BASE/gameplay"
          # oteryn-game-ops is never installed here; it runs as root from ROOT_BASE.
          for name in oteryn-game-server oteryn-game-migrate; do
            # Replace by rename: a running binary is never rewritten in place.
            install -m 0755 "$bundle/bin/$name" "$BASE/bin/$name.new"
            mv -f "$BASE/bin/$name.new" "$BASE/bin/$name"
          done
          rm -rf "$BASE/gameplay.new"
          cp -R "$bundle/gameplay" "$BASE/gameplay.new"
          rm -rf "$BASE/gameplay"
          mv "$BASE/gameplay.new" "$BASE/gameplay"
          install -m 0755 "$bundle/supervisor.sh" "$BASE/supervisor.sh.new"
          mv -f "$BASE/supervisor.sh.new" "$BASE/supervisor.sh"

      - name: Run database migration
        shell: bash
        run: |
          set -euo pipefail
          url="$(tr -d '\n' < "$BASE/ops/migration-url")"
          OTERYN_GAME_MIGRATION_DATABASE_URL="$url" "$BASE/bin/oteryn-game-migrate"

      - name: Issue launch authorization (as root, before touching the service)
        shell: bash
        run: |
          set -euo pipefail
          file="launch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          args=(issue "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          if [[ -s "$BASE/run/current-node-id" ]]; then
            args+=("$(tr -d '[:space:]' < "$BASE/run/current-node-id")")
          fi
          sudo -n "$ROOT_BASE/bin/oteryn-game-deploy-ops" "${args[@]}"
          # Point the node at the new authorization (state dir is BASE/state; file handed to the service uid).
          sed -i "s|^authorization_file = .*|authorization_file = \"$BASE/state/$file\"|" "$BASE/node/node.toml"
          grep -q "^authorization_file = \"$BASE/state/$file\"" "$BASE/node/node.toml"

      - name: Stop the service
        shell: bash
        run: |
          set -euo pipefail
          "$BASE/supervisor.sh" stop

      - name: Start the service
        shell: bash
        run: |
          set -euo pipefail
          export OTERYN_NATIVE_GAMEPLAY_MANIFEST="$BASE/gameplay/content/spells.manifest.json"
          # Detach from the runner process tree so the service outlives the job.
          env -u RUNNER_TRACKING_ID setsid "$BASE/supervisor.sh" start

      - name: Health check
        shell: bash
        run: |
          set -euo pipefail
          "$BASE/supervisor.sh" health

      - name: Assign the scope to the new node (as root) and wait for ready
        shell: bash
        run: |
          set -euo pipefail
          log="$BASE/log/node.log"
          node_id="$(tr -d '[:space:]' < "$BASE/run/current-node-id")"
          if [[ "$(cat "$BASE/run/node-state")" = awaiting_assignment ]]; then
            line="$(grep 'event=awaiting_assignment' "$log" | tail -n 1)"
            revision="$(sed -n 's/.*registration_revision=\([0-9]\{1,18\}\).*/\1/p' <<< "$line")"
            test -n "$revision"
            # The manual first start already assigned the scope, so every deploy replaces.
            sudo -n "$ROOT_BASE/bin/oteryn-game-deploy-ops" assign replace \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$node_id" "$revision"
          fi
          for _ in $(seq 1 60); do
            if grep -q 'event=readiness ready=true' "$log"; then
              echo ready > "$BASE/run/node-state"
              {
                echo 'GAME_PREPRODUCTION_DEPLOY=PASS'
                echo "SOURCE_SHA=$GITHUB_SHA"
                echo 'NODE_STATE=ready'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 2
          done
          echo "::error::node did not report ready after assignment"
          exit 1
