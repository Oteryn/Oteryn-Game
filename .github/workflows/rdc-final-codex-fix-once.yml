name: RDC final Codex fix once

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final-codex-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Apply minimal final Codex fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/agents/validate_remote_desktop_prompt_routing.py')
          text = path.read_text(encoding='utf-8')

          old = '''    re.compile(r"\\bget_config\\b", re.IGNORECASE),
    re.compile(r"\\bping\\b.{0,100}\\b(?:capability|discover|connector|tool|host)\\b", re.IGNORECASE),
'''
          new = '''    re.compile(r"\\bget_config\\b", re.IGNORECASE),
    re.compile(
        r"\\bdirect\\s+(?:connector|tool)\\s+(?:calls?|invocations?)\\b.{0,120}"
        r"\\b(?:authori[sz]ation|host[- ]exception|exception|per[- ]action|exempt|without|need(?:s)?\\s+no)\\b",
        re.IGNORECASE,
    ),
    re.compile(
        r"\\b(?:authori[sz]ation|host[- ]exception|exception|per[- ]action|exempt|without|need(?:s)?\\s+no)\\b.{0,120}"
        r"\\bdirect\\s+(?:connector|tool)\\s+(?:calls?|invocations?)\\b",
        re.IGNORECASE,
    ),
    re.compile(r"\\bping\\b.{0,100}\\b(?:capability|discover|connector|tool|host)\\b", re.IGNORECASE),
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one routing-pattern anchor, got {text.count(old)}')
          text = text.replace(old, new, 1)

          old_zero = '    value = ZERO_WIDTH_RE.sub(" ", value)\n'
          new_zero = '    value = ZERO_WIDTH_RE.sub("", value)\n'
          if text.count(old_zero) != 1:
              raise SystemExit(f'expected one zero-width replacement anchor, got {text.count(old_zero)}')
          text = text.replace(old_zero, new_zero, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused and provider governance GREEN
        shell: bash
        run: |
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_governance.py
          git diff --check
      - name: Commit fix and remove helper
        shell: bash
        run: |
          rm .github/workflows/rdc-final-codex-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/agents/validate_remote_desktop_prompt_routing.py .github/workflows/rdc-final-codex-fix-once.yml
          git commit -m 'fix(agents): close final RDC authorization bypasses'
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
