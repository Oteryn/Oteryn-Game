              'oteryn-gameplay-dispatch gameplay_transport::equipment_move::equipment_effects_owner::tests::ability_tests::equipment_effects_owner_uses_primary_slot_and_extra_never_suppresses': 33,
              'oteryn-gameplay-dispatch gameplay_transport::equipment_move::equipment_effects_owner::tests::armor_tests::dmg3_equipment_earth_death_absorbs_compose_with_installed_protection_before_clamp': 33,
              'oteryn-gameplay-dispatch gameplay_transport::equipment_move::equipment_effects_owner::tests::armor_tests::unknown_or_negative_armor_adds_nothing': 37,
              'oteryn-gameplay-dispatch gameplay_transport::equipment_move::equipment_effects_owner::tests::armor_tests::worn_armor_sums_own_slot_body_items_and_never_the_hands': 33,
