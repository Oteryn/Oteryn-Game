name: Merge gate

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Merge gate / scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - name: Detect validation scope
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repository = os.environ['REPOSITORY']
          number = os.environ['PULL_NUMBER']
          token = os.environ['GH_TOKEN']
          files: list[str] = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/pulls/{number}/files?per_page=100&page={page}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Oteryn-v2-merge-gate',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)
              files.extend(item['filename'] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          exact = {
              'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rustfmt.toml',
              'deny.toml', 'workspace-boundaries.toml',
              '.github/workflows/rust.yml', '.github/workflows/merge-gate.yml',
          }
          prefixes = ('apps/', 'crates/', 'tests/', 'tools/', 'docs/migration/')
          rust = any(path in exact or path.startswith(prefixes) for path in files)
          print('Changed files:')
          for path in files:
              print(f'- {path}')
          print(f'Rust/workspace validation required: {rust}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"rust={'true' if rust else 'false'}\n")
          PY

  governance:
    name: Merge gate / governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    env:
      TARGET_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Verify pull request target and metadata
        env:
          REPOSITORY: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          errors: list[str] = []
          repository = os.environ['REPOSITORY']
          title = os.environ.get('PR_TITLE', '')
          body = os.environ.get('PR_BODY', '')
          head_sha = os.environ.get('PR_HEAD_SHA', '')
          head_repository = os.environ.get('PR_HEAD_REPOSITORY', '')
          base_ref = os.environ.get('PR_BASE_REF', '')

          if head_repository != repository:
              errors.append('merge gate only accepts same-repository pull request heads')
          if base_ref != 'main':
              errors.append('merge gate only accepts pull requests targeting main')
          if re.fullmatch(r'[0-9a-f]{40}', head_sha) is None:
              errors.append('pull request head SHA is invalid')

          pattern = re.compile(
              r'^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)'
              r'(\([a-z0-9][a-z0-9._/-]*\))?!?: [A-Za-z0-9].+$'
          )
          if len(title) > 72:
              errors.append('PR title must be at most 72 characters')
          if not pattern.fullmatch(title):
              errors.append('PR title must follow type(scope): imperative summary')
          for heading in ('## Summary', '## Scope', '## Validation'):
              if heading not in body:
                  errors.append(f'PR body is missing {heading}')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          print(f'Validated PR metadata for exact head {head_sha}.')
          PY

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false

      - name: Verify checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"

      - name: Validate agent governance
        run: python tools/agents/validate_governance.py

      - name: Validate repository policy
        run: python tools/repository/validate_repository_policy.py

  dependency_review:
    name: Merge gate / dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: Merge gate / CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:${{ matrix.language }}

  rust_policy:
    name: Merge gate / Rust policy and metadata
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Verify locked metadata
        run: cargo +1.94.0 metadata --locked --format-version 1 >/dev/null

      - name: Verify formatting
        run: cargo +1.94.0 fmt --all --check

      - name: Verify machine workspace boundaries
        run: cargo +1.94.0 run --locked -p oteryn-architecture-check -- workspace .

      - name: Verify migration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('docs/migration/rust-client-provenance.json'),
              Path('docs/migration/rust-client-path-map.json'),
              Path('docs/migration/rust-dependency-delta.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: PASS')
          PY

      - name: Verify production closure negatives
        run: |
          cargo +1.94.0 tree --locked -p oteryn-client --edges normal,build > production-tree.txt
          python - <<'PY'
          from pathlib import Path
          tree = Path('production-tree.txt').read_text(encoding='utf-8')
          forbidden = (
              'protocol-canary', 'protocol-core', 'protocol-oteryn',
              'transport', 'game-session', 'oteryn-client-domain',
              'oteryn-client-simulation', 'oteryn-synthetic-assets',
              'oteryn-test-support', 'oteryn-synthetic-client-harness',
          )
          found = [name for name in forbidden if name in tree]
          if found:
              raise SystemExit(f'forbidden production closure entries: {found}')
          print('production closure: PASS')
          PY

  rust_linux:
    name: Merge gate / Rust Linux workspace
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build workspace
        run: cargo +1.94.0 build --locked --workspace --all-targets

      - name: Strict Clippy
        run: cargo +1.94.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo +1.94.0 test --locked --workspace

      - name: Run synthetic harness
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness

  rust_windows:
    name: Merge gate / Rust Windows client
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build production client
        shell: pwsh
        run: cargo +1.94.0 build --locked --release -p oteryn-client --target x86_64-pc-windows-msvc

      - name: Strict client Clippy
        shell: pwsh
        run: cargo +1.94.0 clippy --locked -p oteryn-client --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Launch visible pre-native shell smoke
        shell: pwsh
        run: cargo +1.94.0 run --locked -p oteryn-client --target x86_64-pc-windows-msvc -- --smoke

      - name: Run synthetic harness
        shell: pwsh
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness

  rust_supply_chain:
    name: Merge gate / Rust supply chain
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check advisories licenses bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # cargo-deny 0.20.2
        with:
          rust-version: '1.94.0'
          command: check
          arguments: --all-features

  validate:
    name: Merge gate / validate
    if: always()
    needs:
      - scope
      - governance
      - dependency_review
      - codeql
      - rust_policy
      - rust_linux
      - rust_windows
      - rust_supply_chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every applicable gate
        env:
          SCOPE: ${{ needs.scope.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          CODEQL: ${{ needs.codeql.result }}
          RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          RUST_POLICY: ${{ needs.rust_policy.result }}
          RUST_LINUX: ${{ needs.rust_linux.result }}
          RUST_WINDOWS: ${{ needs.rust_windows.result }}
          RUST_SUPPLY_CHAIN: ${{ needs.rust_supply_chain.result }}
        run: |
          python - <<'PY'
          import os
          import sys

          failures: list[str] = []
          for name in ('SCOPE', 'GOVERNANCE', 'DEPENDENCY_REVIEW', 'CODEQL'):
              if os.environ[name] != 'success':
                  failures.append(f'{name}={os.environ[name]}')

          rust_required = os.environ['RUST_REQUIRED'] == 'true'
          rust = ('RUST_POLICY', 'RUST_LINUX', 'RUST_WINDOWS', 'RUST_SUPPLY_CHAIN')
          if rust_required:
              for name in rust:
                  if os.environ[name] != 'success':
                      failures.append(f'{name}={os.environ[name]}')
          else:
              for name in rust:
                  if os.environ[name] not in {'success', 'skipped'}:
                      failures.append(f'{name}={os.environ[name]}')

          if failures:
              print('Merge gate failed:', file=sys.stderr)
              for failure in failures:
                  print(f'- {failure}', file=sys.stderr)
              raise SystemExit(1)
          print('All applicable merge gates passed on the pull request head.')
          PY
