name: Merge gate

run-name: Merge gate • pull_request • ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions: {}

concurrency:
  # One group per PR. Metadata edits never cancel a product qualification:
  # they wait for it and then reuse its job-result markers instead of running
  # a second full gate on the same head. Base retargets and new commits cancel
  # whatever is running. Labels select nothing, so label changes do not run
  # the gate at all.
  group: ${{ format('merge-gate-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ !(github.event.action == 'edited' && github.event.changes.base == null) }}

jobs:
  scope:
    name: Merge gate / scope
    if: github.event.pull_request.base.ref == 'main' || !github.event.pull_request.base.ref
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.detect.outputs.pr_number }}
      target_sha: ${{ steps.detect.outputs.target_sha }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      file_records: ${{ steps.detect.outputs.file_records }}
      file_count: ${{ steps.detect.outputs.file_count }}
      complete: ${{ steps.detect.outputs.complete }}
    steps:
      - name: Resolve and validate exact pull request head
        id: detect
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          repository = os.environ['REPOSITORY']
          number_text = os.environ.get('EVENT_PR_NUMBER', '').strip()
          expected_head = os.environ.get('EVENT_PR_HEAD_SHA', '').strip().lower()
          errors: list[str] = []

          if re.fullmatch(r'[1-9][0-9]*', number_text) is None:
              errors.append('pull request number must be a positive integer')
          if re.fullmatch(r'[0-9a-f]{40}', expected_head) is None:
              errors.append('pull request head SHA must be a full lowercase 40-character SHA')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Oteryn-v2-merge-gate',
          }

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls/{number_text}',
              headers=headers,
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          state = pull.get('state', '')
          head_sha = pull.get('head', {}).get('sha', '').lower()
          head_repository = pull.get('head', {}).get('repo', {}).get('full_name', '')
          base_ref = pull.get('base', {}).get('ref', '')
          base_sha = pull.get('base', {}).get('sha', '').lower()
          changed_files = pull.get('changed_files')

          if state != 'open':
              errors.append('merge-gate validation requires an open pull request')
          if head_sha != expected_head:
              errors.append('pull request head moved after event head was resolved')
          if head_repository != repository:
              errors.append('merge gate only accepts same-repository pull request heads')
          if base_ref != 'main':
              errors.append('merge gate only accepts pull requests targeting main')
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              errors.append('pull request base SHA is invalid')
          if not isinstance(changed_files, int) or changed_files < 0:
              errors.append('pull request changed_files count is invalid')
          complete = type(changed_files) is int and 0 <= changed_files <= 300
          files: list[str] = []
          batch = []
          if not errors and complete:
              # SHA-bound comparison prevents mutable PR-files ABA substitution.
              files_request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/compare/{base_sha}...{expected_head}?per_page=1',
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(files_request, timeout=30) as response:
                      comparison = json.load(response)
                  batch = comparison.get('files')
                  if not isinstance(batch, list):
                      complete = False
                      batch = []
                  for item in batch:
                      if not isinstance(item, dict) or not isinstance(item.get('filename'), str):
                          complete = False
                          break
                      files.append(item['filename'])
              except (OSError, ValueError, AttributeError):
                  complete = False
          if len(files) != changed_files:
              complete = False

          if not errors:
              with urllib.request.urlopen(request, timeout=30) as response:
                  pull_after_files = json.load(response)
              if pull_after_files.get('state') != 'open':
                  errors.append('pull request closed during scope classification')
              if pull_after_files.get('head', {}).get('sha', '').lower() != expected_head:
                  errors.append('pull request head moved during scope classification')
              if pull_after_files.get('head', {}).get('repo', {}).get('full_name') != repository:
                  errors.append('pull request repository changed during scope classification')
              if pull_after_files.get('base', {}).get('sha', '').lower() != base_sha:
                  errors.append('pull request base moved during scope classification')
              if pull_after_files.get('base', {}).get('ref') != 'main':
                  errors.append('pull request base ref changed during scope classification')
              if pull_after_files.get('changed_files') != changed_files:
                  errors.append('pull request file count changed during scope classification')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          records = [
              {key: item[key] for key in ('filename', 'status', 'previous_filename') if key in item}
              for item in batch
          ] if complete else []
          serialized = json.dumps(records, separators=(',', ':'))
          if len(serialized.encode('utf-8')) > 32768:
              complete = False
              serialized = '[]'
          print(f'Validated PR #{number_text} exact head {head_sha} against base {base_sha}.')
          print(f'Changed files: {changed_files}; complete immutable enumeration: {complete}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'pr_number={number_text}\n')
              output.write(f'target_sha={head_sha}\n')
              output.write(f'base_sha={base_sha}\n')
              output.write(f'file_count={changed_files}\n')
              output.write(f'file_records={serialized}\n')
              output.write(f"complete={'true' if complete else 'false'}\n")
          PY

  lanes:
    name: Merge gate / trusted-base risk lanes
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      windows: ${{ steps.classify.outputs.windows }}
      atlas_fullworld: ${{ steps.classify.outputs.atlas_fullworld }}
      server_qualification: ${{ steps.classify.outputs.server_qualification }}
      world_bundle: ${{ steps.classify.outputs.world_bundle }}
      surface: ${{ steps.classify.outputs.surface }}
      reason: ${{ steps.classify.outputs.reason }}
      routing_health: ${{ steps.classify.outputs.routing_health }}
    steps:
      - name: Check out protected-base classifier and inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.base_sha }}
          persist-credentials: false

      - name: Verify protected-base SHA
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.base_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Classify with trusted exact-consumer routing
        id: classify
        shell: bash
        env:
          CHANGED_FILE_RECORDS: ${{ needs.scope.outputs.file_records }}
          CHANGED_FILE_COUNT: ${{ needs.scope.outputs.file_count }}
          ENUMERATION_COMPLETE: ${{ needs.scope.outputs.complete }}
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
        run: |
          set -euo pipefail
          if ! git fetch --no-tags --depth=1 origin "$EXPECTED_HEAD" || ! rustup toolchain install 1.99.1 --profile minimal || ! cargo +1.99.1 metadata --locked --no-deps --all-features --format-version 1 > "$RUNNER_TEMP/risk-metadata.json"; then
            printf '{}' > "$RUNNER_TEMP/risk-metadata.json"
          fi
          python -I tools/repository/classify_pr_test_lanes.py "$RUNNER_TEMP/risk-metadata.json"

      - name: Verify protected-base routing contract health
        env:
          EXPECTED_HEAD: ${{ needs.scope.outputs.base_sha }}
        run: python -I tools/repository/validate_pr_routing_contract.py --protected-main "$RUNNER_TEMP/risk-metadata.json"

      - name: Summarize trusted-base routing
        env:
          RUST: ${{ steps.classify.outputs.rust }}
          WINDOWS: ${{ steps.classify.outputs.windows }}
          ATLAS_FULLWORLD: ${{ steps.classify.outputs.atlas_fullworld }}
          SERVER_QUALIFICATION: ${{ steps.classify.outputs.server_qualification }}
          WORLD_BUNDLE: ${{ steps.classify.outputs.world_bundle }}
          SURFACE: ${{ steps.classify.outputs.surface }}
          REASON: ${{ steps.classify.outputs.reason }}
          ROUTING_HEALTH: ${{ steps.classify.outputs.routing_health }}
        run: |
          {
            echo '### Trusted-base PR routing'
            echo
            printf -- '- Rust: `%s`\n' "$RUST"
            printf -- '- Windows: `%s`\n' "$WINDOWS"
            printf -- '- Atlas fullworld: `%s`\n' "$ATLAS_FULLWORLD"
            printf -- '- Server qualification: `%s`\n' "$SERVER_QUALIFICATION"
            printf -- '- World bundle: `%s`\n' "$WORLD_BUNDLE"
            printf -- '- Surface: `%s`\n' "$SURFACE"
            printf -- '- Reason: `%s`\n' "$REASON"
            printf -- '- Routing health: `%s`\n' "$ROUTING_HEALTH"
          } >> "$GITHUB_STEP_SUMMARY"

  governance:
    name: Merge gate / governance
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify pull request metadata
        env:
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ needs.scope.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/{os.environ['PULL_NUMBER']}",
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Oteryn-v2-merge-gate',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          errors: list[str] = []
          title = pull.get('title', '')
          body = pull.get('body') or ''
          state = pull.get('state')
          head_sha = pull.get('head', {}).get('sha', '')
          head_repository = pull.get('head', {}).get('repo', {}).get('full_name')
          base_ref = pull.get('base', {}).get('ref')
          expected_head = os.environ['EXPECTED_HEAD']
          repository = os.environ['REPOSITORY']
          if state != 'open':
              errors.append('merge gate requires an open pull request')
          if head_sha != expected_head:
              errors.append('pull request head moved after scope validation')
          if head_repository != repository:
              errors.append('merge gate only accepts same-repository pull request heads')
          if base_ref != 'main':
              errors.append('merge gate only accepts pull requests targeting main')

          warnings: list[str] = []
          pattern = re.compile(
              r'^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)'
              r'(\([a-z0-9][a-z0-9._/-]*\))?!?: [A-Za-z0-9].+$'
          )
          if len(title) > 72:
              warnings.append('PR title should be at most 72 characters')
          if not pattern.fullmatch(title):
              warnings.append('PR title should follow type(scope): imperative summary')

          headings: set[str] = set()
          for line in body.splitlines():
              match = re.match(r'^\s{0,3}##\s+(.+?)\s*#*\s*$', line)
              if match:
                  headings.add(' '.join(match.group(1).casefold().split()))
          if 'summary' not in headings:
              warnings.append('PR body should include a Summary section')
          if 'scope' not in headings:
              warnings.append('PR body should include a Scope section')
          validation_word = re.compile(r'(?<![a-z0-9])validation(?![a-z0-9])')
          if not any(validation_word.search(heading) for heading in headings):
              warnings.append('PR body should include a validation section')

          for warning in warnings:
              safe = warning.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=PR metadata guidance::{safe}')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          print(f"Validated PR metadata for exact head {os.environ['EXPECTED_HEAD']}.")
          PY

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      # Job-result cache (pull-request gate only; Merge Queue never caches). The key hashes
      # every input this job can read; a hit means the same job already succeeded on
      # identical inputs for this pull request. Failures are never recorded.
      - name: Compute job-result key
        id: jr_key
        env:
          JOB: governance
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: python -I tools/repository/job_result_key.py key --job "$JOB" --mode tree --extra "base=$BASE_SHA" --extra "image=${ImageVersion:-unknown}" --extra "os=${RUNNER_OS:-}-${RUNNER_ARCH:-}"

      - name: Restore job-result marker
        id: jr_restore
        if: steps.jr_key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: ${{ steps.jr_key.outputs.key }}

      - name: Evaluate job-result marker
        id: jr_hit
        env:
          KEY: ${{ steps.jr_key.outputs.key }}
        run: python -I tools/repository/job_result_key.py verify --key "$KEY" --dir "$RUNNER_TEMP/jobresult"

      - name: Validate agent governance
        if: steps.jr_hit.outputs.hit != 'true'
        run: python tools/agents/validate_governance.py

      - name: Validate repository policy
        if: steps.jr_hit.outputs.hit != 'true'
        run: python tools/repository/validate_repository_policy.py

      - name: Test canonical PG/SIM gate regressions
        if: steps.jr_hit.outputs.hit != 'true'
        run: python tools/repository/test_validate_pr_gate_pg_sim.py

      - name: Record job-result marker
        if: success() && steps.jr_key.outputs.key != '' && steps.jr_hit.outputs.hit != 'true'
        env:
          KEY: ${{ steps.jr_key.outputs.key }}
        run: python -I tools/repository/job_result_key.py marker --key "$KEY" --dir "$RUNNER_TEMP/jobresult"

      - name: Save job-result marker
        if: success() && steps.jr_key.outputs.key != '' && steps.jr_hit.outputs.hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: ${{ steps.jr_key.outputs.key }}

  dependency_review:
    name: Merge gate / dependency review
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ needs.scope.outputs.base_sha }}
          head-ref: ${{ needs.scope.outputs.target_sha }}

  routing_contract:
    name: Merge gate / routing contract
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out exact head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify routing validator blob
        run: test "$(git hash-object tools/repository/validate_pr_routing_contract.py)" = "ce2fc840f22fd75c0ccb067d9807698a87650f77"

      - name: Verify candidate diff whitespace
        env:
          EXPECTED_BASE: ${{ needs.scope.outputs.base_sha }}
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
        run: |
          git cat-file -e "${EXPECTED_BASE}^{commit}"
          git diff --check "$EXPECTED_BASE" "$EXPECTED_HEAD"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Build exact candidate Cargo metadata
        run: cargo +1.99.1 metadata --locked --no-deps --all-features --format-version 1 > "$RUNNER_TEMP/routing-contract-metadata.json"

      - name: Verify exact candidate routing contract
        env:
          EXPECTED_BASE: ${{ needs.scope.outputs.base_sha }}
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
          CHANGED_FILE_RECORDS: ${{ needs.scope.outputs.file_records }}
          CHANGED_FILE_COUNT: ${{ needs.scope.outputs.file_count }}
          ENUMERATION_COMPLETE: ${{ needs.scope.outputs.complete }}
        run: python -I tools/repository/validate_pr_routing_contract.py "$RUNNER_TEMP/routing-contract-metadata.json"

  world_bundle:
    name: Merge gate / World bundle
    needs: [scope, lanes]
    # Fast: runs on every PR that changes a compiler input (an older protected-base
    # classifier without the lane output counts as required).
    if: needs.lanes.outputs.world_bundle != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Check the World pins and build the bundle twice
        run: cargo +1.99.1 run --locked --release -p oteryn-world-bundle-compiler -- pin-check . "$RUNNER_TEMP/world-bundle"

      - name: Name the bundle artifact by its digest
        id: artifact
        run: echo "name=$(cat "$RUNNER_TEMP/world-bundle/artifact-name.txt")" >> "$GITHUB_OUTPUT"

      - name: Upload the World bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/world-bundle/*.otwb
          if-no-files-found: error
          retention-days: 14

  rust_policy:
    name: Merge gate / Rust policy and metadata
    needs: [scope, lanes]
    if: needs.lanes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      # Job-result cache (pull-request gate only; Merge Queue never caches). The key hashes
      # every input this job can read; a hit means the same job already succeeded on
      # identical inputs for this pull request. Failures are never recorded.
      - name: Compute job-result key
        id: jr_key
        env:
          JOB: rust_policy
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: python -I tools/repository/job_result_key.py key --job "$JOB" --mode rust-workspace --extra "base=$BASE_SHA" --extra "image=${ImageVersion:-unknown}" --extra "os=${RUNNER_OS:-}-${RUNNER_ARCH:-}"

      - name: Restore job-result marker
        id: jr_restore
        if: steps.jr_key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: ${{ steps.jr_key.outputs.key }}

      - name: Evaluate job-result marker
        id: jr_hit
        env:
          KEY: ${{ steps.jr_key.outputs.key }}
        run: python -I tools/repository/job_result_key.py verify --key "$KEY" --dir "$RUNNER_TEMP/jobresult"

      - name: Install Rust toolchain
        if: steps.jr_hit.outputs.hit != 'true'
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - name: Verify locked metadata
        if: steps.jr_hit.outputs.hit != 'true'
        run: cargo +1.99.1 metadata --locked --format-version 1 >/dev/null

      - name: Verify formatting
        if: steps.jr_hit.outputs.hit != 'true'
        run: cargo +1.99.1 fmt --all --check

      - name: Verify machine workspace boundaries
        if: steps.jr_hit.outputs.hit != 'true'
        run: cargo +1.99.1 run --locked -p oteryn-architecture-check -- workspace .

      - name: Verify migration JSON
        if: steps.jr_hit.outputs.hit != 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('docs/migration/rust-client-provenance.json'),
              Path('docs/migration/rust-client-path-map.json'),
              Path('docs/migration/rust-dependency-delta.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: PASS')
          PY

      - name: Verify production closure negatives
        if: steps.jr_hit.outputs.hit != 'true'
        run: |
          for package in oteryn-client oteryn-game-server; do
            cargo +1.99.1 tree --locked -p "$package" --edges normal,build > "${package}-production-tree.txt"
          done
          python - <<'PY'
          import re
          from pathlib import Path

          import tomllib

          # Synthetic and test packages come from workspace-boundaries.toml, the
          # single source of truth for production classification.
          boundaries = tomllib.loads(Path('workspace-boundaries.toml').read_text(encoding='utf-8'))
          forbidden = (
              'protocol-canary', 'protocol-core',
              'transport', 'game-session',
              *boundaries['synthetic'], *boundaries['test'],
              'oteryn-dev-client',
          )
          session_crates = ('oteryn-session', 'oteryn-session-tcp')

          def parse_tree(tree):
              stack, edges, protocol = [], 0, []
              for line in tree.splitlines():
                  match = re.search(r'[├└]── (\S+)', line)
                  if not match:
                      continue
                  edges += 1
                  depth = match.start() // 4
                  del stack[depth:]
                  if match.group(1).startswith('oteryn-protocol-oteryn'):
                      protocol.append((match.group(1), stack[-1] if stack else None))
                  stack.append(match.group(1))
              return edges, protocol

          for package in ('oteryn-client', 'oteryn-game-server'):
              tree = Path(f'{package}-production-tree.txt').read_text(encoding='utf-8')
              edges, protocol = parse_tree(tree)
              if not tree.strip() or edges == 0:
                  raise SystemExit(f'{package} production tree is empty or not in the expected format')
              named = sum('oteryn-protocol-oteryn' in line for line in tree.splitlines())
              if named != len(protocol):
                  raise SystemExit(f'{package} production tree has {named} protocol-oteryn lines but {len(protocol)} parsed edges')
              found = [name for name in forbidden if name in tree]
              if package == 'oteryn-client':
                  found += [f'protocol-oteryn via {parent}' for name, parent in protocol if name != 'oteryn-protocol-oteryn' or parent not in session_crates]
              if found:
                  raise SystemExit(f'{package} production closure contains forbidden entries: {found}')
              print(f'{package} production closure: PASS')
          PY

      - name: Record job-result marker
        if: success() && steps.jr_key.outputs.key != '' && steps.jr_hit.outputs.hit != 'true'
        env:
          KEY: ${{ steps.jr_key.outputs.key }}
        run: python -I tools/repository/job_result_key.py marker --key "$KEY" --dir "$RUNNER_TEMP/jobresult"

      - name: Save job-result marker
        if: success() && steps.jr_key.outputs.key != '' && steps.jr_hit.outputs.hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: ${{ steps.jr_key.outputs.key }}

  # One job id, four parallel matrix legs: strict Clippy on one leg, and the unit tests of
  # the same changed crates split over three duration-balanced nextest shards. `needs.rust_fast.result`
  # is success only when every leg succeeds, so validate and game-gate keep their semantics.
  rust_fast:
    name: Merge gate / Rust changed-crate Clippy and unit tests (${{ matrix.leg }})
    needs: [scope, lanes]
    if: needs.lanes.outputs.rust == 'true'
    # OTERYN_SELF_HOSTED_RUST=on runs the Clippy leg on Molehill (warm workspace target); turn it
    # off or delete it when the PC is offline. The three test shards always run hosted from the
    # rust.yml cache, so one PR no longer builds the same test binaries three times on the PC.
    # Forks and dependabot stay hosted because PR code would run on the owner's machine.
    runs-on: ${{ (vars.OTERYN_SELF_HOSTED_RUST == 'on' && matrix.kind == 'clippy' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') && fromJSON('["self-hosted","linux","x64","oteryn-molehill"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: clippy
            slug: clippy
            kind: clippy
            shard: ''
          - leg: tests 1/3
            slug: tests-1-3
            kind: tests
            shard: '1/3'
          - leg: tests 2/3
            slug: tests-2-3
            kind: tests
            shard: '2/3'
          - leg: tests 3/3
            slug: tests-3-3
            kind: tests
            shard: '3/3'
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - name: Select persistent self-hosted Cargo target directory
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          if [[ "${OTERYN_CI_TARGET_ROOT:-}" != /* ]]; then
            echo 'OTERYN_CI_TARGET_ROOT must be set to an absolute path on the self-hosted runner' >&2
            exit 1
          fi
          if [[ ! "${RUNNER_NAME:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo 'RUNNER_NAME must be a plain runner name on the self-hosted runner' >&2
            exit 1
          fi
          # One directory per runner: a runner runs one job at a time, so concurrent jobs
          # (other shards or other PRs) never share artifacts or the JUnit report.
          export CARGO_TARGET_DIR="$OTERYN_CI_TARGET_ROOT/$RUNNER_NAME/merge-gate"
          echo "CARGO_TARGET_DIR=$CARGO_TARGET_DIR" >> "$GITHUB_ENV"
          # Never consume the report of this runner's previous job.
          rm -f -- "$CARGO_TARGET_DIR/nextest/rust-fast/junit.xml"

      - name: Select changed workspace crates
        env:
          CHANGED_FILE_RECORDS: ${{ needs.scope.outputs.file_records }}
          ENUMERATION_COMPLETE: ${{ needs.scope.outputs.complete }}
          EXPECTED_BASE: ${{ needs.scope.outputs.base_sha }}
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
        run: |
          set -euo pipefail
          cargo +1.99.1 metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/rust-fast-metadata.json"
          # A large PR's transport is incomplete (over 300 files or 32 KiB); the exact base
          # tree lets the selection recover the complete delta, as the trusted-base classifier does.
          if [[ "$ENUMERATION_COMPLETE" == 'false' ]]; then
            git fetch --no-tags --depth=1 origin "$EXPECTED_BASE" || true
          fi
          # Unrecoverable enumeration, workspace-wide Rust inputs or no attributable crate
          # select every workspace crate.
          python - "$RUNNER_TEMP/rust-fast-metadata.json" "$RUNNER_TEMP/rust-fast-packages.tsv" <<'PY'
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys

          def exact_tree_paths(base, head):
              """Complete immutable tree delta of two exact commits, or None when unknown."""
              if any(re.fullmatch(r'[0-9a-f]{40}', sha) is None for sha in (base, head)) or base == head:
                  return None
              try:
                  if subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip() != head:
                      return None
                  raw = subprocess.check_output(
                      ['git', 'diff', '--no-ext-diff', '--no-textconv', '--find-renames',
                       '--name-status', '-z', base, head, '--']
                  )
              except (OSError, subprocess.SubprocessError):
                  return None
              if not raw or not raw.endswith(b'\0'):
                  return None
              fields = raw[:-1].split(b'\0')
              found = []
              index = 0
              while index < len(fields):
                  code = fields[index]
                  width = 1 if code in {b'A', b'M', b'D'} else 2 if code[:1] in {b'R', b'C'} and code[1:].isdigit() else 0
                  if width == 0 or index + width >= len(fields):
                      return None
                  try:
                      found.extend(field.decode('utf-8') for field in fields[index + 1:index + 1 + width])
                  except UnicodeDecodeError:
                      return None
                  index += 1 + width
              return found or None

          metadata = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          root = pathlib.Path(metadata['workspace_root']).resolve(strict=True)
          members = set(metadata['workspace_members'])
          packages = {}
          for package in metadata['packages']:
              if package['id'] not in members:
                  continue
              if package['name'] in packages:
                  raise SystemExit(f"duplicate workspace package name: {package['name']}")
              directory = pathlib.Path(package['manifest_path']).resolve(strict=True).parent
              kinds = {kind for target in package['targets'] for kind in target['kind']}
              packages[package['name']] = (directory.relative_to(root).as_posix(), kinds)
          if not packages:
              raise SystemExit('workspace has no member packages')

          workspace_wide = False
          paths = []
          if os.environ.get('ENUMERATION_COMPLETE') == 'true':
              records = json.loads(os.environ['CHANGED_FILE_RECORDS'])
              if not isinstance(records, list) or not records:
                  workspace_wide = True
              else:
                  for record in records:
                      for key in ('filename', 'previous_filename'):
                          if isinstance(record.get(key), str):
                              paths.append(record[key])
          elif os.environ.get('ENUMERATION_COMPLETE') == 'false':
              recovered = exact_tree_paths(
                  os.environ.get('EXPECTED_BASE', '').strip().lower(),
                  os.environ.get('EXPECTED_HEAD', '').strip().lower(),
              )
              if recovered is None:
                  workspace_wide = True
              else:
                  paths = recovered
                  print(f'Recovered {len(paths)} changed paths from exact base/head trees')
          else:
              workspace_wide = True

          rust_wide_files = {
              'Cargo.toml', 'Cargo.lock', 'rust-toolchain', 'rust-toolchain.toml',
              'rustfmt.toml', '.rustfmt.toml', 'clippy.toml', '.clippy.toml', 'deny.toml',
              'workspace-boundaries.toml',
          }
          selected = set()
          for path in paths:
              owners = [
                  (len(directory), name) for name, (directory, _kinds) in packages.items()
                  if directory not in ('', '.') and (path == directory or path.startswith(directory + '/'))
              ]
              if owners:
                  selected.add(max(owners)[1])
              elif path in rust_wide_files or path.startswith(('.cargo/', 'vendor/')):
                  workspace_wide = True
          if workspace_wide or not selected:
              selected = set(packages)

          with open(sys.argv[2], 'w', encoding='utf-8') as output:
              for name in sorted(selected):
                  kinds = packages[name][1]
                  flags = []
                  if kinds & {'lib', 'rlib', 'dylib', 'cdylib', 'staticlib', 'proc-macro'}:
                      flags.append('--lib')
                  if 'bin' in kinds:
                      flags.append('--bins')
                  output.write(f"{name}\t{' '.join(flags)}\n")
          mode = 'workspace' if selected == set(packages) else 'changed'
          print(f'Rust fast lane mode={mode} packages={len(selected)}/{len(packages)}')
          for name in sorted(selected):
              print(f'- {name}')
          PY

      # Job-result ledger (pull-request gate only; Merge Queue never caches). Each test shard keys
      # every selected crate on its own closure; Clippy keys all of them together. A crate is
      # skipped only when its key passed in an earlier run of this pull request, and a failed
      # crate is never recorded: a fix to one failing crate re-runs that crate and the selected
      # crates that depend on it, not the whole leg.
      - name: Plan job-result keys
        id: jr_plan
        env:
          JOB: rust_fast-${{ matrix.leg }}
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
          PER_PACKAGE: ${{ matrix.kind == 'tests' && '--per-package' || '' }}
        run: python -I tools/repository/job_result_key.py plan --job "$JOB" --metadata "$RUNNER_TEMP/rust-fast-metadata.json" --packages "$RUNNER_TEMP/rust-fast-packages.tsv" --out "$RUNNER_TEMP/jr-plan.json" --extra "base=$BASE_SHA" --extra "image=${ImageVersion:-unknown}" --extra "os=${RUNNER_OS:-}-${RUNNER_ARCH:-}" $PER_PACKAGE

      - name: Restore job-result ledger
        if: steps.jr_plan.outputs.keyed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: job-result-ledger-v1-rust_fast-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            job-result-ledger-v1-rust_fast-${{ matrix.slug }}-

      - name: Select crates without a passed result
        id: jr_hit
        run: python -I tools/repository/job_result_key.py select --plan "$RUNNER_TEMP/jr-plan.json" --packages "$RUNNER_TEMP/rust-fast-packages.tsv" --dir "$RUNNER_TEMP/jobresult" --out "$RUNNER_TEMP/rust-fast-run.tsv"

      - name: Restore trimmed Cargo cache from protected main
        if: runner.environment == 'github-hosted' && steps.jr_hit.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-linux-v2-1.99.1-

      # Restore only: the protected-main producer in rust.yml is the only cache writer.
      # The self-hosted runner keeps a warm target dir instead.
      # Old mtimes on files unchanged since the cached commit let Cargo reuse those units;
      # changed files keep fresh mtimes, so this exact head is still built and tested.
      - name: Normalize source mtimes for the restored Cargo cache
        if: runner.environment == 'github-hosted' && steps.jr_hit.outputs.hit != 'true'
        run: python tools/repository/normalize_cargo_mtimes.py

      # One invocation over the whole workspace, as in the rust.yml cache producer: Cargo unifies
      # features over the selected packages, so a `-p` subset resolves different features than
      # the cached `--workspace` build and recompiles shared dependencies (serde, syn, tokio...).
      # Clippy therefore lints every crate, as the Merge Queue does; crates unchanged since the
      # cached commit are reused from the cache, and the shared key still covers the result
      # because every unselected crate is identical to the keyed base.
      - name: Strict Clippy (workspace)
        id: clippy
        if: matrix.kind == 'clippy' && steps.jr_hit.outputs.hit != 'true'
        run: cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings

      # cargo-nextest 0.9.146 (released 2026-09-21), pinned by SHA-256. nextest runs each test
      # in its own process; the game-server unit tests have no env mutation and no ordering or
      # shared-state dependence between tests (see the PR description for the audit).
      - name: Install pinned cargo-nextest
        if: matrix.kind == 'tests' && steps.jr_hit.outputs.hit != 'true'
        env:
          NEXTEST_VERSION: 0.9.146
          NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      # Hash slices left the multi-minute tests wherever their names fell, so one shard ran more
      # than twice as long as another. Each shard lists the lib and bin unit tests of the selected
      # crates without a passed result (this listing is the build; the run reuses it) and computes
      # the same plan for every shard. The measured slow tests go longest first to the least-loaded
      # shard; that assignment depends only on the table in this file. Every other test is spread
      # evenly over the shards within its own test binary. A test's shard thus depends only on this
      # file and its own crate, both in that crate's job-result key, so a crate recorded as passed
      # by one shard can never hide a test that moved to it from another shard. The step fails
      # unless every listed test lands in exactly one shard; a stale table entry only costs balance.
      - name: Plan duration-balanced nextest shard ${{ matrix.shard }}
        id: shard_plan
        if: matrix.kind == 'tests' && steps.jr_hit.outputs.hit != 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/nextest-plan"
          mkdir -p "$plan"
          : > "$plan/filters.txt"
          printf '[profile.rust-fast.junit]\npath = "junit.xml"\n' > "$RUNNER_TEMP/nextest.toml"
          filters=()
          while IFS=$'\t' read -r package flags; do
            if [[ -z "$flags" ]]; then
              echo "NOT_APPLICABLE: $package has no library or binary unit-test targets"
              continue
            fi
            filters+=("package(=$package)")
          done < "$RUNNER_TEMP/rust-fast-run.tsv"
          if [[ "${#filters[@]}" -eq 0 ]]; then
            exit 0
          fi
          expression="$(IFS='|'; echo "${filters[*]}")"
          cargo +1.99.1 nextest list --locked --workspace --lib --bins \
            --config-file "$RUNNER_TEMP/nextest.toml" --profile rust-fast -E "$expression" \
            --message-format json < /dev/null > "$plan/listing.json"
          python3 -I - "$plan" "$SHARD" "$RUNNER_TEMP/nextest.toml" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          plan = pathlib.Path(sys.argv[1])
          match = re.fullmatch(r'([1-9][0-9]*)/([1-9][0-9]*)', sys.argv[2])
          if match is None or int(match.group(1)) > int(match.group(2)):
              raise SystemExit(f'invalid shard {sys.argv[2]!r}')
          index, total = int(match.group(1)) - 1, int(match.group(2))
          # Seconds per test in the three hosted shards of run 40843550148 (every test of the
          # workspace, at least ten seconds); every other test took 0.1 s on average.
          slow = {
              'oteryn-client play::tests::feature_local_world_view::the_map_is_drawn_only_on_the_join_floor': 17,
              'oteryn-client scene::tests::the_start_area_draws_real_sprites_around_the_player': 10,
              'oteryn-game-server bundle_spawn_owner_tests::a_bundle_spawned_rat_killed_by_a_lethal_hit_respawns_on_the_owner_turn': 41,
              'oteryn-game-server node::serve::tests::map_cutover_b_a_bundle_with_items_boots_from_the_active_generation': 42,
              'oteryn-gameplay-characters crystal_parity_tests::c14_health_and_mana_level_gains_equal_crystal_vocation_gains': 11,
              'oteryn-gameplay-combat-rules attack::parity_tests::selected_weapons_have_the_catalogue_attack_or_are_listed': 37,
              'oteryn-gameplay-content content::cw2_b1_import::donor_identity_epoch_2_tests::only_no_match_rows_mint_and_aliases_bind_to_existing_keys': 12,
              'oteryn-gameplay-content content::native_gameplay::tests::caller_artifact_activates_full_book_under_outer_pin_without_changing_baseline': 15,
              'oteryn-gameplay-content content::native_gameplay::tests::cosmetics_activation_uses_independent_outer_issuance_and_keeps_previous_generation': 19,
              'oteryn-gameplay-content content::native_gameplay::tests::cosmetics_v9_decodes_exact_view_and_legacy_framing_cannot_hide_section': 27,
              'oteryn-gameplay-content content::native_gameplay::tests::explicit_v4_profiles_activate_and_bind_training_revision_and_appearance': 13,
              'oteryn-gameplay-content content::native_gameplay::tests::item_key_set_section_is_pinned_digest_bound_and_absent_or_empty_offers_no_index': 19,
              'oteryn-gameplay-content content::native_gameplay::tests::item_spell_augments_artifact_roundtrip_and_bounds': 17,
              'oteryn-gameplay-content content::native_gameplay::tests::loot_section_selects_v8_and_builds_the_reward_table': 25,
              'oteryn-gameplay-content content::native_gameplay::tests::production_manifest_activates_with_the_rat_reward_row': 36,
              'oteryn-gameplay-content content::native_gameplay::tests::ranged_profiles_survive_native_artifact_and_incomplete_weapon_is_rejected': 11,
              'oteryn-gameplay-content content::native_gameplay::tests::substituted_source_revision_and_incomplete_creature_data_are_rejected': 12,
              'oteryn-gameplay-content content::native_gameplay::tests::summer_corpse_capacity_reward_admission_accepts_thirty_and_refuses_thirty_one': 14,
              'oteryn-gameplay-content content::native_gameplay::tests::v6_progression_section_is_pinned_strict_and_older_pins_carry_none': 11,
              'oteryn-gameplay-content content::native_gameplay::tests::writable_profiles_survive_native_artifact_and_preserve_definition_admission': 29,
              'oteryn-gameplay-content content::reference_artifact::typed_item_codec_tests::bed_set_admits_a_matching_occupied_target_at_compile_and_load': 26,
              'oteryn-gameplay-content content::reference_artifact::typed_item_codec_tests::bed_set_refuses_an_occupied_target_with_another_direction': 45,
              'oteryn-gameplay-content content::reference_artifact::typed_item_codec_tests::bed_set_refuses_an_occupied_target_with_another_part': 25,
              'oteryn-gameplay-content content::reference_artifact::typed_item_codec_tests::bed_set_refuses_an_occupied_target_without_the_bed_group': 45,
              'oteryn-gameplay-content content::reference_artifact::typed_item_codec_tests::compiler_writes_only_v7_and_v4_to_v6_artifacts_still_decode_under_their_profile': 110,
              'oteryn-gameplay-content content::reference_artifact::typed_item_codec_tests::cross_item_target_slots_are_13_in_v6_and_15_in_v7': 12,
              'oteryn-gameplay-dispatch gameplay_transport::attack::gate_tests::a_gate_in_the_runtime_condition_slot_refuses_a_cast_as_well': 28,
              'oteryn-gameplay-dispatch gameplay_transport::attack::gate_tests::applying_pacified_clears_the_held_target_before_any_read_or_swing': 13,
              'oteryn-gameplay-dispatch gameplay_transport::attack::tests::a_held_actor_bitten_to_death_ends_the_hold_with_its_death_recorded_for_release': 11,
              'oteryn-gameplay-dispatch gameplay_transport::attack::tests::a_rat_in_a_protection_zone_and_an_attacker_in_one_are_refused': 19,
              'oteryn-gameplay-dispatch gameplay_transport::attack::tests::a_visible_rat_is_held_and_a_new_target_starts_its_own_lineage_at_ordinal_zero': 10,
              'oteryn-gameplay-dispatch gameplay_transport::attack::tests::an_ended_connection_and_a_mode_change_leave_the_chase_search_ordering': 17,
              'oteryn-gameplay-dispatch gameplay_transport::attack::tests::attack_chase_budget_tests::resumed_drains_keep_planned_occupancy_in_both_caller_orders_before_and_after_commit': 145,
