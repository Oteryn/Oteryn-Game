          # The slow tests, longest first, each to the least-loaded shard. Whether they are listed
          # or not, so a test's shard never depends on which other crates this run selected.
          load, slow_shard = [0] * total, {}
          for key in sorted(slow, key=lambda key: (-slow[key], key)):
              share = min(range(total), key=lambda i: (load[i], i))
              slow_shard[key] = share
              load[share] += slow[key]

          listing = json.loads((plan / 'listing.json').read_text(encoding='utf-8'))
          cases = sorted(
              (suite['binary-id'], name)
              for suite in listing['rust-suites'].values()
              for name, case in suite['testcases'].items()
              if case['filter-match']['status'] == 'matches'
          )
          shares = [[] for _ in range(total)]
          rest = {}
          for binary, name in cases:
              key = f'{binary} {name}'
              if key in slow_shard:
                  shares[slow_shard[key]].append((binary, name))
              else:
                  rest.setdefault(binary, []).append(name)
          # Equal estimates within one binary, starting at a shard fixed by the binary's name.
          for binary, names in rest.items():
              start = int(hashlib.sha256(binary.encode('utf-8')).hexdigest(), 16) % total
              for position, name in enumerate(sorted(names)):
                  shares[(start + position) % total].append((binary, name))
          assigned = sorted(case for share in shares for case in share)
          if assigned != cases or len(set(cases)) != len(cases):
              raise SystemExit('the plan does not run every listed test exactly once')

          mine = sorted(shares[index])
          estimate = sum(slow.get(f'{b} {n}', 0.1) for b, n in mine)
          print(f'shard {index + 1}/{total}: {len(mine)} of {len(cases)} tests, estimate {estimate:.0f}s')
          for share, members in enumerate(shares):
              print(f'- shard {share + 1}: {len(members)} tests, estimate '
                    f"{sum(slow.get(f'{b} {n}', 0.1) for b, n in members):.0f}s")
          (plan / 'filters.txt').write_text(
              ''.join(f'binary_id(={b}) & test(={n})\n' for b, n in mine), encoding='utf-8'
          )
          # The long tests start first, so none of them begins near the end of the shard.
          with open(sys.argv[3], 'a', encoding='utf-8') as config:
              for b, n in mine:
                  seconds = slow.get(f'{b} {n}')
                  if seconds is not None:
                      config.write(
                          f"\n[[profile.rust-fast.overrides]]\nfilter = 'binary_id(={b}) & test(={n})'\n"
                          f'priority = {min(100, seconds)}\n'
                      )
          PY

      # Runs exactly the planned share of this shard, one filterset per test. An empty share runs
      # nothing. Exit code 100 means test failures with every binary run, so the JUnit report then
      # names the passed crates.
      - name: Unit-test changed crates (nextest shard ${{ matrix.shard }})
        id: nextest
        if: matrix.kind == 'tests' && steps.jr_hit.outputs.hit != 'true'
        run: |
          set -euo pipefail
          filters=()
          while IFS= read -r filter; do
            filters+=(-E "$filter")
          done < "$RUNNER_TEMP/nextest-plan/filters.txt"
          if [[ "${#filters[@]}" -eq 0 ]]; then
            echo 'code=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=0
          cargo +1.99.1 nextest run --locked --workspace --lib --bins \
            --config-file "$RUNNER_TEMP/nextest.toml" --profile rust-fast "${filters[@]}" \
            --no-tests=fail --no-fail-fast < /dev/null || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Record passed crates in the job-result ledger
        id: jr_record
        if: >-
          always() && steps.jr_plan.outputs.keyed == 'true' && steps.jr_hit.outputs.hit == 'false'
          && (steps.clippy.outcome == 'success'
              || steps.nextest.outputs.code == '0' || steps.nextest.outputs.code == '100')
        env:
          KIND: ${{ matrix.kind }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == 'tests' ]]; then
            junit="${CARGO_TARGET_DIR:-target}/nextest/rust-fast/junit.xml"
            if [[ ! -f "$junit" ]]; then
              printf '<testsuites/>\n' > "$RUNNER_TEMP/empty-junit.xml"
              junit="$RUNNER_TEMP/empty-junit.xml"
            fi
            python -I tools/repository/job_result_key.py junit-passed --junit "$junit" --packages "$RUNNER_TEMP/rust-fast-run.tsv" --out "$RUNNER_TEMP/rust-fast-passed.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            python -I tools/repository/job_result_key.py record --plan "$RUNNER_TEMP/jr-plan.json" --dir "$RUNNER_TEMP/jobresult" --passed "$RUNNER_TEMP/rust-fast-passed.txt"
          else
            python -I tools/repository/job_result_key.py record --plan "$RUNNER_TEMP/jr-plan.json" --dir "$RUNNER_TEMP/jobresult" --packages "$RUNNER_TEMP/rust-fast-run.tsv"
          fi

      - name: Save job-result ledger
        if: always() && steps.jr_record.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: job-result-ledger-v1-rust_fast-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}

  rust_supply_chain:
    name: Merge gate / Rust supply chain
    needs: [scope, lanes]
    if: needs.lanes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      # Job-result cache (pull-request gate only; Merge Queue never caches). The key hashes
      # every input this job can read; a hit means the same job already succeeded on
      # identical inputs for this pull request. Failures are never recorded.
      - name: Compute job-result key
        id: jr_key
        env:
          JOB: rust_supply_chain
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: python -I tools/repository/job_result_key.py key --job "$JOB" --mode rust-workspace --extra "base=$BASE_SHA" --extra "image=${ImageVersion:-unknown}" --extra "os=${RUNNER_OS:-}-${RUNNER_ARCH:-}" --extra "advisory-day=$(date -u +%F)"

      - name: Restore job-result marker
        id: jr_restore
        if: steps.jr_key.outputs.key != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: ${{ steps.jr_key.outputs.key }}

      - name: Evaluate job-result marker
        id: jr_hit
        env:
          KEY: ${{ steps.jr_key.outputs.key }}
        run: python -I tools/repository/job_result_key.py verify --key "$KEY" --dir "$RUNNER_TEMP/jobresult"

      - name: Check advisories licenses bans and sources
        if: steps.jr_hit.outputs.hit != 'true'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # cargo-deny 0.20.2
        with:
          rust-version: '1.99.1'
          command: check
          arguments: --all-features

      - name: Record job-result marker
        if: success() && steps.jr_key.outputs.key != '' && steps.jr_hit.outputs.hit != 'true'
        env:
          KEY: ${{ steps.jr_key.outputs.key }}
        run: python -I tools/repository/job_result_key.py marker --key "$KEY" --dir "$RUNNER_TEMP/jobresult"

      - name: Save job-result marker
        if: success() && steps.jr_key.outputs.key != '' && steps.jr_hit.outputs.hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jobresult
          key: ${{ steps.jr_key.outputs.key }}

  validate:
    name: Merge gate / validate
    if: always() && (github.event.pull_request.base.ref == 'main' || !github.event.pull_request.base.ref)
    needs: [scope, lanes, governance, dependency_review, routing_contract, world_bundle, rust_policy, rust_fast, rust_supply_chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every applicable fast gate
        env:
          SCOPE: ${{ needs.scope.result }}
          LANES: ${{ needs.lanes.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          ROUTING_CONTRACT: ${{ needs.routing_contract.result }}
          RUST_REQUIRED: ${{ needs.lanes.outputs.rust }}
          WINDOWS_REQUIRED: ${{ needs.lanes.outputs.windows }}
          RUST_POLICY: ${{ needs.rust_policy.result }}
          RUST_FAST: ${{ needs.rust_fast.result }}
          RUST_SUPPLY_CHAIN: ${{ needs.rust_supply_chain.result }}
          WORLD_BUNDLE_REQUIRED: ${{ needs.lanes.outputs.world_bundle }}
          WORLD_BUNDLE: ${{ needs.world_bundle.result }}
        run: |
          python - <<'PY'
          import os
          import sys

          failures: list[str] = []
          for name in ('SCOPE', 'LANES', 'GOVERNANCE', 'DEPENDENCY_REVIEW', 'ROUTING_CONTRACT'):
              if os.environ[name] != 'success':
                  failures.append(f'{name}={os.environ[name]}')
          for flag in ('RUST_REQUIRED', 'WINDOWS_REQUIRED'):
              if os.environ[flag] not in {'true', 'false'}:
                  failures.append(f'invalid {flag}={os.environ[flag]}')
          if os.environ['RUST_REQUIRED'] == 'false' and os.environ['WINDOWS_REQUIRED'] == 'true':
              failures.append('Windows selection without Rust selection is invalid')
          rust_allowed = {'success'} if os.environ['RUST_REQUIRED'] == 'true' else {'success', 'skipped'}
          for name in ('RUST_POLICY', 'RUST_FAST', 'RUST_SUPPLY_CHAIN'):
              if os.environ[name] not in rust_allowed:
                  failures.append(f'{name}={os.environ[name]}')
          # Preserve fail-closed World qualification on the PR. Its measured
          # two-minute pin-check is a fast check, independent of heavy MQ tests.
          world_allowed = {'success', 'skipped'} if os.environ.get('WORLD_BUNDLE_REQUIRED', '') == 'false' else {'success'}
          if os.environ['WORLD_BUNDLE'] not in world_allowed:
              failures.append(f"WORLD_BUNDLE={os.environ['WORLD_BUNDLE']}")
          if failures:
              print('Merge gate failed:', file=sys.stderr)
              for failure in failures:
                  print(f'- {failure}', file=sys.stderr)
              raise SystemExit(1)
          print('All applicable fast gates passed on the exact PR head; full qualification belongs to Merge Queue.')
          PY

  game_gate:
    name: game-gate
    if: always() && (github.event.pull_request.base.ref == 'main' || !github.event.pull_request.base.ref)
    needs: [scope, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Require canonical aggregate success
        env:
          LEGACY_VALIDATE: ${{ needs.validate.result }}
        run: test "$LEGACY_VALIDATE" = "success"
      - name: Revalidate isolated edit target before publishing game-gate
        if: github.event.action == 'edited' && github.event.changes.base == null
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
          EXPECTED_BASE: ${{ needs.scope.outputs.base_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ['REPOSITORY']
          number = os.environ['PR_NUMBER']
          expected_head = os.environ['EXPECTED_HEAD']
          expected_base = os.environ['EXPECTED_BASE']
          if re.fullmatch(r'[1-9][0-9]*', number) is None or any(
              re.fullmatch(r'[0-9a-f]{40}', sha) is None for sha in (expected_head, expected_base)
          ):
              raise SystemExit('isolated edit has invalid scope identity')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls/{number}',
              headers={'Accept': 'application/vnd.github+json',
                       'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                       'X-GitHub-Api-Version': '2022-11-28'},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)
          if (pull.get('number') != int(number) or pull.get('state') != 'open'
              or pull.get('head', {}).get('sha') != expected_head
              or pull.get('head', {}).get('repo', {}).get('full_name') != repository
              or pull.get('base', {}).get('ref') != 'main'
              or pull.get('base', {}).get('sha') != expected_base):
              raise SystemExit('isolated edit target changed after qualification; current qualification is required')
          print('Isolated edit still matches the qualified live head and base.')
          PY
