              'oteryn-gameplay-npc npc_promotion::tests::henricus_requires_his_own_service_and_selects_the_inquisition_offer': 29,
              'oteryn-gameplay-npc npc_promotion::tests::promotion_and_premium_blessing_services_require_the_npcs_own_declarations': 31,
              'oteryn-gameplay-npc npc_talk::summer_dialogue_tests::summer_population_lore_book_retains_only_literal_admitted_topics': 50,
              'oteryn-gameplay-spell spell::spell_presentations::tests::ordinary_passive_cue_all_seven_actual_builders_qualify_accepted_focus_binding': 11,
