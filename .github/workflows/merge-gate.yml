name: Merge gate

run-name: >-
  Merge gate • ${{ github.event_name }} •
  ${{ github.event.pull_request.number || github.event.inputs.pull_request_number || github.ref_name }}

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Open PR number whose exact head should be recovered'
        required: true
        type: string
      expected_head_sha:
        description: 'Exact 40-character PR head SHA; dispatch the workflow from that PR head branch'
        required: true
        type: string

permissions: {}

concurrency:
  group: merge-gate-${{ github.event.pull_request.number || github.event.inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Merge gate / scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.detect.outputs.pr_number }}
      target_sha: ${{ steps.detect.outputs.target_sha }}
      base_sha: ${{ steps.detect.outputs.base_sha }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - name: Resolve and validate exact pull request head
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH_PR_NUMBER: ${{ github.event.inputs.pull_request_number }}
          DISPATCH_EXPECTED_HEAD_SHA: ${{ github.event.inputs.expected_head_sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          event_name = os.environ['EVENT_NAME']
          repository = os.environ['REPOSITORY']
          errors: list[str] = []

          def normalize_labeled_input(raw: str, label: str) -> str:
              value = raw.strip()
              prefix = f'{label}:'
              if value.lower().startswith(prefix.lower()):
                  value = value[len(prefix):].strip()
              return value

          if event_name == 'workflow_dispatch':
              number_text = normalize_labeled_input(
                  os.environ.get('DISPATCH_PR_NUMBER', ''), 'pull_request_number'
              )
              expected_head = normalize_labeled_input(
                  os.environ.get('DISPATCH_EXPECTED_HEAD_SHA', ''), 'expected_head_sha'
              ).lower()
              event_sha = os.environ.get('EVENT_SHA', '').strip().lower()
              if event_sha != expected_head:
                  errors.append(
                      'workflow dispatch ref does not resolve to expected_head_sha; '
                      'dispatch from the exact unchanged PR head branch'
                  )
          else:
              number_text = os.environ.get('EVENT_PR_NUMBER', '').strip()
              expected_head = os.environ.get('EVENT_PR_HEAD_SHA', '').strip().lower()

          if re.fullmatch(r'[1-9][0-9]*', number_text) is None:
              errors.append('pull_request_number must be a positive integer')
          if re.fullmatch(r'[0-9a-f]{40}', expected_head) is None:
              errors.append('expected_head_sha must be a full lowercase 40-character SHA')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls/{number_text}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Oteryn-v2-merge-gate',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          state = pull.get('state', '')
          head_sha = pull.get('head', {}).get('sha', '').lower()
          head_repository = pull.get('head', {}).get('repo', {}).get('full_name', '')
          base_ref = pull.get('base', {}).get('ref', '')
          base_sha = pull.get('base', {}).get('sha', '').lower()

          if state != 'open':
              errors.append('merge-gate validation requires an open pull request')
          if head_sha != expected_head:
              errors.append('pull request head moved after expected_head_sha was resolved')
          if head_repository != repository:
              errors.append('merge gate only accepts same-repository pull request heads')
          if base_ref != 'main':
              errors.append('merge gate only accepts pull requests targeting main')
          if re.fullmatch(r'[0-9a-f]{40}', base_sha) is None:
              errors.append('pull request base SHA is invalid')

          files: list[str] = []
          page = 1
          while not errors:
              files_request = urllib.request.Request(
                  f'https://api.github.com/repos/{repository}/pulls/{number_text}/files?per_page=100&page={page}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Oteryn-v2-merge-gate',
                  },
              )
              with urllib.request.urlopen(files_request, timeout=30) as response:
                  batch = json.load(response)
              files.extend(item['filename'] for item in batch)
              if len(batch) < 100:
                  break
              page += 1

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)

          exact = {
              'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'rustfmt.toml',
              'deny.toml', 'workspace-boundaries.toml',
              '.github/workflows/rust.yml', '.github/workflows/merge-gate.yml',
          }
          prefixes = ('apps/', 'crates/', 'tests/', 'tools/', 'docs/migration/')
          rust = any(path in exact or path.startswith(prefixes) for path in files)

          print(f'Validated PR #{number_text} exact head {head_sha} against base {base_sha}.')
          print('Changed files:')
          for path in files:
              print(f'- {path}')
          print(f'Rust/workspace validation required: {rust}')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'pr_number={number_text}\n')
              output.write(f'target_sha={head_sha}\n')
              output.write(f'base_sha={base_sha}\n')
              output.write(f"rust={'true' if rust else 'false'}\n")
          PY

  governance:
    name: Merge gate / governance
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify pull request metadata
        env:
          EXPECTED_HEAD: ${{ needs.scope.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
          PULL_NUMBER: ${{ needs.scope.outputs.pr_number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          repository = os.environ['REPOSITORY']
          number = os.environ['PULL_NUMBER']
          expected_head = os.environ['EXPECTED_HEAD']
          errors: list[str] = []

          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/pulls/{number}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'Oteryn-v2-merge-gate',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          title = pull.get('title', '')
          body = pull.get('body') or ''
          head_sha = pull.get('head', {}).get('sha', '')
          head_repository = pull.get('head', {}).get('repo', {}).get('full_name', '')
          base_ref = pull.get('base', {}).get('ref', '')
          state = pull.get('state', '')

          if state != 'open':
              errors.append('merge gate requires an open pull request')
          if head_sha != expected_head:
              errors.append('pull request head moved after scope validation')
          if head_repository != repository:
              errors.append('merge gate only accepts same-repository pull request heads')
          if base_ref != 'main':
              errors.append('merge gate only accepts pull requests targeting main')

          pattern = re.compile(
              r'^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)'
              r'(\([a-z0-9][a-z0-9._/-]*\))?!?: [A-Za-z0-9].+$'
          )
          if len(title) > 72:
              errors.append('PR title must be at most 72 characters')
          if not pattern.fullmatch(title):
              errors.append('PR title must follow type(scope): imperative summary')
          for heading in ('## Summary', '## Scope', '## Validation'):
              if heading not in body:
                  errors.append(f'PR body is missing {heading}')

          if errors:
              for error in errors:
                  print(f'- {error}', file=sys.stderr)
              raise SystemExit(1)
          print(f'Validated PR metadata for exact head {head_sha}.')
          PY

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ needs.scope.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate agent governance
        run: python tools/agents/validate_governance.py

      - name: Validate repository policy
        run: python tools/repository/validate_repository_policy.py

  dependency_review:
    name: Merge gate / dependency review
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          base-ref: ${{ needs.scope.outputs.base_sha }}
          head-ref: ${{ needs.scope.outputs.target_sha }}

  codeql:
    name: Merge gate / CodeQL (${{ matrix.language }})
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - python
          - actions
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:${{ matrix.language }}

  rust_policy:
    name: Merge gate / Rust policy and metadata
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Verify locked metadata
        run: cargo +1.94.0 metadata --locked --format-version 1 >/dev/null

      - name: Verify formatting
        run: cargo +1.94.0 fmt --all --check

      - name: Verify machine workspace boundaries
        run: cargo +1.94.0 run --locked -p oteryn-architecture-check -- workspace .

      - name: Verify migration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('docs/migration/rust-client-provenance.json'),
              Path('docs/migration/rust-client-path-map.json'),
              Path('docs/migration/rust-dependency-delta.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: PASS')
          PY

      - name: Verify production closure negatives
        run: |
          cargo +1.94.0 tree --locked -p oteryn-client --edges normal,build > production-tree.txt
          python - <<'PY'
          from pathlib import Path
          tree = Path('production-tree.txt').read_text(encoding='utf-8')
          forbidden = (
              'protocol-canary', 'protocol-core', 'protocol-oteryn',
              'transport', 'game-session', 'oteryn-client-domain',
              'oteryn-client-simulation', 'oteryn-synthetic-assets',
              'oteryn-test-support', 'oteryn-synthetic-client-harness',
          )
          found = [name for name in forbidden if name in tree]
          if found:
              raise SystemExit(f'forbidden production closure entries: {found}')
          print('production closure: PASS')
          PY

  rust_linux:
    name: Merge gate / Rust Linux workspace
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build workspace
        run: cargo +1.94.0 build --locked --workspace --all-targets

      - name: Strict Clippy
        run: cargo +1.94.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo +1.94.0 test --locked --workspace

      - name: Run synthetic harness
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness

  rust_windows:
    name: Merge gate / Rust Windows client
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build production client
        shell: pwsh
        run: cargo +1.94.0 build --locked --release -p oteryn-client --target x86_64-pc-windows-msvc

      - name: Strict client Clippy
        shell: pwsh
        run: cargo +1.94.0 clippy --locked -p oteryn-client --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Launch visible pre-native shell smoke
        shell: pwsh
        run: cargo +1.94.0 run --locked -p oteryn-client --target x86_64-pc-windows-msvc -- --smoke

      - name: Run synthetic harness
        shell: pwsh
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness

  rust_supply_chain:
    name: Merge gate / Rust supply chain
    needs: scope
    if: needs.scope.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.scope.outputs.target_sha }}
          persist-credentials: false

      - name: Check advisories licenses bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # cargo-deny 0.20.2
        with:
          rust-version: '1.94.0'
          command: check
          arguments: --all-features

  validate:
    name: Merge gate / validate
    if: always()
    needs:
      - scope
      - governance
      - dependency_review
      - codeql
      - rust_policy
      - rust_linux
      - rust_windows
      - rust_supply_chain
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every applicable gate
        env:
          SCOPE: ${{ needs.scope.result }}
          GOVERNANCE: ${{ needs.governance.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency_review.result }}
          CODEQL: ${{ needs.codeql.result }}
          RUST_REQUIRED: ${{ needs.scope.outputs.rust }}
          RUST_POLICY: ${{ needs.rust_policy.result }}
          RUST_LINUX: ${{ needs.rust_linux.result }}
          RUST_WINDOWS: ${{ needs.rust_windows.result }}
          RUST_SUPPLY_CHAIN: ${{ needs.rust_supply_chain.result }}
        run: |
          python - <<'PY'
          import os
          import sys

          failures: list[str] = []
          for name in ('SCOPE', 'GOVERNANCE', 'DEPENDENCY_REVIEW', 'CODEQL'):
              if os.environ[name] != 'success':
                  failures.append(f'{name}={os.environ[name]}')

          rust_required = os.environ['RUST_REQUIRED'] == 'true'
          rust = ('RUST_POLICY', 'RUST_LINUX', 'RUST_WINDOWS', 'RUST_SUPPLY_CHAIN')
          if rust_required:
              for name in rust:
                  if os.environ[name] != 'success':
                      failures.append(f'{name}={os.environ[name]}')
          else:
              for name in rust:
                  if os.environ[name] not in {'success', 'skipped'}:
                      failures.append(f'{name}={os.environ[name]}')

          if failures:
              print('Merge gate failed:', file=sys.stderr)
              for failure in failures:
                  print(f'- {failure}', file=sys.stderr)
              raise SystemExit(1)
          print('All applicable merge gates passed on the exact pull request head.')
          PY
