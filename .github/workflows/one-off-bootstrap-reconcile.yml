name: One-off bootstrap lock reconcile

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  reconcile-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact bootstrap head with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Reconcile Cargo.lock exactly
        env:
          BOOTSTRAP_BASE_SHA: d9c5ef68e1c88b88b4782219051395eacb0f8e67
        run: |
          git show "$BOOTSTRAP_BASE_SHA:Cargo.lock" > Cargo.lock
          cargo +1.94.0 check --workspace

          python - <<'PY'
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          base_sha = os.environ['BOOTSTRAP_BASE_SHA']
          before = tomllib.loads(
              subprocess.check_output(['git', 'show', f'{base_sha}:Cargo.lock']).decode('utf-8')
          )
          after = tomllib.loads(Path('Cargo.lock').read_text(encoding='utf-8'))
          before_packages = before.get('package', [])
          after_packages = after.get('package', [])
          if len(after_packages) != len(before_packages) + 1:
              raise SystemExit(
                  f'lockfile package cardinality changed unexpectedly: '
                  f'{len(before_packages)} -> {len(after_packages)}'
              )
          unmatched = list(after_packages)
          for package in before_packages:
              try:
                  unmatched.remove(package)
              except ValueError as error:
                  raise SystemExit(
                      f'existing Cargo.lock package changed unexpectedly: '
                      f"{package.get('name')} {package.get('version')}"
                  ) from error
          if len(unmatched) != 1:
              raise SystemExit(f'expected exactly one new lock package, found {len(unmatched)}')
          added = unmatched[0]
          if added.get('name') != 'oteryn-game-server' or added.get('version') != '0.1.0':
              raise SystemExit(f'unexpected new lock package: {added}')
          if set(added.get('dependencies', [])) != {'oteryn-foundation', 'tokio'}:
              raise SystemExit(f'unexpected game-server lock dependencies: {added}')
          if 'source' in added or 'checksum' in added:
              raise SystemExit('workspace game-server lock entry unexpectedly has registry source/checksum')
          print('Cargo.lock delta: exactly one workspace package — PASS')
          PY

      - name: Commit Cargo.lock only
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          test -n "$TARGET_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git diff --cached --check
          git commit -m 'build(rust): reconcile bootstrap Cargo.lock'
          git push origin "HEAD:$TARGET_BRANCH"
