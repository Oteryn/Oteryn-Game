name: RDC Codex P2 repair

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-codex-p2-repair.yml

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Add regressions, prove RED, repair minimally, prove GREEN
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/agents/validate_remote_desktop_prompt_routing.py)" = "c5e983e3df2bf9907cd8507bf1a3a47f7621c1d2"
          test "$(git rev-parse HEAD:tools/agents/test_validate_remote_desktop_prompt_routing.py)" = "6820f60e4a882b70d4f98d65d632d3b95dd8c4e7"

          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/test_validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")
          marker = "\ndef main() -> int:\n"
          if marker not in text:
              raise SystemExit("test insertion marker missing")
          tests = r'''

def test_visible_raw_html_block_remote_desktop_authority_fails() -> None:
    text = (
        "# Prompt\n\n<div>\nUse Remote Desktop for routine Git inspection.\n</div>\n\n"
        + CANONICAL_PROMPT_SECTION
        + "\n"
    )
    assert_fail(text, "Remote Desktop policy text outside canonical section")


def test_surface_visible_raw_html_block_remote_desktop_authority_fails() -> None:
    text = (
        "# Surface\n\n<div>\nUse Remote Desktop for routine Git inspection.\n</div>\n\n"
        + SURFACE_SECTION
        + "\n"
    )
    assert_surface_fail(text, "Remote Desktop policy text outside canonical section")


def test_plural_direct_connectors_authorization_outside_section_fails() -> None:
    text = (
        "# Prompt\n\nDirect connectors are exempt from per-action authorization.\n\n"
        + CANONICAL_PROMPT_SECTION
        + "\n"
    )
    assert_fail(text, "Remote Desktop policy text outside canonical section")


def test_surface_plural_direct_tools_authorization_outside_section_fails() -> None:
    text = (
        "# Surface\n\nDirect tools need no host exception.\n\n"
        + SURFACE_SECTION
        + "\n"
    )
    assert_surface_fail(text, "Remote Desktop policy text outside canonical section")
'''
          text = text.replace(marker, tests + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/agents/test_validate_remote_desktop_prompt_routing.py
          git diff --cached --check
          git commit -m "test(agents): cover final Codex RDC bypasses"
          RED_SHA="$(git rev-parse HEAD)"
          echo "RED test-only head: ${RED_SHA}"

          python - <<'PY'
          import sys
          sys.path.insert(0, "tools/agents")
          import test_validate_remote_desktop_prompt_routing as tests

          expected_red = [
              "test_visible_raw_html_block_remote_desktop_authority_fails",
              "test_surface_visible_raw_html_block_remote_desktop_authority_fails",
              "test_plural_direct_connectors_authorization_outside_section_fails",
              "test_surface_plural_direct_tools_authorization_outside_section_fails",
          ]
          for name in expected_red:
              try:
                  getattr(tests, name)()
              except AssertionError as exc:
                  print(f"EXPECTED RED {name}: {exc}")
              else:
                  raise SystemExit(f"expected RED regression unexpectedly passed: {name}")
          PY
          git push origin HEAD:governance/remote-desktop-per-action-gate-237

          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          old_direct = r'\bdirect\s+(?:connector|tool)\b'
          new_direct = r'\bdirect\s+(?:connectors?|tools?)\b'
          if text.count(old_direct) != 2:
              raise SystemExit(f"expected two singular direct patterns, found {text.count(old_direct)}")
          text = text.replace(old_direct, new_direct)

          old_active = '''        if raw_html_until_blank:\n            if not raw.strip():\n                raw_html_until_blank = False\n            lines.append("")\n            continue\n'''
          new_active = '''        if raw_html_until_blank:\n            if not raw.strip():\n                raw_html_until_blank = False\n                lines.append("")\n            else:\n                visible, in_html_comment = _visible_markdown_line(raw, in_html_comment)\n                lines.append(visible)\n            continue\n'''
          if text.count(old_active) != 1:
              raise SystemExit("raw-html active-state patch anchor mismatch")
          text = text.replace(old_active, new_active, 1)

          old_start = '''                elif kind == "blank":\n                    raw_html_until_blank = True\n                lines.append("")\n                continue\n'''
          new_start = '''                elif kind == "blank":\n                    raw_html_until_blank = True\n                    visible, in_html_comment = _visible_markdown_line(raw, in_html_comment)\n                    lines.append(visible)\n                else:\n                    lines.append("")\n                continue\n'''
          if text.count(old_start) != 1:
              raise SystemExit("raw-html start-state patch anchor mismatch")
          text = text.replace(old_start, new_start, 1)

          path.write_text(text, encoding="utf-8")
          PY

          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/agents/validate_governance.py
          python tools/repository/validate_repository_policy.py
          git diff --check

          git add tools/agents/validate_remote_desktop_prompt_routing.py
          git diff --cached --check
          git commit -m "fix(agents): close final Codex RDC bypasses"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
          echo "GREEN implementation head: $(git rev-parse HEAD)"
