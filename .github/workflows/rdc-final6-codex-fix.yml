name: RDC final6 Codex fix

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-final6-codex-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact helper trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Apply bounded validator repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/agents/validate_remote_desktop_prompt_routing.py')
          text = path.read_text(encoding='utf-8')

          direct_anchor = '''    re.compile(
                  r"(?=.*\\bdirect\\s+(?:connectors?|tools?)\\b)"
                  r"(?=.*(?:\\b(?:blanket|standing|automatic|default)\\s+(?:approval|permission)\\b|"
                  r"\\b(?:approval|permission)\\s+by\\s+default\\b|\\bby\\s+default\\b.{0,160}\\b(?:approval|permission)\\b))",
                  re.IGNORECASE,
              ),'''
          direct_new = direct_anchor + '''
              re.compile(
                  r"(?=.*\\bdirect\\s+(?:connectors?|tools?)\\b)"
                  r"(?=.*\\b(?:approval|permission)\\b)"
                  r"(?=.*(?:\\b(?:granted|given)\\b.{0,80}\\bby\\s+default\\b|"
                  r"\\bautomatically\\b.{0,80}\\b(?:granted|given)\\b|"
                  r"\\b(?:granted|given)\\b.{0,80}\\bautomatically\\b))",
                  re.IGNORECASE,
              ),'''
          if text.count(direct_anchor) != 1:
              raise SystemExit(f'unexpected direct connector matcher count: {text.count(direct_anchor)}')
          text = text.replace(direct_anchor, direct_new)

          ping_old = '''    re.compile(
                  r"(?=.*\\bping\\b)"
                  r"(?=.*\\b(?:automatically\\s+(?:authori[sz]ed|approved)|preauthori[sz]ed|preapproved|"
                  r"(?:blanket|standing|automatic|default)\\s+(?:approval|permission)|"
                  r"(?:approval|permission)\\s+(?:is\\s+)?(?:granted|given)\\s+by\\s+default|"
                  r"(?:approval|permission)\\s+by\\s+default)\\b)",
                  re.IGNORECASE,
              ),'''
          ping_new = '''    re.compile(
                  r"(?=.*\\bping\\b)"
                  r"(?=.*\\b(?:automatically\\s+(?:authori[sz]ed|approved)|preauthori[sz]ed|preapproved|"
                  r"(?:blanket|standing|automatic|default)\\s+(?:approval|permission|authori[sz]ation)|"
                  r"(?:approval|permission|authori[sz]ation)\\s+(?:is\\s+)?(?:granted|given)\\s+by\\s+default|"
                  r"(?:approval|permission|authori[sz]ation)\\s+by\\s+default)\\b)",
                  re.IGNORECASE,
              ),'''
          if text.count(ping_old) != 1:
              raise SystemExit(f'unexpected ping authority matcher count: {text.count(ping_old)}')
          text = text.replace(ping_old, ping_new)

          passive_provider_old = r'(?:stopped|refused)\s+by\s+(?:the\s+)?(?:connectors?|routers?|transports?|providers?)'
          passive_provider_new = r'(?:stopped|refused)\s+(?:by|at)\s+(?:the\s+)?(?:connectors?|routers?|transports?|providers?)'
          if text.count(passive_provider_old) != 1:
              raise SystemExit(f'unexpected passive provider matcher count: {text.count(passive_provider_old)}')
          text = text.replace(passive_provider_old, passive_provider_new)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify repaired validator
        shell: bash
        run: |
          set -euo pipefail
          python tools/agents/validate_governance.py
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check
      - name: Remove one-shot helper and publish repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/rdc-final6-codex-fix.yml
          git add tools/agents/validate_remote_desktop_prompt_routing.py
          python - <<'PY'
          import subprocess
          allowed = {
              '.github/workflows/rdc-final6-codex-fix.yml',
              'tools/agents/validate_remote_desktop_prompt_routing.py',
          }
          changed = set(subprocess.check_output(['git','diff','--cached','--name-only'], text=True).splitlines())
          if changed != allowed:
              raise SystemExit(f'unexpected staged paths: {sorted(changed)}')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(agents): close final RDC wording variants'
          remote_head="$(git ls-remote origin refs/heads/governance/remote-desktop-per-action-gate-237 | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
