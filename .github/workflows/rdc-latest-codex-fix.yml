name: RDC latest Codex fix

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/rdc-latest-codex-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: governance/remote-desktop-per-action-gate-237
          fetch-depth: 0

      - name: Apply bounded validator repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/validate_remote_desktop_prompt_routing.py")
          text = path.read_text(encoding="utf-8")

          ping_anchor = '    re.compile(r"\\bping\\b.{0,100}\\b(?:capability|discover|connector|tool|host)\\b", re.IGNORECASE),\n'
          if text.count(ping_anchor) != 1:
              raise SystemExit("unexpected ping anchor count")
          additions = '''    re.compile(\n        r"(?=.*\\bdirect\\s+(?:connectors?|tools?)\\b)"\n        r"(?=.*\\b(?:(?:blanket|standing|automatic)\\s+(?:approval|permission)|(?:approval|permission)\\s+by\\s+default)\\b)",\n        re.IGNORECASE,\n    ),\n    re.compile(\n        r"(?=.*\\b(?:connectors?|routers?|transports?)\\b)"\n        r"(?=.*\\b(?:fail(?:s|ed|ing)?\\s+closed|deny|denies|denied|denying)\\b)"\n        r"(?=.*\\b(?:per[- ]action|decision|gate|routing|authori[sz]\\w*)\\b)",\n        re.IGNORECASE,\n    ),\n'''
          text = text.replace(ping_anchor, additions + ping_anchor, 1)

          old_url = 'r"(?:(?:https?:)?//)github\\.com/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json"'
          new_url = 'r"(?:(?:https?:)?//)(?:www\\.)?github\\.com/Oteryn/Oteryn/(?:blob|tree)/([^\\s`<>)]+?)/ecosystem/agent-execution-routing-policy\\.json"'
          if text.count(old_url) != 1:
              raise SystemExit("unexpected GitHub routing URL matcher count")
          text = text.replace(old_url, new_url, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify repaired validator
        run: |
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check

      - name: Remove one-shot helper and publish repair
        run: |
          rm .github/workflows/rdc-latest-codex-fix.yml
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/rdc-latest-codex-fix.yml' 'tools/agents/validate_remote_desktop_prompt_routing.py' | sort)"
          test "$changed" = "$expected"
          git config user.name "blakinio"
          git config user.email "75369544+blakinio@users.noreply.github.com"
          git add -A
          git commit -m "fix(agents): close latest Codex RDC bypasses"
          git push origin HEAD:governance/remote-desktop-per-action-gate-237
