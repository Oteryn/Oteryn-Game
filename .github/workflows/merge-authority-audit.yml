name: Merge authority audit

run-name: Merge authority audit • pull_request • ${{ github.event.pull_request.number }}

on:
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: merge-authority-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: Merge authority audit / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve exact pull request head
        id: resolve
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          number = os.environ['EVENT_PR_NUMBER'].strip()
          expected = os.environ['EVENT_PR_HEAD_SHA'].strip().lower()
          if re.fullmatch(r'[1-9][0-9]*', number) is None:
              raise SystemExit('invalid pull request number')
          if re.fullmatch(r'[0-9a-f]{40}', expected) is None:
              raise SystemExit('invalid expected head SHA')

          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}/pulls/{number}",
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version': '2026-03-10',
                  'User-Agent': 'Oteryn-v2-merge-authority-audit',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              pull = json.load(response)

          if pull.get('state') != 'open':
              raise SystemExit('audit requires an open pull request')
          if pull.get('head', {}).get('sha', '').lower() != expected:
              raise SystemExit('pull request head moved')
          if pull.get('head', {}).get('repo', {}).get('full_name') != os.environ['REPOSITORY']:
              raise SystemExit('audit accepts only same-repository PR heads')
          if pull.get('base', {}).get('ref') != 'main':
              raise SystemExit('audit accepts only PRs targeting main')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'target_sha={expected}\n')
          print(f'Auditing PR #{number} exact head {expected}.')
          PY

      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ steps.resolve.outputs.target_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Independently audit merge authority and adversarial mutations
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          workflow_path = Path('.github/workflows/merge-gate.yml')
          policy_path = Path('.github/repository-policy.json')
          validator_path = Path('tools/repository/validate_repository_policy.py')
          apply_path = Path('tools/repository/apply_github_settings.py')
          codeowners_path = Path('.github/CODEOWNERS')

          workflow = workflow_path.read_text(encoding='utf-8')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          apply_text = apply_path.read_text(encoding='utf-8')
          codeowners = codeowners_path.read_text(encoding='utf-8')

          expected_push_paths = [
              '.github/workflows/*',
              '.github/workflows/**/*',
              '.github/repository-policy.json',
              'tools/repository/*',
              'tools/repository/**/*',
          ]
          expected_codeowners = {
              '/.github/CODEOWNERS @blakinio',
              '/.github/workflows/ @blakinio',
              '/.github/repository-policy.json @blakinio',
              '/tools/repository/ @blakinio',
          }

          if policy.get('required_status_check') != 'Merge gate / validate':
              raise SystemExit('policy required status is not the aggregate merge gate')
          ruleset = policy.get('ruleset', {})
          if ruleset.get('target') != 'branch':
              raise SystemExit('Protect main must target branches')
          if ruleset.get('enforcement') != 'active' or ruleset.get('bypass_actors') != []:
              raise SystemExit('Protect main must be active with no bypass actors')

          status_rules = [r for r in ruleset.get('rules', []) if r.get('type') == 'required_status_checks']
          if len(status_rules) != 1:
              raise SystemExit('expected exactly one required-status rule')
          contexts = [
              item.get('context')
              for item in status_rules[0].get('parameters', {}).get('required_status_checks', [])
          ]
          if contexts != ['Merge gate / validate']:
              raise SystemExit(f'unexpected required contexts: {contexts!r}')
          if any(r.get('type') == 'file_path_restriction' for r in ruleset.get('rules', [])):
              raise SystemExit('branch ruleset must not contain file_path_restriction')

          pr_rules = [r for r in ruleset.get('rules', []) if r.get('type') == 'pull_request']
          if len(pr_rules) != 1:
              raise SystemExit('expected exactly one pull_request rule')
          pr = pr_rules[0].get('parameters', {})
          expected_pr = {
              'dismiss_stale_reviews_on_push': True,
              'require_code_owner_review': True,
              'require_last_push_approval': False,
              'required_approving_review_count': 0,
              'required_review_thread_resolution': True,
          }
          for key, expected in expected_pr.items():
              if pr.get(key) != expected:
                  raise SystemExit(f'Protect main pull_request {key} mismatch: {pr.get(key)!r}')

          protection = policy.get('control_plane_protection', {})
          if protection.get('public_repository_strategy') != 'required_code_owner_review':
              raise SystemExit('public repository control-plane fallback is not Code Owner review')
          if protection.get('push_ruleset_private_internal_only') is not True:
              raise SystemExit('policy must mark push rulesets private/internal-only')

          entries = {
              line.strip()
              for line in codeowners.splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }
          if entries != expected_codeowners:
              raise SystemExit(f'CODEOWNERS control-plane entries mismatch: {sorted(entries)!r}')
          if any(line.lstrip().startswith('* ') for line in codeowners.splitlines()):
              raise SystemExit('CODEOWNERS must not make ordinary PRs require owner approval')

          push_ruleset = policy.get('push_ruleset', {})
          if push_ruleset.get('target') != 'push':
              raise SystemExit('latent control-plane ruleset must target pushes')
          if push_ruleset.get('enforcement') != 'active' or push_ruleset.get('bypass_actors') != []:
              raise SystemExit('latent push ruleset must be active with no bypass actors')
          if 'conditions' in push_ruleset:
              raise SystemExit('push ruleset must not contain branch ref_name conditions')
          path_rules = [r for r in push_ruleset.get('rules', []) if r.get('type') == 'file_path_restriction']
          if len(path_rules) != 1:
              raise SystemExit('expected exactly one latent file_path_restriction rule')
          restricted = path_rules[0].get('parameters', {}).get('restricted_file_paths')
          if restricted != expected_push_paths:
              raise SystemExit(f'unexpected latent push-ruleset paths: {restricted!r}')

          for fragment in (
              'repository_supports_push_ruleset',
              'repo.get("visibility") in {"private", "internal"}',
              'remove_named_ruleset_if_present',
              'verify_codeowners_fallback',
              'public repository must not retain unsupported control-plane push ruleset',
          ):
              if fragment not in apply_text:
                  raise SystemExit(f'visibility-aware apply/readback missing fragment: {fragment}')

          if workflow.count('name: Merge gate / validate') != 1:
              raise SystemExit('aggregate required status name must be unique')
          if 'workflow_dispatch:' in workflow:
              raise SystemExit('merge gate must not execute PR code through workflow_dispatch')
          if "prefixes = ('.cargo/', 'apps/', 'crates/', 'tests/', 'tools/', 'docs/migration/')" not in workflow:
              raise SystemExit('Rust-sensitive path classifier is incomplete')
          if "previous_filename = item.get('previous_filename')" not in workflow:
              raise SystemExit('rename-source classification is missing')
          if "changed_files > 3000" not in workflow or "len(files) != changed_files" not in workflow:
              raise SystemExit('changed-file enumeration must fail closed')

          pristine_validator = subprocess.run(
              ['python', str(validator_path)], text=True, capture_output=True, check=False
          )
          if pristine_validator.returncode != 0:
              raise SystemExit(
                  'canonical repository validator failed on pristine exact head:\n'
                  + pristine_validator.stdout + pristine_validator.stderr
              )

          original_workflow = workflow

          def validator_must_reject(mutated: str, label: str) -> None:
              workflow_path.write_text(mutated, encoding='utf-8')
              try:
                  result = subprocess.run(
                      ['python', str(validator_path)], text=True, capture_output=True, check=False
                  )
                  if result.returncode == 0:
                      raise SystemExit(f'validator accepted adversarial mutation: {label}')
                  print(f'{label}: rejected as required')
              finally:
                  workflow_path.write_text(original_workflow, encoding='utf-8')

          rust_line = "rust = any(path in exact or path.startswith(prefixes) for path in classification_paths)"
          if rust_line not in original_workflow:
              raise SystemExit('canonical Rust classifier assignment not found')
          validator_must_reject(
              original_workflow.replace(rust_line, 'rust = False', 1),
              'scope producer forced rust=false',
          )

          aggregate_loop = "for name in ('SCOPE', 'GOVERNANCE', 'DEPENDENCY_REVIEW', 'CODEQL'):"
          if aggregate_loop not in original_workflow:
              raise SystemExit('canonical aggregate fail-closed loop not found')
          validator_must_reject(
              original_workflow.replace(aggregate_loop, 'for name in ():', 1),
              'aggregate always-required results bypassed',
          )

          trigger = "  pull_request:\n    branches:\n      - main\n"
          if trigger not in original_workflow:
              raise SystemExit('canonical pull_request trigger not found')
          validator_must_reject(
              original_workflow.replace(
                  trigger,
                  trigger + "    paths:\n      - 'docs/**'\n",
                  1,
              ),
              'merge gate path-filtered',
          )

          print(f"merge-gate sha256={hashlib.sha256(original_workflow.encode('utf-8')).hexdigest()}")
          print(f"repository-policy sha256={hashlib.sha256(policy_path.read_bytes()).hexdigest()}")
          print(f"repository-validator sha256={hashlib.sha256(validator_path.read_bytes()).hexdigest()}")
          print(f"repository-apply sha256={hashlib.sha256(apply_path.read_bytes()).hexdigest()}")
          print(f"CODEOWNERS sha256={hashlib.sha256(codeowners_path.read_bytes()).hexdigest()}")
          print('Independent deterministic merge-authority audit: PASS')
          PY
