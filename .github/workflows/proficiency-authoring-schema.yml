name: Proficiency Authoring Schema

on:
  pull_request:
    paths:
      - tools/content-schema/proficiency-authoring/**
      - imports/cipsoft-staticdata/proficiencies/**
      - content/proficiencies/**
      - content/project.json
      - content/manifest.json
      - content/content.lock.json
      - tools/content-schema/item-authoring/samples/item-weapon-proficiency-15-30-7fea90ec.json
      - .github/workflows/proficiency-authoring-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  proficiency-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/proficiency-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Candidate catalogue regenerates byte-identically from the staged 15.30 source
        run: python proficiency_authoring.py build --check

      - name: Validate the candidate catalogue
        run: python proficiency_authoring.py validate samples/proficiencies-candidate.json

      - name: Tests
        run: python test_proficiency_authoring.py

      - name: Ruff check and format
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        working-directory: .
        run: test -z "$(git status --short --untracked-files=all)"
