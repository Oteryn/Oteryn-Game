name: Spell Authoring Schema and Wiki Capture

on:
  pull_request:
    paths:
      - tools/content-schema/spell-authoring/**
      - tools/content-schema/monster-authoring/monster.schema.json
      - tools/content-schema/monster-authoring/monster-import-readiness.schema.json
      - .github/workflows/spell-wiki-capture.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    name: Spell authoring / schema and validator
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OTERYN_SPELL_SOURCE_ROOT: ${{ github.workspace }}/_sources
      OTERYN_SPELL_SOURCES: ${{ github.workspace }}/_sources
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/spell-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Read the source pins
        id: pins
        run: |
          set -euo pipefail
          python - >> "$GITHUB_OUTPUT" <<'PY'
          from convert_spells import SOURCES
          for name, source in SOURCES.items():
              print(f"{name}_repository={source['repository']}")
              print(f"{name}_revision={source['revision']}")
          PY

      - name: Check out the pinned Canary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.canary_repository }}
          ref: ${{ steps.pins.outputs.canary_revision }}
          path: _sources/canary
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
                data/scripts
                data/libs
                data/XML
                data/items
                data/global.lua
                src
                config.lua.dist

      - name: Check out the pinned Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.crystal_repository }}
          ref: ${{ steps.pins.outputs.crystal_revision }}
          path: _sources/crystal
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
                data/scripts
                data/libs
                data/XML
                data/items
                data/global.lua
                src
                config.lua.dist

      - name: Retrieve external completion test fixtures from pinned sources
        run: |
          set -euo pipefail
          python retrieve_completion_fixtures.py \
            --manifest "$GITHUB_WORKSPACE/docs/reference/spells/r21-local-candidate/external-fixture-inputs.json" \
            --checkout-root "$GITHUB_WORKSPACE" --sources "$GITHUB_WORKSPACE/_sources"

      - name: Regenerate schemas and template byte-identically
        run: |
          set -euo pipefail
          python build_formal_schema.py
          git diff --exit-code -- .

      - name: Focused schema, validator and tool checks
        run: |
          set -euo pipefail
          python verify_formal_schema.py
          git diff --exit-code -- .
          python validate_spell.py synthetic-valid-light-healing.json synthetic-valid-light-healing-dependencies.json \
            --catalog synthetic-catalog.json
          python spell_census.py self-test
          python wiki_spells.py self-test
          python tibiopedia_spells.py self-test
          python verify_spells.py self-test
          python tibiacom_spells.py self-test
          python vocation_vitals.py self-test
          for bundle in samples/starter-bundles/*/; do
            python validate_spell.py "$bundle/spell.json" "$bundle/dependencies.json" \
              --catalog "$bundle/catalog.json" --manifest "$bundle/manifest.json" > /dev/null
          done

  conversion:
    # The committed census, readiness report, verification report and starter bundles must be exactly what
    # the tools produce from the pinned Canary and Crystal commits (SOURCES in convert_spells.py).
    name: Spell authoring / conversion reproduces committed outputs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/spell-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Read the source pins
        id: pins
        run: |
          set -euo pipefail
          python - >> "$GITHUB_OUTPUT" <<'PY'
          from convert_spells import SOURCES
          for name, source in SOURCES.items():
              print(f"{name}_repository={source['repository']}")
              print(f"{name}_revision={source['revision']}")
          PY

      - name: Check out the pinned Canary source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.canary_repository }}
          ref: ${{ steps.pins.outputs.canary_revision }}
          path: _sources/canary
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
                data/scripts
                data/libs
                data/XML
                data/items
                data/global.lua
                src
                config.lua.dist

      - name: Check out the pinned Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pins.outputs.crystal_repository }}
          ref: ${{ steps.pins.outputs.crystal_revision }}
          path: _sources/crystal
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
                data/scripts
                data/libs
                data/XML
                data/items
                data/global.lua
                src
                config.lua.dist

      - name: Regenerate and compare
        env:
          CANARY: ${{ github.workspace }}/_sources/canary
          CRYSTAL: ${{ github.workspace }}/_sources/crystal
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/conversion"
          mkdir -p "$out"
          python spell_census.py --canary "$CANARY" --crystal "$CRYSTAL" --out "$out/census.json" > /dev/null
          cmp "$out/census.json" samples/spell-census-canary-99902524-crystal-ff7ede5.json
          python convert_spells.py --canary "$CANARY" --crystal "$CRYSTAL" \
            --readiness "$out/readiness.json" --out "$out/bundles" > /dev/null
          cmp "$out/readiness.json" samples/spell-readiness-p2.json
          python verify_spells.py --bundles "$out/bundles" --out "$out/verify.json" > /dev/null
          cmp "$out/verify.json" samples/spell-verify-3-sources-2026-09-28.json
          python convert_spells.py --canary "$CANARY" --crystal "$CRYSTAL" --out "$out/starter" \
            --only "cure poison" "energy strike" "great fireball rune" "ice strike" "intense healing" \
                   "light healing" "sudden death rune" "magic patch" "bruise bane" "wound cleansing" \
                   "ultimate healing" > /dev/null
          diff -r "$out/starter" samples/starter-bundles
          echo 'census, readiness, verification and starter bundles reproduce from the pinned sources'

  wiki-br:
    # TibiaWiki BR answers 403 (Cloudflare) from the build container; this job reads it from a hosted
    # runner. The artifact keeps infobox fields cut to 200 characters (effect and notes whole, up to 4000) and revision ids, never raw pages.
    name: Spell authoring / TibiaWiki BR capture
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/spell-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Capture current TibiaWiki BR spell and rune pages
        run: |
          set -euo pipefail
          python wiki_spells.py fetch --wiki br --cache "$RUNNER_TEMP/br"
          mkdir -p "$RUNNER_TEMP/out"
          python wiki_spells.py facts --wiki br --all-fields --cache "$RUNNER_TEMP/br" \
            --out "$RUNNER_TEMP/out/wiki-spell-infoboxes-br.json"
          python - "$RUNNER_TEMP/out/wiki-spell-infoboxes-br.json" <<'PY'
          import base64, gzip, json, sys
          doc = json.load(open(sys.argv[1], encoding='utf-8'))
          pages = doc['pages']
          assert doc['wiki'] == 'br' and pages, 'empty BR capture'
          assert all('content' not in p for p in pages), 'raw wikitext must not leave the runner'
          spells = sum(1 for p in pages if 'Infobox Spell' in p.get('infoboxes', {}))
          print(f"BR pages: {len(pages)}, with Infobox Spell: {spells}")
          # Public allowlisted facts only; retain artifact and provide a bounded log fallback.
          raw = json.dumps(doc, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          compressed = gzip.compress(raw, mtime=0)
          assert len(compressed) <= 1024 * 1024, 'BR factual log fallback exceeds 1 MiB'
          encoded = base64.b64encode(compressed).decode('ascii')
          assert gzip.decompress(base64.b64decode(encoded, validate=True)) == raw
          chunks = [encoded[i:i + 16000] for i in range(0, len(encoded), 16000)]
          for index, chunk in enumerate(chunks, 1):
              print(f"OTERYN_WIKI_BR_FACTS_GZIP_BASE64={index}/{len(chunks)}:{chunk}")
          PY

      - name: Upload BR infobox facts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spell-wiki-br-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/out/wiki-spell-infoboxes-br.json
          if-no-files-found: error
          retention-days: 14
