name: PR PostgreSQL harness

# Early signal only: runs the Merge Queue PostgreSQL harness on pull requests
# that can change what it runs (the game-server crate and its path
# dependencies), so its failures show before the queue.
# Grouped runs (owner decision 2026-10-28): the harness runs only on pull
# requests labelled `heavy-tests` - a finished mechanic, or one batch pull
# request that merges several finished ones - instead of on every push of
# every pull request. Adding the label starts a run; later pushes to a
# labelled pull request run it again. Protected main still runs every
# PostgreSQL lane after each merge (merge-group-gate.yml on push to main).
# It is not the PR gate (merge-gate.yml) and not a required check; the Merge
# Queue (merge-group-gate.yml) keeps the exact-candidate qualification and
# runs the full workspace suite and every PostgreSQL lane once (D1471). The
# build job keeps the Merge Queue custody checks and compiles the test set
# once into two nextest archives (the registered E2E targets and the
# PostgreSQL-backed library tests); the partition jobs only download the
# archives and run them against PostgreSQL, so nothing is compiled twice and
# the six count partitions together run every test exactly once.
#
# OTERYN_SELF_HOSTED_PG=on runs the six partitions on the Molehill runners
# against a throwaway native PostgreSQL 18 cluster per job instead of the
# hosted service container; turn it off or delete it when the PC is offline.
# Forks and Dependabot always stay hosted. The build job stays hosted: the
# test binaries embed its workspace path at compile time, so a Molehill
# partition exposes a checkout of the same head at that path (one head at a
# time; partitions of other heads wait for it to be released).

on:
  pull_request:
    branches:
      - main
    # Drafts are still being authored; the harness runs once the PR is ready.
    types: [opened, reopened, synchronize, ready_for_review, labeled]
    # Everything the game-server PostgreSQL targets link: the targets and the
    # library PostgreSQL tests exercise game-server code well beyond
    # durability/** (combat, pickup, transport, interaction, catalogues), so
    # the whole crate and its workspace path dependencies (including the
    # gameplay crates carved out of it) are in scope. The
    # lane is skipped only for PRs that cannot change what it runs.
    paths:
      - 'apps/game-server/**'
      - 'crates/gameplay/**'
      - 'crates/error-codes/**'
      - 'crates/foundation/**'
      - 'crates/ntp-clock/**'
      - 'crates/protocol-oteryn/**'
      - 'crates/session/**'
      - 'crates/session-tcp/**'
      - 'crates/simulation-determinism/**'
      - 'crates/world-bundle/**'
      - 'tools/dev-client/**'
      - 'tools/world-bundle-compiler/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'tools/repository/normalize_cargo_mtimes.py'
      - '.github/workflows/pr-postgres-harness.yml'

permissions: {}

concurrency:
  # Adding any other label must not cancel a running harness, so those
  # (skipped) runs get a group of their own.
  group: pr-postgres-harness-${{ github.event.pull_request.number }}${{ (github.event.action == 'labeled' && github.event.label.name != 'heavy-tests') && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  build:
    name: PR early signal / Durability PostgreSQL harness build
    # Early signal for authors only: drafts and Dependabot bumps wait for the
    # Merge Queue, which runs the same targets on the exact candidate. Only
    # pull requests labelled `heavy-tests` run it, and a `labeled` event only
    # when that label is the one added.
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && contains(github.event.pull_request.labels.*.name, 'heavy-tests')
      && (github.event.action != 'labeled' || github.event.label.name == 'heavy-tests')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      archives_sha256: ${{ steps.digest.outputs.archives_sha256 }}
      workspace: ${{ steps.digest.outputs.workspace }}
    # No database here: this job verifies target custody and compiles once; the partition jobs run the tests.
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact pull request head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Fetch exact pull request base for PostgreSQL custody
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$BASE_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal

      - name: Restore trimmed Cargo cache from protected main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-

      - name: Normalize source mtimes for the restored Cargo cache
        run: python tools/repository/normalize_cargo_mtimes.py

      - name: Verify locked metadata
        run: cargo +1.99.1 metadata --locked --format-version 1 >/dev/null

      # cargo-nextest 0.9.146, pinned by SHA-256 as in the Rust Linux legs.
      - name: Install pinned cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.146
          NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      # Every registered target present at the head is archived exactly once; any target removed or
      # renamed against the protected base fails here, before anything is compiled.
      - name: Archive registered PostgreSQL E2E targets
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          archived_targets=()
          verify_registered_target_binding() {
            local name="$1"
            local path="$2"
            local metadata
            metadata="$(mktemp)"
            cargo +1.99.1 metadata --locked --no-deps --format-version 1 > "$metadata"
            python - "$metadata" "$name" "$path" <<'PY'
          import json
          import pathlib
          import sys

          metadata_path, name, registered_path = sys.argv[1:]
          try:
              payload = json.loads(pathlib.Path(metadata_path).read_text(encoding='utf-8'))
              packages = payload['packages']
              if not isinstance(packages, list):
                  raise ValueError('packages is not a list')
              owners = [package for package in packages if package.get('name') == 'oteryn-game-server']
              if len(owners) != 1:
                  raise ValueError('expected exactly one oteryn-game-server package')
              expected_manifest = (pathlib.Path.cwd() / 'apps/game-server/Cargo.toml').resolve(strict=True)
              observed_manifest = pathlib.Path(owners[0]['manifest_path']).resolve(strict=True)
              if observed_manifest != expected_manifest:
                  raise ValueError(
                      f'package manifest is {observed_manifest}, expected {expected_manifest}'
                  )
              targets = owners[0].get('targets')
              if not isinstance(targets, list):
                  raise ValueError('package targets is not a list')
              matches = [target for target in targets if target.get('name') == name]
              global_matches = [target for package in packages for target in package.get('targets', []) if target.get('name') == name and target.get('kind') == ['test']]
              if len(global_matches) != 1:
                  raise ValueError('expected exactly one workspace integration-test target')
              if len(matches) != 1 or matches[0].get('kind') != ['test']:
                  raise ValueError('expected exactly one integration-test target')
              expected = (pathlib.Path.cwd() / registered_path).resolve(strict=True)
              observed = pathlib.Path(matches[0]['src_path']).resolve(strict=True)
              if observed != expected:
                  raise ValueError(f'target source is {observed}, expected {expected}')
          except (KeyError, OSError, TypeError, ValueError, json.JSONDecodeError) as error:
              raise SystemExit(f'Cargo target binding verification failed for {name}: {error}') from error
          PY
            rm -f "$metadata"
          }
          run_registered_target() {
            local name="$1"
            local path="$2"
            local base_present=false
            local head_present=false
            local object_type

            if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
              object_type="$(git cat-file -t "$BASE_SHA:$path")"
              [[ "$object_type" == blob ]] || {
                echo "Protected-base PostgreSQL target is not a blob: $name -> $path" >&2
                exit 1
              }
              base_present=true
            fi
            if git cat-file -e "$HEAD_SHA:$path" 2>/dev/null; then
              object_type="$(git cat-file -t "$HEAD_SHA:$path")"
              [[ "$object_type" == blob ]] || {
                echo "Pull request PostgreSQL target is not a blob: $name -> $path" >&2
                exit 1
              }
              head_present=true
            fi

            if [[ "$base_present" == true && "$head_present" == false ]]; then
              echo "Protected PostgreSQL target was removed or renamed: $name -> $path" >&2
              exit 1
            fi
            if [[ "$head_present" == true ]]; then
              test -f "$path" && test ! -L "$path"
              test "$(git hash-object -- "$path")" = "$(git rev-parse "$HEAD_SHA:$path")"
              verify_registered_target_binding "$name" "$path"
              archived_targets+=(--test "$name")
              echo "ARCHIVED: $name"
            elif [[ -e "$path" ]]; then
              echo "Absent registered PostgreSQL target has unexpected checkout state: $name -> $path" >&2
              exit 1
            else
              echo "NOT_APPLICABLE: registered PostgreSQL target absent before introduction: $name -> $path"
            fi
          }
          run_registered_target durability_postgres apps/game-server/tests/durability_postgres.rs
          run_registered_target character_authority_postgres apps/game-server/tests/character_authority_postgres.rs
          run_registered_target runtime_scope_assignment_postgres apps/game-server/tests/runtime_scope_assignment_postgres.rs
          run_registered_target native_admission_source_postgres apps/game-server/tests/native_admission_source_postgres.rs
          (( ${#archived_targets[@]} > 0 )) || {
            echo "No registered PostgreSQL target is present at the head" >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/pg-archives"
          cargo +1.99.1 nextest archive --locked --workspace "${archived_targets[@]}" \
            --archive-file "$RUNNER_TEMP/pg-archives/pg-e2e.tar.zst"

      # Library tests that need PostgreSQL skip in the Rust Linux lib shards, which have no database;
      # this archive holds exactly the library tests the partition jobs run against the service.
      - name: Archive PostgreSQL-backed library tests
        run: |
          set -euo pipefail
          cargo +1.99.1 nextest archive --locked -p oteryn-gameplay-durability -p oteryn-gameplay-dispatch -p oteryn-game-server --lib \
            --archive-file "$RUNNER_TEMP/pg-archives/pg-lib.tar.zst"

      - name: Record archive digests and head
        id: digest
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pg-archives"
          printf '%s\n' "$HEAD_SHA" > head-sha
          sha256sum head-sha pg-e2e.tar.zst pg-lib.tar.zst > SHA256SUMS
          ls -l
          echo "archives_sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "workspace=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"

      # The archives are already zstd-compressed and only live for this run's partition jobs.
      - name: Upload PostgreSQL test archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-postgres-test-archives
          path: ${{ runner.temp }}/pg-archives/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: true

  durability_postgres:
    name: PR early signal / Durability PostgreSQL harness
    needs: build
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ${{ (vars.OTERYN_SELF_HOSTED_PG == 'on' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') && fromJSON('["self-hosted","linux","x64","oteryn-molehill"]') || 'ubuntu-24.04' }}
    timeout-minutes: 45
    permissions:
      contents: read
    # Each partition runs a disjoint count slice of both archives; together the six run every test once.
    # These jobs install no toolchain and restore no cache: they cannot compile.
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    # An empty image skips the service container on Molehill, which starts its own cluster below.
    services:
      postgres:
        image: ${{ !(vars.OTERYN_SELF_HOSTED_PG == 'on' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') && 'postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc' || '' }}
        env:
          POSTGRES_USER: oteryn_test_admin
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oteryn_test_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      # The test binaries read repository files through their compile-time CARGO_MANIFEST_DIR, so the
      # partition checks out the same head at the same workspace path as the build job.
      - name: Check out exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact pull request head SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Use the PostgreSQL service container
        if: runner.environment != 'self-hosted'
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          echo "OTERYN_TEST_POSTGRES_ADMIN_URL=postgresql://oteryn_test_admin:ci-${RUN_ID}-${RUN_ATTEMPT}@127.0.0.1:5432/postgres" >> "$GITHUB_ENV"
          echo "PG_WORKSPACE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "PG_SOURCE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          printf '%s\n' '#!/bin/bash' 'exec "$@"' > "$RUNNER_TEMP/pg-run"
          chmod 755 "$RUNNER_TEMP/pg-run"
          echo "PG_RUN=$RUNNER_TEMP/pg-run" >> "$GITHUB_ENV"

      # The binaries read repository files through the build job's compile-time workspace path. All
      # Molehill runners share one host, so each partition keeps a per-head checkout and runs its tests
      # in a private mount namespace where that checkout is bound at the build path. Partitions of
      # different heads therefore run side by side; a shared lock per checkout keeps it from being
      # pruned while a partition uses it.
      - name: Expose this head at the build workspace path
        if: runner.environment == 'self-hosted'
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_WORKSPACE: ${{ needs.build.outputs.workspace }}
        run: |
          set -euo pipefail
          if [[ "${OTERYN_CI_TARGET_ROOT:-}" != /* ]]; then
            echo 'OTERYN_CI_TARGET_ROOT must be set to an absolute path on the self-hosted runner' >&2
            exit 1
          fi
          if [[ ! "${RUNNER_NAME:-}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo 'RUNNER_NAME must be a plain runner name on the self-hosted runner' >&2
            exit 1
          fi
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_WORKSPACE" =~ ^/home/runner/work/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]
          parent="$(dirname "$BUILD_WORKSPACE")"
          if [[ ! -d "$parent" ]]; then
            echo "$parent must exist (Molehill PostgreSQL setup)" >&2
            exit 1
          fi
          base="$OTERYN_CI_TARGET_ROOT/pr-postgres"
          mkdir -p "$base/ws"
          ws="$base/ws/$EXPECTED_SHA"
          exec 9>"$base/switch.lock"
          flock -x 9
          # Drop idle checkouts of other heads older than a day.
          find "$base/ws" -mindepth 1 -maxdepth 1 -type d -mmin +1440 -print0 |
            while IFS= read -r -d '' old; do
              if [[ "$old" != "$ws" ]] && flock -n -x "$old.use" true; then rm -rf -- "$old" "$old.use"; fi
            done
          if [[ ! -d "$ws/.git" ]]; then
            rm -rf -- "$ws.tmp"
            git clone -q --local --no-checkout "$GITHUB_WORKSPACE" "$ws.tmp"
            git -C "$ws.tmp" -c advice.detachedHead=false checkout -q --detach "$EXPECTED_SHA"
            mv -T "$ws.tmp" "$ws"
          fi
          test "$(git -C "$ws" rev-parse HEAD)" = "$EXPECTED_SHA"
          setsid flock -s -o "$ws.use" sleep 7200 </dev/null >/dev/null 2>&1 &
          holder=$!
          # Keep the prune lock until the shared lock is held, so the checkout cannot be dropped first.
          for _ in $(seq 1 50); do
            if ! flock -n -x "$ws.use" true; then break; fi
            sleep 0.1
          done
          if flock -n -x "$ws.use" true; then
            echo 'could not take the shared workspace lock' >&2
            exit 1
          fi
          touch "$ws"
          flock -u 9
          # Outer namespace: map this user to root only to mount. Inner namespace: map root back to
          # this user's id, so the tests run with no capabilities and normal file permissions.
          cat > "$RUNNER_TEMP/pg-run" <<'WRAP'
          #!/bin/bash
          set -euo pipefail
          export PG_RUN_UID="$(id -u)" PG_RUN_GID="$(id -g)"
          exec unshare --user --mount --map-root-user --propagation private bash -euc '
            mount -t tmpfs -o mode=0755 tmpfs "$(dirname "$PG_WORKSPACE")"
            mkdir "$PG_WORKSPACE"
            mount --bind "$PG_SOURCE" "$PG_WORKSPACE"
            exec unshare --user --map-user="$PG_RUN_UID" --map-group="$PG_RUN_GID" -- "$@"
          ' pg-run "$@"
          WRAP
          chmod 755 "$RUNNER_TEMP/pg-run"
          echo "PG_WORKSPACE=$BUILD_WORKSPACE" >> "$GITHUB_ENV"
          echo "PG_SOURCE=$ws" >> "$GITHUB_ENV"
          echo "PG_RUN=$RUNNER_TEMP/pg-run" >> "$GITHUB_ENV"
          echo "PG_WS_HOLDER=$holder" >> "$GITHUB_ENV"
          test "$(PG_WORKSPACE="$BUILD_WORKSPACE" PG_SOURCE="$ws" "$RUNNER_TEMP/pg-run" \
            git -C "$BUILD_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"

      # A throwaway cluster per job: fresh data directory, random password, loopback only, durability
      # off (the tests never survive a crash of their own database).
      - name: Start ephemeral PostgreSQL 18
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          bin=/usr/lib/postgresql/18/bin
          if [[ ! -x "$bin/initdb" ]]; then
            echo 'PostgreSQL 18 server binaries are missing (Molehill PostgreSQL setup)' >&2
            exit 1
          fi
          "$bin/postgres" --version | grep -Eq ' 18\.'
          dir="$OTERYN_CI_TARGET_ROOT/$RUNNER_NAME/pr-postgres"
          if [[ -f "$dir/data/postmaster.pid" ]]; then
            "$bin/pg_ctl" -D "$dir/data" stop -m immediate -w || true
          fi
          rm -rf -- "$dir"
          mkdir -p "$dir/sock"
          chmod 700 "$dir"
          password="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$password"
          printf '%s\n' "$password" > "$dir/pwfile"
          "$bin/initdb" -D "$dir/data" -U oteryn_test_admin --pwfile="$dir/pwfile" \
            --auth=scram-sha-256 --encoding=UTF8 --locale=en_US.UTF-8 >/dev/null
          rm -f -- "$dir/pwfile"
          started=''
          for _ in 1 2 3; do
            port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()')"
            if "$bin/pg_ctl" -D "$dir/data" -l "$dir/postgres.log" -w -t 60 start \
              -o "-c listen_addresses=127.0.0.1 -p $port -k $dir/sock -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=200"; then
              started=1
              break
            fi
          done
          if [[ -z "$started" ]]; then
            tail -n 50 "$dir/postgres.log" >&2 || true
            exit 1
          fi
          "$bin/pg_isready" -h 127.0.0.1 -p "$port" -U oteryn_test_admin -d postgres
          echo "OTERYN_TEST_POSTGRES_ADMIN_URL=postgresql://oteryn_test_admin:${password}@127.0.0.1:${port}/postgres" >> "$GITHUB_ENV"
          echo "PG_DATA_DIR=$dir/data" >> "$GITHUB_ENV"
          # Match the hosted runner's four CPUs so four partitions share the PC.
          echo "NEXTEST_TEST_THREADS=4" >> "$GITHUB_ENV"

      - name: Install pinned cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.146
          NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NEXTEST_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: Download PostgreSQL test archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-postgres-test-archives
          path: ${{ runner.temp }}/pg-archives

      - name: Verify archives were built for this head
        id: verify
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          ARCHIVES_SHA256: ${{ needs.build.outputs.archives_sha256 }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/pg-archives"
          [[ "$ARCHIVES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "${ARCHIVES_SHA256}  SHA256SUMS" | sha256sum -c -
          sha256sum -c SHA256SUMS
          test "$(cat head-sha)" = "$EXPECTED_SHA"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git -C "$PG_SOURCE" rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$("$PG_RUN" git -C "$PG_WORKSPACE" rev-parse HEAD)" = "$EXPECTED_SHA"

      # The partition is taken from the matrix position and size, so the slices always cover the
      # whole archive whatever the matrix length; the label must agree with the position.
      - name: Resolve partition
        id: partition
        env:
          LABEL: ${{ matrix.partition }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          [[ "$JOB_INDEX" =~ ^[0-9]+$ && "$JOB_TOTAL" =~ ^[1-9][0-9]*$ ]]
          test "$LABEL" = "$((JOB_INDEX + 1))"
          echo "spec=count:$((JOB_INDEX + 1))/${JOB_TOTAL}" >> "$GITHUB_OUTPUT"

      - name: Run registered PostgreSQL E2E targets
        env:
          PARTITION_SPEC: ${{ steps.partition.outputs.spec }}
        run: |
          set -euo pipefail
          "$PG_RUN" cargo-nextest nextest run --archive-file "$RUNNER_TEMP/pg-archives/pg-e2e.tar.zst" \
            --workspace-remap "$PG_WORKSPACE" --partition "$PARTITION_SPEC" --no-fail-fast

      - name: Run PostgreSQL-backed library tests
        if: ${{ !cancelled() && steps.partition.outcome == 'success' }}
        env:
          PARTITION_SPEC: ${{ steps.partition.outputs.spec }}
        run: |
          set -euo pipefail
          "$PG_RUN" cargo-nextest nextest run --archive-file "$RUNNER_TEMP/pg-archives/pg-lib.tar.zst" \
            --workspace-remap "$PG_WORKSPACE" --partition "$PARTITION_SPEC" --no-fail-fast

      - name: Stop ephemeral PostgreSQL 18
        if: always() && runner.environment == 'self-hosted'
        run: |
          set -uo pipefail
          if [[ -n "${PG_DATA_DIR:-}" && -f "$PG_DATA_DIR/postmaster.pid" ]]; then
            /usr/lib/postgresql/18/bin/pg_ctl -D "$PG_DATA_DIR" stop -m fast -w -t 60 ||
              /usr/lib/postgresql/18/bin/pg_ctl -D "$PG_DATA_DIR" stop -m immediate -w
          fi
          if [[ "${PG_WS_HOLDER:-}" =~ ^[0-9]+$ ]]; then
            kill -- "-$PG_WS_HOLDER" 2>/dev/null || true
          fi
          exit 0
