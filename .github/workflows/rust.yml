name: Rust protected-main cache

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer main push supersedes the cache build of an older one; the newest cache is the useful one.
concurrency:
  group: rust-protected-main-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lanes:
    name: Rust / protected-main risk lanes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - name: Check out exact protected revision and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact protected revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Classify protected-main push using existing risk model
        id: classify
        env:
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if ! rustup toolchain install 1.99.1 --profile minimal || ! cargo +1.99.1 metadata --locked --no-deps --all-features --format-version 1 > "$RUNNER_TEMP/post-merge-metadata.json"; then
            echo 'FULL: protected metadata unavailable.'
            printf 'rust=true\nwindows=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wire="$(mktemp "$RUNNER_TEMP/post-merge-lanes.XXXXXX")"
          if GITHUB_OUTPUT="$wire" python -I tools/repository/classify_pr_test_lanes.py --post-merge "$RUNNER_TEMP/post-merge-metadata.json"; then
            for pair in $'rust=false\nwindows=false\n' $'rust=true\nwindows=false\n' $'rust=true\nwindows=true\n'; do
              if printf '%s' "$pair" | cmp -s - "$wire"; then
                cat "$wire" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi
          echo 'FULL: failed classifier or incomplete/incoherent output.'
          printf 'rust=true\nwindows=true\n' >> "$GITHUB_OUTPUT"

      - name: Verify protected-main routing contract health
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: python -I tools/repository/validate_pr_routing_contract.py --protected-main "$RUNNER_TEMP/post-merge-metadata.json"

  policy:
    name: Rust / policy and metadata
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - name: Verify locked metadata
        run: cargo +1.99.1 metadata --locked --format-version 1 >/dev/null

      - name: Verify formatting
        run: cargo +1.99.1 fmt --all --check

      - name: Verify machine workspace boundaries
        run: cargo +1.99.1 run --locked -p oteryn-architecture-check -- workspace .

      - name: Verify migration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('docs/migration/rust-client-provenance.json'),
              Path('docs/migration/rust-client-path-map.json'),
              Path('docs/migration/rust-dependency-delta.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: PASS')
          PY

      - name: Verify production closure negatives
        run: |
          for package in oteryn-client oteryn-game-server; do
            cargo +1.99.1 tree --locked -p "$package" --edges normal,build > "${package}-production-tree.txt"
          done
          python - <<'PY'
          import re
          from pathlib import Path

          import tomllib

          # Synthetic and test packages come from workspace-boundaries.toml, the
          # single source of truth for production classification.
          boundaries = tomllib.loads(Path('workspace-boundaries.toml').read_text(encoding='utf-8'))
          forbidden = (
              'protocol-canary', 'protocol-core',
              'transport', 'game-session',
              *boundaries['synthetic'], *boundaries['test'],
              'oteryn-dev-client',
          )
          session_crates = ('oteryn-session', 'oteryn-session-tcp')

          def parse_tree(tree):
              stack, edges, protocol = [], 0, []
              for line in tree.splitlines():
                  match = re.search(r'[├└]── (\S+)', line)
                  if not match:
                      continue
                  edges += 1
                  depth = match.start() // 4
                  del stack[depth:]
                  if match.group(1).startswith('oteryn-protocol-oteryn'):
                      protocol.append((match.group(1), stack[-1] if stack else None))
                  stack.append(match.group(1))
              return edges, protocol

          for package in ('oteryn-client', 'oteryn-game-server'):
              tree = Path(f'{package}-production-tree.txt').read_text(encoding='utf-8')
              edges, protocol = parse_tree(tree)
              if not tree.strip() or edges == 0:
                  raise SystemExit(f'{package} production tree is empty or not in the expected format')
              named = sum('oteryn-protocol-oteryn' in line for line in tree.splitlines())
              if named != len(protocol):
                  raise SystemExit(f'{package} production tree has {named} protocol-oteryn lines but {len(protocol)} parsed edges')
              found = [name for name in forbidden if name in tree]
              if package == 'oteryn-client':
                  found += [f'protocol-oteryn via {parent}' for name, parent in protocol if name != 'oteryn-protocol-oteryn' or parent not in session_crates]
              if found:
                  raise SystemExit(f'{package} production closure contains forbidden entries: {found}')
              print(f'{package} production closure: PASS')
          PY

  linux:
    name: Rust / protected-main cache
    needs: lanes
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.ref_protected && (github.event_name != 'push' || needs.lanes.result != 'success' || needs.lanes.outputs.rust != 'false' || needs.lanes.outputs.windows != 'false') }}
    runs-on: ubuntu-24.04
    # Full test execution, the synthetic harness and the smoke belong to Merge Queue (rust_linux
    # build-smoke on the same SHA). Compile and lint the protected merged tree to warm every shared
    # Cargo artifact without repeating tests or runs.
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy,rustfmt

      - name: Restore trimmed Cargo cache from protected main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-

      - name: Normalize source mtimes for the restored Cargo cache
        run: python tools/repository/normalize_cargo_mtimes.py

      - name: Build workspace
        run: cargo +1.99.1 build --locked --workspace --all-targets

      - name: Strict Clippy
        run: cargo +1.99.1 clippy --locked --workspace --all-targets -- -D warnings

      - name: Compile workspace tests without executing them
        run: cargo +1.99.1 test --locked --workspace --no-run

      # The MQ build-smoke leg, node_boot and server_seam build these package-scoped units
      # (`-p` resolves features per package) and reuse them from this cache.
      - name: Build synthetic harness and native game-server
        run: |
          cargo +1.99.1 build --locked -p oteryn-synthetic-client-harness
          cargo +1.99.1 build --locked -p oteryn-game-server --bin oteryn-game-server

      # Only protected-main source may produce the shared compilation cache.
      # A cache hit never substitutes for exact-candidate MQ qualification.
      # The cache keeps dependency and library artifacts. Workspace test executables (profile.test,
      # listed by replaying the fresh `test --no-run` above) and incremental directories are
      # dropped: they are most of target/, and a consumer relinks the ones it runs.
      - name: Trim test executables and incremental cache and mark its source commit
        if: github.ref == 'refs/heads/main' && github.ref_protected
        shell: bash
        run: |
          set -euo pipefail
          du -sh target/ | tee -a "$GITHUB_STEP_SUMMARY"
          find target -type d -name incremental -prune -exec rm -rf -- {} +
          cargo +1.99.1 test --locked --workspace --no-run --message-format=json > "$RUNNER_TEMP/test-artifacts.jsonl"
          python - "$RUNNER_TEMP/test-artifacts.jsonl" <<'PY'
          import json
          import sys
          from pathlib import Path

          deps = (Path.cwd() / 'target/debug/deps').resolve(strict=True)
          removed = 0
          for line in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines():
              message = json.loads(line)
              if message.get('reason') != 'compiler-artifact' or not message['profile']['test']:
                  continue
              executable = Path(message['executable'] or '')
              if executable.parent.resolve() != deps:
                  raise SystemExit(f'unexpected test executable location: {executable}')
              executable.unlink(missing_ok=True)
              removed += 1
          if removed == 0:
              raise SystemExit('no workspace test executable listed; refusing to save an untrimmed cache')
          print(f'removed {removed} workspace test executables')
          PY
          git rev-parse HEAD > target/.oteryn-cache-source-sha
          du -sh target/ | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Save trimmed cache from protected main after compilation
        if: github.ref == 'refs/heads/main' && github.ref_protected
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
