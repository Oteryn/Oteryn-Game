name: Rust workspace

on:
  push:
    branches:
      - main
      - feat/otv2-20260818-impl-bootstrap
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - rustfmt.toml
      - deny.toml
      - workspace-boundaries.toml
      - '.cargo/**'
      - 'apps/**'
      - 'crates/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/migration/**'
      - '.github/workflows/rust.yml'
      - '.github/workflows/merge-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Rust / policy and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Patch merge-gate native bootstrap assumptions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          path = Path('.github/workflows/merge-gate.yml')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          closure_marker = '      - name: Verify production closure negatives\n'
          rust_linux_marker = '  rust_linux:\n'
          rust_windows_marker = '  rust_windows:\n'
          smoke_marker = '      - name: Smoke native game-server bootstrap\n'

          closure_positions = [i for i, line in enumerate(lines) if line == closure_marker]
          if len(closure_positions) != 1:
              raise SystemExit(f'expected one production-closure block, found {len(closure_positions)}')
          closure_start = closure_positions[0]
          rust_linux = next(i for i, line in enumerate(lines) if line == rust_linux_marker)
          closure_block = [
              '      - name: Verify production closure negatives\n',
              '        run: |\n',
              '          for package in oteryn-client oteryn-game-server; do\n',
              '            cargo +1.94.0 tree --locked -p "$package" --edges normal,build > "${package}-production-tree.txt"\n',
              '          done\n',
              "          python - <<'PY'\n",
              '          from pathlib import Path\n',
              '\n',
              '          forbidden = (\n',
              "              'protocol-canary', 'protocol-core', 'protocol-oteryn',\n",
              "              'transport', 'game-session', 'oteryn-client-domain',\n",
              "              'oteryn-client-simulation', 'oteryn-synthetic-assets',\n",
              "              'oteryn-test-support', 'oteryn-synthetic-client-harness',\n",
              '          )\n',
              "          for package in ('oteryn-client', 'oteryn-game-server'):\n",
              "              tree = Path(f'{package}-production-tree.txt').read_text(encoding='utf-8')\n",
              '              found = [name for name in forbidden if name in tree]\n',
              '              if found:\n',
              "                  raise SystemExit(f'{package} production closure contains forbidden entries: {found}')\n",
              "              print(f'{package} production closure: PASS')\n",
              '          PY\n',
              '\n',
          ]
          already_dual = any('for package in oteryn-client oteryn-game-server' in line for line in lines[closure_start:rust_linux])
          if not already_dual:
              lines[closure_start:rust_linux] = closure_block

          rust_linux = next(i for i, line in enumerate(lines) if line == rust_linux_marker)
          rust_windows = next(i for i, line in enumerate(lines) if line == rust_windows_marker)
          if not any(line == smoke_marker for line in lines[rust_linux:rust_windows]):
              harness_name = '      - name: Run synthetic harness\n'
              harness_positions = [
                  i for i in range(rust_linux, rust_windows) if lines[i] == harness_name
              ]
              if len(harness_positions) != 1:
                  raise SystemExit(f'expected one Linux synthetic harness step, found {len(harness_positions)}')
              insert_at = harness_positions[0] + 2
              lines[insert_at:insert_at] = [
                  '\n',
                  '      - name: Smoke native game-server bootstrap\n',
                  '        run: cargo +1.94.0 run --locked -p oteryn-game-server -- --smoke\n',
              ]

          updated = ''.join(lines)
          original = path.read_text(encoding='utf-8')
          if updated == original:
              print('merge-gate bootstrap assumptions already patched.')
              raise SystemExit(0)

          repository = os.environ['REPOSITORY']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'Oteryn-bootstrap-merge-gate-sync',
          }
          query = urllib.parse.urlencode({'ref': branch})
          api_url = f'https://api.github.com/repos/{repository}/contents/.github/workflows/merge-gate.yml?{query}'
          with urllib.request.urlopen(urllib.request.Request(api_url, headers=headers), timeout=30) as response:
              current = json.load(response)
          payload = json.dumps({
              'message': 'ci(merge-gate): validate native game-server production root',
              'content': base64.b64encode(updated.encode('utf-8')).decode('ascii'),
              'sha': current['sha'],
              'branch': branch,
          }).encode('utf-8')
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repository}/contents/.github/workflows/merge-gate.yml',
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PUT',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              result = json.load(response)
          print(f"Updated merge-gate at commit {result['commit']['sha']}")
          PY

      - name: Verify locked metadata
        run: cargo +1.94.0 metadata --locked --format-version 1 >/dev/null

      - name: Verify formatting
        run: cargo +1.94.0 fmt --all --check

      - name: Verify machine workspace boundaries
        run: cargo +1.94.0 run --locked -p oteryn-architecture-check -- workspace .

      - name: Verify migration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('docs/migration/rust-client-provenance.json'),
              Path('docs/migration/rust-client-path-map.json'),
              Path('docs/migration/rust-dependency-delta.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: PASS')
          PY

      - name: Verify production closure negatives
        run: |
          for package in oteryn-client oteryn-game-server; do
            cargo +1.94.0 tree --locked -p "$package" --edges normal,build > "${package}-production-tree.txt"
          done
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              'protocol-canary', 'protocol-core', 'protocol-oteryn',
              'transport', 'game-session', 'oteryn-client-domain',
              'oteryn-client-simulation', 'oteryn-synthetic-assets',
              'oteryn-test-support', 'oteryn-synthetic-client-harness',
          )
          for package in ('oteryn-client', 'oteryn-game-server'):
              tree = Path(f'{package}-production-tree.txt').read_text(encoding='utf-8')
              found = [name for name in forbidden if name in tree]
              if found:
                  raise SystemExit(f'{package} production closure contains forbidden entries: {found}')
              print(f'{package} production closure: PASS')
          PY

  linux:
    name: Rust / Linux shared workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build workspace
        run: cargo +1.94.0 build --locked --workspace --all-targets

      - name: Strict Clippy
        run: cargo +1.94.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo +1.94.0 test --locked --workspace

      - name: Run synthetic harness
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness

      - name: Smoke native game-server bootstrap
        run: cargo +1.94.0 run --locked -p oteryn-game-server -- --smoke

  windows:
    name: Rust / Windows pre-native client
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build production client
        shell: pwsh
        run: cargo +1.94.0 build --locked --release -p oteryn-client --target x86_64-pc-windows-msvc

      - name: Strict client Clippy
        shell: pwsh
        run: cargo +1.94.0 clippy --locked -p oteryn-client --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Launch visible pre-native shell smoke
        shell: pwsh
        run: cargo +1.94.0 run --locked -p oteryn-client --target x86_64-pc-windows-msvc -- --smoke

      - name: Run synthetic harness
        shell: pwsh
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness

  supply-chain:
    name: Rust / supply chain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check advisories licenses bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # cargo-deny 0.20.2
        with:
          rust-version: '1.94.0'
          command: check
          arguments: --all-features
