name: Rust workspace

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lanes:
    name: Rust / protected-main risk lanes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      windows: ${{ steps.classify.outputs.windows }}
    steps:
      - name: Check out exact protected revision and complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact protected revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Classify protected-main push using existing risk model
        id: classify
        env:
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if ! rustup toolchain install 1.94.0 --profile minimal || ! cargo +1.94.0 metadata --locked --no-deps --all-features --format-version 1 > "$RUNNER_TEMP/post-merge-metadata.json"; then
            echo 'FULL: protected metadata unavailable.'
            printf 'rust=true\nwindows=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          wire="$(mktemp "$RUNNER_TEMP/post-merge-lanes.XXXXXX")"
          if GITHUB_OUTPUT="$wire" python -I tools/repository/classify_pr_test_lanes.py --post-merge "$RUNNER_TEMP/post-merge-metadata.json"; then
            for pair in $'rust=false\nwindows=false\n' $'rust=true\nwindows=false\n' $'rust=true\nwindows=true\n'; do
              if printf '%s' "$pair" | cmp -s - "$wire"; then
                cat "$wire" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi
          echo 'FULL: failed classifier or incomplete/incoherent output.'
          printf 'rust=true\nwindows=true\n' >> "$GITHUB_OUTPUT"

      - name: Verify protected-main routing contract health
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: python -I tools/repository/validate_pr_routing_contract.py --protected-main "$RUNNER_TEMP/post-merge-metadata.json"

  policy:
    name: Rust / policy and metadata
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Verify locked metadata
        run: cargo +1.94.0 metadata --locked --format-version 1 >/dev/null

      - name: Verify formatting
        run: cargo +1.94.0 fmt --all --check

      - name: Verify machine workspace boundaries
        run: cargo +1.94.0 run --locked -p oteryn-architecture-check -- workspace .

      - name: Verify migration JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in (
              Path('docs/migration/rust-client-provenance.json'),
              Path('docs/migration/rust-client-path-map.json'),
              Path('docs/migration/rust-dependency-delta.json'),
          ):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'{path}: PASS')
          PY

      - name: Verify production closure negatives
        run: |
          for package in oteryn-client oteryn-game-server; do
            cargo +1.94.0 tree --locked -p "$package" --edges normal,build > "${package}-production-tree.txt"
          done
          python - <<'PY'
          from pathlib import Path

          forbidden = (
              'protocol-canary', 'protocol-core', 'protocol-oteryn',
              'transport', 'game-session', 'oteryn-client-domain',
              'oteryn-client-simulation', 'oteryn-synthetic-assets',
              'oteryn-test-support', 'oteryn-synthetic-client-harness',
          )
          for package in ('oteryn-client', 'oteryn-game-server'):
              tree = Path(f'{package}-production-tree.txt').read_text(encoding='utf-8')
              found = [name for name in forbidden if name in tree]
              if found:
                  raise SystemExit(f'{package} production closure contains forbidden entries: {found}')
              print(f'{package} production closure: PASS')
          PY

  linux:
    name: Rust / Linux shared workspace
    needs: lanes
    if: ${{ always() && !cancelled() && (github.event_name != 'push' || needs.lanes.result != 'success' || needs.lanes.outputs.rust != 'false' || needs.lanes.outputs.windows != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build workspace
        run: cargo +1.94.0 build --locked --workspace --all-targets

      - name: Strict Clippy
        run: cargo +1.94.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Test workspace
        run: cargo +1.94.0 test --locked --workspace

      - name: Run synthetic harness
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness

      - name: Smoke native game-server bootstrap
        run: cargo +1.94.0 run --locked -p oteryn-game-server -- --smoke

  durability-postgres:
    name: Rust / Durability PostgreSQL harness
    needs: lanes
    if: ${{ always() && !cancelled() && (github.event_name != 'push' || needs.lanes.result != 'success' || needs.lanes.outputs.rust != 'false' || needs.lanes.outputs.windows != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
        env:
          POSTGRES_USER: oteryn_test_admin
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oteryn_test_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OTERYN_TEST_POSTGRES_ADMIN_URL: postgresql://oteryn_test_admin:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/postgres
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.94.0 --profile minimal

      - name: Verify locked metadata
        run: cargo +1.94.0 metadata --locked --format-version 1 >/dev/null

      - name: Run registered PostgreSQL E2E targets when present
        shell: bash
        run: |
          set -euo pipefail
          verify_registered_target_binding() {
            local name="$1"
            local path="$2"
            local metadata
            metadata="$(mktemp)"
            cargo +1.94.0 metadata --locked --no-deps --format-version 1 > "$metadata"
            python - "$metadata" "$name" "$path" <<'PY'
          import json
          import pathlib
          import sys

          metadata_path, name, registered_path = sys.argv[1:]
          try:
              payload = json.loads(pathlib.Path(metadata_path).read_text(encoding='utf-8'))
              packages = payload['packages']
              if not isinstance(packages, list):
                  raise ValueError('packages is not a list')
              owners = [package for package in packages if package.get('name') == 'oteryn-game-server']
              if len(owners) != 1:
                  raise ValueError('expected exactly one oteryn-game-server package')
              expected_manifest = (pathlib.Path.cwd() / 'apps/game-server/Cargo.toml').resolve(strict=True)
              observed_manifest = pathlib.Path(owners[0]['manifest_path']).resolve(strict=True)
              if observed_manifest != expected_manifest:
                  raise ValueError(
                      f'package manifest is {observed_manifest}, expected {expected_manifest}'
                  )
              targets = owners[0].get('targets')
              if not isinstance(targets, list):
                  raise ValueError('package targets is not a list')
              matches = [target for target in targets if target.get('name') == name]
              if len(matches) != 1 or matches[0].get('kind') != ['test']:
                  raise ValueError('expected exactly one integration-test target')
              expected = (pathlib.Path.cwd() / registered_path).resolve(strict=True)
              observed = pathlib.Path(matches[0]['src_path']).resolve(strict=True)
              if observed != expected:
                  raise ValueError(f'target source is {observed}, expected {expected}')
          except (KeyError, OSError, TypeError, ValueError, json.JSONDecodeError) as error:
              raise SystemExit(f'Cargo target binding verification failed for {name}: {error}') from error
          PY
            rm -f "$metadata"
          }
          if [[ -f apps/game-server/tests/durability_postgres.rs && ! -L apps/game-server/tests/durability_postgres.rs ]]; then
            verify_registered_target_binding durability_postgres apps/game-server/tests/durability_postgres.rs
            cargo +1.94.0 test --locked -p oteryn-game-server --test durability_postgres
          elif [[ -e apps/game-server/tests/durability_postgres.rs ]]; then
            echo "Registered PostgreSQL target is not a regular file: durability_postgres -> apps/game-server/tests/durability_postgres.rs" >&2
            exit 1
          else
            echo "NOT_APPLICABLE: registered PostgreSQL target absent on protected main: durability_postgres -> apps/game-server/tests/durability_postgres.rs"
          fi
          run_registered_target() {
            local name="$1"
            local path="$2"
            if [[ -f "$path" && ! -L "$path" ]]; then
              verify_registered_target_binding "$name" "$path"
              cargo +1.94.0 test --locked -p oteryn-game-server --test "$name"
            elif [[ -e "$path" ]]; then
              echo "Registered PostgreSQL target is not a regular file: $name -> $path" >&2
              exit 1
            else
              echo "NOT_APPLICABLE: registered PostgreSQL target absent on protected main: $name -> $path"
            fi
          }
          run_registered_target character_authority_postgres apps/game-server/tests/character_authority_postgres.rs
          run_registered_target runtime_scope_assignment_postgres apps/game-server/tests/runtime_scope_assignment_postgres.rs
          run_registered_target native_admission_source_postgres apps/game-server/tests/native_admission_source_postgres.rs

  windows:
    name: Rust / Windows pre-native client
    needs: lanes
    if: ${{ always() && !cancelled() && (github.event_name != 'push' || needs.lanes.result != 'success' || needs.lanes.outputs.windows != 'false') }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          if ((git rev-parse HEAD).Trim() -ne "$env:EXPECTED_SHA") {
            throw "checked-out revision does not match expected exact SHA"
          }

      - name: Install Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt

      - name: Build production client
        shell: pwsh
        run: cargo +1.94.0 build --locked --release -p oteryn-client --target x86_64-pc-windows-msvc

      - name: Strict client Clippy
        shell: pwsh
        run: cargo +1.94.0 clippy --locked -p oteryn-client --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Launch exact release client smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $client = ".\target\x86_64-pc-windows-msvc\release\oteryn-client.exe"
          if (-not (Test-Path -LiteralPath $client -PathType Leaf)) {
            throw "release client artifact missing: $client"
          }
          & $client --smoke
          if ($LASTEXITCODE -ne 0) {
            throw "release client smoke failed with exit code $LASTEXITCODE"
          }

      - name: Run synthetic harness
        shell: pwsh
        run: cargo +1.94.0 run --locked -p oteryn-synthetic-client-harness --target x86_64-pc-windows-msvc

      - name: Test Windows input platform
        shell: pwsh
        run: cargo +1.94.0 test --locked -p oteryn-input-platform --target x86_64-pc-windows-msvc

      - name: Verify deterministic simulation golden fixtures
        shell: pwsh
        run: cargo +1.94.0 test --locked -p oteryn-simulation-determinism --target x86_64-pc-windows-msvc

  supply-chain:
    name: Rust / supply chain
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Check advisories licenses bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # cargo-deny 0.20.2
        with:
          rust-version: '1.94.0'
          command: check
          arguments: --all-features
