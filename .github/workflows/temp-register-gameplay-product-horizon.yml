name: Temporary gameplay and product horizon registration

on:
  push:
    branches:
      - arch/register-gameplay-product-horizon-20260805

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: arch/register-gameplay-product-horizon-20260805
          fetch-depth: 0

      - name: Patch canonical architecture registers
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one anchor, found {count}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          register = "docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md"
          backlog = "docs/architecture/FOUNDATION_DECISION_BACKLOG.md"
          programme = "docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md"

          replace_once(
              register,
              "This register is a coordination source, not an implementation claim. Accepted decisions live in ADRs and contracts. The ordered foundation gates live in `FOUNDATION_DECISION_BACKLOG.md`. This file ensures that global project domains are not lost while the programme resolves them in stages.\n",
              "This register is a coordination source, not an implementation claim. Accepted decisions live in ADRs and contracts. The ordered foundation gates live in `FOUNDATION_DECISION_BACKLOG.md`. This file ensures that global project domains are not lost while the programme resolves them in stages. The detailed open gameplay and product decision horizon is retained in `GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md`.\n",
          )

          replace_once(
              register,
              "### `DUR-02` — Persistence v1\n",
              "### `GAME-CHAR-01` — Character Lifecycle and Progression\n\n- Status: `BLOCKS_DURABLE_GAMEPLAY`\n- Freeze character creation/deletion/restore, world assignment, progression ownership, levels/skills/attributes, vocation/class evolution, death/respawn/penalties, transfer and ruleset migration semantics.\n- Define account/world/character scope, deterministic formulas and interaction with session-generation fencing.\n- Must be accepted before `DUR-02` finalizes the durable character schema.\n\n### `DUR-02` — Persistence v1\n",
          )

          replace_once(
              register,
              "### `DUR-03` — Item Transaction and Anti-Duplication Invariants\n",
              "### `GAME-ITEM-01` — Item Model and Equipment Rules\n\n- Status: `BLOCKS_DURABLE_GAMEPLAY`\n- Freeze item type versus instance identity, stacks, charges, durability/decay, equipment slots, requirements, modifiers, binding, containers, transformations and content-revision migration.\n- Preserve `DUR-03` as the authority for conservation, single-location and retry-safe transfer invariants.\n- Must be accepted before `DUR-03` finalizes item transaction semantics and before broad item import.\n\n### `DUR-03` — Item Transaction and Anti-Duplication Invariants\n",
          )

          alpha_block = """### `GAME-ABILITY-01` — Ability, Spell and Condition Architecture

- Status: `REQUIRED_FOR_ALPHA`
- Define one server-authoritative model for spells, weapon actions, runes, active/passive abilities, resource costs, cooldown groups, targeting, formulas, conditions, triggers and deterministic ordering.
- Preserve ruleset variation through data/policy and bounded modules, not protocol forks.

### `GAME-AI-01` — Creature AI, Spawn and Pathfinding Architecture

- Status: `REQUIRED_FOR_ALPHA`
- Define creature/summon/NPC ownership, perception, aggro/threat, behavior composition, bounded pathfinding, spawn/population control, boss phases, recovery and deterministic testing.
- Keep heavy or stale work outside the authoritative channel writer and reject stale results.

### `GAME-INTERACTION-01` — World Interaction and Environmental Mechanics

- Status: `REQUIRED_FOR_ALPHA`
- Define doors, switches, teleports, fields, traps, readable objects, item-use targets, movement/timer triggers, scoped persistence and script/domain-action boundaries.
- No interaction may bypass item, lease, transaction or channel ownership invariants.

### `PROD-LIVEOPS-01` — Live Operations and Runtime Configuration

- Status: `REQUIRED_FOR_ALPHA`
- Define versioned feature flags, maintenance mode, event/rate scheduling, emergency kill switches, approvals, audit, propagation, rollback and fail-safe defaults.
- Runtime configuration cannot silently change protocol or durable-schema compatibility.

### `PROD-COMPAT-01` — Release Compatibility and Version Train

- Status: `REQUIRED_FOR_ALPHA`
- Freeze the client/protocol/server/Platform/content/asset compatibility matrix, supported version windows, forced updates, mixed-version behavior, staged rollout and rollback order.
- Coordinate signed release manifests with `EXP-UPDATE-01` without conflating protocol, content and ruleset revisions.

### `SEC-CLIENT-01` — Client Integrity and Anti-Cheat Boundary

- Status: `REQUIRED_FOR_ALPHA`
- Separate server-authoritative prevention from client integrity signals; define signing, tamper/bot evidence, rate limits, false-positive handling and human-reviewed sanctions.
- Client signals never become authoritative gameplay truth or autonomous punishment authority.

### `DATA-PRIVACY-01` — Product Privacy and Data Lifecycle

- Status: `REQUIRED_FOR_ALPHA`
- Define data classification, Platform/game ownership, retention, deletion/anonymization, export, legal hold, consent, backups and privacy-safe diagnostics across gameplay, analytics, support and security evidence.
- Preserve ADR-0006 durability-class and pseudonymization boundaries.

### `UX-I18N-A11Y-01` — Localization, Input, Onboarding and Accessibility

- Status: `REQUIRED_FOR_ALPHA`
- Define localization keys and packaging, locale-independent identifiers, formatting/font fallback, remappable input, controllers, UI scaling, accessibility settings, tutorial/onboarding and validation coverage.
- Translated strings cannot become domain or protocol identifiers.

### `OPS-GM-01` — Support, Moderation and GM Operations

- Status: `REQUIRED_FOR_ALPHA`
- Define least-privilege roles, audited commands, moderation/case/appeal workflows, safe item/character corrections, dual control and emergency rollback.
- No hidden raw database or unaudited authoritative mutation path is permitted.

"""
          replace_once(register, "### `ALPHA-CLIENT-01` — Client Architecture\n", alpha_block + "### `ALPHA-CLIENT-01` — Client Architecture\n")

          expansion_block = """### `GAME-META-01` — Collections, Achievements and Recurring Progression

- Status: `EXPANSION`
- Cover achievements, bestiary, collections, cosmetics, daily/weekly systems, crafting/upgrades, rankings, seasons, retroactive criteria and idempotent rewards.

### `GAME-INSTANCES-01` — Dungeons, Arenas, Matchmaking and Spectating

- Status: `EXPANSION`
- Cover instance lifecycle/recovery, queues and ratings, lockouts, checkpoints, rewards, tournaments, spectators/replay, privacy and safe return to the origin channel.

### `GAME-WORLD-LIFECYCLE-01` — World Lifecycle, Transfer and Merge

- Status: `EXPANSION`
- Cover world creation/closure/archival, ruleset upgrades, character transfer, world merge, identity/economy/guild/house reconciliation, staged migration and rollback.

### `INTEGRATION-API-01` — External APIs, Notifications and Integrations

- Status: `EXPANSION`
- Cover versioned read/partner APIs, webhooks, signatures/replay prevention, notifications/offline delivery, projections, rate limits, privacy and deprecation.
- External integrations do not gain implicit authoritative mutation access.

### `PROD-ENTITLEMENTS-01` — Entitlements, Premium and Commerce Boundary

- Status: `DEFERRED`
- Required before paid entitlements, premium time, cosmetic purchase or store delivery is enabled.
- Define Platform/payment ownership, authoritative idempotent delivery, expiry/revocation, refunds/chargebacks, fraud, audit and separation from in-game currency.

### `MOD-ECOSYSTEM-01` — Modding and Plugin Ecosystem

- Status: `DEFERRED`
- Define trust classes, capability sandboxing, resource limits, signing/provenance, distribution/revocation, compatibility, anti-cheat impact and support boundaries before any public mod ecosystem.

"""
          replace_once(register, "### `EXP-EVENTS-01` — Dynamic Events, Raids and Bosses\n", expansion_block + "### `EXP-EVENTS-01` — Dynamic Events, Raids and Bosses\n")

          replace_once(
              register,
              "12. VSL-02 uses one atomic Oteryn-v2 destination PR; the later otclient PR is source-marker closeout only.\n",
              "12. VSL-02 uses one atomic Oteryn-v2 destination PR; the later otclient PR is source-marker closeout only.\n13. Every gameplay/product package must reconcile `GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md`; an unnamed domain may not be silently absorbed into an unrelated gate.\n",
          )

          replace_once(
              register,
              "Draft and accept `FND-01` — the **Workspace, Dependency and Existing-Rust Migration Contract**. Its terminal next action is `VSL-02`, followed by one atomic destination migration/workspace PR, the source-only cutover marker and only then layer-specific contracts.\n",
              "Draft and accept `FND-01` — the **Workspace, Dependency and Existing-Rust Migration Contract**. Its terminal next action is `VSL-02`, followed by one atomic destination migration/workspace PR, the source-only cutover marker and only then layer-specific contracts. The newly registered gameplay/product gates remain ordered future work and do not replace this immediate action.\n",
          )

          horizon_section = """## Registered gameplay and product decision horizon

The detailed scope and dependency rules are canonical in `GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md`.

### Blocks durable gameplay

- `GAME-CHAR-01` — character lifecycle, progression, death, transfer and ruleset migration; must precede final `DUR-02` character schema.
- `GAME-ITEM-01` — item type/instance behavior, equipment, modifiers, containers, decay and transformations; must precede final `DUR-03` transaction semantics.

### Required for Playable Alpha completeness

- `GAME-ABILITY-01` — abilities, spells, weapons, conditions, cooldowns, targeting and formula ordering.
- `GAME-AI-01` — creature/summon AI, spawns, pathfinding budgets and recovery.
- `GAME-INTERACTION-01` — world objects, item use, triggers, hazards and scoped persistence.
- `PROD-LIVEOPS-01` — runtime configuration, feature flags, scheduling, kill switches, audit and rollback.
- `PROD-COMPAT-01` — client/protocol/server/Platform/content/asset version compatibility and release train.
- `SEC-CLIENT-01` — client integrity and anti-cheat boundary without client authority or opaque automatic punishment.
- `DATA-PRIVACY-01` — full product data lifecycle beyond analytics-only privacy.
- `UX-I18N-A11Y-01` — localization, input, onboarding and accessibility.
- `OPS-GM-01` — support, moderation, GM roles, audited corrections and appeals.

### Expansion or explicitly deferred

- `GAME-META-01` — achievements, collections, cosmetics, recurring progression, crafting/upgrades, rankings and seasons.
- `GAME-INSTANCES-01` — dungeons, arenas, matchmaking, spectators and replay.
- `GAME-WORLD-LIFECYCLE-01` — world creation/closure, transfer, merge and migration.
- `INTEGRATION-API-01` — external APIs, webhooks, notifications and integrations.
- `PROD-ENTITLEMENTS-01` — deferred until paid entitlements or commerce are explicitly selected.
- `MOD-ECOSYSTEM-01` — deferred public mod/plugin ecosystem.

Registering these gates prevents omission but does not accept their technologies, formulas, schemas or implementation topology.

"""
          replace_once(backlog, "## Explicitly deferred\n", horizon_section + "## Explicitly deferred\n")

          replace_once(backlog, "- complete dungeon/arena instance programme;\n", "- `GAME-INSTANCES-01` complete dungeon/arena/matchmaking/spectator programme;\n")
          replace_once(backlog, "- public mod ecosystem;\n", "- `MOD-ECOSYSTEM-01` public mod ecosystem;\n")

          old_order = """12. Accept DUR-01 full Identifier Contract for database and durable-state representation
13. Accept ANL-01 Game Event and Audit Foundation Contract
14. Accept DUR-02 Persistence v1 Contract with transactional outbox/audit recovery
15. Accept DUR-03 Item Transaction and Anti-Duplication Contract, if not complete in DUR-02
16. Draft ANL-02 and ANL-03 on the accepted event/persistence/item foundations
17. Run the bounded world-format spike and complete DUR-04 under ADR-0005
18. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence
19. Execute the separately authorized vertical-slice implementation programme
20. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized
"""
          new_order = """12. Accept DUR-01 full Identifier Contract for database and durable-state representation
13. Accept GAME-CHAR-01 before DUR-02 freezes the durable character schema
14. Accept GAME-ITEM-01 before DUR-03 freezes the item model and transfer semantics
15. Accept ANL-01 Game Event and Audit Foundation Contract
16. Accept DUR-02 Persistence v1 Contract with transactional outbox/audit recovery
17. Accept DUR-03 Item Transaction and Anti-Duplication Contract, if not complete in DUR-02
18. Draft ANL-02 and ANL-03 on the accepted event/persistence/item foundations
19. Run the bounded world-format spike and complete DUR-04 under ADR-0005
20. Accept VSL-01 Foundation Vertical-Slice Programme with correlated event/audit evidence
21. Execute the separately authorized vertical-slice implementation programme
22. Accept GAME-ABILITY-01, GAME-AI-01 and GAME-INTERACTION-01 before Playable Alpha gameplay breadth is claimed
23. Accept PROD-LIVEOPS-01, PROD-COMPAT-01, SEC-CLIENT-01, DATA-PRIVACY-01, UX-I18N-A11Y-01 and OPS-GM-01 before Playable Alpha operational completeness is claimed
24. Complete ANL-02/ANL-03 before production-grade alpha analytics claims; defer ANL-04 until read-only investigation is authorized
25. Activate expansion/deferred gameplay-product gates only when their milestone or explicit owner decision requires them
"""
          replace_once(backlog, old_order, new_order)

          replace_once(
              backlog,
              "- `DUR-01`, `DUR-02` and `DUR-03` must be accepted before authoritative durable character, item or currency mutation.\n",
              "- `DUR-01`, `DUR-02` and `DUR-03` must be accepted before authoritative durable character, item or currency mutation.\n- `GAME-CHAR-01` must be accepted before `DUR-02` finalizes the character schema; `GAME-ITEM-01` must be accepted before `DUR-03` finalizes item semantics.\n- `GAME-ABILITY-01`, `GAME-AI-01` and `GAME-INTERACTION-01` are required before Playable Alpha gameplay breadth is claimed; bounded vertical-slice contracts may precede them.\n- `PROD-LIVEOPS-01`, `PROD-COMPAT-01`, `SEC-CLIENT-01`, `DATA-PRIVACY-01`, `UX-I18N-A11Y-01` and `OPS-GM-01` are required before Playable Alpha operational completeness is claimed.\n",
          )

          replace_once(
              programme,
              "Canonical evidence: ADR-0001 through ADR-0006.\n",
              "Canonical evidence: ADR-0001 through ADR-0006.\n\nRegistered open-decision coverage: `docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md`. Registration prevents omission but does not accept solutions.\n",
          )

          stable_ids = """- `GAME-CHAR-01` — Character Lifecycle and Progression.
- `GAME-ITEM-01` — Item Model and Equipment Rules.
- `GAME-ABILITY-01` — Ability, Spell and Condition Architecture.
- `GAME-AI-01` — Creature AI, Spawn and Pathfinding Architecture.
- `GAME-INTERACTION-01` — World Interaction and Environmental Mechanics.
- `PROD-LIVEOPS-01` — Live Operations and Runtime Configuration.
- `PROD-COMPAT-01` — Release Compatibility and Version Train.
- `SEC-CLIENT-01` — Client Integrity and Anti-Cheat Boundary.
- `DATA-PRIVACY-01` — Product Privacy and Data Lifecycle.
- `UX-I18N-A11Y-01` — Localization, Input, Onboarding and Accessibility.
- `OPS-GM-01` — Support, Moderation and GM Operations.
- `GAME-META-01` — Collections, Achievements and Recurring Progression.
- `GAME-INSTANCES-01` — Dungeons, Arenas, Matchmaking and Spectating.
- `GAME-WORLD-LIFECYCLE-01` — World Lifecycle, Transfer and Merge.
- `INTEGRATION-API-01` — External APIs, Notifications and Integrations.
- `PROD-ENTITLEMENTS-01` — Entitlements, Premium and Commerce Boundary.
- `MOD-ECOSYSTEM-01` — Modding and Plugin Ecosystem.
"""
          replace_once(programme, "- `ANL-04` — Read-Only Investigation and AI Contract.\n", "- `ANL-04` — Read-Only Investigation and AI Contract.\n" + stable_ids)

          replace_once(
              programme,
              "- `ANL-02`/`ANL-03` gate production-grade analytics claims; `ANL-04` gates later read-only AI investigation.\n",
              "- `ANL-02`/`ANL-03` gate production-grade analytics claims; `ANL-04` gates later read-only AI investigation.\n- `GAME-CHAR-01` and `GAME-ITEM-01` gate final character/item durable models before `DUR-02`/`DUR-03`.\n- `GAME-ABILITY-01`, `GAME-AI-01` and `GAME-INTERACTION-01` gate Playable Alpha gameplay breadth.\n- `PROD-LIVEOPS-01`, `PROD-COMPAT-01`, `SEC-CLIENT-01`, `DATA-PRIVACY-01`, `UX-I18N-A11Y-01` and `OPS-GM-01` gate Playable Alpha operational completeness.\n- Expansion/deferred gameplay-product gates remain inactive until their milestone or explicit owner decision requires them.\n",
          )

          replace_once(programme, "- complete instance and market programmes;\n", "- `GAME-INSTANCES-01` complete instance/matchmaking/spectator programme and full market programme;\n")
          replace_once(programme, "- public mod ecosystem;\n", "- `MOD-ECOSYSTEM-01` public mod ecosystem;\n")

          replace_once(
              programme,
              "- [ ] `DUR-03` accepted before durable item/currency mutation.\n",
              "- [ ] `DUR-03` accepted before durable item/currency mutation.\n- [ ] `GAME-CHAR-01` accepted before `DUR-02` freezes the durable character schema.\n- [ ] `GAME-ITEM-01` accepted before `DUR-03` freezes item behavior and transaction semantics.\n- [ ] Playable Alpha gameplay breadth is not claimed before `GAME-ABILITY-01`, `GAME-AI-01` and `GAME-INTERACTION-01`.\n- [ ] Playable Alpha operational completeness is not claimed before live-ops, compatibility, client-integrity, privacy, localization/accessibility and GM-operation gates are accepted.\n",
          )

          replace_once(
              programme,
              "last_progress: ADR-0001 through ADR-0006 are accepted; ADR-0002 requires VSL-02 immediately after FND-01 and one atomic destination migration/workspace PR before a source-only cutover marker and shared-contract freeze.\n",
              "last_progress: ADR-0001 through ADR-0006 are accepted; ADR-0002 requires VSL-02 immediately after FND-01 and one atomic destination migration/workspace PR before a source-only cutover marker and shared-contract freeze; missing gameplay and product domains are registered as open future gates.\n",
          )

          replace_once(
              programme,
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n",
              "  - docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md\n  - docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md\n",
          )

      - name: Validate patch coverage
        run: |
          grep -q 'GAME-CHAR-01' docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md
          grep -q 'PROD-ENTITLEMENTS-01' docs/architecture/GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md
          grep -q 'GAMEPLAY_AND_PRODUCT_ARCHITECTURE_HORIZON.md' docs/architecture/FOUNDATION_DECISION_BACKLOG.md
          grep -q 'UX-I18N-A11Y-01' docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md

      - name: Commit synchronized documents
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/GLOBAL_ARCHITECTURE_DECISION_REGISTER.md \
                  docs/architecture/FOUNDATION_DECISION_BACKLOG.md \
                  docs/agents/tasks/active/OTV2-20260805-foundation-preimplementation-contracts.md
          git commit -m "docs(architecture): synchronize gameplay product horizon"
          git push
