name: PR239 final Codex round 8 tests-only staging

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237
    paths:
      - .github/workflows/pr239-final-codex-round8-tests-only.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact trigger SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Stage durable tests only and remove helper
        env:
          EXPECTED_PARENT: ${{ github.sha }}
          BRANCH: governance/remote-desktop-per-action-gate-237
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          python - <<'PY'
          from pathlib import Path

          path = Path("tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py")
          text = path.read_text(encoding="utf-8")
          if "test_ping_passive_automatic_authorization_grant_fails" in text:
              raise SystemExit("round 8 tests already present")
          marker = "\ndef test_ordinary_permission_blocker_prose_passes() -> None:\n"
          if marker not in text:
              raise SystemExit("insertion marker missing")
          addition = r'''

def test_ping_passive_automatic_authorization_grant_fails() -> None:
    assert_prompt_fail(
        "Authorization is automatically granted for ping.",
        "Remote Desktop policy text outside canonical section",
    )


def test_ping_passive_automatic_permission_grant_fails() -> None:
    assert_surface_fail(
        "Permission is automatically granted for ping.",
        "Remote Desktop policy text outside canonical section",
    )


def test_ping_authorized_by_default_fails() -> None:
    assert_prompt_fail(
        "Ping is authorized by default.",
        "Remote Desktop policy text outside canonical section",
    )


def test_calls_active_stop_at_connector_fails() -> None:
    assert_prompt_fail(
        "Calls lacking per-action authorization stop at the connector.",
        "Remote Desktop policy text outside canonical section",
    )


def test_calls_get_stopped_at_connector_fails() -> None:
    assert_surface_fail(
        "Calls lacking per-action authorization get stopped at the connector.",
        "Remote Desktop policy text outside canonical section",
    )


def test_github_trailing_dot_mutable_selector_fails() -> None:
    assert_prompt_fail(
        "Use https://github.com./Oteryn/Oteryn/blob/main/ecosystem/agent-execution-routing-policy.json for host exceptions.",
        "stale META execution-routing coordinate",
    )


def test_pinned_github_trailing_dot_selector_passes() -> None:
    assert_prompt_pass(
        f"Reference https://github.com./Oteryn/Oteryn/blob/{META_SHA}/ecosystem/agent-execution-routing-policy.json for the pinned policy."
    )
'''
          path.write_text(text.replace(marker, addition + marker, 1), encoding="utf-8")
          PY
          git rm .github/workflows/pr239-final-codex-round8-tests-only.yml
          git diff --check
          test -z "$(git diff --name-only -- . ':!tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py' ':!.github/workflows/pr239-final-codex-round8-tests-only.yml')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          git commit -m "test(agents): cover final Codex round 8 bypasses"
          remote_sha="$(git ls-remote origin "refs/heads/$BRANCH" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_PARENT"
          git push origin "HEAD:refs/heads/$BRANCH"
