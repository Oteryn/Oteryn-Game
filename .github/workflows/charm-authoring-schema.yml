name: Charm Authoring Schema

on:
  pull_request:
    paths:
      - tools/content-schema/charm-authoring/**
      - .github/workflows/charm-authoring-schema.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  charm-authoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/charm-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt

      - name: Catalogue and report regenerate byte-identically from the committed source facts
        run: python charm_authoring.py build --check

      - name: Validate the candidate catalogue
        run: python charm_authoring.py validate samples/charms-candidate.json

      - name: Tests
        run: python test_charm_authoring.py

      - name: Ruff check and format
        run: |
          set -euo pipefail
          ruff check .
          ruff format --check .

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        working-directory: .
        run: test -z "$(git status --short --untracked-files=all)"

  # `charm_authoring.py capture` needs the network (tibia.fandom.com) and a pinned reference-engine
  # checkout, which this CI does not fetch; like the store census it is run locally and its
  # result is the committed `samples/charm-sources-2026-09-29.json`.
