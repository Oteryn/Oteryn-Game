name: Craft Authoring

on:
  pull_request:
    paths:
      - tools/content-schema/craft-authoring/**
      # craft_authoring.py imports these helpers and pins the Canary items.xml digest.
      - tools/content-migration/world_project_v2_to_tree.py
      - tools/content-schema/item-authoring/lower_item_consumption_packet.py
      - tools/content-schema/item-authoring/requirements.txt
      - tools/content-schema/reward-claim-authoring/reward_claim_authoring.py
      - imports/canary/items-xml/**
      - content/craft/**
      - content/project.json
      - content/manifest.json
      - content/content.lock.json
      - .github/workflows/craft-authoring.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  craft-authoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: false
      - name: Install pinned schema requirements
        run: python -m pip install -r tools/content-schema/item-authoring/requirements.txt
      - name: Verify deterministic craft content and registration
        run: python tools/content-schema/craft-authoring/craft_authoring.py content --check
      - name: Test craft authoring
        run: python -m unittest discover -s tools/content-schema/craft-authoring -p 'test_*.py' -v
      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        run: test -z "$(git status --short --untracked-files=all)"
