name: World Metadata Authoring

on:
  pull_request:
    paths:
      - tools/content-schema/world-authoring/**
      - tools/content-schema/validate_materialized_game_tree.py
      - content/houses/**
      - content/world/areas/**
      - content/world/transitions/**
      - content/world/placements/**
      - content/world/worlds/**
      - content/world/objects/**
      - content/world/terrain/**
      - imports/crystalserver/bindings/items.json
      - imports/tibiawiki/hunting-places/**
      - imports/tibiawiki/islands/**
      - imports/official/client-assets/15.30/manifest.json
      - content/assets/files/catalog-content.json
      - content/assets/files/appearances-*.dat
      - content/assets/files/map-*.dat
      - content/assets/files/subarea-*
      - .github/workflows/world-metadata-authoring.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  world-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/world-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate committed world metadata and base map families
        run: |
          set -euo pipefail
          python convert_hunting_places.py --check
          python convert_islands.py --check
          python validate_islands.py
          python convert_map_regions.py --check
          python validate_world_metadata.py
          python validate_world_base.py
          python convert_world_record.py --check
          python validate_world_record.py
          python validate_floor_changes.py
          python convert_terrain.py --check
          python validate_terrain.py
          python ../validate_materialized_game_tree.py

      - name: Reader, converter and validator fixture tests
        run: |
          set -euo pipefail
          python test_world_authoring.py
          python test_world_base.py
          python test_edron_rework.py
          python test_minimap_draft.py
          python test_world_record.py
          python test_floor_changes.py
          python test_islands.py
          python test_terrain.py

      - name: Ruff check and format
        working-directory: .
        run: |
          set -euo pipefail
          ruff check tools/content-schema/world-authoring
          ruff format --check tools/content-schema/world-authoring

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        working-directory: .
        run: test -z "$(git status --short --untracked-files=all)"

  # `convert_world_metadata.py --check`, `convert_world_base.py --check`,
  # `convert_floor_changes.py --check`, `convert_islands.py --crystal-root` and
  # `convert_terrain.py --crystal-root` need the pinned
  # zimbadev/crystalserver checkout, which this repository's CI does not fetch; whoever
  # regenerates the families runs them locally and commits the output together with
  # samples/source-capture-v1.json, samples/world-base-capture-v1.json and
  # samples/floor-changes-capture-v1.json (`convert_terrain.py` also writes
  # samples/terrain-capture-v1.json). `convert_world_base.py` also reads
  # data-global/world/maps.7z (fill) and needs py7zr from requirements-regenerate.txt; the
  # Edron rework and the minimap draft also need Pillow (same file) and the pinned tibiamaps
  # files (floors 6, 7 and 9-11) in a directory given as --tibiamaps-root.
