name: World Metadata Authoring

on:
  pull_request:
    paths:
      - tools/content-schema/world-authoring/**
      - tools/content-schema/validate_materialized_game_tree.py
      - content/world/transitions/**
      - content/world/terrain/**
      - content/world/objects/**
      - content/world/areas/cities/**
      - content/world/areas/hunting-places/**
      - content/items/definitions/**
      - imports/tibiawiki/hunting-places/**
      - .github/workflows/world-metadata-authoring.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  world-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: tools/content-schema/world-authoring
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out SHA
        working-directory: .
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pinned requirements
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate committed world metadata families
        run: |
          set -euo pipefail
          python convert_hunting_places.py --check
          python validate_world_metadata.py
          python ../validate_materialized_game_tree.py

      - name: Reader, converter and validator fixture tests
        run: python test_world_authoring.py

      - name: Ruff check and format
        working-directory: .
        run: |
          set -euo pipefail
          ruff check tools/content-schema/world-authoring
          ruff format --check tools/content-schema/world-authoring

      - name: Verify the checkout stayed clean
        if: ${{ always() }}
        working-directory: .
        run: test -z "$(git status --short --untracked-files=all)"

  # `convert_world_metadata.py --check` needs the pinned zimbadev/crystalserver checkout,
  # which this repository's CI does not fetch; whoever regenerates the families runs it
  # locally and commits the output together with samples/source-capture-v1.json.
