name: Codex Cloud runner PoC

# Proof of concept, not a required check: one ephemeral JIT runner started
# inside a Codex Cloud task picks up this job. It runs only when this file
# changes or by hand.
on:
  pull_request:
    paths:
      - .github/workflows/codex-runner-poc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-runner-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: Codex runner PoC / seed artifact (hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Make a 200 MiB test archive
        run: |
          mkdir -p "$RUNNER_TEMP/seed"
          head -c 209715200 /dev/urandom > "$RUNNER_TEMP/seed/blob.bin"
          (cd "$RUNNER_TEMP/seed" && sha256sum blob.bin > blob.sha256)
      - name: Upload test archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-runner-poc-seed
          path: ${{ runner.temp }}/seed/
          if-no-files-found: error
          retention-days: 1

  smoke:
    name: Codex runner PoC / PostgreSQL smoke
    needs: seed
    runs-on: [self-hosted, codex-cloud]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: oteryn_test_admin
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oteryn_test_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Runner facts
        run: |
          uname -a
          nproc
          free -g
          df -h "$GITHUB_WORKSPACE"
      - name: PostgreSQL reachable
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "postgres port open after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "postgres port did not open"
          exit 1
      - name: Download hosted archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: codex-runner-poc-seed
          path: ${{ runner.temp }}/seed
      - name: Verify hosted archive
        run: cd "$RUNNER_TEMP/seed" && sha256sum -c blob.sha256
      - name: Try an upload from this runner (expected to be blocked)
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-runner-poc-back
          path: ${{ runner.temp }}/seed/blob.sha256
          retention-days: 1
