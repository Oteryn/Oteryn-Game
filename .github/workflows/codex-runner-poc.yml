name: Codex Cloud runner PoC

# Proof of concept, not a required check: one ephemeral JIT runner started
# inside a Codex Cloud task picks up this job. It runs only when this file
# changes or by hand.
on:
  pull_request:
    paths:
      - .github/workflows/codex-runner-poc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-runner-poc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    name: Codex runner PoC / seed archive in ghcr (hosted)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Make a 200 MiB test archive
        run: |
          mkdir -p "$RUNNER_TEMP/seed"
          head -c 209715200 /dev/urandom > "$RUNNER_TEMP/seed/blob.bin"
          (cd "$RUNNER_TEMP/seed" && sha256sum blob.bin > blob.sha256)
          printf 'FROM scratch\nCOPY blob.bin blob.sha256 /\n' > "$RUNNER_TEMP/seed/Dockerfile"
      - name: Push test archive to ghcr
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/oteryn/oteryn-game-codex-runner-poc:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE" "$RUNNER_TEMP/seed"
          docker push "$IMAGE"

  smoke:
    name: Codex runner PoC / PostgreSQL smoke
    needs: seed
    permissions:
      contents: read
      packages: read
    runs-on: [self-hosted, codex-cloud]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
        env:
          POSTGRES_USER: oteryn_test_admin
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oteryn_test_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Runner facts
        run: |
          uname -a
          nproc
          free -g
          df -h "$GITHUB_WORKSPACE"
      - name: PostgreSQL reachable
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null; then
              echo "postgres port open after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "postgres port did not open"
          exit 1
      - name: Pull test archive from ghcr
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/oteryn/oteryn-game-codex-runner-poc:${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          start=$(date +%s)
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker pull "$IMAGE"
          mkdir -p "$RUNNER_TEMP/seed"
          id=$(docker create "$IMAGE" /none)
          docker cp "$id:/blob.bin" "$RUNNER_TEMP/seed/blob.bin"
          docker cp "$id:/blob.sha256" "$RUNNER_TEMP/seed/blob.sha256"
          docker rm "$id"
          echo "pull and extract took $(( $(date +%s) - start ))s"
      - name: Verify test archive
        run: cd "$RUNNER_TEMP/seed" && sha256sum -c blob.sha256
