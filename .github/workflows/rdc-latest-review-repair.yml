name: RDC latest review repair

on:
  push:
    branches:
      - governance/remote-desktop-per-action-gate-237

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1

      - name: Apply bounded repair
        run: python tools/agents/rdc_latest_review_repair.py

      - name: Verify GREEN before publication
        run: |
          python tools/agents/validate_governance.py
          python tools/agents/test_validate_remote_desktop_prompt_routing.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_regressions.py
          python tools/agents/test_validate_remote_desktop_prompt_routing_codex_round12.py
          python tools/agents/validate_remote_desktop_prompt_routing.py
          python tools/repository/validate_repository_policy.py
          git diff --check

      - name: Publish exact guarded repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tools/agents/validate_remote_desktop_prompt_routing.py tools/agents/rdc_latest_review_repair.py .github/workflows/rdc-latest-review-repair.yml
          git commit -m "fix(agents): close latest RDC review findings"
          git fetch origin governance/remote-desktop-per-action-gate-237
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/governance/remote-desktop-per-action-gate-237
