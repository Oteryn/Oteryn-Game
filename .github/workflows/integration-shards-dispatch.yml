name: Integration shards (manual)

# Runs the two integration-test legs of the merge-group gate (integration-heavy and
# integration-rest) on a chosen branch or commit before it reaches main. The merge-group gate
# itself stays push/merge_group only; this workflow is read-only and qualifies nothing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch name or full 40-character commit SHA to test
        required: true
        type: string

permissions: {}

concurrency:
  group: integration-shards-dispatch-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Integration shards / resolve exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.source.outputs.revision }}
      compiler_override: ${{ steps.source.outputs.compiler_override }}
    steps:
      - name: Validate requested ref
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$REQUESTED_REF" != -* ]]

      - name: Resolve requested ref once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Bind the exact source and compiler-consumer capability
        id: source
        run: |
          set -euo pipefail
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          available = Path('tools/content-migration/world_compiler_artifact.py').is_file()
          if available:
              source = Path('apps/game-server/tests/world_bundle_artifact_boot.rs').read_text()
              assert 'std::env::var_os("OTERYN_WORLD_COMPILER_BIN")' in source
              assert Path('tools/qualification/node_boot/prebuilt.py').is_file()
              assert Path('tools/ci/shared_dispatch_archive.py').is_file()
          print('compiler_override=' + str(available).lower())
          PY

  world_compiler:
    name: Integration shards / World compiler
    needs: resolve
    if: needs.resolve.outputs.compiler_override == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CARGO_BUILD_JOBS: '2'
    outputs:
      world_compiler_sha256: ${{ steps.compiler.outputs.sha256 }}
      world_compiler_artifact_id: ${{ steps.compiler_upload.outputs.artifact-id }}
      world_compiler_producer_attempt: ${{ steps.compiler.outputs.producer_attempt }}
    steps:
      - name: Check out the resolved candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Test current-run compiler artifact guards
        run: python3 -m unittest discover -s tools/content-migration -p test_world_compiler_artifact.py

      - name: Build the release compiler while integration targets compile
        id: compiler
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          printf 'producer_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          python3 tools/qualification/node_boot/prebuilt.py build world-compiler "$RUNNER_TEMP/world-compiler-build"
          digest="$(sha256sum "$RUNNER_TEMP/world-compiler-build/bundle.tar.gz" | cut -d' ' -f1)"
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Publish the current-attempt release compiler
        id: compiler_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-compiler-${{ github.run_attempt }}
          path: ${{ runner.temp }}/world-compiler-build/bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  integration:
    name: Integration shards / ${{ matrix.shard }}
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [integration-heavy, integration-rest]
    steps:
      - name: Validate requested ref
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REF" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$REQUESTED_REF" != -* ]]

      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.revision }}
          persist-credentials: false

      - name: Verify exact candidate
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.revision }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      # Restore only: this run never writes a cache entry that main or the queue could read.
      - name: Restore trimmed Cargo cache from protected main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.100.0-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-linux-v2-1.100.0-${{ hashFiles('Cargo.lock') }}-

      - name: Normalize source mtimes for the restored Cargo cache
        run: python tools/repository/normalize_cargo_mtimes.py

      # Same pinned cargo-nextest release and fallback as the merge-group gate.
      - name: Install pinned cargo-nextest
        env:
          NEXTEST_VERSION: 0.9.146
          NEXTEST_SHA256: 682c21b777c333e96fd532e114d3a5a894e0729ab88d94c0a9f20f8419695428
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-nextest.tar.gz"
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          if curl --proto '=https' --tlsv1.2 -fsSL --retry 8 --retry-delay 15 --retry-all-errors --retry-max-time 150 --connect-timeout 30 -o "$archive" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-${NEXTEST_VERSION}/cargo-nextest-${NEXTEST_VERSION}-x86_64-unknown-linux-gnu.tar.gz"; then
            echo "${NEXTEST_SHA256}  ${archive}" | sha256sum -c -
            tar -xzf "$archive" -C "$RUNNER_TEMP/nextest-bin"
          else
            echo "::warning::cargo-nextest ${NEXTEST_VERSION} release download failed; building it from crates.io"
            cargo +1.100.0 install --locked --quiet cargo-nextest --version "=${NEXTEST_VERSION}" --root "$RUNNER_TEMP/nextest-root"
            cp "$RUNNER_TEMP/nextest-root/bin/cargo-nextest" "$RUNNER_TEMP/nextest-bin/"
          fi
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      - name: Compile heavy integration targets while the release compiler builds
        if: matrix.shard == 'integration-heavy' && needs.resolve.outputs.compiler_override == 'true'
        env:
          SHARD: ${{ matrix.shard }}
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo +1.100.0 metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python tools/repository/plan_rust_test_shards.py "$RUNNER_TEMP/metadata.json" "$SHARD" > "$RUNNER_TEMP/shard-args.txt"
          mapfile -t shard_args < "$RUNNER_TEMP/shard-args.txt"
          test "${#shard_args[@]}" -gt 0
          cargo +1.100.0 nextest list --locked --workspace "${shard_args[@]}" --message-format json > "$RUNNER_TEMP/integration-heavy-inventory.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["test-count"] > 0' "$RUNNER_TEMP/integration-heavy-inventory.json"

      - name: Reuse the same-run release compiler after test compilation
        if: matrix.shard == 'integration-heavy' && needs.resolve.outputs.compiler_override == 'true'
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          compiler="$(python3 tools/content-migration/world_compiler_artifact.py \
            --workflow integration-shards-dispatch.yml "$RUNNER_TEMP/integration-world-compiler")"
          printf 'OTERYN_WORLD_COMPILER_BIN=%s\n' "$compiler" >> "$GITHUB_ENV"

      # Heads predating the source-bound compiler helper retain this original
      # full invocation, including the test's local compiler fallback.
      - name: Test workspace integration targets
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          cargo +1.100.0 metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/metadata.json"
          python tools/repository/plan_rust_test_shards.py "$RUNNER_TEMP/metadata.json" "$SHARD" > "$RUNNER_TEMP/shard-args.txt"
          mapfile -t shard_args < "$RUNNER_TEMP/shard-args.txt"
          test "${#shard_args[@]}" -gt 0
          cargo +1.100.0 nextest run --locked --workspace "${shard_args[@]}" --no-fail-fast
