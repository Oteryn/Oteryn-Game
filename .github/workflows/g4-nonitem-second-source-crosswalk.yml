name: G4 Non-Item Second-Source Crosswalk

on:
  pull_request:
    branches: [main]
    paths:
      - tools/content-census/g4_nonitem_second_source_crosswalk.py
      - tools/content-census/g4_nonitem_second_source_crosswalk_self_test.py
      - .github/workflows/g4-nonitem-second-source-crosswalk.yml
      - docs/agents/tasks/active/OTV2-20260925-g4-nonitem-second-source-crosswalk.md
      - docs/agents/evidence/OTV2-20260925-g4-nonitem-second-source-crosswalk.json
  workflow_dispatch:

permissions: {}

concurrency:
  group: g4-nonitem-second-source-crosswalk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: G4 / bounded second-source crosswalk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify admission, exact head, and five owned paths
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: bfc8b54548a09c59e062873a5dfa48739c477420
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" "$EXPECTED_SHA"
          expected_paths=$(printf '%s\n' \
            .github/workflows/g4-nonitem-second-source-crosswalk.yml \
            docs/agents/evidence/OTV2-20260925-g4-nonitem-second-source-crosswalk.json \
            docs/agents/tasks/active/OTV2-20260925-g4-nonitem-second-source-crosswalk.md \
            tools/content-census/g4_nonitem_second_source_crosswalk.py \
            tools/content-census/g4_nonitem_second_source_crosswalk_self_test.py | sort)
          actual_paths=$(git diff --name-only "$BASE_SHA" "$EXPECTED_SHA" | sort)
          test "$actual_paths" = "$expected_paths"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Run local synthetic tests
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/content-census/g4_nonitem_second_source_crosswalk.py \
            tools/content-census/g4_nonitem_second_source_crosswalk_self_test.py
          python tools/content-census/g4_nonitem_second_source_crosswalk_self_test.py

      - name: Capture exact #875 cohort and bounded source evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g4-nonitem-second-source-crosswalk"
          python tools/content-census/g4_nonitem_second_source_crosswalk.py \
            --output "$ROOT/crosswalk.json" \
            --manifest-output "$ROOT/manifest.json"

      - name: Gate exact cohort and fail-closed source-unavailable evidence
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/g4-nonitem-second-source-crosswalk"
          python - "$ROOT/crosswalk.json" "$ROOT/manifest.json" <<'PY'
          import hashlib, json, pathlib, re, sys
          artifact_path, manifest_path = map(pathlib.Path, sys.argv[1:])
          artifact, manifest = [json.loads(p.read_text(encoding="utf-8")) for p in (artifact_path, manifest_path)]
          canonical = lambda value: (json.dumps(value, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
          assert artifact["schema"] == "OTERYN_G4_NONITEM_SECOND_SOURCE_CROSSWALK/v1"
          assert manifest["schema"] == "OTERYN_G4_NONITEM_SECOND_SOURCE_CROSSWALK_MANIFEST/v1"
          assert manifest["artifact_sha256"] == hashlib.sha256(canonical(artifact)).hexdigest()
          expected = {"Creature":2149,"NPC":1253,"Achievement":569,"Quest":272,"Ability":171,"Outfit":134,"Mount":252}
          assert manifest["counts"]["source_rows"] == 4800
          assert manifest["counts"]["family_rows"] == expected
          assert set(artifact["families"]) == set(expected)
          rows = [row for family_rows in artifact["families"].values() for row in family_rows]
          assert len(rows) == len({row["source_tuple"]["external_id"] for row in rows}) == 4800
          assert all(row["source_tuple"]["source"] == "TIBIAWIKI_STRUCTURED" for row in rows)
          assert all(row["source_tuple"]["canonical_target"] is None and row["source_tuple"]["production_key"] is None and row["source_tuple"]["source_identity_binding"] is None for row in rows)
          assert artifact["authority"]["canonical_identity_binding_emitted"] is False
          assert artifact["authority"]["canonical_definition_population"] is False
          assert artifact["authority"]["semantic_field_promotion"] is False
          assert artifact["authority"]["article_prose_retained"] is False
          if artifact["status"] == "SOURCE_UNAVAILABLE":
              assert set(manifest["family_corroboration_statuses"].values()) == {"UNKNOWN"}
              assert all(row["independent_source"]["crosswalk"]["state"] == "SOURCE_UNAVAILABLE" for row in rows)
              assert manifest["invariants"]["all_family_status_unknown_when_source_unavailable"] is True
              assert manifest["fandom_preflight"]["state"] == "SOURCE_UNAVAILABLE"
          else:
              allowed = {"EXACT_CANDIDATE","PROBABLE","AMBIGUOUS","CONFLICT","NO_MATCH","SOURCE_UNAVAILABLE"}
              assert artifact["status"] == "CAPTURED_EVIDENCE_ONLY"
              assert all(row["independent_source"]["crosswalk"]["state"] in allowed for row in rows)
              assert all(row["independent_source"]["crosswalk"]["state"] != "EXACT_CANDIDATE" or len(row["independent_source"]["crosswalk"].get("matching_facts", [])) >= 2 for row in rows)
          print(f"G4 second-source evidence: PASS status={artifact['status']} rows={len(rows)} sha256={manifest['artifact_sha256']}")
          PY

      - name: Upload compact evidence artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: g4-nonitem-second-source-crosswalk-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/g4-nonitem-second-source-crosswalk/crosswalk.json
            ${{ runner.temp }}/g4-nonitem-second-source-crosswalk/manifest.json
          if-no-files-found: error
          retention-days: 14
