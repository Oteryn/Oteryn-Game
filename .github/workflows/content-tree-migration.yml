name: Pinned W01 Source Facts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-w01-source-facts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact extraction candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked-out source SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Extract bounded pinned facts without persisting source asset
        run: python3 tools/diagnostics/extract_w01_source_facts.py --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/w01-source-facts.json"
      - name: Upload bounded source facts only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: w01-source-facts-${{ github.sha }}
          path: ${{ runner.temp }}/w01-source-facts.json
          retention-days: 3
          if-no-files-found: error
