name: PR3056 World pin candidate (manual)

# Temporary evidence branch only; never merged into the product branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr3056-world-pin-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  world-pin-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact helper candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact head and clean index
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Free disposable runner SDK space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Restore trimmed Cargo cache from protected main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-
      - name: Normalize restored source mtimes
        run: python3 tools/repository/normalize_cargo_mtimes.py
      - name: Refresh World pins with the existing generator
        run: |
          set -euo pipefail
          git add --all
          cargo +1.99.1 run --locked --release -p oteryn-world-bundle-compiler -- pin-refresh .
      - name: Export hash-bound generated patch for independent review
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          output="$RUNNER_TEMP/world-pin-candidate"
          mkdir -p "$output"
          git add --all
          git rev-parse HEAD > "$output/base-sha.txt"
          git write-tree > "$output/staged-input-tree.txt"
          git diff --binary --full-index --output="$output/candidate.patch" HEAD
          sha256sum "$output/candidate.patch" > "$output/candidate.sha256"
          git status --porcelain=v1 > "$output/status.txt"
          printf '%s\n' 'existing world-bundle-compiler pin-refresh; generation only; no gameplay qualification or commit/ref publication' > "$output/operation.txt"
      - name: Upload generated evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: world-pin-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/world-pin-candidate/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
