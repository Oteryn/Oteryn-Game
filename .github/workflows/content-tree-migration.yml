name: Content Tree Migration Equivalence

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches:
      - main
    paths:
      - content/items/**
      - content/starter/**
      - content/cosmetics/**
      - content/project.json
      - content/manifest.json
      - content/content.lock.json
      - content/world/definitions/reference.json
      - content/world/definitions/declarations.json
      - content/world/editor/author.json
      - content/world/provenance/sources.json
      - imports/tibiawiki/bindings/**
      - imports/tibiawiki/facts/items-family-fallback*.json
      - imports/tibiawiki/facts/items-family-alias26-20261001.json
      - imports/tibiawiki/facts/items-external-family18-20261001.json
      - tools/content-migration/**
      - tools/merge-driver/**
      # Pinned by tools/content-migration/source_relocations.py.
      - crates/gameplay/content-promotion/src/content/item_identity.rs
      - tools/content-schema/starter-kit-authoring/**
      - tools/content-schema/imbuement-authoring/**
      - imports/tibiawiki/facts/items-stats.json
      - content/assets/files/appearances-*.dat
      - tools/content-census/stage_proficiencies.py
      - rulesets/items/imbuements/**
      # validate_presentation_bindings.py scans every content JSON file for presentation keys.
      - content/**
      - crates/protocol-oteryn/src/presentation.rs
      - tools/content-schema/native-gameplay/*presentation*.py
      - tools/content-schema/native-gameplay/build_creature_races.py
      - tools/content-schema/native-gameplay/build_spell_cues.py
      - tools/content-schema/item-authoring/requirements.txt
      - .github/workflows/content-tree-migration.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-tree-migration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content tree / Item+Mount equivalence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact head
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          check-latest: false

      - name: Install pinned authoring dependencies
        run: python -m pip install -r tools/content-schema/item-authoring/requirements.txt

      - name: Install imbuement authoring validator
        run: python -m pip install -r tools/content-schema/imbuement-authoring/requirements.txt

      - name: Validate imported imbuement data and negative cases
        run: |
          python tools/content-schema/imbuement-authoring/imbuement_content.py content --check
          python -m unittest discover -s tools/content-schema/imbuement-authoring -p 'test_*.py' -q

      - name: Validate SPELL-PRESENT-0 presentation bindings
        working-directory: tools/content-schema/native-gameplay
        run: python -m unittest test_presentation_bindings -q

      - name: Read the presentation binding source pins
        id: presentation-pins
        working-directory: tools/content-schema/native-gameplay
        run: |
          set -euo pipefail
          python - >> "$GITHUB_OUTPUT" <<'PY'
          import build_creature_races as races
          import build_presentation_bindings as bindings
          print('canary_cues=' + bindings.PIN)
          print('canary_monsters=' + races.SOURCES['canary/monster-file'][1])
          print('crystal=' + bindings.CRYSTAL_PIN)
          assert races.SOURCES['crystalserver/monster-file'][1] == bindings.CRYSTAL_PIN
          PY

      - name: Check out the pinned Canary cue source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentibiabr/canary
          ref: ${{ steps.presentation-pins.outputs.canary_cues }}
          path: _sources/canary-cues
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src

      - name: Check out the pinned Canary monster source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: opentibiabr/canary
          ref: ${{ steps.presentation-pins.outputs.canary_monsters }}
          path: _sources/canary-monsters
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data-otservbr-global/monster

      - name: Check out the pinned Crystal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zimbadev/crystalserver
          ref: ${{ steps.presentation-pins.outputs.crystal }}
          path: _sources/crystal
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src
            data-crystal/monster
            data-global/monster

      - name: Rebuild the presentation bindings and creature races from the pinned sources
        working-directory: tools/content-schema/native-gameplay
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/_sources"
          python build_presentation_bindings.py --check \
            --reference-engine "$SRC/canary-cues" --crystal-engine "$SRC/crystal"
          python build_creature_races.py --check \
            --canary "$SRC/canary-monsters" --crystal "$SRC/crystal"
          # Later steps read the candidate tree only.
          rm -rf "$SRC"

      - name: Validate successor Item/Mount tree against legacy WorldProject
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/content-migration/test_world_project_v2_to_tree.py \
            tools/content-migration/validate_world_project_v2_to_tree.py
          python tools/content-migration/test_source_relocations.py
          python tools/content-migration/test_regenerate_content.py
          python tools/merge-driver/test_oteryn_additive_driver.py
          # The migration test awaits its test_item_taxonomy.py subcheck with check=True.
          python tools/content-migration/test_world_project_v2_to_tree.py
          python tools/content-migration/test_npc_presence_stage.py
          python tools/content-migration/test_item_navigation_source_supplement.py
          python tools/content-migration/test_item_engine_navigation.py
          python tools/content-migration/test_item_external_family_refinement.py
          python tools/content-migration/test_item_bounded7_navigation.py
          python tools/content-migration/validate_world_project_v2_to_tree.py

      - name: Check StarterKit seals against the base revision
        env:
          SEAL_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python tools/content-schema/starter-kit-authoring/starter_kit_authoring.py content --check --seal-base "$SEAL_BASE"

  generate-candidate:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'content-candidate')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      # This isolated checkout produces reviewable artifacts; it never publishes a commit.
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt

      - name: Install pinned content authoring dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/content-candidate-venv"
          "$RUNNER_TEMP/content-candidate-venv/bin/python" -m pip install -r tools/content-schema/item-authoring/requirements.txt
          echo "$RUNNER_TEMP/content-candidate-venv/bin" >> "$GITHUB_PATH"

      - name: Restore trimmed Cargo cache from protected main
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            rust-linux-v2-1.99.1-${{ hashFiles('Cargo.lock') }}-
            rust-linux-v2-1.99.1-

      - name: Normalize source mtimes for the restored Cargo cache
        run: python3 tools/repository/normalize_cargo_mtimes.py

      - name: Rebuild canonical Quest source and state projections
        run: |
          set -euo pipefail
          python3 tools/content-schema/quest-authoring/amend_itemhold_source_receipt.py --check
          python3 tools/content-schema/quest-authoring/quest_tree_authoring.py content
          python3 tools/content-schema/quest-authoring/quest_state_lowering.py
          python3 tools/content-schema/quest-authoring/quest_completion_import.py

      - name: Regenerate canonical content without qualification tests
        env:
          RUSTUP_TOOLCHAIN: 1.99.1
        run: python3 tools/content-migration/regenerate_content.py --skip-checks --no-stage

      - name: Stage candidate inputs and refresh final World bundle pins
        run: |
          set -euo pipefail
          # The compiler's input diagnostic must describe the generated inputs.
          # Staging is confined to this disposable checkout; no commit/ref is written.
          git add --all
          cargo +1.99.1 run --locked --release -p oteryn-world-bundle-compiler -- pin-refresh .

      - name: Export exact candidate patch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          output="$RUNNER_TEMP/content-candidate"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/base-sha.txt"
          git write-tree > "$output/staged-input-tree.txt"
          git diff --binary --full-index --output="$output/candidate.patch" HEAD
          sha256sum "$output/candidate.patch" > "$output/candidate.sha256"
          git status --porcelain=v1 > "$output/status.txt"
          printf '%s\n' 'amend_itemhold_source_receipt.py --check; quest_tree_authoring.py content; quest_state_lowering.py; quest_completion_import.py; regenerate_content.py --skip-checks --no-stage; stage generated inputs; world-bundle-compiler pin-refresh' > "$output/operation.txt"

      - name: Upload generated candidate for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: content-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/content-candidate/
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
