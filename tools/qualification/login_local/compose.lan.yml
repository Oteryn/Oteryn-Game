# LOGIN_LOCAL_HOST=<private LAN IPv4> only: nginx publishes TLS listeners for the Platform and the gateway on that
# IP. The loopback publishes of compose.override.yml stay (random host ports, 127.0.0.1). PostgreSQL and the
# Platform mTLS port are not touched. The per-run LAN CA and leaf come from run.sh (LL_LAN_PKI).
services:
  nginx:
    ports:
      - "${LL_HOST:?set LL_HOST}:${LL_PLATFORM_HTTP_PORT:?set LL_PLATFORM_HTTP_PORT}:8446"
      - "${LL_HOST}:${LL_GATEWAY_PORT:?set LL_GATEWAY_PORT}:8445"
    volumes:
      - ${GAME_SOURCE}/tools/qualification/login_local/nginx.lan.conf:/etc/nginx/login-local-lan/lan.conf:ro
      - ${LL_LAN_PKI:?set LL_LAN_PKI}:/run/lan-pki:ro
