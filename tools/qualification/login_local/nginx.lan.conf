# Included by nginx.conf in LAN mode only (LOGIN_LOCAL_HOST=<private IPv4>); the leaf SAN is that IP.
# Platform web side over TLS: browser OAuth. The service-token admission route stays unreachable from the LAN.
# External port from the Host header the client used (published port == LL_PLATFORM_HTTP_PORT), not the container's 8446.
map $http_host $ll_lan_port {
    ~:(?<p>[0-9]+)$ $p;
    default 443;
}
server {
    listen 8446 ssl;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/lan-pki/lan.crt;
    ssl_certificate_key /run/lan-pki/lan.key;
    ssl_session_tickets off;
    client_max_body_size 16k;
    location ^~ /internal/ { return 404; }
    location / {
        include /etc/nginx/fastcgi_params;
        fastcgi_pass platform:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_PORT $ll_lan_port;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_FORWARDED "";
        fastcgi_read_timeout 10s;
    }
}

# Gateway over TLS: POST /v1/login from the PC client.
server {
    listen 8445 ssl;
    ssl_protocols TLSv1.3;
    ssl_certificate /run/lan-pki/lan.crt;
    ssl_certificate_key /run/lan-pki/lan.key;
    ssl_session_tickets off;
    client_max_body_size 16k;
    location / {
        proxy_pass http://gateway:8080;
        proxy_read_timeout 10s;
    }
}
