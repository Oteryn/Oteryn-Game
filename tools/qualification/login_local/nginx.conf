user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;

    include /run/pki/runtime-status-map.conf;

    # LAN mode only: compose.lan.yml mounts the TLS listeners here (no match, no effect, otherwise).
    include /etc/nginx/login-local-lan/*.conf;

    # Loopback web side: browser OAuth + the gateway's service-token admission call.
    server {
        listen 8080;
        client_max_body_size 16k;
        location ^~ /internal/ {
            location = /internal/v1/game-auth/native-admissions {
                include /etc/nginx/fastcgi_params;
                fastcgi_pass platform:9000;
                fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
                fastcgi_param SCRIPT_NAME /index.php;
                fastcgi_read_timeout 10s;
            }
            return 404;
        }
        location / {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass platform:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_read_timeout 10s;
        }
    }

    # Gateway upstream: the service-token admission call over TLS (in-network only, not published).
    server {
        listen 8444 ssl;
        server_name nginx;
        ssl_protocols TLSv1.3;
        ssl_certificate /run/pki/platform-upstream.crt;
        ssl_certificate_key /run/pki/platform-upstream.key;
        ssl_session_tickets off;
        client_max_body_size 16k;
        location = /internal/v1/game-auth/native-admissions {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass platform:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_read_timeout 10s;
        }
        location / { return 404; }
    }

    # mTLS producer side: the runtime node identity is its verified certificate DNS SAN.
    server {
        listen 8443 ssl;
        server_name source.test;
        ssl_protocols TLSv1.3;
        ssl_certificate /run/pki/server.crt;
        ssl_certificate_key /run/pki/server.key;
        ssl_client_certificate /run/pki/client-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_session_tickets off;
        client_max_body_size 16k;

        location = /internal/v1/game-auth/native-runtime-status {
            limit_except POST { deny all; }
            if ($login_local_runtime_identity = "") { return 401; }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass platform:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_param SSL_CLIENT_VERIFY $ssl_client_verify;
            fastcgi_param SSL_PROTOCOL $ssl_protocol;
            fastcgi_param SSL_CLIENT_S_DN $login_local_runtime_identity;
            fastcgi_param HTTP_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_SSL_PROTOCOL "";
            fastcgi_param HTTP_SSL_CLIENT_S_DN "";
            fastcgi_param HTTP_X_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_X_SSL_PROTOCOL "";
            fastcgi_param HTTP_X_SSL_CLIENT_S_DN "";
            fastcgi_read_timeout 10s;
        }

        location ~ ^/internal/v1/game-auth/(native-evidence|character-bootstrap-intents/read|native-scope-assignments|native-account-characters|native-account-characters/watermark)$ {
            limit_except POST { deny all; }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass platform:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_param SSL_CLIENT_VERIFY $ssl_client_verify;
            fastcgi_param SSL_PROTOCOL $ssl_protocol;
            fastcgi_param SSL_CLIENT_S_DN $ssl_client_s_dn;
            fastcgi_param HTTP_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_SSL_PROTOCOL "";
            fastcgi_param HTTP_SSL_CLIENT_S_DN "";
            fastcgi_param HTTP_X_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_X_SSL_PROTOCOL "";
            fastcgi_param HTTP_X_SSL_CLIENT_S_DN "";
            fastcgi_read_timeout 10s;
        }

        location / { return 404; }
    }
}
