# WP5 S3-B: the S3-A producer route plus the purpose-separated Character
# bootstrap-intent reconciliation route, with the same trusted TLS metadata.
user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;

    server {
        listen 8443 ssl;
        server_name source.test;
        ssl_protocols TLSv1.3;
        ssl_certificate /run/pki/server.crt;
        ssl_certificate_key /run/pki/server.key;
        ssl_client_certificate /run/pki/client-ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;
        ssl_session_tickets off;
        client_max_body_size 16k;

        location = /internal/v1/game-auth/native-evidence {
            limit_except POST { deny all; }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass platform:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_param SSL_CLIENT_VERIFY $ssl_client_verify;
            fastcgi_param SSL_PROTOCOL $ssl_protocol;
            fastcgi_param SSL_CLIENT_S_DN $ssl_client_s_dn;
            fastcgi_param HTTP_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_SSL_PROTOCOL "";
            fastcgi_param HTTP_SSL_CLIENT_S_DN "";
            fastcgi_param HTTP_X_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_X_SSL_PROTOCOL "";
            fastcgi_param HTTP_X_SSL_CLIENT_S_DN "";
            fastcgi_read_timeout 10s;
        }

        location = /internal/v1/game-auth/character-bootstrap-intents/read {
            limit_except POST { deny all; }
            include /etc/nginx/fastcgi_params;
            fastcgi_pass platform:9000;
            fastcgi_param SCRIPT_FILENAME /var/www/platform/public/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param HTTPS on;
            fastcgi_param SSL_CLIENT_VERIFY $ssl_client_verify;
            fastcgi_param SSL_PROTOCOL $ssl_protocol;
            fastcgi_param SSL_CLIENT_S_DN $ssl_client_s_dn;
            fastcgi_param HTTP_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_SSL_PROTOCOL "";
            fastcgi_param HTTP_SSL_CLIENT_S_DN "";
            fastcgi_param HTTP_X_SSL_CLIENT_VERIFY "";
            fastcgi_param HTTP_X_SSL_PROTOCOL "";
            fastcgi_param HTTP_X_SSL_CLIENT_S_DN "";
            fastcgi_read_timeout 10s;
        }

        location / { return 404; }
    }
}
