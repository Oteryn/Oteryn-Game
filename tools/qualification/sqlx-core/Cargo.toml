[package]
edition = "2021"
rust-version = "1.94.0"
name = "sqlx-core"
version = "0.9.0"
authors = [
    "Ryan Leckey <leckey.ryan@gmail.com>",
    "Austin Bonander <austin.bonander@gmail.com>",
    "Chloe Ross <orangesnowfox@gmail.com>",
    "Daniel Akhterov <akhterovd@gmail.com>",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core of SQLx, the rust SQL toolkit. Not intended to be used directly."
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/launchbadge/sqlx"
publish = false

# This qualification-only manifest intentionally declares only the dependency
# closure already selected for sqlx-core in the canonical Oteryn workspace.
# The library source remains the exact vendored SQLx 0.9.0 source below.
[features]
_rt-async-global-executor = []
_rt-async-io = []
_rt-async-std = []
_rt-async-task = []
_rt-smol = []
_rt-tokio = ["tokio", "tokio-stream"]
_tls-native-tls = []
_tls-none = []
_tls-rustls = ["rustls"]
_tls-rustls-aws-lc-rs = [
    "_tls-rustls",
    "rustls/aws-lc-rs",
    "rustls/prefer-post-quantum",
    "webpki-roots",
]
_tls-rustls-ring-native-roots = ["_tls-rustls", "rustls/ring"]
_tls-rustls-ring-webpki = ["_tls-rustls", "rustls/ring", "webpki-roots"]
_unstable-doc = []
any = []
bigdecimal = []
bit-vec = []
bstr = []
chrono = []
default = []
ipnet = []
ipnetwork = []
json = ["serde", "serde_json"]
mac_address = []
migrate = ["sha2", "crc"]
offline = ["serde", "either/serde"]
rust_decimal = []
sqlx-toml = []
time = []
uuid = ["dep:uuid"]

[lib]
name = "sqlx_core"
path = "../../../vendor/sqlx-core-0.9.0/src/lib.rs"

[dependencies.base64]
version = "0.22.1"
features = ["alloc"]
default-features = false

[dependencies.bytes]
version = "1.2.0"

[dependencies.cfg-if]
version = "1.0.0"

[dependencies.crc]
version = "3"
optional = true

[dependencies.crossbeam-queue]
version = "0.3.2"

[dependencies.either]
version = "1.6.1"

[dependencies.event-listener]
version = "5.2.0"

[dependencies.futures-core]
version = "0.3.32"
default-features = false

[dependencies.futures-intrusive]
version = "0.5.0"

[dependencies.futures-io]
version = "0.3.32"

[dependencies.futures-util]
version = "0.3.32"
features = ["alloc", "sink", "io"]
default-features = false

[dependencies.hashbrown]
version = "0.16.0"

[dependencies.hashlink]
version = "0.11.0"

[dependencies.indexmap]
version = "2.0"

[dependencies.log]
version = "0.4.18"
default-features = false

[dependencies.memchr]
version = "2.5.0"
default-features = false

[dependencies.percent-encoding]
version = "2.3.0"

[dependencies.rustls]
version = "0.23.24"
features = ["std", "tls12"]
optional = true
default-features = false

[dependencies.serde]
version = "1.0.219"
features = ["derive", "rc"]
optional = true

[dependencies.serde_json]
version = "1.0.142"
features = ["raw_value"]
optional = true

[dependencies.sha2]
version = "0.10.0"
optional = true
default-features = false

[dependencies.smallvec]
version = "1.13.1"

[dependencies.thiserror]
version = "2.0.18"
features = ["std"]
default-features = false

[dependencies.tokio]
version = "1.25.0"
features = ["time", "net", "sync", "fs", "io-util", "rt"]
optional = true
default-features = false

[dependencies.tokio-stream]
version = "0.1.8"
features = ["fs"]
optional = true

[dependencies.tracing]
version = "0.1.37"
features = ["log"]

[dependencies.url]
version = "2.2.2"

[dependencies.uuid]
version = "1.12.1"
optional = true

[dependencies.webpki-roots]
version = "1"
optional = true

[dev-dependencies.tokio]
version = "1.25.0"
features = ["rt"]

[patch.crates-io]
rustls = { path = "../../../vendor/rustls-0.23.45" }
tokio = { path = "../../../vendor/tokio-1.53.1" }

[lints.clippy]
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
disallowed_methods = "deny"

[workspace]
resolver = "3"
