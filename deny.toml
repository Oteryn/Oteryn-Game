[graph]
all-features = true
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"
# Scoped, reviewed exceptions only. Each names the single path that pulls the crate in.
ignore = [
    # humantime 2.4.0 is unmaintained (no safe upgrade). Its only path is
    # console-subscriber, behind oteryn-game-server's optional `diagnostics`
    # feature (tokio-console build, `--cfg tokio_unstable`); production binaries
    # do not contain it. Drop this entry when console-subscriber leaves humantime.
    { id = "RUSTSEC-2026-0542", reason = "unmaintained; diagnostics-only console-subscriber dependency, absent from production" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Bounded admission for Bevy 0.20.1's upstream shader-layout infrastructure.
# Registry archives/checksums and SPDX MIT-0 text were verified against the
# exact upstream commit; see crates/client-ui-bevy/dependency-custody.json.
# Keep these exact versions scoped here; MIT-0 is not globally allowed.
[[licenses.exceptions]]
name = "encase"
version = "=0.12.1"
allow = ["MIT-0"]

[[licenses.exceptions]]
name = "encase_derive"
version = "=0.12.1"
allow = ["MIT-0"]

[[licenses.exceptions]]
name = "encase_derive_impl"
version = "=0.12.1"
allow = ["MIT-0"]

# Upstream native clipboard text paste; exact registry archives and Boost license
# text reviewed in apps/client/dependency-custody.json. No global BSL allowance.
[[licenses.exceptions]]
name = "clipboard-win"
version = "=5.4.3"
allow = ["BSL-1.0"]

[[licenses.exceptions]]
name = "error-code"
version = "=3.4.0"
allow = ["BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
