[graph]
all-features = true
targets = [
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

# Bounded admission for Bevy 0.20.1's upstream shader-layout infrastructure.
# Registry archives/checksums and SPDX MIT-0 text were verified against the
# exact upstream commit; see crates/client-ui-bevy/dependency-custody.json.
# Keep these exact versions scoped here; MIT-0 is not globally allowed.
[[licenses.exceptions]]
name = "encase"
version = "=0.12.1"
allow = ["MIT-0"]

[[licenses.exceptions]]
name = "encase_derive"
version = "=0.12.1"
allow = ["MIT-0"]

[[licenses.exceptions]]
name = "encase_derive_impl"
version = "=0.12.1"
allow = ["MIT-0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
