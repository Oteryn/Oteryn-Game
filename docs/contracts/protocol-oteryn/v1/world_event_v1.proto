syntax = "proto3";
package oteryn.protocol.v1;

// Capability 53, command 64. Empty query; World and session are admission facts.
message WorldEventQueryV1 {}

// Server-owned World announcements, returned only after a durable
// session-generation-fenced observation receipt commits. Reset-selected
// gathering is active in odd epochs. An independently scheduled occurrence can
// activate an announcement in any epoch, including epoch zero before the first
// planned reset. No client-selected time or activation.
// ACTIVE requires a nonempty announcement (<=128 UTF-8 bytes); INACTIVE requires
// an empty announcement. Maximum encoded result: 144 bytes. Strict decoding
// rejects unknown/repeated fields, invalid booleans and control characters.
message WorldEventStateV1 {
  uint64 reset_epoch = 1;
  bool active = 2;
  string announcement = 3;
}
