syntax = "proto3";
package oteryn.game.v1;

// Capability 86. Command 102. Unknown, duplicate and oversized fields refuse.
message HouseTransferIntentV1 {
  // 1 = entry, 2 = exit. The server resolves every authority-bearing field.
  uint32 direction = 1;
  string house = 2;
}

// HOUSE_TRANSFER CommandResult payload. A rejected result carries field 13 only.
// An accepted result and scope recovery carry the grant fields (1–12).
message HouseTransferAckV1 {
  bytes transfer_id = 1;
  bytes destination_game_session_id = 2;
  bytes world_id = 3;
  bytes origin_channel_id = 4;
  // Present for a House destination; absent for the origin Channel destination.
  optional string house = 5;
  uint64 scope_ownership_generation = 6;
  uint64 connection_generation = 7;
  uint64 character_lease_generation = 8;
  repeated uint32 selected_capabilities = 9;
  sint32 x = 10;
  sint32 y = 11;
  sint32 floor = 12;
  HouseTransferRefusalV1 refusal = 13;
}


// An empty rejection from an older server may still be shown as a generic refusal.
enum HouseTransferRefusalV1 {
  HOUSE_TRANSFER_REFUSAL_UNSPECIFIED = 0;
  HOUSE_TRANSFER_REFUSAL_UNAVAILABLE = 1;
  HOUSE_TRANSFER_REFUSAL_INVALID_INTENT = 2;
  HOUSE_TRANSFER_REFUSAL_NOT_AT_ENTRANCE = 3;
  HOUSE_TRANSFER_REFUSAL_NO_ACCESS = 4;
  HOUSE_TRANSFER_REFUSAL_IN_COMBAT = 5;
  HOUSE_TRANSFER_REFUSAL_BUSY = 6;
  HOUSE_TRANSFER_REFUSAL_HOUSE_CLOSED = 7;
  HOUSE_TRANSFER_REFUSAL_NO_ROOM = 8;
  HOUSE_TRANSFER_REFUSAL_CAPABILITY_REQUIRED = 9;
}
