// OTERYN_PLAYER_SPELL_CAST_WIRE_AND_VITALS_CONTRACT_CANDIDATE_V1 §3 (SPELL-D1, SPELL-D2 and
// SPELL-D6, #162 owner acceptance of the architect verdicts 5867161696; SPELL-D7, owner decision D89
// 5875958040; SPELL-D8 H-3, #162 comment 5884682203): typed payloads of command type 3
// WORLD_ACTOR_SPELL_CAST_INTENT and state domain 3 ACTOR_VITALS (delta type 1, snapshot type 1).
// The client proposes an intent only; the server resolves the spell, the target and legality.
// FND-02 envelopes own CommandRef, server sequence, domain ID and revisions; these payloads never
// duplicate them. Unknown fields, repeated fields, zero and unknown enum values, and values outside
// the declared bounds all fail closed.
syntax = "proto3";

package oteryn.protocol.v1.actor_spell;

enum SpellTargetIntent {
  SPELL_TARGET_INTENT_UNSPECIFIED = 0;
  // Self or area spells; the server derives the target.
  SPELL_TARGET_INTENT_NONE = 1;
  // The actor's current attack target, as the server holds it.
  SPELL_TARGET_INTENT_ATTACK_TARGET = 2;
  // SPELL-D7: a world position, for cast_at_position spells.
  SPELL_TARGET_INTENT_POSITION = 3;
}

// SPELL-D7: a position in the actor's own Channel, in the pinned frame's native coordinates.
message SpellTargetPositionV1 {
  sint32 x = 1;
  sint32 y = 2;
  // Limited to the int16 range.
  sint32 floor = 3;
}

// ClientCommand.payload of command type 3. At most 32 encoded bytes (SPELL-D7).
message WorldActorSpellCastIntentV1 {
  // 1-based index into the spell book of the loaded content generation (SPELL-D1): the position in
  // ProductionKey ascending UTF-8 byte order. Zero (or absent) fails closed. Never persisted or
  // logged as spell identity.
  uint32 spell = 1;
  SpellTargetIntent target = 2;
  // SPELL-D7: present only with SPELL_TARGET_INTENT_POSITION; otherwise absent. Present with another
  // intent, or absent with POSITION, fails closed.
  SpellTargetPositionV1 target_position = 3;
  // SPELL-D7: per cast, stateless. Honoured only for a spell with targeting.aim_at_target.
  bool aim_at_target = 4;
}

enum SpellCastDisposition {
  SPELL_CAST_DISPOSITION_UNSPECIFIED = 0;
  SPELL_CAST_DISPOSITION_CAST = 1;
  // Spell, group or secondary group.
  SPELL_CAST_DISPOSITION_COOLING_DOWN = 2;
  SPELL_CAST_DISPOSITION_LEVEL_TOO_LOW = 3;
  SPELL_CAST_DISPOSITION_MAGIC_LEVEL_TOO_LOW = 4;
  SPELL_CAST_DISPOSITION_NOT_ENOUGH_MANA = 5;
  SPELL_CAST_DISPOSITION_NOT_ENOUGH_SOUL = 6;
  // Not learned, wrong vocation or premium.
  SPELL_CAST_DISPOSITION_NOT_AVAILABLE = 7;
  SPELL_CAST_DISPOSITION_TARGET_REQUIRED = 8;
  // Range, line of sight, floor, protection zone.
  SPELL_CAST_DISPOSITION_TARGET_ILLEGAL = 9;
  // Unknown spell index, stale binding or ineligible actor.
  SPELL_CAST_DISPOSITION_REJECTED = 10;
}

// CommandResult.payload of command type 3: outcome only, never state. At most 4 bytes.
message WorldActorSpellCastResultV1 {
  SpellCastDisposition disposition = 1;
}

// StateDelta.payload of domain 3, delta type 1, and StateDomainSnapshot.payload of snapshot type 1.
// Own actor only (SPELL-RL-03 = 1). At most 32 bytes; the SPELL-D8 value bounds keep the worst case
// at 27 bytes. The encoder refuses a value above its bound as a server fault, and the decoder
// rejects it.
message ActorVitalsV1 {
  // SPELL-D8: at most 2^28 - 1.
  uint32 health = 1;
  // SPELL-D8: at most 2^28 - 1.
  uint32 max_health = 2;
  // SPELL-D8: at most 2^28 - 1.
  uint32 mana = 3;
  // SPELL-D8: at most 2^28 - 1.
  uint32 max_mana = 4;
  // SPELL-D8: at most 16383.
  uint32 soul = 5;
  // SPELL-D8: monk Harmony, 0..5; always 0 for another vocation. A value above 5 fails closed.
  uint32 harmony = 6;
  // SPELL-D8: the monk is Serene; always false for another vocation.
  bool serene = 7;
}
