// ZONES-NOLOGOUT-1: capability 92, domain 57. Reuses TutorialNoticeV1 status_text bytes.
// Snapshot: empty=1 or the once-per-login configured MOTD (status_text).
// Delta: exactly one status_text, raid warning or raid advance.
// Text is 1..=255 UTF-8 bytes; message is at most 260 bytes. No hint IDs.
syntax = "proto3";
package oteryn.protocol.v1.server_messages;
message ServerMessageV1 {
  oneof message {
    uint32 empty = 1; // Exactly 1; snapshot only.
    string status_text = 2;
    string warning = 3; // Crystal MESSAGE_GAME_HIGHLIGHT raid announcement.
    string advance = 4; // Crystal MESSAGE_EVENT_ADVANCE, including XML type=event.
  }
}
