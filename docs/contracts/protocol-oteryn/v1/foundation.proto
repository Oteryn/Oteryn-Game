syntax = "proto3";

package oteryn.protocol.v1;

// FND-02 foundation wire schema.
//
// This file intentionally defines only the stable protocol foundation.
// Gameplay-specific movement, combat, inventory, chat, quest and content
// payloads are registered by later owning gates and carried as typed payload bytes.
//
// Protobuf binary serialization is not a canonical semantic representation.
// Do not hash serialized protobuf bytes to define command identity or equality.

message WireEnvelope {
  // Stable foundation message type from PROTOCOL_OTERYN_V1_REGISTRY.json.
  // Zero is invalid.
  uint32 message_type = 1;

  // Zero is allowed only before authoritative admission/resume completes.
  // Every post-admission client frame must carry the current non-zero generation.
  uint64 connection_generation = 2;

  // Server-authoritative sequence for messages classified SERVER_SEQUENCED
  // by the registry. Zero is required for unsequenced control messages and
  // for every client->server frame.
  uint64 server_sequence = 3;

  // Exactly one message encoded according to message_type.
  bytes payload = 4;

  reserved 5 to 15;
}

message ClientBootstrap {
  uint32 protocol_major = 1;
  uint32 transport_profile_id = 2;

  // Build/schema evidence only. Same-major peers do not require exact equality
  // when all used fields and selected capabilities remain compatible.
  uint32 schema_revision = 3;

  // Sorted, unique optional extension capability IDs.
  // Core v1 behavior is never disabled through capabilities.
  repeated uint32 supported_capability_id = 4;

  // Opaque one-time/pre-admission material. FND-04 owns its construction,
  // validation, lifetime and replay policy.
  bytes admission_material = 5;

  // Canonical CharacterId bytes. Exactly 16 bytes; all-zero is invalid.
  bytes character_id = 6;

  // Bounded diagnostic/build identity, never authority.
  string client_build_id = 7;

  reserved 8 to 15;
}

message ServerAccepted {
  // Issued only after authoritative game admission succeeds.
  bytes game_session_id = 1;

  bytes world_id = 2;
  bytes channel_id = 3;

  uint64 connection_generation = 4;

  // Highest authoritative server sequence represented by the initial state
  // boundary. Zero is valid before the first snapshot commits.
  uint64 current_server_sequence = 5;

  // First valid CommandId for this logical GameSession.
  uint64 next_command_id = 6;

  uint32 protocol_major = 7;
  uint32 transport_profile_id = 8;
  uint32 schema_revision = 9;

  repeated uint32 selected_capability_id = 10;

  reserved 11 to 20;
}

message ClientResume {
  bytes game_session_id = 1;

  // Opaque reconnect proof/context. FND-04 owns semantics.
  bytes reconnect_material = 2;

  // Last authoritative server message fully applied by the client.
  uint64 last_applied_server_sequence = 3;

  uint32 protocol_major = 4;
  uint32 transport_profile_id = 5;
  uint32 schema_revision = 6;
  repeated uint32 supported_capability_id = 7;

  string client_build_id = 8;

  reserved 9 to 16;
}

message ServerResumeAccepted {
  bytes game_session_id = 1;
  uint64 connection_generation = 2;
  uint64 current_server_sequence = 3;
  uint64 next_command_id = 4;
  uint32 schema_revision = 5;
  repeated uint32 selected_capability_id = 6;

  reserved 7 to 16;
}

message LivenessProbe {
  // Monotonic within one connection_generation; zero is invalid.
  uint64 probe_id = 1;
}

message LivenessAck {
  uint64 probe_id = 1;

  // Diagnostic/reconciliation hint only; receipt time and current transport
  // generation are server-authoritative liveness evidence.
  uint64 last_applied_server_sequence = 2;
}

message StateRevision {
  // Stable domain ID registered by the owning later contract. Zero is invalid.
  uint32 domain_id = 1;
  uint64 revision = 2;
}

message ClientCommand {
  // CommandId is a strictly increasing uint64 scoped by GameSessionId.
  // It starts at 1 and survives eligible reconnect of the same GameSession.
  uint64 command_id = 1;

  // Stable command type registered by the owning gameplay contract.
  // Zero is invalid.
  uint32 command_type = 2;

  repeated StateRevision expected_revision = 3;

  // Exactly one typed command payload encoded by command_type.
  bytes payload = 4;

  reserved 5 to 15;
}

enum CommandStatus {
  COMMAND_STATUS_UNSPECIFIED = 0;
  COMMAND_STATUS_ACCEPTED = 1;
  COMMAND_STATUS_REJECTED = 2;
  COMMAND_STATUS_DUPLICATE_REPLAY = 3;
  COMMAND_STATUS_DUPLICATE_OUTCOME_EXPIRED = 4;
}

message CommandResult {
  uint64 command_id = 1;
  CommandStatus status = 2;

  // Zero means no error. Non-zero values are stable FND-02 error codes.
  uint32 error_code = 3;

  repeated StateRevision authoritative_revision = 4;

  // Typed result payload owned by the registered command type.
  bytes payload = 5;

  reserved 6 to 15;
}

message StateDelta {
  uint32 domain_id = 1;
  uint64 base_revision = 2;
  uint64 new_revision = 3;

  // Stable type registered by the owning state-domain contract.
  uint32 delta_type = 4;
  bytes payload = 5;

  reserved 6 to 15;
}

message ResyncRequest {
  uint64 last_applied_server_sequence = 1;
  repeated StateRevision current_revision = 2;
}

message StateDomainSnapshot {
  uint32 domain_id = 1;
  uint64 revision = 2;

  // Stable type registered by the owning state-domain contract.
  uint32 snapshot_type = 3;
  bytes payload = 4;
}

message SnapshotBody {
  repeated StateDomainSnapshot domain = 1;
}

message SnapshotBegin {
  // Monotonic server-assigned snapshot operation ID scoped to GameSessionId.
  // Zero is invalid.
  uint64 snapshot_id = 1;

  uint32 chunk_count = 2;
  uint64 total_encoded_bytes = 3;

  // After atomic snapshot application, this becomes the client's
  // last_applied_server_sequence.
  uint64 target_server_sequence = 4;

  reserved 5 to 15;
}

message SnapshotChunk {
  uint64 snapshot_id = 1;

  // Zero-based and strictly less than chunk_count.
  uint32 chunk_index = 2;

  bytes data = 3;
}

message SnapshotCommit {
  uint64 snapshot_id = 1;
}

enum ProtocolDisposition {
  PROTOCOL_DISPOSITION_UNSPECIFIED = 0;
  PROTOCOL_DISPOSITION_OPERATION_TERMINAL = 1;
  PROTOCOL_DISPOSITION_RESYNC_REQUIRED = 2;
  PROTOCOL_DISPOSITION_SESSION_FATAL = 3;
  PROTOCOL_DISPOSITION_TRANSPORT_FATAL = 4;
}

message ProtocolError {
  uint32 error_code = 1;
  ProtocolDisposition disposition = 2;

  // Optional safe correlation values. Zero means not applicable.
  uint64 related_command_id = 3;
  uint64 expected_command_id = 4;
  uint64 expected_server_sequence = 5;

  reserved 6 to 15;
}
