syntax = "proto3";
package oteryn.protocol.v1;
// Capability 72, command 89. Strict bounded codec: every scalar explicitly present,
// duplicate/unknown fields refused; the reply decodes only in its canonical encoding.
// No client identity, fence, kill count or time input: the server's quest store decides.
message TaskBoardRequestV1 {
  uint32 action = 1; // 0 query, 1 select task, 2 claim task
  uint32 task = 2; // 1-based task number 1..5; 0 for a query
}
message TaskBoardTaskV1 {
  string race = 1; // Creature race key, oteryn: prefix, 128 bytes maximum
  uint64 required = 2; // > 0, <= i64::MAX
  uint64 claimed_at_unix = 3; // database seconds of the last claim; 0 never
}
message TaskBoardReplyV1 {
  uint32 refused = 1; // 0 or 1: the store refused the select or claim
  uint32 selected = 2; // active task number; 0 none
  uint64 kills = 3; // 0 when none active, else <= the active task's required
  uint64 points = 4; // task points, <= i64::MAX
  repeated TaskBoardTaskV1 tasks = 5; // <= 5, in task-number order
}
