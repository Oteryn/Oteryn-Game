syntax = "proto3";
package oteryn.game.v1;
// PLAYER-TRADE0 / TRADE-WIRE-1. Integers/oneofs are required even at zero where stated.
message TradePartnerV1 { bytes actor_id = 1; uint64 generation = 2; }
message PlayerTradeOfferIntentV1 { TradePartnerV1 partner = 1; uint64 item_handle = 2; }
message PlayerTradeLookV1 { bytes trade_id = 1; bool counter_offer = 2; }
message PlayerTradeIntentV1 {
  oneof intent {
    PlayerTradeOfferIntentV1 offer = 1;
    bytes accept_trade_id = 2;
    PlayerTradeCancelV1 cancel = 3;
    PlayerTradeLookV1 look = 4;
  }
}
message PlayerTradeCancelV1 {}
message PlayerTradeResultV1 {
  // 1 OFFERED, 2 ACCEPTED, 3 COMPLETED, 4 CANCELLED, 5 TOO_FAR,
  // 6 NOT_TRADEABLE, 7 PARTNER_BUSY, 8 NO_ROOM, 9 NO_BACKPACK,
  // 10 STALE, 11 NOT_SUPPORTED, 12 REJECTED. At most 4 bytes.
  uint32 result = 1;
}
message PlayerTradeOfferV1 { uint32 definition = 1; uint32 count = 2; uint32 sub_type = 3; }
message PlayerTradeStateV1 {
  bytes trade_id = 1; // Server-issued only once READY, opaque 16 bytes.
  TradePartnerV1 partner = 2;
  PlayerTradeOfferV1 own = 3;
  PlayerTradeOfferV1 counter = 4; // Only after the viewer offers their own item.
  bool own_accepted = 5;
  bool partner_accepted = 6;
  uint32 phase = 7; // OFFERED=1, READY=2, TRANSFERRING=3, CLOSED=4
  uint32 reason = 8; // open=0, COMPLETED=1, CANCELLED=2, NO_ROOM=3, STALE=4, REJECTED=5
  string message = 9; // At most 256 UTF-8 bytes.
  string look = 10; // At most 4096 UTF-8 bytes; read-only leaf inspection.
}
