// FIRST-CONTROL-WIRE-V1 (#642 owner acceptance 5853424280): typed payloads of command type 1
// WORLD_ACTOR_STEP_INTENT and state domain 1 WORLD_SPATIAL_VISIBILITY (delta type 1, snapshot
// type 1). FND-02 envelopes own CommandRef, server sequence, domain ID and revisions; these
// payloads never duplicate them. Unknown fields, zero and unknown enum values fail closed.
syntax = "proto3";

package oteryn.protocol.v1.world_spatial;

enum StepDirection {
  STEP_DIRECTION_UNSPECIFIED = 0;
  STEP_DIRECTION_NORTH = 1;
  STEP_DIRECTION_EAST = 2;
  STEP_DIRECTION_SOUTH = 3;
  STEP_DIRECTION_WEST = 4;
}

// ClientCommand.payload of command type 1. At most 4 encoded bytes.
message WorldActorStepIntentV1 {
  StepDirection direction = 1;
}

enum StepDisposition {
  STEP_DISPOSITION_UNSPECIFIED = 0;
  STEP_DISPOSITION_MOVED = 1;
  // Destination is not walkable or outside the active room.
  STEP_DISPOSITION_BLOCKED = 2;
  // The actor is not eligible or the binding is stale.
  STEP_DISPOSITION_REJECTED = 3;
  // A second step requested while one already waits in the one-step pacing buffer (CONDITIONS-0
  // §4.3). Sent only to a session that selected capability 13 PACED_MOVEMENT_V1; without it the
  // same request is STEP_DISPOSITION_REJECTED. Either way the CommandResult status is REJECTED
  // and nothing moves.
  STEP_DISPOSITION_TOO_EARLY = 4;
}

// CommandResult.payload of command type 1: outcome only, never state. At most 4 bytes.
message WorldActorStepResultV1 {
  StepDisposition disposition = 1;
}

// Native-frame coordinates of the Channel's pinned frame binding.
message ActorPositionV1 {
  sint32 x = 1;
  sint32 y = 2;
  // Limited to the int16 range.
  sint32 floor = 3;
}

// StateDelta.payload of domain 1, delta type 1. At most 64 bytes; exactly one actor (own).
message WorldSpatialDeltaV1 {
  // The active client artifact digest. Applied only when equal to the loaded generation.
  bytes content_generation = 1;
  ActorPositionV1 actor_position = 2;
}

// StateDomainSnapshot.payload of domain 1, snapshot type 1: a complete own-actor baseline.
message WorldSpatialSnapshotV1 {
  bytes content_generation = 1;
  ActorPositionV1 actor_position = 2;
}

// ---------------------------------------------------------------------------------------------
// VIS-2 (MOVE-RL-11-VISIBILITY-V1, D84-D87): the second schema revision of domain 1, snapshot type
// 2 and delta type 2, gated by the optional capability 6 WORLD_SPATIAL_ENTITIES. A session that
// did not select the capability receives only the v1 types above (own actor). Payloads are at
// most 33,792 bytes (256 entries x 128 B + 1,024 B header). Unknown, repeated and kind-
// inconsistent fields, duplicate identities and zero or unknown enum values fail closed.
// ---------------------------------------------------------------------------------------------

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_CREATURE = 2;
  ENTITY_KIND_CORPSE = 3;
  ENTITY_KIND_GROUND_ITEM = 4;
}

// Identity of an entity that leaves. Same field numbers as the identity fields of the entry.
message EntityRefV1 {
  // The 16-byte interest index identity.
  bytes identity = 1;
  // The actor generation; absent (0) for corpses and ground items.
  uint64 generation = 2;
}

// At most 128 encoded bytes. Players and creatures carry fields 5-7 and no fields 8-10; corpses and
// ground items carry fields 8-9 (and 10 under capability 4) and no fields 3, 5-7.
message WorldSpatialEntityV1 {
  EntityKind kind = 1;
  bytes identity = 2;
  uint64 generation = 3;
  ActorPositionV1 position = 4;
  // Required for actors: NORTH..WEST.
  StepDirection direction = 5;
  uint32 appearance_ref = 6;
  // 0..=100.
  uint32 health_percent = 7;
  // Required for objects, non-zero.
  uint32 item_definition_ref = 8;
  // Required for objects, at least 1.
  uint32 quantity = 9;
  // ITEM-MOVE-WIRE-0 §4.1 (D212): the object's item handle (item_view_v1.proto ItemTargetV1),
  // non-zero. Sent, and required for objects, only to a session that selected capability 4
  // ITEM_VIEW_MOVE_V1; never on actors. Any other session receives the entry without it, and
  // field 10 fails closed there.
  uint64 item_handle = 10;
}

// StateDomainSnapshot.payload of domain 1, snapshot type 2. At most 256 entities (MOVE-RL-11),
// which include the own player: kind PLAYER, identity == own_identity, position == actor_position.
message WorldSpatialEntitiesSnapshotV2 {
  bytes content_generation = 1;
  ActorPositionV1 actor_position = 2;
  bytes own_identity = 3;
  repeated WorldSpatialEntityV1 entities = 4;
}

// StateDelta.payload of domain 1, delta type 2. enter + update + leave is at most 256 (MOVE-RL-08);
// a larger change is sent as a snapshot. An identity appears at most once across the three lists.
message WorldSpatialEntitiesDeltaV2 {
  bytes content_generation = 1;
  ActorPositionV1 actor_position = 2;
  repeated WorldSpatialEntityV1 enter = 3;
  repeated WorldSpatialEntityV1 update = 4;
  repeated EntityRefV1 leave = 5;
}
