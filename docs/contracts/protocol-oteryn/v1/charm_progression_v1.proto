syntax = "proto3";
package oteryn.protocol.v1;
// Capability 67 BESTIARY_CHARM_PROGRESSION_V1, command 84 (PARITY-PROGRESSION-QUERIES-1).
// Strict bounded codec: duplicate/unknown fields refused; zero fields omitted.
// Views: BestiaryViewV1 and CharmViewV1 of charm_bestiary_v1.proto, as of the reply.
message CharmProgressionRequestV1 {
  uint32 action = 1; // 1 query, 2 unlock next stage, 3 assign, 4 remove, 5 reset all
  uint32 charm = 2; // 1..=32; absent on query/reset all
  uint32 race = 3; // 1..=1024; present only on assign
  uint32 expected_stage = 4; // 0..=2; only on unlock
}
message CharmProgressionReplyV1 {
  uint32 action = 1; // the request action
  uint32 disposition = 2; // CharmUnlock/CharmAssign result codes; remove: 1 removed,
                          // 2 not assigned, 3 not enough gold, 4 change does not fit,
                          // 5 unknown charm, 6 rejected; query: 1
  uint64 fee_gold = 3; // non-zero exactly on remove or reset all / removed, <= i64::MAX
  bytes bestiary = 4; // BestiaryViewV1, <= 21504 bytes
  bytes charms = 5; // CharmViewV1, <= 554 bytes
}

// WB2/P01 action 5 resets all stages and assignments and refunds earned balances.
// Price: 100000 through level 100; above it 100000 + level*11000; Expansion pays 75%.
// Crystal src/io/iobestiary.cpp:648-672. Dispositions reuse remove codes; success=1.
// Reset retains promotion and Expansion. Premium without Expansion has six slots
// (Crystal src/io/iobestiary.cpp:603-607); Free two; Expansion unlimited.
// Expansion purchase stays PENDING PLATFORM: migration 0568 is the existing durable hook;
// the Platform Store producer must grant that character entitlement through its accepted
// commercial/control-plane integration. Game exposes no player-grant command or Store purchase.

// O072 catalogue extension, command 84 / capability 67. This read-only request
// is distinguished before the legacy protobuf decoder by the seven-byte body:
// ff 01, after:u16le, race:u16le, category:u8. Race 0 browses canonical race
// ordinals after `after`; a positive race requests its card and uses `after`
// as the loot offset. Category 0 means all, otherwise a 1-based category index.
// The active generation supplies names, classes, combat facts and base loot.
// These public definition facts grant no discovery, charm or gameplay authority.
// Request <=7 bytes; the response retains the existing command reply byte limit.
// Legacy request/reply bytes and all progression mutation guards are unchanged.
message BestiaryCataloguePageV1 {
  optional uint32 next = 1; // positive race ordinal or loot offset, <=8192
  repeated BestiaryCatalogueCardV1 cards = 2; // <=20, strictly ascending race
  repeated string categories = 3; // <=64 unique ascending names, <=128 UTF-8 bytes each
}
message BestiaryCatalogueCardV1 {
  uint32 outfit_look_type = 5; // 0 if unavailable or object appearance
  optional uint32 object_look_type = 6; // nonzero; mutually exclusive with outfit
  uint32 race = 1; // 1..1024, the same canonical ordinal used for charm assignment
  string name = 2; // 1..128 UTF-8 bytes
  string category = 3; // an exact member of the page categories
  string detail = 4; // <=16000 UTF-8 bytes; empty on browse pages
}

// T081: command 84 also accepts ff 02 after:u8 (0..32) for paged charm
// descriptions. Reply uses BestiaryCataloguePageV1: card.race is the 1-based
// charm index in the same catalogue as progression; name is derived from its
// canonical key, category Major/Minor, detail contains effect rules and all
// stage values/costs. Appearance fields are absent. Cursor equals the last index.
// This read uses the same admitted actor/generation fence as ff 01.
// ff 03 followed by 1..5 strictly ascending nonzero race:u16le IDs (<=1024)
// returns their active creature catalogue cards in the same page shape, no cursor.
// The client batches confirmed discovered races to name the eligible race selector.
