// USE-WIRE-V1 (#162 owner acceptance 5864914163): typed payloads of command type 2
// USE_INTENT and state domain 2 WORLD_OBJECT_OVERLAY (delta type 1, snapshot type 1).
// The client sends intent only; the server selects the unique bound transition out of
// the object's current state. Zero or more than one candidate transition fails closed;
// replay is handled by the FND-02 CommandId and staleness by expected_revision. FND-02
// envelopes own CommandRef, server sequence, domain ID and revisions; these payloads
// never duplicate them. Unknown fields, zero and unknown enum values, and a
// content_generation other than 32 bytes all fail closed.
syntax = "proto3";

package oteryn.protocol.v1.world_object;

import "item_view_v1.proto";
import "world_spatial_v1.proto";

// A world-object target: the placement key of the object and the overlay revision the
// client last observed. Both are bounded by FIRST_PRODUCTION_MAX_KEY_BYTES / u64.
message WorldObjectTargetV1 {
  bytes placement = 1;
  uint64 expected_revision = 2;
}

// ClientCommand.payload of command type 2. At most 529 encoded bytes (ITEMUSE0-RL-03 keeps
// the bound under capability 15). Field 2, the item target, is ITEM-MOVE-WIRE-0 §4.3 (D212):
// a handle-bearing item, gated by capability 4 ITEM_VIEW_MOVE_V1; a session that did not
// select it and sends field 2 fails closed. Fields 4 and 5 are ITEM-USE-0 §3 (ITEM-USE-WIRE-1,
// D485), gated by capability 15 ITEM_USE_V1 (which requires 4); a session that did not
// select it and sends either fails closed (REJECTED). Field 4 is valid only with field 2 or
// 5, at most once, with a 16-byte identity and a non-zero generation. Field 3 stays reserved.
message UseIntentV1 {
  oneof target {
    WorldObjectTargetV1 world_object = 1;
    oteryn.protocol.v1.item_view.ItemTargetV1 item = 2;
    ItemByDefinitionV1 item_by_definition = 5;
  }
  oteryn.protocol.v1.world_spatial.EntityRefV1 use_with = 4;
  reserved 3;
}

// An item named by its 1-based definition index in the active content generation (the
// client's hotkey use); zero, absent or above u32 fails closed.
message ItemByDefinitionV1 {
  uint32 definition_index = 1;
}

enum UseDispositionV1 {
  USE_DISPOSITION_UNSPECIFIED = 0;
  USE_DISPOSITION_COMMITTED = 1;
  USE_DISPOSITION_NOTHING_TO_USE = 2;
  USE_DISPOSITION_OCCUPIED = 3;
  USE_DISPOSITION_STALE_STATE = 4;
  USE_DISPOSITION_TOO_FAR = 5;
  USE_DISPOSITION_REJECTED = 6;
  // 7 to 10 are sent only to a session that selected capability 15 ITEM_USE_V1.
  USE_DISPOSITION_REQUIREMENT_NOT_MET = 7;
  USE_DISPOSITION_EXHAUSTED = 8;
  USE_DISPOSITION_FULL = 9;
  USE_DISPOSITION_NO_TARGET = 10;
}

// CommandResult.payload of command type 2: outcome only, never state. At most 4 bytes.
message UseResultV1 {
  UseDispositionV1 disposition = 1;
}

// One world-object overlay entry: the state is a state key, not an Open/Closed enum,
// because CW4 (#1055) is N-state.
message WorldObjectOverlayEntryV1 {
  // The active client artifact digest. Applied only when equal to the loaded generation.
  bytes content_generation = 1;
  bytes placement = 2;
  bytes state = 3;
  uint64 revision = 4;
}

// StateDelta.payload of domain 2, delta type 1: exactly one changed overlay entry
// (WOBJ-RL-02 = 1). At most 1,078 bytes.
message WorldObjectOverlayDeltaV1 {
  repeated WorldObjectOverlayEntryV1 entries = 1;
}

// StateDomainSnapshot.payload of domain 2, snapshot type 1: every changed overlay in
// scope, bounded by WOBJ-RL-03. At most 523,908 bytes.
message WorldObjectOverlaySnapshotV1 {
  repeated WorldObjectOverlayEntryV1 entries = 1;
}
