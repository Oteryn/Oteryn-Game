syntax = "proto3";
package oteryn.protocol.v1;

// BOSS-ENCOUNTER-1, owner decisions 23 and 24. Capability 117, command 133.
// Server-only implementation. This capability exposes the cooldown read path;
// it does not advertise activity-instance admission or reward delivery.
message BossCooldownQueryV1 {
  // Empty starts the list. Otherwise the previous page's next_after_boss_key.
  // Strictly bounded to a production key (512 UTF-8 bytes), in C sort order.
  string after_boss_key = 1;
}
message BossCooldownEntryV1 {
  string boss_key = 1;
  uint64 available_at_unix_ms = 2;
}
message BossCooldownListV1 {
  uint64 now_unix_ms = 1;
  // At most 64 rows of this admitted Character, including expired cooldowns.
  repeated BossCooldownEntryV1 entries = 2;
  // Empty if exhausted; otherwise the last key returned. Live keyset pagination:
  // concurrent admissions may appear on later queries, no snapshot is promised.
  string next_after_boss_key = 3;
}

// Command 340. Identity and World come exclusively from the admitted session.
message BossRewardOpenV1 {}
message BossRewardGroupV1 {
  bytes death_id = 1;
  string boss_key = 2;
  uint64 minted_at_unix_ms = 3;
  uint64 expires_at_unix_ms = 4;
  uint32 item_count = 5;
}
message BossRewardChestV1 {
  uint64 now_unix_ms = 1;
  // Oldest first, at most 64 groups. Expired groups are never exposed.
  repeated BossRewardGroupV1 entries = 2;
}

// Reserved staged commands 178 (lever), 179 (defeated), 180 (timeout).
// Every request remains refused: the activity handoff, InstanceRuntime and
// return/recovery owner are not installed. Capability 117 also retains hazard 169.
// The client supplies no party, policy, position, level, cooldown, death or timeout facts.
message BossLeverRequestV1 { string boss_key = 1; }
message BossInstanceReceiptV1 {
  bytes instance_id = 1; // opaque 16-byte UUID
  uint64 deadline_unix_ms = 2;
}
// Reserved terminal schemas are not client authority to manufacture a death or timeout.
// A future runtime owner must bind the exact instance, live boss generation and occurrence.
message BossTerminalRequestV1 { string boss_key = 1; }
message BossTerminalResultV1 { bool settled = 1; }
