syntax = "proto3";
package oteryn.protocol.v1;
// action: 1 Click, 2 LootAll, 3 Assign, 4 FilterAdd, 5 FilterRemove, 6 FilterClear, 7 FilterSelect.
// filter_mode: 1 skipped-list mode, 2 accepted-list mode; definition_ref uses the admitted Item index.
// Command 114 (capability 98). Both target fields carry 16-byte UUIDs.
message QuickLootRequestV1 {
  uint32 action = 1;
  bytes corpse = 2; // Corpse item UUID or the corpse UUID published by the spatial view.
  uint32 category = 3;
  uint32 recipient = 4;
  bytes recipient_id = 5; // Item UUID of the carried container or Gold Pouch.
  bool fallback_to_main = 6;
  uint32 filter_mode = 7;
  uint32 filter_definition_ref = 8;
}

// Command 6253 requires selected capability 516. Command 114 keeps its UUID
// encoding on the same session. Handles are nonzero session-local item IDs
// encoded as big-endian u64 values zero-extended to 16 bytes.
message QuickLootHandleRequestV1 {
  uint32 action = 1;
  bytes corpse = 2; // Visible spatial corpse item handle for Click.
  uint32 category = 3;
  uint32 recipient = 4;
  bytes recipient_id = 5; // Visible carried-container or Gold Pouch item handle for Assign.
  bool fallback_to_main = 6;
  uint32 filter_mode = 7;
  uint32 filter_definition_ref = 8;
}
message QuickLootItemResultV1 { bytes item = 1; bool accepted = 2; }
message QuickLootResultV1 { repeated QuickLootItemResultV1 items = 1; }
