syntax = "proto3";
package oteryn.protocol.v1;
// action: 1 Click, 2 LootAll, 3 Assign, 4 FilterAdd, 5 FilterRemove, 6 FilterClear, 7 FilterSelect.
// filter_mode: 1 skipped-list mode, 2 accepted-list mode; definition_ref uses the admitted Item index.
message QuickLootRequestV1 { uint32 action = 1; bytes corpse = 2; uint32 category = 3; uint32 recipient = 4; bytes recipient_id = 5; bool fallback_to_main = 6; uint32 filter_mode = 7; uint32 filter_definition_ref = 8; }
message QuickLootItemResultV1 { bytes item = 1; bool accepted = 2; }
message QuickLootResultV1 { repeated QuickLootItemResultV1 items = 1; }
