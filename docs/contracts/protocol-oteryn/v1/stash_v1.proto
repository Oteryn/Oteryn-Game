syntax = "proto3";
package oteryn.game.v1;

// Additive capability 62, command 79, domain 27. Requires native DEPOT_V1 (37).
// Definition identities and row versions come only from the server's open page.
message StashIntentV1 {
  uint32 page = 1; // 0..14999
  uint32 action = 2; // 1 browse, 2 whole-item stow, 3 withdraw
  // 4 stow a quantity, 5 stow matching stacks, 6 stow container contents.
  // Actions 4..6 require capability 591.
  optional uint64 item_handle = 3; // stow only
  optional bytes row_handle = 4; // withdraw only; exact 16-byte last_entry_id
  optional uint32 amount = 5; // withdraw: 1..20*stack_max; quantity stow: 1..100
  optional StashFilterV1 filter = 6; // fresh view only; excluded from conversion receipt identity
}
message StashFilterV1 {
  string search = 1; // <=128 UTF-8 bytes, case-insensitive name/key substring
  string category = 2; // <=128 bytes; admitted item type, weapon type or equipment slot
  string trader = 3; // <=128 bytes; admitted buyer name substring (BuyFromPlayer offers)
  bool stock_order = 4; // descending quantity; otherwise ascending pinned name
}
message StashRowV1 {
  bytes handle = 1;
  string definition_key = 2; // 1..512 UTF-8 bytes
  string definition_revision = 3; // 1..512 UTF-8 bytes
  uint32 quantity = 4; // 1..1,000,000,000
  bool migration_required = 5;
}
message StashReplyV1 {
  uint32 outcome = 1; // 1 opened, 2 committed, 3 no locker, 4 stale, 5 no room,
  // 6 no backpack, 7 overweight, 8 unsupported, 9 rejected, 10 Premium required,
  // 11 amount limit, 12 insufficient balance.
  optional bytes transaction = 2; // immutable receipt identity; unchanged on replay
  uint32 page = 3;
  bool has_more = 4;
  repeated StashRowV1 rows = 5; // <=32, unique handles; order is server-selected by the view criteria
  string message = 6; // deterministic native message for outcome
  uint32 stowed_quantity = 7; // success stow only, 1..100 legacy or 1..50000 for actions 5/6
}
// Base conversion intent <=48 bytes; request with view criteria <=460 bytes; result/page delta <=36,000 bytes. Canonical decoding rejects
// duplicate/unknown fields, cross-action fields, zero quantities and invalid pages.
// Domain 27/type 1 replaces the complete page. Its revision is connection-local.
// Browse reopens after reconnect/resync. Row handles are invalidated by value
// changes or another mechanic command. Every mutation rechecks locker reach.
// Receipt fields (transaction, outcome) are durable. Page rows are a fresh view
// and are omitted outside reach, including on a historical receipt replay.
// Existing domain 9/11/14 inventory refresh follows a committed conversion.
// Native rules follow tibia.com news 8076: Free, current Premium and expired
// Premium accounts may stow and withdraw. They otherwise differ intentionally
// from the pinned OTS implementations: whole main-bag sources, 20 output
// stacks, atomic full withdrawal, no top-up/loot routing. Historical durable
// PremiumRequired receipts remain decodable but are never produced anew.

// Filters apply before pagination across all balances. Metadata is derived from the
// active item pin and admitted NPC offers. Unmatched/old revisions remain visible
// with empty criteria and remain searchable by key. Category/trader criteria
// select only known matching metadata.
// Conversion receipts retain their original canonical base intent; view criteria
// never select a definition to mint or change a durable receipt.

// Action 4 takes the requested units from the selected carried stack, retaining
// the source's identity and placement when a remainder stays. An amount above
// the current stack is INSUFFICIENT. Action 5 selects all eligible stacks with
// the same exact definition/revision in the main-backpack tree. Action 6 stows
// every eligible descendant of the selected carried container (including the
// main backpack), preserving containers and the ineligible contents.
// A batch is atomic. Its first ledger receipt identifies the original result,
// whose total counts all units stowed by that command. It uses the same
// authoritative locker/Steward, inventory and session fences as a legacy stow.
// Crystal 201189f player.cpp:9521-9635 and protocolgame.cpp:10232-10254 cover the
// three source actions. Oteryn limits them to its fenced carried stash owner.

// Command 6345 requires capability 591. The row must be on the open page and
// still be the positive current balance version for this Character and World.
// 1 returns the Item reference for Cyclopedia inspection. 2 returns the
// reference for Market Book (requires capability 63). 3/4 add/remove the
// resolved definition in the active Quick Loot list (requires capability 98).
// List modifications are fenced and receipted. They preserve the selected
// list mode, recipients and stash balance. No durable identity is returned.
message StashRowIntentV1 {
  uint32 action = 1;
  bytes row_handle = 2; // nonzero version, exactly 16 bytes
}
// Common ACCEPTED carries the admitted generation's Item reference. Common
// REJECTED with empty payload is the generic "Sorry, not possible." refusal.
// The reply does not close the stash page. The client opens its existing
// Cyclopedia or Market view using the returned reference.
message StashRowResultV1 {
  uint32 definition_ref = 1; // nonzero
}
