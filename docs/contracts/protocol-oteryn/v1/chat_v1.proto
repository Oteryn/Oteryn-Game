// CHAT-0 §7 (CHAT0-LOCAL-PRIVATE-WORLD-ROOMS-V1, docs/architecture/reviews/
// OTERYN_GAME_CHAT0_PLAYER_CHAT_DECISION_2026-09-30.md): typed payloads of capability 7 CHAT_V1,
// command type 13 CHAT_INTENT and state domain 12 CHAT (snapshot type 1, delta types 1 and 2).
// Numbers leased to CHAT-1 by the #162 control plane. FND-02 envelopes own CommandRef, server
// sequence, domain ID and revisions; these payloads never duplicate them. Clients see a local
// speaker as its spatial identity and name, and a room or private speaker by name, never its
// CharacterId (FND-02 §10). Unknown fields, repeated singular fields, more than one intent, zero
// and unknown enum values, fields that do not belong to a line's kind, and values outside the
// declared bounds all fail closed. A string is UTF-8; text is 1..=1020 bytes (CHAT0-RL-01) and a
// name 1..=120 bytes (CHAT1-RL-01). The server also trims text and refuses control characters (CHAT-0 §4).
syntax = "proto3";

package oteryn.protocol.v1.chat;

enum ChatSpeechMode {
  CHAT_SPEECH_MODE_UNSPECIFIED = 0;
  CHAT_SPEECH_MODE_SAY = 1;
  CHAT_SPEECH_MODE_WHISPER = 2;
  CHAT_SPEECH_MODE_YELL = 3;
}

enum ChatRoom {
  CHAT_ROOM_UNSPECIFIED = 0;
  CHAT_ROOM_WORLD = 1;
  CHAT_ROOM_ENGLISH = 2;
  CHAT_ROOM_HELP = 3;
  CHAT_ROOM_ADVERTISING = 4;
}

message ChatSayV1 {
  ChatSpeechMode mode = 1;
  string text = 2;
}

message ChatPrivateV1 {
  string recipient_name = 1;
  string text = 2;
}

message ChatRoomLineV1 {
  ChatRoom room = 1;
  string text = 2;
}

message ChatRoomRefV1 {
  ChatRoom room = 1;
}

// ClientCommand.payload of command type 13: exactly one intent; an empty one is refused.
// At most 1148 bytes (a private message: 120-byte name and 1020-byte text).
message ChatIntentV1 {
  oneof intent {
    ChatSayV1 say = 1;
    ChatPrivateV1 private_message = 2;
    ChatRoomLineV1 room = 3;
    ChatRoomRefV1 open_room = 4;
    ChatRoomRefV1 close_room = 5;
    ChatGuildSendV1 guild = 6; // requires capability 36
    ChatPrivateChannelCreateV1 private_channel_create = 7;   // requires capability 80
    ChatPrivateChannelNameV1 private_channel_invite = 8;     // requires capability 80
    ChatPrivateChannelNameV1 private_channel_exclude = 9;    // requires capability 80
    ChatPrivateChannelRefV1 private_channel_join = 10;       // requires capability 80
    ChatPrivateChannelRefV1 private_channel_leave = 11;      // requires capability 80
    ChatPrivateChannelSayV1 private_channel_say = 12;        // requires capability 80
    ChatChannelListRequestV1 channel_list = 13;              // requires capability 80
  }
}

enum ChatDisposition {
  CHAT_DISPOSITION_UNSPECIFIED = 0;
  CHAT_DISPOSITION_OK = 1;               // sent; for a private or room line: the relay accepted it
  CHAT_DISPOSITION_MUTED = 2;            // wait_seconds until the mute ends
  CHAT_DISPOSITION_EXHAUSTED = 3;        // wait_seconds until the yell or Advertising cooldown ends
  CHAT_DISPOSITION_LEVEL_TOO_LOW = 4;
  CHAT_DISPOSITION_NOT_ONLINE = 5;
  CHAT_DISPOSITION_NO_VOCATION = 6;
  CHAT_DISPOSITION_ROOM_NOT_OPEN = 7;
  CHAT_DISPOSITION_CHAT_UNAVAILABLE = 8; // the World relay is not ready
  CHAT_DISPOSITION_REJECTED = 9;         // malformed intent or text, ineligible actor
  CHAT_DISPOSITION_NOT_ALLOWED = 10; // capability 36; committed non-member. Capability 80: create without Premium, invite or exclude without an own channel
  CHAT_DISPOSITION_NOT_INVITED = 11; // capability 80: no invitation to the channel, or no such channel
}

// CommandResult.payload of command type 13: outcome only. At most 8 bytes.
message ChatIntentResultV1 {
  ChatDisposition disposition = 1;
  uint32 wait_seconds = 2; // 1..=1280 with MUTED and EXHAUSTED only (5 s x 16^2, CHAT0-RL-04)
}

// StateDomainSnapshot.payload of snapshot type 1 and StateDelta.payload of delta type 2: the
// whole set of rooms the session has open; a delta replaces it. At most 4 bytes.
message ChatRoomsV1 {
  uint32 open_rooms = 1; // bit (room - 1) per open ChatRoom; bits 4 and up exceed CHAT0-RL-07
}

enum ChatLineKind {
  CHAT_LINE_KIND_UNSPECIFIED = 0;
  CHAT_LINE_KIND_LOCAL = 1;   // fields 2, 3, 4, 5, 7, 8
  CHAT_LINE_KIND_PRIVATE = 2; // fields 4, 7
  CHAT_LINE_KIND_ROOM = 3;    // fields 4, 6, 7
  CHAT_LINE_KIND_DROPPED = 4; // no other field: lines were dropped by the egress bound (CHAT0-RL-11)
  CHAT_LINE_KIND_GUILD = 5; // capability 36: fields 4, 7, 9, 10 only
  CHAT_LINE_KIND_PRIVATE_CHANNEL = 6; // capability 80: fields 4, 7, 11 only
}

// Same encoding as world_spatial ActorPositionV1; floor 0..=15.
message ChatPositionV1 {
  sint32 x = 1;
  sint32 y = 2;
  sint32 floor = 3;
}

// StateDelta.payload of delta type 1: one line. A whisper heard from beyond an adjacent tile
// carries the text "pspsps". At most 1194 bytes (a local line).
message ChatLineV1 {
  ChatLineKind kind = 1;
  bytes speaker_identity = 2;    // the 16-byte spatial identity (world_spatial EntityRefV1)
  uint64 speaker_generation = 3; // the speaker's actor generation; never 0 on a local line
  string speaker_name = 4;
  ChatSpeechMode mode = 5;
  ChatRoom room = 6;
  string text = 7;
  ChatPositionV1 position = 8;   // where the line was spoken; always present on a local line
  bytes guild_id = 9; // capability 36, kind 5 only; 16-byte UUIDv7
  uint32 guild_rank = 10; // capability 36, kind 5 only; send-time rank 1..20
  uint32 channel_id = 11; // capability 80, kind 6 only; 1..=65535
}

// GUILD-CHAT-1, Integrator decision 2026-10-22: capability 36 CHAT_GUILD_ROOM_V1
// requires 7. Only selected peers use intent tag 6, disposition 10, line kind 5
// and snapshot type 2. Public ChatRoom and ChatRoomsV1 bytes are unchanged.
// NOT_ALLOWED is common CommandStatus ACCEPTED, wait_seconds=0; no new ErrorCode.
// Line acceptance under fresh Guild/session custody is the delivery boundary:
// an accepted line may finish socket I/O after exclusion commits. No receipts/history.
message ChatGuildSendV1 { string text = 1; } // no client destination, rank or name

// Domain 12 snapshot type 2 replaces type 1 only for capability 36. At most 1049
// bytes. No author/synthetic sender, Channel, position, Account or CharacterId.
message GuildChatSnapshotV1 {
  ChatRoomsV1 rooms = 1;
  uint32 state = 2; // 1 absent, 2 unavailable, 3 member; zero/unknown rejected
  bytes guild_id = 3; // UUIDv7, exactly 16 bytes; member only
  uint32 rank = 4; // 1..20; member only
  string motd = 5; // present even empty; member only, <=1020 bytes / 255 scalars
}

// CHAT-PM-CHANNELS-1, coordinator lane NIGHT-W1 2026-10-25: capability 80
// CHAT_PRIVATE_CHANNEL_V1 requires 7. Only selected peers use intent tags 7..=13,
// disposition 11, line kind 6 and delta type 3; every CHAT_V1 byte is unchanged
// without selection. A private channel lives in the memory of one Channel: its owner,
// invitations and members are sessions of that Channel, it closes when its owner
// leaves it or its session ends, and nothing is stored. A channel is named by its
// Channel-local number 1..=65535, never by a CharacterId. Lines pass the CHAT_V1
// limiter (mute and bucket) and text rule; they are delivered to the joined members,
// the speaker included. Results are common status ACCEPTED with wait_seconds=0
// except MUTED and EXHAUSTED.
message ChatPrivateChannelCreateV1 {} // Premium only; one own channel per session
message ChatPrivateChannelNameV1 { string name = 1; } // 1..=120 bytes; an online session of this Channel
message ChatPrivateChannelRefV1 { uint32 channel_id = 1; } // 1..=65535
message ChatPrivateChannelSayV1 {
  uint32 channel_id = 1; // 1..=65535
  string text = 2;       // 1..=1020 bytes
}
message ChatChannelListRequestV1 {} // answered by one delta type 3

message ChatInvitedChannelV1 {
  uint32 channel_id = 1; // 1..=65535
  string owner_name = 2; // 1..=120 bytes
}

// StateDelta.payload of delta type 3 (capability 80): the whole channel list; a delta
// replaces it. At most 2054 bytes (16 invitations, CHATPM-RL-02).
message ChatChannelListV1 {
  uint32 public_rooms = 1; // ChatRoomsV1 bits of the rooms that can be opened; absent when none
  uint32 own_channel = 2; // the session's own channel; absent when it has none
  repeated ChatInvitedChannelV1 invited = 3; // at most 16, distinct, never the own channel
}
