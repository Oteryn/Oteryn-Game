syntax = "proto3";
package oteryn.events.v2;

// Event type 9; ECONOMY_LEDGER_RETENTION_V1 (P30D). Success only.
// Schema1 remains unchanged: item/value lines are CONVERSION (class=1).
// Schema2 adds Task Board consumption only: zero item lines and one BURN
// value line (class=2). No replacement ItemInstance or generic debit is admitted.
message StashItemLineV1 {
 bytes item = 1;
 string definition_key = 2;
 string definition_revision = 3;
 uint32 quantity = 4;
 uint32 direction = 5; // 1 input, 2 output
 uint32 class = 6; // 1 CONVERSION
}
message StashValueLineV1 {
 bytes entry = 1;
 string asset = 2; // stash:<definition_key>@<definition_revision>
 bytes character = 3;
 bytes world = 4;
 uint32 kind = 5; // schema1: 1 stow, 2 withdraw; schema2: 3 Task Board consumption
 uint32 class = 6; // schema1: 1 CONVERSION; schema2: 2 BURN, only kind3
 uint32 amount = 7;
 uint64 quantity_before = 8;
 uint64 quantity_after = 9;
}
message StashOperationV1 {
 uint32 interpretation_revision = 1; // schema1: 1; schema2: 2
 uint32 conversion_kind = 2; // schema1: 1 stow or 2 withdraw; schema2: 3 Task Board consumption; closed per schema
 bytes intent = 3; // schema1: canonical native stash intent <=48 bytes; schema2: original Task Board Deliver command <=192 bytes
 repeated StashItemLineV1 items = 4; // schema1: one input OR 1..20 outputs; schema2: empty
 StashValueLineV1 value = 5; // exactly one, same definition/revision as every item
}
