syntax = "proto3";
package oteryn.events.v2;

// Foundation event 8, schema 1; ECONOMY_LEDGER_RETENTION_V1. Each operation
// carries at most three ledger lines plus one changed bid custody line.
message HouseOperationV1 {
  bytes auction = 1;
  string house = 2;
  bytes account = 3;
  bytes character = 4;
  uint32 kind = 5; // 1 bid edit, 2 winner, 3 refund
  uint64 maximum = 6;
  uint64 first_rent = 7;
  uint64 price = 8;
  repeated HouseValueLineV1 lines = 9;
  uint64 escrow_before = 10;
  uint64 escrow_after = 11;
  uint32 eligibility_version = 12;
  repeated HouseEligibilityV1 eligibility = 13; // up to 256, captured under native locks
  optional bytes owner_before = 14; // present and empty on acquisition
  optional bytes owner_after = 15;
  optional bool slot_before = 16;
  optional bool slot_after = 17;
  optional uint64 ownership_before = 18;
  optional uint64 ownership_after = 19;
  optional int64 paid_until_unix_us = 20;
}
message HouseEligibilityV1 {
  bytes account = 1;
  bytes character = 2;
  uint64 maximum = 3;
  uint64 reached_order = 4;
  bool active = 5;
  bool account_matches = 6;
  bool world_matches = 7;
  uint32 level = 8;
  bool junior = 9;
  bool slot_occupied = 10;
  bool banned = 11;
  bool premium_allowed = 12; // Current or the real pre-delivery gate
  uint32 refusal = 13; // 0 eligible, 1 nomination, 2 junior, 3 level, 4 slot, 5 ban, 6 Premium
}
message HouseValueLineV1 {
  uint32 kind = 1; // 7 reserve, 8 release, 9 price burn, 10 rent burn
  uint64 amount = 2;
  uint64 balance_before = 3;
  uint64 balance_after = 4;
  uint64 escrow_before = 5;
  uint64 escrow_after = 6;
}
