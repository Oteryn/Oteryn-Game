syntax = "proto3";
package oteryn.events.v1;

// D1118: target session belongs only in EventEnvelope.game_session_id.
// No grant code, account, position or observation payload is audited here.
message SpectateObservationV1 {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    GRANT_CREATED = 1;
    GRANT_ENDED = 2;
    OBSERVER_ADMITTED = 3;
    OBSERVER_ENDED = 4;
  }
  enum EndReason {
    END_REASON_UNSPECIFIED = 0;
    REVOKED = 1;
    TARGET_GONE = 2;
    TARGET_MOVED = 3;
    OVERLOAD = 4;
    NOT_OBSERVABLE = 5;
    OBSERVER_STOPPED = 6;
  }
  Kind kind = 1;
  // UUID bytes; present exactly for observer events.
  optional bytes observer_session_id = 2;
  // Unspecified exactly for non-terminal events.
  EndReason end_reason = 3;
}
