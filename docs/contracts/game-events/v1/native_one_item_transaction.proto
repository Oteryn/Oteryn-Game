syntax = "proto3";

package oteryn.events.v1;

// DUR-03 §39.3 native one-item transaction durable-audit payload.
// Registered as GAME_EVENT_FOUNDATION_REGISTRY.json event type 2
// (DUR03_NATIVE_ONE_ITEM_TRANSACTION), payload message OneItemTransactionV1,
// retention profile DUR03_ONE_ITEM_DURABLE_AUDIT_RETENTION_V1 (P90D).
// The payload is carried as EventEnvelope.payload (foundation.proto); event,
// transaction, session and command identities stay owned by EventEnvelope.
//
// Resource maxima (RESOURCE_LIMITS_REGISTRY.json DUR03-RL-01..DUR03-RL-08;
// decision OTERYN_GAME_DUR03_RESOURCE_MAXIMA_AND_CREATURE_DEATH_IDENTITY_DECISION_2026-09-28, D50/D51):
// one event per logical transaction; payload <= 7,936 B; EventEnvelope <= 9,216 B;
// content keys and revisions <= 512 B; technical fields <= 128 B; UUID fields
// exactly 16 B. Oversize input is rejected before allocation, never truncated.
//
// Excluded fail-closed (no field exists; an unknown field rejects by canonical
// round trip): item free text, value lines, transform inputs/outputs,
// container expansion and the direct-root inventory typed_position.
// TRANSFER is admitted only for the B3 destinations
// (reviews/OTERYN_GAME_B3_INVENTORY_DESTINATION_CAPACITY_AND_STACKS_DECISION_2026-09-28.md
// §4): the CharacterEquipment `container` slot, direct entries of the equipped
// main backpack, and the D83 full-merge and top-up shapes. DUR03-RL-01 and
// DUR03-RL-06 are 2 items / 2 participants / 6 work units for the merge shapes.
// Its source is a live Ground location or (D3-4, `corpse_source`) a direct
// entry of a live corpse container; the corpse item itself is never a source.
// The reward-claim MINT (operation tag 4, chest decisions §5.1, CHEST-1) mints
// exactly one live item into a new direct entry of the equipped main backpack
// for a `once` RewardClaim; it has no Ground and no creature-death source.
// The D3 corpse-loot MINT (D3-2, DUR-03 §39.4) is the same `mint` operation
// with its destination carried in `corpse_container_entry` (field 5) instead of
// the Ground `destination` (field 2): exactly one of the two is set, and the
// corpse's own MINT stays a Ground MINT. The D3-4 TRANSFER source widening is
// `OneItemTransferV1.corpse_source` (field 7).
// The D3-6 DECAY_RETIRE (operation tag 5, DUR-03 §39.1/§39.4, decision D136)
// retires one live corpse ItemInstance or one live entry of its container to
// RETIRED, quantity 0 and no location, under the closed `CorpseDecay` cause;
// a corpse decays as N+1 such one-item events (each entry, then the corpse
// once no live entry remains), never one multi-item event. It is server
// originated: no CommandRef, session or causation exists for it.
// The gold fee BURN (operation tag 6, GOLD-FEE-1a; DUR-03 §39.3 gold fee
// amendment, decision CHARACTER-GOLD-FEE-BOUNDARY-V1 §4.5, D174-D178) burns up
// to 20 coin stacks in direct entries of the equipped main backpack under the
// closed FeeBurnCause, in the fee source's Character transaction. It has its
// own rows DUR03-RL-01/-02/-06/-07-FEE-BURN (payload <= 25,398 B, EventEnvelope
// <= 25,712 B). GOLD-FEE-1b adds platinum and crystal inputs and the additive
// change fields 11-12 (at most a platinum and a gold change MINT); a GOLD-FEE-1a
// event decodes with change 0 and no change line.
// The timed expiry (operation tag 7, TIMED-RT-1b; DUR-03 §39.3 timed-item
// amendment, decision TIMEDITEM0B-RUNTIME-CHARGES-AND-DURATION-V1 §8/§12) is one
// server-originated event per expiry of one held timed item: an expiry
// TRANSFORM (PRESERVE_INSTANCE, in place, 1 input / 1 output) to its decay
// target, or an expiry burn to RETIRED from its container entry. Its own rows
// are DUR03-RL-*-TIMED*; payload and envelope stay within DUR03-RL-07.
// Historical game-events/v1/item_transaction.proto and
// game-events/v2/item_transaction.proto remain unchanged.

message OneItemTransactionV1 {
  uint32 interpretation_revision = 1; // exactly 1
  oneof operation {
    OneItemMintV1 mint = 2;
    OneItemTransferV1 transfer = 3; // B3 destinations only (see above)
    OneItemRewardClaimMintV1 reward_claim_mint = 4; // CHEST-1 only (see above)
    OneItemDecayRetireV1 decay_retire = 5; // D3-6 corpse decay only (see above)
    OneItemFeeBurnV1 fee_burn = 6; // coin fee BURN only (see above)
    OneItemTimedExpiryV1 timed_expiry = 7; // timed expiry only (see above)
  }
}

// Typed identity is carried in full; no numeric key substitutes for it.
message OneItemTypedDefinitionRevisionV1 {
  string family = 1;         // closed family name, <= 128 B
  string production_key = 2; // <= 512 B
  string revision_ref = 3;   // <= 512 B
}

message OneItemStateV1 {
  bytes item_instance_id = 1; // exactly 16-byte non-nil UUIDv7
  bytes world_id = 2;         // exactly 16-byte non-nil UUIDv7
  OneItemTypedDefinitionRevisionV1 definition = 3;
  uint32 quantity = 4;
  uint32 lifecycle = 5; // 1 = LIVE; 2 = RETIRED (TRANSFER full-merge source after, quantity 0)
}

message OneItemGroundV1 {
  bytes world_id = 1;                      // exactly 16-byte non-nil UUIDv7
  bytes channel_id = 2;                    // exactly 16-byte non-nil UUIDv7
  bytes spatial_position = 3;              // <= 128 B
  bytes corpse_ref = 4;                    // <= 128 B; provenance, not location authority
  string map_revision = 5;                 // <= 512 B
  string content_revision = 6;             // <= 512 B
  bytes native_room_placement_context = 7; // <= 128 B
  uint64 runtime_scope_ownership_generation = 8; // non-zero
}

message OneItemInventoryV1 {
  bytes character_id = 1; // exactly 16-byte non-nil UUIDv7
  // The direct-root typed_position is excluded fail-closed until its owner
  // defines it.
  reserved 2;
  reserved "typed_position";
  uint64 expected_session_generation = 3;      // expected binding, not live authority
  bytes expected_game_session_id = 4;          // exactly 16-byte non-nil UUIDv7
  uint64 expected_character_lease_generation = 5; // expected binding only
  // B3 destinations: exactly one of these, or neither for a full merge (the
  // source retires into the receiver).
  OneItemContainerEntryV1 container_entry = 6; // direct entry of the main backpack
  bool equipment_container_slot = 7;           // CharacterEquipment slot `container`
}

// Container { parent = main backpack, entry = placement ordinal } (B3 §4.1).
message OneItemContainerEntryV1 {
  bytes parent_item_instance_id = 1; // exactly 16-byte non-nil UUIDv7
  uint64 placement_ordinal = 2;      // non-zero; newest (highest) first
}

// D83 receiver: a compatible stack already in the main backpack. It shares
// the source's World and definition; quantities are item state, not value
// lines. Units are conserved: quantity_after - quantity_before equals the
// source's before - after quantity; quantity_after <= 100.
message OneItemReceiverV1 {
  bytes item_instance_id = 1; // exactly 16-byte non-nil UUIDv7
  OneItemContainerEntryV1 position = 2;
  uint32 quantity_before = 3;
  uint32 quantity_after = 4;
}

message OneItemCommandRefV1 {
  bytes game_session_id = 1; // exactly 16-byte non-nil UUIDv7
  uint64 command_id = 2;     // non-zero
}

// CREATURE-DEATH-OCCURRENCE-IDENTITY-V1 durable, restart-stable death key.
message CreatureDeathOccurrenceRefV1 {
  bytes world_id = 1;   // exactly 16-byte non-nil UUIDv7
  bytes channel_id = 2; // exactly 16-byte non-nil UUIDv7
  uint64 scope_ownership_generation = 3;
  uint32 actor_local_id = 4;
  uint64 actor_local_generation = 5;
}

// The loot output cause (death key, LootTableDefinitionRef, purpose key,
// deterministic draw ordinal) is stored in full; there is no hash-only equality.
message OneItemProvenanceV1 {
  string typed_cause = 1; // <= 128 B
  CreatureDeathOccurrenceRefV1 death_occurrence = 2;
  OneItemTypedDefinitionRevisionV1 loot_table = 3; // LootTableDefinitionRef
  string loot_purpose_key = 4; // <= 512 B
  uint32 draw_ordinal = 5;
  string content_revision = 6; // <= 512 B
  string ruleset_revision = 7; // <= 512 B
  string sim_revision = 8;     // <= 512 B
  OneItemCommandRefV1 command_ref = 9; // TRANSFER only; expected binding
}

// TRANSFER cause: typed_cause "ground_pickup_transfer", the revisions and the
// actual player CommandRef. Wire-compatible subset of OneItemProvenanceV1
// (same field numbers); the MINT-only death and loot fields 2-5 are absent.
message OneItemTransferCauseV1 {
  string typed_cause = 1;      // <= 128 B
  string content_revision = 6; // <= 512 B
  string ruleset_revision = 7; // <= 512 B
  string sim_revision = 8;     // <= 512 B
  OneItemCommandRefV1 command_ref = 9;
}

message OneItemMintV1 {
  OneItemStateV1 after = 1;
  // Exactly one of `destination` (Ground) and `corpse_container_entry` is set.
  OneItemGroundV1 destination = 2;
  OneItemProvenanceV1 source = 3;
  // Explicit semantic absence of a prior item; not a nil or zero identifier.
  bool before_semantically_absent = 4;
  // D3-2 corpse-loot MINT: Container { parent = the death's corpse
  // ItemInstance, entry = placement ordinal, 1..=16 }. The parent is the
  // corpse MINTed for the same death (source.death_occurrence); the World and
  // Channel of the event are those of that death.
  OneItemContainerEntryV1 corpse_container_entry = 5;
}

// D3-4 (DUR-03 §39.4 "Pickup source"): Container { parent = a live corpse
// ItemInstance, entry = placement ordinal } as a TRANSFER source. The corpse's
// own live Ground location stays carried in full because it is the scope
// authority of the source (World, Channel, ownership generation), exactly as
// `OneItemTransferV1.source` is for a Ground source. Additive: new message,
// new field number; every existing field and golden byte is unchanged.
message OneItemCorpseSourceV1 {
  bytes corpse_item_instance_id = 1;  // exactly 16-byte non-nil UUIDv7; never the moved item
  uint64 placement_ordinal = 2;       // non-zero
  OneItemGroundV1 corpse_ground = 3;  // the corpse's own live Ground location
}

message OneItemTransferV1 {
  OneItemStateV1 before = 1;
  OneItemStateV1 after = 2;
  // Exactly one source: a live Ground location (`source`) or a corpse
  // container entry (`corpse_source`, D3-4). Both present or both absent
  // rejects.
  OneItemGroundV1 source = 3;
  OneItemInventoryV1 destination = 4;
  OneItemTransferCauseV1 cause = 5;
  OneItemReceiverV1 receiver = 6; // D83 full merge and top-up only
  OneItemCorpseSourceV1 corpse_source = 7; // D3-4 corpse-entry source only
}

// Reward-claim MINT cause: typed_cause "reward_claim_mint", the revisions, the
// actual player USE CommandRef and the claimed RewardClaim definition. Same
// field numbers as OneItemTransferCauseV1 for the shared fields.
message OneItemRewardClaimCauseV1 {
  string typed_cause = 1;      // <= 128 B
  string content_revision = 6; // <= 512 B
  string ruleset_revision = 7; // <= 512 B
  string sim_revision = 8;     // <= 512 B
  OneItemCommandRefV1 command_ref = 9;
  OneItemTypedDefinitionRevisionV1 reward_claim = 10; // the claimed RewardClaim
}

// One fresh live item placed in a new direct entry of the main backpack; the
// destination carries container_entry only (never the container slot).
message OneItemRewardClaimMintV1 {
  OneItemStateV1 after = 1;
  OneItemInventoryV1 destination = 2;
  OneItemRewardClaimCauseV1 source = 3;
  // Explicit semantic absence of a prior item; not a nil or zero identifier.
  bool before_semantically_absent = 4;
}

// D3-6 `CorpseDecay { corpse_item, deadline }` (DUR-03 §39.4): the only admitted
// retire cause; no caller-chosen reason, burn cause or free-form label exists.
message OneItemCorpseDecayV1 {
  // The corpse this retirement belongs to: the retired item itself for the
  // corpse's own step, its parent corpse for an entry's step.
  bytes corpse_item_instance_id = 1; // exactly 16-byte non-nil UUIDv7
  // The exact corpse `materialized_at + 60_000` (unix ms) that authorized the
  // retirement; the event's occurred_at is never before it.
  uint64 deadline_unix_ms = 2;
}

// D3-6 DECAY_RETIRE step: one live item (identity, type and quantity before)
// retires to RETIRED, quantity 0, no location (after), from exactly one live
// location. Touches 1 ItemInstance with 1 location line (DUR03-RL-01/-RL-06
// defaults; no new resource row).
message OneItemDecayRetireV1 {
  OneItemStateV1 before = 1; // LIVE, quantity > 0
  OneItemStateV1 after = 2;  // RETIRED, quantity 0; same identity, World and definition
  // Exactly one before-location: the corpse's own live Ground (`ground`, the
  // corpse's own step, admitted only once no live entry remains under it) or
  // a direct entry of that corpse (`corpse_entry`, carrying the corpse's live
  // Ground as scope authority exactly as a D3-4 TRANSFER source does).
  OneItemGroundV1 ground = 3;
  OneItemCorpseSourceV1 corpse_entry = 4;
  OneItemCorpseDecayV1 cause = 5;
  // Safe fence reference: the retiring owner's runtime-scope ownership
  // generation (non-zero); it may be later than the corpse's own generation.
  uint64 runtime_scope_ownership_generation = 6;
}

// Closed FeeBurnCause (decision §4.4): one variant per admitted fee source.
message OneItemCharmUnassignV1 {
  string charm_key = 1; // oteryn:charm.<name>, <= 128 B
  bytes occurrence = 2; // the unassign command occurrence, 16-byte UUIDv7
}
message OneItemFeeBurnCauseV1 {
  oneof cause {
    OneItemCharmUnassignV1 charm_unassign = 1;
  }
}

// One BURN line: a live coin stack in a direct entry of the main backpack.
message OneItemFeeBurnLineV1 {
  OneItemStateV1 before = 1; // LIVE, 1..100 units of one coin definition
  // Same identity, World and definition: RETIRED with quantity 0 and no
  // location (whole burn), or LIVE with fewer units in the same entry (partial
  // burn, the last line only).
  OneItemStateV1 after = 2;
  uint64 placement_ordinal = 3; // the entry before the burn, non-zero
}

// One change MINT: a fresh coin stack that did not exist before, in a new
// direct entry of the main backpack.
message OneItemFeeChangeMintV1 {
  OneItemStateV1 after = 1;     // LIVE, 1..99 platinum or gold coins
  uint64 placement_ordinal = 2; // its new entry, non-zero
}

// Coin fee BURN transaction (GOLD-FEE-1a/1b). Lines are in burn order: worth
// ascending, then display order (highest placement ordinal first).
message OneItemFeeBurnV1 {
  OneItemFeeBurnCauseV1 cause = 1;
  uint64 fee_gold_units = 2;    // 1..20,000,000
  uint64 burned_gold_units = 3; // conservation summary: fee + change
  bytes character_id = 4;       // 16-byte UUIDv7
  uint64 committed_character_revision = 5; // the fee source's committed revision (>= 2)
  bytes world_id = 6;
  bytes channel_id = 7;
  uint64 runtime_scope_ownership_generation = 8; // non-zero
  bytes backpack_item_instance_id = 9; // parent of every line's entry
  repeated OneItemFeeBurnLineV1 lines = 10; // 1..20
  uint64 change_gold_units = 11; // burned - fee, below the last line's coin worth
  // change / 100 platinum, then change % 100 gold, each only when positive, in
  // consecutive new entries after the burn lines.
  repeated OneItemFeeChangeMintV1 change = 12; // 0..2
}

// One side of the timed row: absent values are a spent row (a transform to a
// target that is not timed); revision 0 is an item without a row.
message OneItemTimedRowV1 {
  optional uint32 charges = 1;      // 1..65,535 (TIMEDITEM0-RL-01)
  optional uint64 remaining_ms = 2; // 0..604,800,000 (TIMEDITEM0-RL-02)
  uint64 revision = 3;
}

// Timed expiry (TIMED-RT-1b). A transform keeps the instance, quantity and
// location and changes the definition, the row reset to the target's full
// values (never 0 ms) or spent at revision + 1. A burn keeps the definition,
// retires the item (quantity 0) from its container entry and leaves the row
// as it was (row_after = row_before).
message OneItemTimedExpiryV1 {
  OneItemStateV1 before = 1;
  OneItemStateV1 after = 2;
  bytes character_id = 3; // the holder, 16-byte UUIDv7
  bytes world_id = 4;
  bytes channel_id = 5;
  uint64 runtime_scope_ownership_generation = 6; // non-zero
  // Exactly one location before: a container entry or the CharacterEquipment
  // `container` slot. A burn's location is always an entry.
  OneItemContainerEntryV1 container_entry = 7;
  bool equipment_container_slot = 8;
  uint32 reason = 9; // 1 TimeExhausted, 2 ChargesExhausted
  OneItemTimedRowV1 row_before = 10;
  OneItemTimedRowV1 row_after = 11;
}
