syntax = "proto3";

package oteryn.events.v1;

// ANL-01 source IDL. Event interchange only; no broker/DB/gameplay-protocol selection.

message CommandRef {
  bytes game_session_id = 1; // exactly 16-byte non-nil UUIDv7
  uint64 command_id = 2;     // non-zero; FND-02 semantics
}

message AnalyticsActorRef {
  string identity_domain = 1;
  uint64 identity_epoch = 2;    // non-zero policy epoch
  bytes analytics_actor_id = 3; // 16-byte non-nil UUIDv7; fresh across epochs
}

message RuntimeOrderRef {
  uint64 scope_ownership_generation = 1; // non-zero FND-03 generation
  uint64 runtime_execution_ordinal = 2;  // non-zero within same owner generation
}

message TransactionEventRef {
  bytes transaction_id = 1; // exactly 16-byte non-nil TransactionId UUIDv7
  uint32 ordinal = 2;       // 1..count
  uint32 count = 3;         // non-zero, identical for one committed TransactionId event set
}

message CausationRef {
  oneof cause {
    bytes event_id = 1;
    CommandRef command = 2;
    bytes operation_id = 3;
    bytes transaction_id = 4;
  }
}

enum EventDurabilityClass {
  EVENT_DURABILITY_UNSPECIFIED = 0;
  BEST_EFFORT_TELEMETRY = 1;
  DURABLE_AUDIT = 2;
}

enum EventPrivacyClass {
  EVENT_PRIVACY_UNSPECIFIED = 0;
  INTERNAL_NON_PERSONAL = 1;
  PSEUDONYMOUS_ANALYTICS = 2;
  RESTRICTED_PLAYER_LINKED = 3;
  SECURITY_SENSITIVE = 4;
}

message EventEnvelope {
  uint32 envelope_revision = 1;
  bytes event_id = 2;
  uint32 event_type_id = 3;
  uint32 event_schema_revision = 4;
  EventDurabilityClass durability_class = 5;
  EventPrivacyClass privacy_class = 6;
  string retention_profile_id = 7;
  int64 occurred_at_unix_ms = 8;

  optional bytes world_id = 9;
  optional bytes channel_id = 10;
  optional bytes instance_id = 11;
  optional bytes node_id = 12;

  optional bytes game_session_id = 13;
  optional uint64 connection_generation = 14;
  optional RuntimeOrderRef runtime_order = 15;
  optional uint64 command_id = 16;

  optional bytes operation_id = 17;
  optional TransactionEventRef transaction_event = 18;
  optional bytes correlation_id = 19;
  optional CausationRef causation = 20;
  optional AnalyticsActorRef analytics_actor = 21;

  optional uint32 protocol_major = 22;
  optional string ruleset_revision = 23;
  optional string content_revision = 24;
  string server_build_id = 25;

  bytes payload = 26;        // exact immutable registered protobuf payload bytes
  bytes payload_sha256 = 27; // exactly 32 bytes, SHA-256(exact payload bytes)

  reserved 28 to 63;
}
