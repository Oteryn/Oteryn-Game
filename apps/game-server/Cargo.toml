[package]
name = "oteryn-game-server"
default-run = "oteryn-game-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "app"
release-role = "production"

[features]
# Recognized by the remaining path-loaded integration fixtures.
test-support = ["oteryn-gameplay-entities/test-support"]

[dependencies]
oteryn-gameplay-world-change = { version = "=0.1.0", path = "../../crates/gameplay/world-change" }
