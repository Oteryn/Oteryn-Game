oteryn-gameplay-progression = { version = "=0.1.0", path = "../../crates/gameplay/progression" }
oteryn-gameplay-items = { version = "=0.1.0", path = "../../crates/gameplay/items" }
oteryn-gameplay-economy = { version = "=0.1.0", path = "../../crates/gameplay/economy" }
oteryn-gameplay-quests = { version = "=0.1.0", path = "../../crates/gameplay/quests" }
oteryn-gameplay-housing = { version = "=0.1.0", path = "../../crates/gameplay/housing" }
oteryn-gameplay-combat-rules = { version = "=0.1.0", path = "../../crates/gameplay/combat-rules" }
oteryn-gameplay-spell-rules = { version = "=0.1.0", path = "../../crates/gameplay/spell-rules" }
oteryn-gameplay-encounter-rules = { version = "=0.1.0", path = "../../crates/gameplay/encounter-rules" }
