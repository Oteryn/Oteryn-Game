[package]
name = "oteryn-game-server"
default-run = "oteryn-game-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "app"
release-role = "production"

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
oteryn-error-codes = { version = "=0.1.0", path = "../../crates/error-codes" }
oteryn-foundation = { version = "=0.1.0", path = "../../crates/foundation" }
oteryn-gameplay-admission-evidence = { version = "=0.1.0", path = "../../crates/gameplay/admission-evidence" }
oteryn-gameplay-character-recovery-fence = { version = "=0.1.0", path = "../../crates/gameplay/character-recovery-fence" }
oteryn-gameplay-source-critical-baseline = { version = "=0.1.0", path = "../../crates/gameplay/source-critical-baseline" }
oteryn-gameplay-weather = { version = "=0.1.0", path = "../../crates/gameplay/weather" }
oteryn-ntp-clock = { version = "=0.1.0", path = "../../crates/ntp-clock" }
oteryn-protocol-oteryn = { version = "=0.1.0", path = "../../crates/protocol-oteryn" }
oteryn-simulation-determinism = { version = "=0.1.0", path = "../../crates/simulation-determinism" }
oteryn-world-bundle = { version = "=0.1.0", path = "../../crates/world-bundle" }
prost.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
rustls.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["signal"] }
tokio-rustls.workspace = true
toml.workspace = true

[dev-dependencies]
# Dev/qualification-only (ADR-0011 §6, #162 C1b): drives the seam qualification's
# `stage=dev_client`. Not part of either production closure (workspace-boundaries.toml
# `[dev_edges]`, never walked by the production-closure check).
oteryn-dev-client = { version = "=0.1.0", path = "../../tools/dev-client" }
# Test-only (MAP-LOAD-1): the map_load tests compile their fixture bundle with the compiler.
oteryn-world-bundle-compiler = { version = "=0.1.0", path = "../../tools/world-bundle-compiler" }
rcgen.workspace = true
# Test-only (BUNDLE-GATES-1): the gate inventory parses the seam sources to find each room read.
syn.workspace = true
# Test-only: a TLS 1.2-constrained client proves the seam rejects TLS 1.2.
rustls = { workspace = true, features = ["tls12"] }
# Test-only (MAP-LOAD-1): the map_load tests assemble and reseal bundles byte by byte.
zstd.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
cap-fs-ext.workspace = true
cap-std.workspace = true
rustix = { workspace = true, features = ["process"] }

# Thin wrappers kept for focused local runs (`cargo test --test <name>`). Their
# `tests/support/*_cases.rs` files run in the CI-run aggregate PostgreSQL targets and the
# `../src` modules they include run their unit tests in the library, so `test = false`
# keeps them out of `cargo test`/`cargo clippy --all-targets` instead of compiling and
# running those tests once more per wrapper. `tools/repository/check_duplicate_test_sources.py`
# fails a new wrapper that is not listed here.

[[test]]
name = "account_achievement_postgres"
test = false

[[test]]
name = "bank_postgres"
test = false

