[package]
name = "oteryn-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "app"
release-role = "production"

[[bin]]
name = "oteryn-client"
path = "src/main.rs"

[[bin]]
name = "oteryn-launcher"
path = "src/bin/oteryn-launcher.rs"

[dependencies]
oteryn-client-assets = { version = "=0.1.0", path = "../../crates/client-assets" }
oteryn-client-runtime = { version = "=0.1.0", path = "../../crates/client-runtime" }
oteryn-diagnostics = { version = "=0.1.0", path = "../../crates/diagnostics" }
oteryn-foundation = { version = "=0.1.0", path = "../../crates/foundation" }
oteryn-identity = { version = "=0.1.0", path = "../../crates/identity" }
oteryn-input-actions = { version = "=0.1.0", path = "../../crates/input-actions" }
oteryn-input-platform = { version = "=0.1.0", path = "../../crates/input-platform" }
oteryn-platform-client = { version = "=0.1.0", path = "../../crates/platform-client" }
oteryn-platform-contracts = { version = "=0.1.0", path = "../../crates/platform-contracts" }
oteryn-renderer = { version = "=0.1.0", path = "../../crates/renderer" }
oteryn-session = { version = "=0.1.0", path = "../../crates/session" }
oteryn-session-tcp = { version = "=0.1.0", path = "../../crates/session-tcp" }
oteryn-world-bundle = { version = "=0.1.0", path = "../../crates/world-bundle" }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zstd.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
winit.workspace = true

[dev-dependencies]
rcgen.workspace = true
tokio-rustls.workspace = true

# The workspace lints with one change: `unsafe_code` is `deny` instead of `forbid`, so the
# Windows mutex FFI in `src/win_mutex.rs` alone can allow it (CP D901).
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
