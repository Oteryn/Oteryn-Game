[package]
name = "oteryn-client"
version.workspace = true
edition.workspace = true
rust-version = "1.95"
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.oteryn]
category = "app"
release-role = "production"

[dependencies]
oteryn-client-assets = { version = "=0.1.0", path = "../../crates/client-assets" }
oteryn-client-runtime = { version = "=0.1.0", path = "../../crates/client-runtime" }
oteryn-diagnostics = { version = "=0.1.0", path = "../../crates/diagnostics" }
oteryn-foundation = { version = "=0.1.0", path = "../../crates/foundation" }
oteryn-identity = { version = "=0.1.0", path = "../../crates/identity" }
oteryn-input-actions = { version = "=0.1.0", path = "../../crates/input-actions" }
oteryn-input-platform = { version = "=0.1.0", path = "../../crates/input-platform" }
oteryn-platform-client = { version = "=0.1.0", path = "../../crates/platform-client" }
oteryn-platform-contracts = { version = "=0.1.0", path = "../../crates/platform-contracts" }
oteryn-renderer = { version = "=0.1.0", path = "../../crates/renderer" }
oteryn-session = { version = "=0.1.0", path = "../../crates/session" }
oteryn-session-tcp = { version = "=0.1.0", path = "../../crates/session-tcp" }
oteryn-world-bundle = { version = "=0.1.0", path = "../../crates/world-bundle" }
rustls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
zstd.workspace = true
url = "=2.5.8"
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
egui = "=0.36.2"
egui-winit = { version = "=0.36.2", default-features = false }
image = { version = "=0.25.8", default-features = false, features = ["webp"] }
winit.workspace = true
keyring-core = { version = "=1.0.0", default-features = false }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-async-io-crypto-rust"] }

[dev-dependencies]
rcgen.workspace = true
tokio-rustls.workspace = true

[lints]
workspace = true
